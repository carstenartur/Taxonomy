name: Analysis terminal and cleanup contract verification (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: write
concurrency:
  group: analysis-terminal-cleanup-verification
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/bge-small-en-v1.5
      TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b744aa5950fc1a32935e1896788a2964e4bedafb
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: {java-version: '21', distribution: temurin, cache: maven}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: models/bge-small-en-v1.5
          key: ${{ runner.os }}-taxonomy-bge-small-en-v1.5-${{ hashFiles('.github/scripts/download-embedding-model.sh') }}
      - name: Provision canonical embedding model
        run: bash .github/scripts/download-embedding-model.sh
      - name: Fetch hash-verified external test builders
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          builders={'/tmp/analysis-completion-base.py':'146c096efcccad2cf1b80e7c0eba9c018b738407',
                    '/tmp/prepare-completion-builder.py':'0939234a647b1f87a4ff5494cadec0643e156d3a',
                    '/tmp/analysis-completion-builder.py':'f1961e8cfc2d520364f138da287c92b242c49936'}
          for path,sha in builders.items():
              request=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs/'+sha,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response: blob=json.load(response)
              content=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()==sha
              Path(path).write_bytes(content)
          Path('target/completion-evidence').mkdir(parents=True)
      - name: Add counterexamples before production changes
        run: python /tmp/analysis-completion-builder.py tests
      - name: Execute unchanged-code Java and browser-contract counterexamples
        shell: python
        run: |
          import subprocess,xml.etree.ElementTree as ET,json
          from pathlib import Path
          folder=Path('target/completion-evidence')
          with (folder/'java-red.log').open('w') as log:
              java=subprocess.run(['./mvnw','-B','-ntp','test','-Dtest=AnalysisCompletionContractTest,AnalysisTerminalContractTest','-Dsurefire.failIfNoSpecifiedTests=false'],stdout=log,stderr=subprocess.STDOUT)
          paths=[Path('taxonomy-app/target/surefire-reports/TEST-com.taxonomy.analysis.controller.AnalysisCompletionContractTest.xml'),Path('taxonomy-app/target/surefire-reports/TEST-com.taxonomy.analysis.service.AnalysisTerminalContractTest.xml')]
          reports=[ET.parse(path).getroot() for path in paths]
          counts=[dict(report.attrib) for report in reports]
          print('JAVA RED',json.dumps(counts))
          assert java.returncode!=0 and sum(int(report.attrib['failures']) for report in reports)>=8, counts
          assert sum(int(report.attrib['errors']) for report in reports)==0, counts
          for report in reports:
              for case in report.findall('testcase'):
                  problem=case.find('failure')
                  if problem is not None: print('RED',case.attrib.get('name'),problem.attrib.get('type'),problem.attrib.get('message','')[:600])
          for path in paths: (folder/('red-'+path.name)).write_bytes(path.read_bytes())
          with (folder/'js-red.log').open('w') as log:
              js=subprocess.run(['node','--test','.github/scripts/analysis-readiness.test.mjs','.github/scripts/analysis-live-progress.test.mjs'],stdout=log,stderr=subprocess.STDOUT)
          assert js.returncode==1,(folder/'js-red.log').read_text()[-3000:]
          print((folder/'js-red.log').read_text()[-700:])
      - name: Apply the consolidated correction
        run: |
          python /tmp/analysis-completion-builder.py fix
          git diff --check
      - name: Verify all affected server and client regression contracts
        run: |
          set -o pipefail
          ./mvnw -B -ntp test '-Dtest=Analysis*Test,LlmService*Test,ExplicitCentralAnalysisAdmissionTest,ProjectRequirementAnalysisAsyncDispatchTest' -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee target/completion-evidence/java-green.log
          node --test .github/scripts/analysis-readiness.test.mjs .github/scripts/analysis-live-progress.test.mjs .github/scripts/product-score-streaming.test.mjs 2>&1 | tee target/completion-evidence/js-green.log
      - name: Every reactor unit test
        run: |
          set -o pipefail
          ./mvnw -B -ntp test -DexcludedGroups=real-llm 2>&1 | tee target/completion-evidence/all-unit.log
      - name: Complete Maven-owned UI contracts and bootstrap
        run: |
          set -o pipefail
          ./mvnw -B -f .github/ui-verification-pom.xml verify -Pcontracts 2>&1 | tee target/completion-evidence/ui-contracts.log
          node .github/scripts/test-taxonomy-base-path.mjs 2>&1 | tee target/completion-evidence/basepath.log
      - name: Publish tested source objects without changing product refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/analysis-completion-builder.py publish
      - name: Preserve resolved test-only libraries for local exact-source checks
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          root=Path.home()/'.m2/repository'
          groups=['com/jayway/jsonpath','net/minidev','org/ow2/asm','org/springframework/security/spring-security-test','org/springframework/boot/spring-boot-test','org/springframework/boot/spring-boot-test-autoconfigure','org/junit/platform/junit-platform-launcher']
          with zipfile.ZipFile('target/completion-evidence/test-libraries.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for group in groups:
                  for path in (root/group).rglob('*.jar'): archive.write(path,str(path.relative_to(root)))
      - name: Summarize executed failures without hiding logs
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').rglob('TEST-*.xml'):
              if 'target/surefire-reports' not in str(path): continue
              root=ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  issue=case.find('failure')
                  if issue is None: issue=case.find('error')
                  if issue is not None: print(path,case.attrib,issue.attrib,(issue.text or '')[:2500])
          for name in ('java-green.log','js-green.log','all-unit.log','ui-contracts.log'):
              path=Path('target/completion-evidence')/name
              if path.exists(): print('\nLOG',name,'\n',path.read_text()[-7000:])
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: analysis-completion-contract-evidence
          path: |
            target/completion-evidence
            **/target/surefire-reports/TEST-*.xml
          retention-days: 7
          if-no-files-found: error
  manifest:
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: analysis-completion-contract-evidence
          path: evidence
      - name: Verify source archive and report exact tested identities
        shell: python
        run: |
          import hashlib,json,zipfile,collections,xml.etree.ElementTree as ET
          from pathlib import Path
          folder=Path('evidence/target/completion-evidence')
          manifest=json.loads((folder/'manifest.json').read_text())
          with zipfile.ZipFile(folder/'tested-sources.zip') as archive:
              for path,sha in manifest['files'].items():
                  content=archive.read(path)
                  assert hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()==sha,path
          total=collections.Counter()
          for path in Path('evidence').rglob('TEST-*.xml'):
              suite=ET.parse(path).getroot()
              total.update({key:int(suite.attrib.get(key,0)) for key in ('tests','failures','errors','skipped')})
              total['suites']+=1
          assert total['failures']==0 and total['errors']==0,total
          print('UNIT',dict(total))
          print(json.dumps(manifest,indent=2))
