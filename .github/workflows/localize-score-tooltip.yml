name: Localize score semantics tooltip

on:
  push:
    branches:
      - fix/1006-product-score-semantics
    paths:
      - .github/workflows/localize-score-tooltip.yml

permissions:
  contents: write

jobs:
  localize:
    name: Apply and verify score tooltip localization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/1006-product-score-semantics
          fetch-depth: 0

      - name: Apply deterministic localization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js')
          js = js_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(?m)^(?P<indent>[ \t]*)badge\.title = isProductScore\(scoreDetail\)\s*\n"
              r"[ \t]*\? 'Independent product suitability and comparable effective relevance'\s*\n"
              r"[ \t]*: 'Comparable relevance';"
          )

          def localized_tooltip(match):
              indent = match.group('indent')
              return (
                  indent + "badge.title = isProductScore(scoreDetail)\n"
                  + indent + "    ? t('scoring.score.tooltip.product')\n"
                  + indent + "    : t('scoring.score.tooltip.relevance');"
              )

          js, replacements = pattern.subn(localized_tooltip, js)
          if replacements != 1:
              raise SystemExit(f'expected one tooltip block, found {replacements}')
          js_path.write_text(js, encoding='utf-8')

          additions = {
              Path('taxonomy-app/src/main/resources/i18n/messages.properties'): (
                  'scoring.analyze.btn=Analyze with AI\n',
                  'scoring.analyze.btn=Analyze with AI\n'
                  'scoring.score.tooltip.product=Independent product suitability and comparable effective relevance\n'
                  'scoring.score.tooltip.relevance=Comparable relevance\n'),
              Path('taxonomy-app/src/main/resources/i18n/messages_de.properties'): (
                  'scoring.analyze.btn=Mit KI analysieren\n',
                  'scoring.analyze.btn=Mit KI analysieren\n'
                  'scoring.score.tooltip.product=Unabh\\u00e4ngige Produkteignung und vergleichbare effektive Relevanz\n'
                  'scoring.score.tooltip.relevance=Vergleichbare Relevanz\n'),
          }
          for path, (old_line, replacement) in additions.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old_line) != 1:
                  raise SystemExit(f'{path}: expected one insertion anchor, found {text.count(old_line)}')
              path.write_text(text.replace(old_line, replacement, 1), encoding='utf-8')
          PY

          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js
          python3 - <<'PY'
          from pathlib import Path

          def properties(path):
              result = {}
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line and not line.startswith(('#', '!')) and '=' in line:
                      key, value = line.split('=', 1)
                      result[key] = value
              return result

          required = {
              'scoring.score.tooltip.product',
              'scoring.score.tooltip.relevance',
          }
          for path in (
              'taxonomy-app/src/main/resources/i18n/messages.properties',
              'taxonomy-app/src/main/resources/i18n/messages_de.properties',
          ):
              values = properties(path)
              if not required <= values.keys():
                  raise SystemExit(f'{path}: localized tooltip keys missing')
              if any(not values[key].strip() for key in required):
                  raise SystemExit(f'{path}: localized tooltip value is blank')
          PY
          git diff --check

      - name: Commit verified localization
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/localize-score-tooltip.yml
          git add taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js \
                  taxonomy-app/src/main/resources/i18n/messages.properties \
                  taxonomy-app/src/main/resources/i18n/messages_de.properties
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Localize score semantics tooltip"
          git push origin HEAD:fix/1006-product-score-semantics
