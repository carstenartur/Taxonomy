# Disposable external services for the additive acceptance namespace only.
# All credentials and TLS material are generated by artemis-constrained-smoke.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: taxonomy-artemis-smoke
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: taxonomy-artemis-smoke
  namespace: taxonomy-artemis-smoke
spec:
  hard:
    requests.cpu: "1500m"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 5Gi
    pods: "8"
    services: "5"
    secrets: "12"
    configmaps: "8"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: taxonomy-artemis-smoke
  namespace: taxonomy-artemis-smoke
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 128Mi}
      default: {cpu: 500m, memory: 512Mi}
      max: {cpu: "1", memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-postgres
  namespace: taxonomy-artemis-smoke
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: taxonomy-smoke-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: taxonomy-smoke-postgres}
    spec:
      automountServiceAccountToken: false
      # The pinned Alpine image defines postgres as UID/GID 70. PGDATA lives
      # below the fsGroup-owned mount so the non-root user owns its directory.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_DB, value: taxonomy}
            - {name: POSTGRES_USER, value: taxonomy}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: taxonomy-artemis-smoke, key: SPRING_DATASOURCE_PASSWORD}
          ports: [{name: postgres, containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            exec: {command: [pg_isready, -U, taxonomy, -d, taxonomy]}
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: socket, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-postgres
  namespace: taxonomy-artemis-smoke
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: taxonomy-smoke-postgres}
  ports: [{port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-broker
  namespace: taxonomy-artemis-smoke
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: taxonomy-smoke-broker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: taxonomy-smoke-broker}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: broker
          image: apache/artemis:2.53.0-alpine@sha256:ce784035e4c5c5c91c505d7bd8edb8842559b909f3d5c2fddff968a2accc612e
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: ARTEMIS_USER, value: taxonomy-smoke}
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: taxonomy-artemis-smoke, key: ARTEMIS_PASSWORD}
            - {name: ANONYMOUS_LOGIN, value: "false"}
            - name: EXTRA_ARGS
              value: --http-host 0.0.0.0 --relax-jolokia --role taxonomy-admin --no-autotune
            - name: JAVA_ARGS
              value: -Xms64m -Xmx256m -XX:+UseSerialGC -Dhawtio.disableProxy=true -Dhawtio.realm=activemq -Dhawtio.offline=true -Dhawtio.rolePrincipalClasses=org.apache.activemq.artemis.spi.core.security.jaas.RolePrincipal -Djolokia.policyLocation=classpath:jolokia-access.xml -Dlog4j2.disableJmx=true --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
          ports:
            - {name: core-tls, containerPort: 61617}
            - {name: management, containerPort: 8161}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            tcpSocket: {port: core-tls}
            initialDelaySeconds: 5
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/artemis-instance}
            - {name: tmp, mountPath: /tmp}
            - {name: configuration, mountPath: /var/lib/artemis-instance/etc-override, readOnly: true}
            - {name: tls, mountPath: /etc/artemis/tls, readOnly: true}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: configuration
          secret: {secretName: taxonomy-artemis-broker-config}
        - name: tls
          secret: {secretName: taxonomy-artemis-broker-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-broker
  namespace: taxonomy-artemis-smoke
spec:
  # Management stays internal; the harness uses an authenticated kubectl port-forward.
  # No Ingress, NodePort or LoadBalancer is created by this fixture.
  type: ClusterIP
  selector: {app.kubernetes.io/name: taxonomy-smoke-broker}
  ports:
    - {name: core-tls, port: 61617, targetPort: core-tls}
    - {name: management, port: 8161, targetPort: management}
