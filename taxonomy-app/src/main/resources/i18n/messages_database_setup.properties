database.setup.username=Application username
database.setup.password=Application password
database.setup.password.help=Used for the connection test and cleared when you close this dialog. Supply the same password in your deployment Secret when applying the configuration.
database.setup.tls=Use TLS and verify the server certificate
database.setup.tls.warning=This connection is unencrypted. Login details and data will be sent without TLS protection. Use this only when appropriate for your network; enable verified TLS for production.
database.setup.ca=Trusted CA certificate path (optional)
database.setup.ca.help=An already mounted absolute server path, for example /etc/taxonomy-db-ca/ca.crt. This is not a file upload or a path on your browser computer.
database.setup.jvm.trust=SQL Server and Oracle use the existing JVM truststore. Provision the trusted database CA there before testing; this assistant does not install certificates.
