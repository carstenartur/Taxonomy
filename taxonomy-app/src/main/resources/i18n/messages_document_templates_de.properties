document.templates.heading=Versionierte Word-Dokumentvorlagen
document.templates.intro=Verwalten Sie organisationsspezifische DOTX-Vorlagen. Taxonomy versioniert deren OOXML-Inhalte in Git und stellt vollständige Word-Vorlagen über WebDAV bereit.
document.templates.help.title=Wählen Sie den zu Ihren Kenntnissen passenden Arbeitsweg
document.templates.help.edit=Vorlage in Word bearbeiten öffnet die versionierte WebDAV-Ressource in der installierten Microsoft-Word-Anwendung. Beim Speichern in Word entsteht eine neue Git-Version.
document.templates.help.new=Neues Dokument aus Vorlage erzeugt ein getrenntes Word-Dokument, ohne die gespeicherte Vorlage zu verändern.
document.templates.help.fallback=Herunterladen bleibt verfügbar, wenn Word nicht installiert ist, der Browser Anwendungslinks blockiert oder die WebDAV-Anmeldung manuell eingerichtet werden muss.
document.templates.https.warning=Die direkte Word-Bearbeitung sollte die öffentliche HTTPS-Adresse von Taxonomy verwenden. Die aktuelle Seite wird nicht über HTTPS aufgerufen.
document.templates.direct-word.disabled=Das direkte Öffnen in Word ist für dieses Anmeldeprofil deaktiviert, weil Desktop-Word die Browser-Anmeldung nicht übernehmen kann. Der Download bleibt verfügbar; WebDAV kann weiterhin mit Clients verwendet werden, die einen unterstützten Bearer-Token-Ablauf beherrschen.
