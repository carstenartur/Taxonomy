name: Verify final analysis diagnostics (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: write
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7bada07047ad49f2f15428b3236111e535145483
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Assemble exact candidate without adding verification helpers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          out=Path('/tmp/analysis-final-logs');out.mkdir()
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='7bada07047ad49f2f15428b3236111e535145483'
          assert git('rev-parse','HEAD')==base
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for blob,digest in [('d94209b86c369e3c91e5c846fd8437471581595b','73f81c7da3064d99f7da622483f192c079ea95b4b8371d3c889545fb5d048e80'),('669b7861563da2a5e9a2c295d22980707021c638','27d4dc72cfaf826e6037b5f53d534c876151181c2508ce6e9ac804fa7a3c6bba')]:
              with urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs/'+blob,headers=headers)) as response:
                  data=base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob
              patch=gzip.decompress(data);assert hashlib.sha256(patch).hexdigest()==digest
              patchFile=out/(blob+'.patch');patchFile.write_bytes(patch)
              subprocess.run(['git','apply','--index',str(patchFile)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          paths=git('diff','--cached','--name-only').splitlines();assert len(paths)==12,paths
          tree=git('write-tree');assert tree=='c52c43db529e3c59a89056b1cb5c109aa04e46e7',tree
          doc={'base':base,'tree':tree,'files':{p:git('hash-object',p) for p in paths},'verificationRun':os.environ['GITHUB_RUN_ID'],'baseFullVerificationRun':35035811379}
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--full-index','--binary']))
          subprocess.run(['git','-c','user.name=Analysis verification','-c','user.email=verification@invalid.example','commit','-m','Verify final diagnostic candidate locally on runner'],check=True)
          assert git('status','--porcelain')==''
          (out/'manifest.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
      - name: Actual browser completion and diagnostic lifecycle
        run: |
          set -o pipefail
          docker info
          ./mvnw -B -ntp -pl taxonomy-app -am verify -Dtest=AnalysisLiveProgressFixtureTest -Dit.test=AnalysisLiveProgressUiIT -Dsurefire.failIfNoSpecifiedTests=false -Dfailsafe.failIfNoSpecifiedTests=false -DexcludedGroups=real-llm 2>&1 | tee /tmp/analysis-final-logs/browser.log
      - name: Complete Maven-owned frontend contracts
        run: |
          set -o pipefail
          ./mvnw -B -ntp -f .github/ui-verification-pom.xml verify -Pcontracts 2>&1 | tee /tmp/analysis-final-logs/frontend.log
          .cache/ui-frontend/node/node .github/scripts/test-taxonomy-base-path.mjs | tee /tmp/analysis-final-logs/base-path.log
      - name: Publish verified source blobs without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,subprocess,urllib.request,zipfile
          from pathlib import Path
          out=Path('/tmp/analysis-final-logs');doc=json.loads((out/'manifest.json').read_text())
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^{tree}')==doc['tree']
          assert git('diff','--name-only')==''
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          with zipfile.ZipFile(out/'tested-sources.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path,sha in doc['files'].items():
                  data=Path(path).read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha,path
                  request=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs',headers=headers,
                      data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST')
                  with urllib.request.urlopen(request) as response: assert json.load(response)['sha']==sha
                  archive.writestr(path,data)
          doc['frontendAndComponentBrowserVerification']='passed'
          (out/'manifest.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: analysis-final-diagnostics-${{ github.sha }}
          path: |
            /tmp/analysis-final-logs
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
            **/target/analysis-ui-evidence/**
          retention-days: 7
          if-no-files-found: error
