name: LLM diagnostics source verification
on:
  push:
    branches: [work/llm-json-diagnostics-checks]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact source tree
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD | gzip > evidence/source.tar.gz
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: llm-diagnostics-source
          path: evidence/
          retention-days: 7
