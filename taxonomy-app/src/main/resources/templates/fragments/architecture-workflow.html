<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="context" id="architectureWorkflow" class="architecture-workflow" aria-labelledby="workflowIdentity" hidden>
    <div class="workflow-heading">
        <strong id="workflowIdentity"></strong>
        <span id="workflowState" class="workflow-state"></span>
    </div>
    <nav th:aria-label="#{workflow.navigation}" aria-label="Continue architecture work">
        <a id="workflow-requirement" th:text="#{workflow.requirement}" hidden>Requirement and evidence</a>
        <a id="workflow-clarify" th:text="#{workflow.clarify}" hidden>Clarify requirement</a>
        <a id="workflow-snapshot" th:text="#{workflow.backSnapshot}" hidden>Return to source analysis</a>
        <a id="workflow-portfolio" th:text="#{workflow.portfolio}" hidden>Project portfolio</a>
        <a id="workflow-editor" th:text="#{workflow.openEditor}" hidden>Open architecture working state</a>
    </nav>
    <p id="workflowExplanation"></p>
</section>
</body></html>
