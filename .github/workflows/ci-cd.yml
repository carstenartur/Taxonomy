name: CI / CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches: [ main, feat/artemis-execution-base, 'implementation/**' ]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Plan Maven verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs: { scope: '${{ steps.scope.outputs.scope }}' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - name: Compile Maven-owned scope planner
        run: ./mvnw -B -ntp -pl taxonomy-tooling -am compile -Dtaxonomy.frontend.skip=true -Dmaven.build.cache.enabled=false
      - name: Classify the complete source change
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling plan-ci-verification
      - name: Upload source-bound verification scope
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: ci-change-scope, path: target/ci-change-scope.json, if-no-files-found: error, retention-days: 7 }

  application:
    name: Commit-bound UI application
    needs: [change-scope]
    if: needs.change-scope.outputs.scope == 'full' || needs.change-scope.outputs.scope == 'documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - name: Identify daily cache snapshot
        id: cache-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Restored archives are only seeds: Maven still validates every module input.
      # Only main writes one snapshot per UTC day, rather than ~1.47 GB per SHA/PR.
      - name: Restore Maven build cache
        id: application-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/build-cache
          key: ${{ runner.os }}-taxonomy-maven-build-cache-app-v3-${{ steps.cache-day.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-taxonomy-maven-build-cache-app-v3-
      - name: Package commit-bound UI application
        shell: bash
        run: bash .github/scripts/package-ui-application.sh 2>&1 | tee "$RUNNER_TEMP/application-package.log"
      - name: Record Maven cache effectiveness
        if: always()
        env:
          CACHE_EXACT_HIT: ${{ steps.application-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.application-cache.outputs.cache-matched-key }}
        run: |
          {
            echo '### Maven application cache'
            echo "Exact archive hit: ${CACHE_EXACT_HIT:-false}; restored key: ${CACHE_MATCHED_KEY:-none}"
            echo "Cache entries found: $(grep -c 'Found cached build' "$RUNNER_TEMP/application-package.log" || true)"
            echo "Rejected artifact restorations: $(grep -c 'Cannot restore project artifacts' "$RUNNER_TEMP/application-package.log" || true)"
            echo "Cached plugin executions: $(grep -c 'Skipping plugin execution' "$RUNNER_TEMP/application-package.log" || true)"
            du -sh "$HOME/.m2/build-cache" 2>/dev/null || true
            echo 'Packaging cache only; authoritative test lanes always execute freshly.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save daily main Maven cache snapshot
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.application-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/build-cache
          key: ${{ steps.application-cache.outputs.cache-primary-key }}
      - name: Stage commit-bound UI application
        run: bash .github/scripts/stage-ui-application.sh
      - name: Upload commit-bound UI application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: taxonomy-ui-application, path: 'target/ui-application/**', if-no-files-found: error, retention-days: 7 }

  production-image:
    name: Production Docker image verification
    needs: [change-scope]
    if: needs.change-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs: { executed: "${{ github.event_name != 'pull_request' || steps.production-image-scope.outputs.run == 'true' }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - name: Configure and verify Docker Hub cache
        run: bash .github/scripts/configure-docker-mirror.sh
      - name: Detect production-image changes
        id: production-image-scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- \
              Dockerfile \
              taxonomy-build/src/test/java/com/taxonomy/build/ProductionImageIT.java \
              taxonomy-build/src/test/java/com/taxonomy/build/ExternalDriverSupport.java \
              .github/ui-verification-pom.xml \
              .github/scripts/configure-docker-mirror.sh \
              .github/scripts/build-production-image.sh \
              .github/scripts/download-embedding-model.sh \
              deploy/container/onnx \
              .dockerignore \
              pom.xml \
              mvnw \
              .mvn/wrapper \
              'taxonomy-*/pom.xml' \
              docs \
              LICENSE \
              NOTICE \
              THIRD-PARTY-NOTICES.md \
              observability/javaagent.properties; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up production image builder
        if: github.event_name != 'pull_request' || steps.production-image-scope.outputs.run == 'true'
        id: image-builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Identify Docker cache snapshot
        id: docker-cache-day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore Docker layers
        if: github.event_name != 'pull_request' || steps.production-image-scope.outputs.run == 'true'
        id: docker-layer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/taxonomy-docker-cache
          key: ${{ runner.os }}-${{ runner.arch }}-taxonomy-docker-v1-${{ steps.docker-cache-day.outputs.day }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-taxonomy-docker-v1-
      - name: Verify production Docker image build
        if: github.event_name != 'pull_request' || steps.production-image-scope.outputs.run == 'true'
        env:
          IMAGE_TAG: taxonomy-ci:${{ github.sha }}
          TAXONOMY_DOCKER_BUILDER: ${{ steps.image-builder.outputs.name }}
          TAXONOMY_DOCKER_CACHE_DIRECTORY: ${{ runner.temp }}/taxonomy-docker-cache
        run: ./mvnw -B -f .github/ui-verification-pom.xml verify -Pimage

      - name: Save daily main Docker cache snapshot
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.docker-layer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/taxonomy-docker-cache
          key: ${{ steps.docker-layer-cache.outputs.cache-primary-key }}

      - name: Upload JUnit production image evidence
        if: always() && (github.event_name != 'pull_request' || steps.production-image-scope.outputs.run == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: junit-production-image, path: '.github/target/failsafe-reports/TEST-com.taxonomy.build.ProductionImageIT.xml', if-no-files-found: error, retention-days: 90 }

  app-test-plan:
    name: Plan Maven-owned application test shards
    needs: [change-scope]
    if: needs.change-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    outputs: { matrix: '${{ steps.matrix.outputs.matrix }}' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Export shard matrix from the Maven verification catalogue
        id: matrix
        run: |
          jq -e '
            .applicationTestShards.defaultGroup == "core" and
            ([.applicationTestShards.groups[] | select(.default != true)] | length > 0) and
            ([.applicationTestShards.groups[] | select(.default != true) |
              (.profile | test("^ci-app-test-shard-[a-z0-9-]+$"))] | all)
          ' .mvn/verification-suites.json >/dev/null
          matrix=$(jq -c '
            {include: [.applicationTestShards.groups | to_entries[] |
              select(.value.default != true) |
            {shard: .key, profile: .value.profile,
              requiresModel: (.value.requiresEmbeddingModel == true)}]}
          ' .mvn/verification-suites.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  app-test-shards:
    name: Application test shard / ${{ matrix.shard }}
    needs: [app-test-plan, change-scope]
    if: needs.change-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.app-test-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - name: Restore pinned embedding model
        if: matrix.requiresModel == true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: models/multilingual-minilm
          key: ${{ runner.os }}-taxonomy-multilingual-minilm-${{ hashFiles('.github/scripts/download-embedding-model.sh') }}
      - name: Configure and verify Docker Hub cache
        run: bash .github/scripts/configure-docker-mirror.sh
      - name: Run the Maven-owned application shard
        env:
          APP_TEST_PROFILE: ${{ matrix.profile }}
          HF_TOKEN: ${{ matrix.requiresModel && secrets.HF_TOKEN || '' }}
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/multilingual-minilm
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
          VERSION_STATE_MODE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'development' }}
          VERSION_STATE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          ./mvnw -B -pl taxonomy-tooling,taxonomy-app -am verify -P"ci,$APP_TEST_PROFILE" -DrunOnnxTests=true
      - name: Publish shard JUnit results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: always()
        continue-on-error: true
        with:
          name: 'Application tests / ${{ matrix.shard }}'
          path: 'taxonomy-app/target/surefire-reports/TEST-*.xml,taxonomy-app/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
      - name: Stage digest-bound shard reports and coverage
        if: always()
        env:
          APP_TEST_SHARD: ${{ matrix.shard }}
        run: |
          source_tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
          java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-app-test-shards \
            --stage true \
            --shard "$APP_TEST_SHARD" \
            --commit "$GITHUB_SHA" \
            --source-tree "$source_tree" \
            --build-id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${APP_TEST_SHARD}"
      - name: Upload application test shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: 'app-test-shard-${{ matrix.shard }}'
          path: target/app-test-shards/
          if-no-files-found: error
          retention-days: 7
      - name: Upload native browser diagnostics
        if: always() && matrix.shard == 'browser'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-browser-diagnostics
          path: |
            taxonomy-app/target/archi-return-native/
            taxonomy-app/target/portfolio-context-evidence/
            taxonomy-app/target/portfolio-workflow-evidence/
            taxonomy-app/target/complete-copilot-session-evidence/
            taxonomy-app/target/coherent-lifecycle/evidence/
          if-no-files-found: warn
          retention-days: 7

  core:
    name: Core reactor verification
    needs: [change-scope]
    if: needs.change-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      # Clean before any root target/ evidence exists. A clean in the later
      # tee pipeline would unlink the log and delete the rendered Helm files.
      - name: Clean reactor before producing evidence
        if: github.event_name != 'pull_request'
        run: ./mvnw -B clean -Dmaven.build.cache.enabled=false
      - name: Verify release and delivery contracts
        run: |
          set -euo pipefail
          core_contract=.github/scripts/ci-core-contracts.sh
          required_contracts=(
            './mvnw -B -pl taxonomy-tooling -am package -DskipTests'
            "-name 'taxonomy-tooling-*.jar'"
            'if [[ -z "$tooling_jar" || ! -f "$tooling_jar" ]]'
            '::error::Java release tooling jar was not produced'
            'java -jar "$tooling_jar" check-release-plan'
            '--state development'
            '--require-clean true'
          )
          for required in "${required_contracts[@]}"; do
            if ! grep -F -- "$required" "$core_contract" >/dev/null; then
              echo "::error::$core_contract is missing delegated contract: $required"
              exit 1
            fi
          done
          bash "$core_contract"
      - name: Install verified Helm 3.21.0
        env: { HELM_VERSION: v3.21.0 }
        run: bash .github/scripts/install-helm.sh
      - name: Configure and verify Docker Hub cache
        run: bash .github/scripts/configure-docker-mirror.sh
      - name: Validate production and Rancher Helm profiles
        run: bash deploy/helm/taxonomy/verify.sh target/taxonomy-helm-rendered.yaml
      - name: Restore pinned embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: models/multilingual-minilm
          key: ${{ runner.os }}-taxonomy-multilingual-minilm-${{ hashFiles('.github/scripts/download-embedding-model.sh') }}
      - name: Run the core reactor test suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/multilingual-minilm
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
          FRONTEND_API_BASE_REF: ${{ github.event.pull_request.base.sha }}
          VERSION_STATE_MODE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'development' }}
          VERSION_STATE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          mkdir -p target
          set -o pipefail
          ./mvnw -B verify -Pci,ci-app-test-shards-core -DrunOnnxTests=true -Dtaxonomy.ui.skip=true \
            2>&1 | tee target/maven-verification.log
      - name: Publish authoritative JUnit results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: always()
        continue-on-error: true
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'
      - name: Stage core application shard evidence
        if: always()
        env:
          APP_TEST_SHARD: core
        run: |
          source_tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
          java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-app-test-shards \
            --stage true --shard "$APP_TEST_SHARD" \
            --commit "$GITHUB_SHA" --source-tree "$source_tree" \
            --build-id "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.${APP_TEST_SHARD}"
      - name: Upload core application test shard evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: app-test-shard-core
          path: target/app-test-shards/
          if-no-files-found: error
          retention-days: 7
      - name: Stage full-reactor class outputs for aggregate coverage
        if: success()
        run: |
          set -euo pipefail
          mkdir -p target
          find . -type d -path '*/target/classes' -print0 > target/reactor-coverage-inputs
          mapfile -d '' -t class_directories < target/reactor-coverage-inputs
          ((${#class_directories[@]} > 0))
          # A test-skipped join cannot recreate execution data from upstream tests.
          # Reject missing data per tested production module, not just an empty tar.
          shopt -s nullglob
          for classes in "${class_directories[@]}"; do
            module_target=${classes%/classes}
            reports=("$module_target"/surefire-reports/TEST-*.xml "$module_target"/failsafe-reports/TEST-*.xml)
            production_class=$(find "$classes" -type f -name '*.class' -print -quit)
            if ((${#reports[@]} > 0)) && [[ -n "$production_class" && ! -s "$module_target/jacoco.exec" ]]; then
              echo "::error::Missing JaCoCo execution data for tested module: $module_target" >&2
              exit 1
            fi
          done
          mapfile -d '' -t execution_files < <(find . -type f -path '*/target/jacoco.exec' -size +0c -print0)
          ((${#execution_files[@]} > 0))
          find "${class_directories[@]}" -type f -print0 > target/reactor-output-files
          printf '%s\0' "${execution_files[@]}" >> target/reactor-output-files
          # Fresh policy execution and the workspace test-fixture dependency use
          # core's verified bytecode; neither consumer recompiles source files.
          for replay_tests in taxonomy-build/target/test-classes taxonomy-workspace/target/test-classes; do
            if [[ ! -d "$replay_tests" ]] || ! find "$replay_tests" -type f -name '*.class' -print -quit | grep -q .; then
              echo "::error::Missing coverage replay test classes: $replay_tests" >&2
              exit 1
            fi
            find "$replay_tests" -type f -print0 >> target/reactor-output-files
          done
          mapfile -d '' -t reactor_outputs < target/reactor-output-files
          sha256sum -- "${reactor_outputs[@]}" > target/core-reactor-files.sha256
          printf '%s\0' target/core-reactor-files.sha256 >> target/reactor-output-files
          tar --null -T target/reactor-output-files -czf target/core-reactor-outputs.tar.gz
          source_tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
          printf '%s\n' "$source_tree" > target/core-reactor-outputs.tree
          sha256sum target/core-reactor-outputs.tar.gz > target/core-reactor-outputs.sha256
      - name: Upload full-reactor class outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success()
        with:
          name: core-reactor-coverage-inputs
          path: |
            target/core-reactor-outputs.tar.gz
            target/core-reactor-outputs.tree
            target/core-reactor-outputs.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Stage commit-bound verified reports
        if: always()
        env:
          REQUIRE_AGGREGATE_COVERAGE: 'false'
        run: bash .github/scripts/stage-core-quality-reports.sh
      - name: Upload core verified reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with: { name: quality-reports-core, path: 'target/quality-reports/**', if-no-files-found: warn, include-hidden-files: true, retention-days: 7 }
  coverage-aggregate:
    name: Complete reactor coverage aggregation
    needs: [core, app-test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - name: Download all isolated application test evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-test-shard-*
          path: target/app-test-shards
          merge-multiple: true
      - name: Download full-reactor class outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: core-reactor-coverage-inputs, path: target }
      - name: Verify source-bound reactor outputs and shard inputs
        run: |
          set -euo pipefail
          source_tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
          [[ "$(cat target/core-reactor-outputs.tree)" == "$source_tree" ]]
          sha256sum --check target/core-reactor-outputs.sha256
          tar -xzf target/core-reactor-outputs.tar.gz -C .
          sha256sum --check target/core-reactor-files.sha256
          mapfile -t core_execution_files < <(find . -type f -path '*/target/jacoco.exec' -size +0c -print)
          ((${#core_execution_files[@]} > 0))
          java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-app-test-shards \
            --verify-inputs true --commit "$GITHUB_SHA" --source-tree "$source_tree"
          java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-app-test-shards \
            --verify true --commit "$GITHUB_SHA" --source-tree "$source_tree"
      - name: Run full-reactor JaCoCo aggregation and coverage policy
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          ./mvnw -B process-test-classes -Pci,ci-app-test-shards-coverage -DrunOnnxTests=true \
            -Dtaxonomy.ui.skip=true 2>&1 | tee target/coverage-aggregation.log
          # Reporting must not mutate the original production classes/probes or policy bytecode.
          sha256sum --check target/core-reactor-files.sha256
      - name: Stage complete coverage and shard evidence
        if: success()
        run: |
          set -euo pipefail
          mkdir -p target/quality-reports/coverage \
            target/quality-reports/evidence/application-test-shards \
            target/quality-reports/tests/taxonomy-build/target/failsafe-reports
          cp -a taxonomy-coverage/target/site/jacoco-aggregate/. \
            target/quality-reports/coverage/
          cp target/app-test-shards/timings.json \
            target/quality-reports/evidence/application-test-shards/
          cp target/coverage-aggregation.log target/quality-reports/evidence/
          cp target/coverage-gate.txt target/quality-reports/evidence/
          cp taxonomy-build/target/failsafe-reports/TEST-com.taxonomy.build.ReactorCoveragePolicyIT.xml \
            target/quality-reports/tests/taxonomy-build/target/failsafe-reports/
          for shard_directory in target/app-test-shards/*; do
            [[ -d "$shard_directory" ]] || continue
            shard=${shard_directory##*/}
            evidence_directory="target/quality-reports/evidence/application-test-shards/$shard"
            mkdir -p "$evidence_directory"
            cp "$shard_directory/manifest.json" "$evidence_directory/"
            cp "$shard_directory/coverage.exec" "$evidence_directory/"
            if [[ "$shard" == core || ! -d "$shard_directory/tests" ]]; then
              continue
            fi
            while IFS= read -r -d '' report; do
              relative=${report#"$shard_directory/tests/"}
              destination="target/quality-reports/tests/application-test-shards/$shard/$relative"
              mkdir -p "$(dirname "$destination")"
              cp "$report" "$destination"
            done < <(find "$shard_directory/tests" -type f -name 'TEST-*.xml' -print0)
          done
      - name: Upload complete aggregate coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-reports-coverage
          path: target/quality-reports/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  observability:
    name: OpenTelemetry performance budget
    needs: [change-scope]
    if: needs.change-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - name: Detect performance-sensitive changes
        id: observability-performance-scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- pom.xml Dockerfile taxonomy-workspace/pom.xml taxonomy-workspace/src/main taxonomy-templates/pom.xml taxonomy-templates/src/main taxonomy-templates-api/pom.xml taxonomy-templates-api/src/main taxonomy-extension-api/pom.xml taxonomy-extension-api/src/main taxonomy-extension-runtime/pom.xml taxonomy-extension-runtime/src/main plugins ':(glob,exclude)plugins/*/README.md' ':(glob,exclude)plugins/*/README_DE.md' taxonomy-interop/pom.xml taxonomy-interop/src/main taxonomy-knowledge/pom.xml taxonomy-knowledge/src/main taxonomy-architecture/pom.xml taxonomy-architecture/src/main taxonomy-reporting/pom.xml taxonomy-reporting/src/main taxonomy-reporting-api/pom.xml taxonomy-reporting-api/src/main taxonomy-analysis/pom.xml taxonomy-analysis/src/main taxonomy-portfolio/pom.xml taxonomy-portfolio/src/main taxonomy-app/pom.xml taxonomy-app/src/main ':(exclude)taxonomy-app/src/main/resources/static/**' ':(exclude)taxonomy-app/src/main/resources/templates/**' taxonomy-app/src/test/java/com/taxonomy/ObservabilityContainerIT.java taxonomy-app/src/test/java/com/taxonomy/ObservabilityPerformanceIT.java taxonomy-app/src/test/resources/observability observability .github/scripts/run-observability-performance.sh .github/scripts/configure-docker-mirror.sh docs/dev/OBSERVABILITY_PERFORMANCE.md; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Configure and verify Docker Hub cache
        if: github.event_name != 'pull_request' || steps.observability-performance-scope.outputs.run == 'true'
        run: bash .github/scripts/configure-docker-mirror.sh
      - name: Measure OpenTelemetry performance budget
        if: github.event_name != 'pull_request' || steps.observability-performance-scope.outputs.run == 'true'
        env: { TAXONOMY_OBSERVABILITY_PERFORMANCE_ENFORCE: 'true' }
        run: bash .github/scripts/run-observability-performance.sh
      - name: Record observability lane scope
        if: always()
        env:
          EXECUTED: ${{ github.event_name != 'pull_request' || steps.observability-performance-scope.outputs.run == 'true' }}
        run: bash .github/scripts/record-observability-evidence.sh
      - name: Upload observability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: observability-performance, path: 'target/observability-performance/**', if-no-files-found: error, retention-days: 7 }

  ui-plan:
    name: Plan authoritative UI shards
    needs: [change-scope]
    if: needs.change-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    outputs: { matrix: '${{ steps.matrix.outputs.matrix }}' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Export repository-owned UI shard matrix
        id: matrix
        run: |
          jq -e '.schemaVersion == 1 and (.shards | length > 0)' .github/ui-shards.json >/dev/null
          echo "matrix=$(jq -c '{include:[.shards[] | {shard:.id, requiresWebKit}]}' .github/ui-shards.json)" >> "$GITHUB_OUTPUT"

  ui-contracts:
    name: UI contract verification
    needs: [change-scope]
    if: needs.change-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.npm
            .cache/ui-frontend
          key: ${{ runner.os }}-taxonomy-ui-node-${{ hashFiles('.github/package-lock.json', '.github/ui-verification-pom.xml') }}
      - name: Run Maven-owned UI contracts
        run: ./mvnw -B -f .github/ui-verification-pom.xml verify -Pcontracts
      - name: Upload JUnit contract evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: junit-ui-contracts, path: 'taxonomy-tooling/target/surefire-reports/TEST-com.taxonomy.tooling.JavascriptContractTest.xml', if-no-files-found: error, retention-days: 90 }

  ui-shards:
    name: UI shard / ${{ matrix.shard }}
    needs: [application, ui-plan, ui-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ui-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.npm
            .cache/ui-frontend
          key: ${{ runner.os }}-taxonomy-ui-node-${{ hashFiles('.github/package-lock.json', '.github/ui-verification-pom.xml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-taxonomy-playwright-${{ hashFiles('.github/package-lock.json', '.github/scripts/install-playwright-github.sh') }}-webkit-${{ matrix.requiresWebKit }}
      - name: Prepare pinned Node and Playwright CLI through Maven
        run: ./mvnw -B -f .github/ui-verification-pom.xml process-resources -Pshard
      # Only one shard needs WebKit. Prepare and consume its package cache on
      # the same runner: independent hosted jobs can receive different images.
      - name: Identify the exact runner image
        if: matrix.requiresWebKit == true
        id: cache-key
        env:
          PACKAGE_KEY_PREFIX: ${{ runner.os }}-taxonomy-ui-playwright-packages-v1-${{ hashFiles('.github/scripts/install-playwright-github.sh', '.github/scripts/apt-packages.sh', '.github/package-lock.json') }}
        run: |
          : "${ImageOS:?Missing hosted runner ImageOS}" "${ImageVersion:?Missing hosted runner ImageVersion}"
          echo "key=${PACKAGE_KEY_PREFIX}-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore UI system packages (exact runner image)
        if: matrix.requiresWebKit == true
        id: packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/playwright-system-packages/*.deb
            .cache/playwright-system-packages/SHA256SUMS
          key: ${{ steps.cache-key.outputs.key }}
      - name: Check package cache runner compatibility
        if: matrix.requiresWebKit == true
        env:
          PACKAGE_KEY: ${{ steps.cache-key.outputs.key }}
          PACKAGE_CACHE_HIT: ${{ steps.packages.outputs.cache-hit }}
          PACKAGE_CACHE_MATCHED_KEY: ${{ steps.packages.outputs.cache-matched-key }}
        run: |
          : "${ImageOS:?Missing hosted runner ImageOS}" "${ImageVersion:?Missing hosted runner ImageVersion}"
          [[ "$PACKAGE_KEY" == *"-${ImageOS}-${ImageVersion}" ]] || {
            echo "::error title=UI system packages / Paketinstallation::Package cache key does not match this runner image."
            exit 1
          }
          if [[ -n "$PACKAGE_CACHE_MATCHED_KEY" || "$PACKAGE_CACHE_HIT" == true ]]; then
            [[ "$PACKAGE_CACHE_HIT" == true && "$PACKAGE_CACHE_MATCHED_KEY" == "$PACKAGE_KEY" ]] || {
              echo "::error title=UI system packages / Paketinstallation::Only an exact package cache hit may be consumed; prefix restores are not accepted."
              exit 1
            }
          fi
      - name: UI system packages / Paketinstallation (download only)
        if: matrix.requiresWebKit == true && steps.packages.outputs.cache-hit != 'true'
        timeout-minutes: 8
        working-directory: .github
        run: |
          export PATH="$GITHUB_WORKSPACE/.cache/ui-frontend/node:$PATH"
          timeout --foreground 470s bash scripts/install-playwright-github.sh --only-download || {
            status=$?
            echo "::error title=UI system packages / Paketinstallation::Package download failed (exit $status; 124 means timeout). Check the apt mirror/network, not the browser tests."
            exit "$status"
          }
      - name: UI system packages / Paketinstallation (offline)
        if: matrix.requiresWebKit == true
        timeout-minutes: 8
        working-directory: .github
        run: |
          export PATH="$GITHUB_WORKSPACE/.cache/ui-frontend/node:$PATH"
          timeout --foreground 470s bash scripts/install-playwright-github.sh --offline-mode --system-packages-only || {
            status=$?
            echo "::error title=UI system packages / Paketinstallation::Offline package installation failed (exit $status; 124 means timeout). No mirror fallback was attempted."
            exit "$status"
          }
      - name: Save UI system packages (exact runner image)
        if: matrix.requiresWebKit == true && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/playwright-system-packages/*.deb
            .cache/playwright-system-packages/SHA256SUMS
          key: ${{ steps.cache-key.outputs.key }}
      - name: Download commit-bound UI application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: taxonomy-ui-application, path: target/ui-application }
      - name: Verify and stage the UI application
        run: bash .github/scripts/verify-ui-application.sh
      - name: Run Maven-owned authoritative UI shard
        env:
          TAXONOMY_PLAYWRIGHT_BROWSERS_ONLY: 'true'
          TAXONOMY_PLAYWRIGHT_SKIP_WEBKIT: ${{ !matrix.requiresWebKit }}
          TAXONOMY_UI_SHARD: ${{ matrix.shard }}
          TAXONOMY_UI_OUTPUT_ROOT: ${{ github.workspace }}/target/ui-verification/${{ matrix.shard }}
        run: ./mvnw -B -f .github/ui-verification-pom.xml verify -Pshard -Dtaxonomy.ui.junit.directory="$TAXONOMY_UI_OUTPUT_ROOT/junit-scenarios"
      - name: Upload UI shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: 'ui-verification-${{ matrix.shard }}', path: 'target/ui-verification/**', if-no-files-found: error, retention-days: 7 }

  interoperability-products:
    name: Interoperability product compatibility
    needs: [application, change-scope]
    if: needs.change-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { java-version: '25', distribution: temurin }
      - name: Download commit-bound application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: taxonomy-ui-application, path: target/ui-application }
      - name: Verify real StrictDoc and Archi round trips
        run: ./mvnw -B -f .github/ui-verification-pom.xml verify -Pinteroperability
      - name: Upload JUnit product evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: junit-interoperability-products, path: '.github/target/failsafe-reports/TEST-com.taxonomy.build.InteroperabilityProductsIT.xml', if-no-files-found: error, retention-days: 90 }
      - name: Upload product compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interoperability-product-evidence
          path: |
            target/interoperability-products/evidence.json
            target/interoperability-products/execution.log
            target/interoperability-products/strictdoc-dependencies.txt
            target/interoperability-products/*.reqif
            target/interoperability-products/*.xml
            target/interoperability-products/workbench.zip
            target/interoperability-products/strictdoc-original/reqif/*.reqif
            target/interoperability-products/strictdoc-final/reqif/*.reqif
          if-no-files-found: error
          retention-days: 7

  plugin-profile:
    name: Complete plugin packaging profile
    needs: [change-scope]
    if: needs.change-scope.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - name: Install verified Helm 3.21.0
        run: bash .github/scripts/install-helm.sh
      - name: Configure and verify Docker Hub cache
        run: bash .github/scripts/configure-docker-mirror.sh
      - name: Verify Docker availability
        run: docker info
      - name: Run the complete Maven-owned plugin profile
        env:
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
          FRONTEND_API_BASE_REF: ${{ github.event.pull_request.base.sha }}
          VERSION_STATE_MODE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'development' }}
          VERSION_STATE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          mkdir -p target
          set -o pipefail
          ./mvnw -B verify -Pplugin-packaging-tests,ci-plugin-packaging 2>&1 | tee target/plugin-profile-verification.log
      - name: Stage source-bound original plugin reports
        run: |
          mkdir -p target/plugin-profile-evidence
          for suite in ExternalPluginPackagedIT OptionalFeaturePackagedIT; do
            cp "taxonomy-build/target/failsafe-reports/TEST-com.taxonomy.build.$suite.xml" target/plugin-profile-evidence/
          done
          source_tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
          jq -n --arg commit "$GITHUB_SHA" \
            --arg sourceTree "$source_tree" \
            --arg buildId "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
            --arg external "$(sha256sum target/plugin-profile-evidence/TEST-com.taxonomy.build.ExternalPluginPackagedIT.xml | cut -d ' ' -f 1)" \
            --arg optional "$(sha256sum target/plugin-profile-evidence/TEST-com.taxonomy.build.OptionalFeaturePackagedIT.xml | cut -d ' ' -f 1)" \
            '{commit: $commit, sourceTree: $sourceTree, buildId: $buildId, reports: {
              "TEST-com.taxonomy.build.ExternalPluginPackagedIT.xml": $external,
              "TEST-com.taxonomy.build.OptionalFeaturePackagedIT.xml": $optional
            }}' > target/plugin-profile-evidence/manifest.json
      - name: Upload original plugin reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: junit-plugin-profile, path: 'target/plugin-profile-evidence/*', if-no-files-found: error, retention-days: 90 }
      - name: Upload complete plugin profile evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-profile-verification
          path: |
            target/plugin-profile-verification.log
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            taxonomy-build/target/plugin-packaging-evidence.txt
            taxonomy-build/target/plugin-sdk-verification.txt
            taxonomy-build/target/architecture-module-graph.txt
          if-no-files-found: error
          retention-days: 90

  documentation:
    name: Packaged documentation verification
    needs: [change-scope, application]
    if: needs.change-scope.outputs.scope == 'documentation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_DRAFT: ${{ github.event.pull_request.draft || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: ci-change-scope, path: target }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: taxonomy-ui-application, path: target/ui-application }
      - name: Verify exact packaged documentation through Maven
        run: ./mvnw -B -ntp -f .github/ui-verification-pom.xml verify -Pdocumentation
      - name: Stage original documentation test evidence
        run: java -cp .github/target/classes com.taxonomy.tooling.TaxonomyTooling check-ci-documentation --stage true
      - name: Upload explicitly scoped documentation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: documentation-verification, path: target/documentation-verification, if-no-files-found: error, retention-days: 7 }

  verify:
    name: Maven verification
    needs: [application, production-image, app-test-shards, core, coverage-aggregate, observability, ui-contracts, ui-shards, interoperability-products, plugin-profile, change-scope, documentation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Keep draft heads non-mergeable
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          echo "::error::Draft pull-request heads intentionally do not satisfy required Maven verification."
          exit 1
      - name: Require every authoritative lane
        if: needs.change-scope.outputs.scope == 'full'
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          PRODUCTION_IMAGE_RESULT: ${{ needs.production-image.result }}
          APP_TEST_SHARDS_RESULT: ${{ needs.app-test-shards.result }}
          CORE_RESULT: ${{ needs.core.result }}
          COVERAGE_AGGREGATE_RESULT: ${{ needs.coverage-aggregate.result }}
          OBSERVABILITY_RESULT: ${{ needs.observability.result }}
          UI_CONTRACTS_RESULT: ${{ needs.ui-contracts.result }}
          UI_SHARDS_RESULT: ${{ needs.ui-shards.result }}
          INTEROPERABILITY_RESULT: ${{ needs.interoperability-products.result }}
          PLUGIN_PROFILE_RESULT: ${{ needs.plugin-profile.result }}
        run: |
          for lane in APPLICATION_RESULT PRODUCTION_IMAGE_RESULT APP_TEST_SHARDS_RESULT CORE_RESULT COVERAGE_AGGREGATE_RESULT OBSERVABILITY_RESULT UI_CONTRACTS_RESULT UI_SHARDS_RESULT INTEROPERABILITY_RESULT PLUGIN_PROFILE_RESULT; do
            [[ "${!lane}" == success ]] || { echo "::error::$lane ended with ${!lane}"; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
      - name: Compile the Maven-owned final scope gate
        run: ./mvnw -B -ntp -pl taxonomy-tooling -am compile -Dtaxonomy.frontend.skip=true -Dmaven.build.cache.enabled=false
      - name: Download the source-bound verification scope
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: ci-change-scope, path: target }
      - name: Require the complete selected verification scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-ci-verification-gate
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: needs.change-scope.outputs.scope == 'full'
        with:
          path: .cache/ui-frontend
          key: ${{ runner.os }}-taxonomy-ui-node-${{ hashFiles('.github/package-lock.json', '.github/ui-verification-pom.xml') }}
      - name: Download commit-bound UI application manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: taxonomy-ui-application, path: target/ui-application }
      - name: Download all UI shard evidence
        if: needs.change-scope.outputs.scope == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'ui-verification-*', path: target/ui-verification, merge-multiple: true }
      - name: Download observability evidence
        if: needs.change-scope.outputs.scope == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: observability-performance, path: target/observability-performance }
      - name: Download core quality reports
        if: needs.change-scope.outputs.scope == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: quality-reports-core, path: target/quality-reports }
      - name: Download complete coverage and app shard reports
        if: needs.change-scope.outputs.scope == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: quality-reports-coverage, path: target/quality-reports }
      - name: Download source-bound original plugin reports
        if: needs.change-scope.outputs.scope == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: junit-plugin-profile, path: target/plugin-profile-evidence }
      - name: Download JUnit contract evidence
        if: needs.change-scope.outputs.scope == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: junit-ui-contracts, path: target/quality-reports/tests/ui-contracts/target/surefire-reports }
      - name: Download JUnit production image evidence
        if: needs.change-scope.outputs.scope == 'full' && (needs.production-image.outputs.executed == 'true')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: junit-production-image, path: target/quality-reports/tests/production-image/target/failsafe-reports }
      - name: Download JUnit product evidence
        if: needs.change-scope.outputs.scope == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: junit-interoperability-products, path: target/quality-reports/tests/interoperability-products/target/failsafe-reports }
      - name: Verify complete digest-bound UI evidence
        if: needs.change-scope.outputs.scope == 'full'
        env:
          TAXONOMY_UI_EXPECTED_COMMIT: ${{ github.sha }}
          TAXONOMY_UI_SHARD_RESULTS_ROOT: ${{ github.workspace }}/target/ui-verification
          TAXONOMY_UI_APPLICATION_MANIFEST: ${{ github.workspace }}/target/ui-application/manifest.json
        run: ./mvnw -B -f .github/ui-verification-pom.xml verify -Pevidence-gate
      - name: Finalize commit-bound quality evidence
        if: needs.change-scope.outputs.scope == 'full'
        run: bash .github/scripts/finalize-quality-evidence.sh
      - name: Upload verified reports
        if: needs.change-scope.outputs.scope == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: quality-reports, path: 'target/quality-reports/**', if-no-files-found: error, include-hidden-files: true, retention-days: 90, overwrite: true }
      - name: Upload consolidated UI verification evidence
        if: needs.change-scope.outputs.scope == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: ui-verification, path: 'target/ui-verification/**', if-no-files-found: error, retention-days: 90, overwrite: true }
      - name: Download documentation evidence
        if: needs.change-scope.outputs.scope == 'documentation'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: documentation-verification, path: target/documentation-verification }
      - name: Verify original source-bound documentation results
        if: needs.change-scope.outputs.scope == 'documentation'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-ci-documentation --verify true
      - name: Publish verified documentation scope
        if: needs.change-scope.outputs.scope == 'documentation'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: documentation-verification, path: target/documentation-verification, if-no-files-found: error, retention-days: 90, overwrite: true }
