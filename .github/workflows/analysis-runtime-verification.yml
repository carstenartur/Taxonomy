name: Verify remaining analysis correction (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: write
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6f009d7ab6ba95e28ced41b58224a822ff6ccd3c
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Assemble exact six-file correction without overwriting published work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          out=Path('/tmp/analysis-current');out.mkdir()
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='6f009d7ab6ba95e28ced41b58224a822ff6ccd3c'
          assert git('rev-parse','HEAD')==base
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for blob,digest in [('669b7861563da2a5e9a2c295d22980707021c638','27d4dc72cfaf826e6037b5f53d534c876151181c2508ce6e9ac804fa7a3c6bba'),('b413ac8357d992485802cb28ad80e893e31604ef','1c2033042132841fb5c5f4d593106be5f47c45d0e40908f9c3f9aa0a94ccfa05')]:
              with urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs/'+blob,headers=headers)) as response:
                  data=base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob
              patch=gzip.decompress(data);assert hashlib.sha256(patch).hexdigest()==digest
              path=out/(blob+'.patch');path.write_bytes(patch)
              subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          paths=git('diff','--cached','--name-only').splitlines();assert len(paths)==6,paths
          assert not any('/src/main/java/' in p for p in paths),paths
          tree=git('write-tree');assert tree=='235a144fe002e51c6ca8332b84c72d4beb53e98c',tree
          doc={'base':base,'tree':tree,'files':{p:git('hash-object',p) for p in paths},'verificationRun':os.environ['GITHUB_RUN_ID']}
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary','--full-index']))
          subprocess.run(['git','-c','user.name=Analysis verification','-c','user.email=verification@invalid.example','commit','-m','Verify remaining analysis correction locally'],check=True)
          assert git('status','--porcelain')==''
          (out/'manifest.json').write_text(json.dumps(doc,indent=2)+'\n')
      - name: HTTP terminal boundaries and actual Selenium diagnostic completion
        run: |
          set -o pipefail
          docker info
          ./mvnw -B -ntp -pl taxonomy-app -am verify -DskipITs=false -Dtest=AnalysisCompletionContractTest,AnalysisLiveProgressFixtureTest -Dit.test=AnalysisLiveProgressUiIT -Dsurefire.failIfNoSpecifiedTests=false -Dfailsafe.failIfNoSpecifiedTests=false -DexcludedGroups=real-llm 2>&1 | tee /tmp/analysis-current/maven-focused.log
      - name: Require all five actual browser cases and the twenty HTTP cases
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path
          cases={
              'failsafe-reports/TEST-com.taxonomy.AnalysisLiveProgressUiIT.xml':5,
              'surefire-reports/TEST-com.taxonomy.analysis.controller.AnalysisCompletionContractTest.xml':20,
              'surefire-reports/TEST-com.taxonomy.AnalysisLiveProgressFixtureTest.xml':12}
          for file,count in cases.items():
              suite=ET.parse(Path('taxonomy-app/target')/file).getroot()
              assert int(suite.get('tests','0'))==count,(file,suite.attrib)
              for key in ('failures','errors','skipped'): assert int(suite.get(key,'0'))==0,(file,suite.attrib)
              print(file,suite.attrib)
      - name: Complete Maven-owned frontend contracts and strict bootstrap
        run: |
          set -o pipefail
          ./mvnw -B -ntp -f .github/ui-verification-pom.xml verify -Pcontracts 2>&1 | tee /tmp/analysis-current/frontend.log
          .cache/ui-frontend/node/node .github/scripts/test-taxonomy-base-path.mjs | tee /tmp/analysis-current/base-path.log
      - name: Publish exact checked source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,subprocess,urllib.request,zipfile
          from pathlib import Path
          out=Path('/tmp/analysis-current');doc=json.loads((out/'manifest.json').read_text())
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^{tree}')==doc['tree']
          assert git('diff','--name-only')==''
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          with zipfile.ZipFile(out/'tested-sources.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path,sha in doc['files'].items():
                  data=Path(path).read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha,path
                  request=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs',headers=headers,
                      data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST')
                  with urllib.request.urlopen(request) as response: assert json.load(response)['sha']==sha
                  archive.writestr(path,data)
          doc['verification']='32 focused unit cases, 5 actual Selenium cases, complete frontend and bootstrap contracts passed; full canonical PR CI remains required'
          (out/'manifest.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: analysis-current-${{ github.sha }}
          path: |
            /tmp/analysis-current
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
            **/target/analysis-ui-evidence/**
          retention-days: 7
          if-no-files-found: error
