name: Assemble Copilot Workbench Renderer

on:
  push:
    branches:
      - fix/copilot-architecture-workbench-ux
    paths:
      - .github/tmp/copilot-workbench-js/ready

permissions:
  contents: write

concurrency:
  group: assemble-copilot-workbench-renderer
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/copilot-architecture-workbench-ux
          fetch-depth: 0

      - name: Assemble and verify renderer
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/copilot-workbench-js/part-* \
            > taxonomy-app/src/main/resources/static/js/architecture-workbench.js
          node --check taxonomy-app/src/main/resources/static/js/architecture-workbench.js
          test "$(wc -c < taxonomy-app/src/main/resources/static/js/architecture-workbench.js)" -gt 30000
          rm -rf .github/tmp/copilot-workbench-js
          rm .github/workflows/assemble-copilot-workbench-js.yml
          git diff --check

      - name: Commit assembled source and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/main/resources/static/js/architecture-workbench.js \
            .github/tmp/copilot-workbench-js \
            .github/workflows/assemble-copilot-workbench-js.yml
          git commit -m 'Add the interactive persisted Copilot workbench renderer'
          git push origin HEAD:fix/copilot-architecture-workbench-ux
