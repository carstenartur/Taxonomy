document.templates.local.title=Edit a template locally — Taxonomy
document.templates.local.heading=Edit a template locally — without WebDAV
document.templates.local.back=Back to templates
document.templates.local.intro=Download the template, edit it locally in Word, then upload it in this browser. Word does not connect to Taxonomy; no additional client or application password is required.
document.templates.local.base=Fixed starting version:
document.templates.local.keep=Keep this page open or bookmark its address. The address preserves the starting version, including after reloading or signing in again. Do not use a new editing link for a file based on an older download.
document.templates.local.download.heading=1. Download and edit
document.templates.local.word=In Word use File → Open to edit this DOTX template itself. Keep its required placeholders and save as DOTX, not as a new DOCX document. Saving in Word does not upload the file to Taxonomy.
document.templates.local.download=Download this starting version
document.templates.local.upload.heading=2. Upload the edited template
document.templates.local.check=The server validates the DOTX package and any required placeholders before creating a new active Git version. A changed server version causes a conflict, not an overwrite.
document.templates.local.file.help=Select the file edited from the starting version above. Template ID and name are fixed. Your local file is not deleted, including after an error.
document.templates.local.save=Validate and save as a new version
document.templates.local.javascript=JavaScript is required for the version-protected upload. Download and history links remain available.
document.templates.local.result=3. Review the saved result
document.templates.local.compare=Compare the saved changes
document.templates.local.sample=Download a test report from the current template
document.templates.local.sample.help=The test report uses the current server version, which may have changed since this save. It is not a pre-publication check.
document.templates.local.history=Inspect history and compare with the starting version
document.templates.local.failed=The version-protected upload is unavailable. Keep your local file and return to this exact editing address.
document.templates.local.invalid=Select a valid, non-empty DOTX template, not a DOCX document.
document.templates.local.too-large=The file exceeds the permitted template archive size.
document.templates.local.busy=Uploading and validating the template…
document.templates.local.saved=The template passed validation and was saved as a new Git version. Review the changes below.
document.templates.local.conflict=This template has changed on the server since your starting version. Nothing was overwritten by this request. Keep your local file and use the history comparison to reconcile the changes. Reloading this page will not bypass the conflict.
document.templates.local.authentication=Your sign-in has expired or you do not have permission to save templates. Sign in as an administrator in another tab, then return to this exact editing address and select your local file again if necessary.
document.templates.local.uncertain=The save result could not be confirmed. Keep your local file and check the history before retrying: the server may already have saved it. No automatic retry or overwrite was attempted.
