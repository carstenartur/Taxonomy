name: Fix container navigation initialization race

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-fix-container-nav-race.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/issue-461-jgit-storage-hibernate
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Patch the shared Selenium navigation contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('taxonomy-app/src/test/java/com/taxonomy/AbstractSeleniumContainerIT.java')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one occurrence, found {text.count(old)}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'import org.openqa.selenium.By;\nimport org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.WebElement;\n',
              'import org.openqa.selenium.By;\nimport org.openqa.selenium.JavascriptExecutor;\nimport org.openqa.selenium.WebDriver;\nimport org.openqa.selenium.WebElement;\n')

          replace_once(
              '''        if (!dismissBtns.isEmpty()) {
              dismissBtns.get(0).click();
              new WebDriverWait(driver, Duration.ofSeconds(5))
                      .until(ExpectedConditions.invisibilityOfElementLocated(By.id("onboardingOverlay")));
          }
      }

      @AfterAll
'''.replace('      ', ''),
              '''        if (!dismissBtns.isEmpty()) {
              dismissBtns.get(0).click();
              new WebDriverWait(driver, Duration.ofSeconds(5))
                      .until(ExpectedConditions.invisibilityOfElementLocated(By.id("onboardingOverlay")));
          }
          waitForRoleSurfaceReady();
      }

      @AfterAll
'''.replace('      ', ''))

          replace_once(
              '''    private String baseUrl() {
          return "http://" + appContainer.getHost() + ":" + appContainer.getMappedPort(8080);
      }
'''.replace('      ', ''),
              '''    private void waitForRoleSurfaceReady() {
          new WebDriverWait(driver, Duration.ofSeconds(30))
                  .until(d -> Boolean.TRUE.equals(((JavascriptExecutor) d).executeScript(
                          "return Boolean(window.TaxonomyRoleSurface " +
                                  "&& window.TaxonomyRoleSurface.getContext " +
                                  "&& window.TaxonomyRoleSurface.getContext().administrator === true);")));
      }

      private void openMainTab(String pageId) {
          waitForRoleSurfaceReady();
          By tabSelector = By.cssSelector(
                  "#mainNavTabs .nav-link[data-page='" + pageId + "']");
          WebElement tab = new WebDriverWait(driver, Duration.ofSeconds(20))
                  .until(ExpectedConditions.visibilityOfElementLocated(tabSelector));
          ((JavascriptExecutor) driver).executeScript(
                  "arguments[0].scrollIntoView({block:'nearest',inline:'center'});", tab);
          new WebDriverWait(driver, Duration.ofSeconds(20))
                  .until(d -> Boolean.TRUE.equals(((JavascriptExecutor) d).executeScript(
                          "const el=arguments[0],r=el.getBoundingClientRect();" +
                                  "const hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);" +
                                  "return hit===el || el.contains(hit);", tab)));
          new WebDriverWait(driver, Duration.ofSeconds(20))
                  .until(ExpectedConditions.elementToBeClickable(tabSelector))
                  .click();
          new WebDriverWait(driver, Duration.ofSeconds(20))
                  .until(ExpectedConditions.visibilityOfElementLocated(By.id("tab-" + pageId)));
      }

      private String baseUrl() {
          return "http://" + appContainer.getHost() + ":" + appContainer.getMappedPort(8080);
      }
'''.replace('      ', ''))

          replace_once(
              '''        WebElement helpTab = driver.findElement(
                  By.cssSelector("#mainNavTabs .nav-link[data-page='help']"));
          helpTab.click();
'''.replace('      ', ''),
              '        openMainTab("help");\n'.replace('      ', ''))

          marker = '''        new WebDriverWait(driver, Duration.ofSeconds(30))
                  .until(ExpectedConditions.presenceOfElementLocated(
                          By.cssSelector("#taxonomyTree .tax-node")));
'''.replace('      ', '')
          if text.count(marker) != 2:
              raise SystemExit(f'Expected two locale reload markers, found {text.count(marker)}')
          text = text.replace(marker, marker + '        waitForRoleSurfaceReady();\n'.replace('      ', ''), 2)

          replace_once(
              '''        // Should still be in German locale from previous test
          // Navigate to Help tab
          WebElement helpTab = driver.findElement(
                  By.cssSelector("#mainNavTabs .nav-link[data-page='help']"));
          helpTab.click();
'''.replace('      ', ''),
              '''        // Should still be in German locale from previous test.
          openMainTab("help");
'''.replace('      ', ''))

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/database-compatibility.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          trigger = "      - 'taxonomy-app/src/test/java/com/taxonomy/AbstractSeleniumContainerIT.java'\n"
          anchor = "      - 'taxonomy-app/src/test/java/com/taxonomy/**/*Oracle*IT.java'\n"
          if trigger not in workflow_text:
              if workflow_text.count(anchor) != 1:
                  raise SystemExit('Database workflow trigger anchor is unavailable')
              workflow_text = workflow_text.replace(anchor, anchor + trigger, 1)
          workflow.write_text(workflow_text, encoding='utf-8')
          PY
      - name: Compile the patched integration-test contract
        run: ./mvnw -B -pl taxonomy-app -am -DskipTests test-compile
      - name: Commit the verified fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taxonomy-app/src/test/java/com/taxonomy/AbstractSeleniumContainerIT.java \
            .github/workflows/database-compatibility.yml
          git commit -m 'Wait for stable role navigation in container UI tests'
          git push origin HEAD:fix/issue-461-jgit-storage-hibernate
