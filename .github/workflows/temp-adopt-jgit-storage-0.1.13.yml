name: Adopt jgit-storage-hibernate 0.1.13

on:
  push:
    branches: [ fix/issue-461-jgit-storage-hibernate ]
    paths:
      - '.github/workflows/temp-adopt-jgit-storage-0.1.13.yml'

permissions:
  contents: write

concurrency:
  group: taxonomy-adopt-jgit-storage-0.1.13
  cancel-in-progress: true

jobs:
  adopt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/issue-461-jgit-storage-hibernate
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Wait for anonymous immutable release
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/carstenartur/jgit-storage-hibernate/maven-repository/io/github/carstenartur/jgit-storage-hibernate-core/0.1.13/jgit-storage-hibernate-core-0.1.13.pom'
          for attempt in $(seq 1 90); do
            if curl -fsS "$url" -o /tmp/jgit-storage-hibernate-core-0.1.13.pom; then
              grep -q '<version>0.1.13</version>' /tmp/jgit-storage-hibernate-core-0.1.13.pom
              exit 0
            fi
            sleep 20
          done
          echo 'Public 0.1.13 POM did not become available.' >&2
          exit 1
      - name: Update current consumer references
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -l '0\.1\.12' -- pom.xml README.md docs .env.example 'docker-compose*.yml' taxonomy-app || true)
          printf 'Updating:\n%s\n' "${files[@]}"
          test ${#files[@]} -gt 0
          sed -i 's/0\.1\.12/0.1.13/g' "${files[@]}"
          grep -q '<jgit-storage-hibernate.version>0.1.13</jgit-storage-hibernate.version>' pom.xml
          ! git grep -n '0\.1\.12' -- pom.xml README.md docs .env.example 'docker-compose*.yml' taxonomy-app
      - name: Validate Maven model
        run: ./mvnw -B -N validate
      - name: Commit consumer update
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pom.xml README.md docs .env.example docker-compose*.yml taxonomy-app
          if git diff --staged --quiet; then
            echo 'No consumer update required.'
            exit 0
          fi
          git commit -m 'Use jgit-storage-hibernate 0.1.13'
          git push origin HEAD:fix/issue-461-jgit-storage-hibernate
