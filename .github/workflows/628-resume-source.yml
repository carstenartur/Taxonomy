name: Workspace regression runtime (temporary)
on:
  push:
    branches: [verify/628-boundary-regressions-20260916]
    paths: [.github/workflows/628-resume-source.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dcaae3052efaab54273c919689899582938ed141
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Compile unchanged workspace and its test runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 1a410ee2674e91f1dea02286fc771812126f8854
          mkdir -p /tmp/workspace-runtime/libs
          git archive --format=tar HEAD | gzip > /tmp/workspace-runtime/source.tar.gz
          git rev-parse HEAD HEAD^{tree} > /tmp/workspace-runtime/identity.txt
          ./mvnw -B -ntp -pl taxonomy-workspace -am install -DskipTests -DskipITs -Dtaxonomy.ui.skip=true
          ./mvnw -B -ntp -pl taxonomy-workspace org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=test -DoutputDirectory=/tmp/workspace-runtime/libs
          tar -czf /tmp/workspace-runtime/compiled.tar.gz taxonomy-workspace/target/classes taxonomy-workspace/target/test-classes
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workspace-runtime-dcaae305
          path: /tmp/workspace-runtime
          retention-days: 3
          if-no-files-found: error
