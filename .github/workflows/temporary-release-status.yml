name: Temporary release status diagnostics

on:
  pull_request:
    branches: [ main ]

permissions:
  actions: read
  contents: read

jobs:
  release-status:
    name: Read latest release workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-release.yml \
            --branch main \
            --limit 10 \
            --json databaseId,displayTitle,event,headSha,status,conclusion,createdAt,updatedAt,url
