name: Release Workflow

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-request.json'
  workflow_dispatch:
    inputs:
      next_development_version:
        description: 'Exact next development version, for example 1.3.0-SNAPSHOT. Leave empty to use the increment choice.'
        required: false
        type: string
        default: ''
      next_version_increment:
        description: 'Select how the development version advances when no exact version is supplied.'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: 'Skip tests in a dry run only. Published releases always run the canonical verification suite.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate and build without changing remote refs, releases, images or deploy hooks.'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  issues: read
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build, stage and advance to the next snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout authoritative release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build Java release tooling
        id: release_tooling
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -pl taxonomy-tooling -am package -DskipTests
          tooling_jar=$(find taxonomy-tooling/target -maxdepth 1 -type f \
            -name 'taxonomy-tooling-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)
          if [[ -z "$tooling_jar" || ! -f "$tooling_jar" ]]; then
            echo "::error::Java release tooling jar was not produced"
            exit 1
          fi
          cp "$tooling_jar" "$RUNNER_TEMP/taxonomy-tooling.jar"
          echo "jar=$RUNNER_TEMP/taxonomy-tooling.jar" >> "$GITHUB_OUTPUT"

      - name: Resolve release parameters
        id: release_parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_NEXT_DEVELOPMENT_VERSION: ${{ inputs.next_development_version }}
          INPUT_NEXT_VERSION_INCREMENT: ${{ inputs.next_version_increment }}
          INPUT_SKIP_TESTS: ${{ inputs.skip_tests }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" resolve-release-parameters --root .

      - name: Install verified Helm 3.21.0
        env:
          HELM_VERSION: v3.21.0
        shell: bash
        run: bash .github/scripts/install-helm.sh

      - name: Verify release Helm chart before publication
        if: hashFiles('deploy/helm/taxonomy/Chart.yaml') != ''
        shell: bash
        run: bash deploy/helm/taxonomy/verify.sh "$RUNNER_TEMP/taxonomy-helm-preflight.yaml"

      - name: Preserve release scripts
        run: |
          cp .github/scripts/release.sh "$RUNNER_TEMP/release.sh"
          cp .github/scripts/update-release-metadata.py \
            "$RUNNER_TEMP/update-release-metadata.py"
          cp .github/scripts/generate-vex.py "$RUNNER_TEMP/generate-vex.py"
          cp .github/scripts/verify-exact-release-gates.sh \
            "$RUNNER_TEMP/verify-exact-release-gates.sh"
          cp .github/scripts/validate-reviewed-release-notes.sh \
            "$RUNNER_TEMP/validate-reviewed-release-notes.sh"
          chmod +x "$RUNNER_TEMP/release.sh" \
            "$RUNNER_TEMP/update-release-metadata.py" \
            "$RUNNER_TEMP/generate-vex.py" \
            "$RUNNER_TEMP/verify-exact-release-gates.sh" \
            "$RUNNER_TEMP/validate-reviewed-release-notes.sh"

      - name: Test release guards
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -pl taxonomy-tooling test
          bash -n .github/scripts/release.sh
          bash -n .github/scripts/verify-exact-release-gates.sh
          bash -n .github/scripts/validate-reviewed-release-notes.sh
          bash -n .github/scripts/install-helm.sh
          bash -n deploy/helm/taxonomy/verify.sh
          python3 .github/scripts/check-release-delivery-contract.py

      - name: Build and stage release, then prepare next development version
        if: steps.release_parameters.outputs.resume_staged_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_parameters.outputs.release_version }}
          NEXT_VERSION_INPUT: ${{ steps.release_parameters.outputs.next_development_version }}
          SKIP_TESTS: ${{ steps.release_parameters.outputs.skip_tests }}
          DRY_RUN: ${{ steps.release_parameters.outputs.dry_run }}
          DEFER_RELEASE_PUBLICATION: 'true'
          SOURCE_BRANCH: ${{ github.ref_name }}
          METADATA_HELPER: ${{ runner.temp }}/update-release-metadata.py
          TOOLING_JAR: ${{ runner.temp }}/taxonomy-tooling.jar
          VEX_HELPER: ${{ runner.temp }}/generate-vex.py
          RELEASE_NOTES_VALIDATOR: ${{ runner.temp }}/validate-reviewed-release-notes.sh
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/bge-small-en-v1.5
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
        run: "$RUNNER_TEMP/release.sh"

      - name: Validate staged release for resume
        if: steps.release_parameters.outputs.resume_staged_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_parameters.outputs.release_version }}
          NEXT_VERSION_INPUT: ${{ steps.release_parameters.outputs.next_development_version }}
          RELEASE_NOTES_VALIDATOR: ${{ runner.temp }}/validate-reviewed-release-notes.sh
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"

          git fetch origin "refs/heads/main:refs/remotes/origin/main" --force
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}"

          if ! git merge-base --is-ancestor "$tag" origin/main; then
            echo "::error::Staged tag $tag is not an ancestor of origin/main"
            exit 1
          fi

          git checkout --detach "$tag"
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-version-state \
            --root . --mode release \
            --expected-version "$RELEASE_VERSION" --tag "$tag"
          RELEASE_NOTES_COMMIT="$tag" \
            RELEASE_NOTES_FILE=release_notes.md \
            "$RELEASE_NOTES_VALIDATOR"

          release_tag=$(gh release view "$tag" --json tagName --jq '.tagName')
          is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
          if [[ "$release_tag" != "$tag" ]]; then
            echo "::error::Release lookup returned $release_tag instead of $tag"
            exit 1
          fi
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $tag must still be a draft before publication resumes"
            exit 1
          fi

          git checkout --detach origin/main
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-version-state \
            --root . --mode development \
            --expected-version "$NEXT_VERSION_INPUT"

      - name: Record exact final main snapshot
        id: final_main
        if: steps.release_parameters.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected_sha=$(git rev-parse HEAD)
          git fetch origin "refs/heads/main:refs/remotes/origin/main" --force
          remote_sha=$(git rev-parse origin/main)
          if [[ "$remote_sha" != "$expected_sha" ]]; then
            echo "::error::Publication candidate is $expected_sha, but origin/main is $remote_sha"
            exit 1
          fi
          echo "sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Verify exact final main release gate matrix
        if: steps.release_parameters.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ steps.final_main.outputs.sha }}
        shell: bash
        run: bash "$RUNNER_TEMP/verify-exact-release-gates.sh"

      - name: Checkout immutable release source
        if: steps.release_parameters.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ steps.release_parameters.outputs.release_version }}"
          git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "$tag"

      - name: Package and stage immutable Helm artifacts
        if: steps.release_parameters.outputs.dry_run != 'true' && hashFiles('deploy/helm/taxonomy/Chart.yaml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_parameters.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          artifact_dir="$RUNNER_TEMP/helm-release"
          mkdir -p "$artifact_dir"

          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-version-state \
            --root . --mode release \
            --expected-version "$RELEASE_VERSION" --tag "$tag"
          helm lint deploy/helm/taxonomy \
            --set "image.tag=${tag}" \
            --set existingSecret=taxonomy-secrets
          helm package deploy/helm/taxonomy \
            --destination "$artifact_dir" \
            --version "$RELEASE_VERSION" \
            --app-version "$RELEASE_VERSION"
          chart_archive="$artifact_dir/taxonomy-${RELEASE_VERSION}.tgz"
          test -f "$chart_archive"

          chart_version=$(helm show chart "$chart_archive" \
            | awk '$1 == "version:" {print $2; exit}')
          app_version=$(helm show chart "$chart_archive" \
            | awk '$1 == "appVersion:" {gsub(/\"/, "", $2); print $2; exit}')
          test "$chart_version" = "$RELEASE_VERSION"
          test "$app_version" = "$RELEASE_VERSION"

          manifest="$artifact_dir/taxonomy-${RELEASE_VERSION}-kubernetes.yaml"
          helm template taxonomy deploy/helm/taxonomy \
            --namespace taxonomy \
            --set "image.tag=${tag}" \
            --set existingSecret=taxonomy-secrets \
            > "$manifest"
          grep -Fq "image: \"ghcr.io/carstenartur/taxonomy:${tag}\"" "$manifest"
          grep -Fq 'namespace: taxonomy' "$manifest"
          grep -Fq 'readOnlyRootFilesystem: true' "$manifest"
          grep -Fq 'runAsUser: 10001' "$manifest"

          (
            cd "$artifact_dir"
            sha256sum "taxonomy-${RELEASE_VERSION}.tgz" \
              "taxonomy-${RELEASE_VERSION}-kubernetes.yaml" \
              > "taxonomy-${RELEASE_VERSION}-helm.sha256"
          )
          gh release upload "$tag" "$artifact_dir"/* --clobber

      - name: Describe immutable release source
        id: release_source
        if: steps.release_parameters.outputs.dry_run != 'true'
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.release_parameters.outputs.dry_run != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable release image
        id: release_image
        if: steps.release_parameters.outputs.dry_run != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/taxonomy:v${{ steps.release_parameters.outputs.release_version }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=Taxonomy Architecture Analyzer
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release_parameters.outputs.release_version }}
            org.opencontainers.image.revision=${{ steps.release_source.outputs.sha }}
          build-args: |
            BUILD_DATE=${{ steps.release_source.outputs.created }}
            VCS_REF=${{ steps.release_source.outputs.sha }}
            VERSION=${{ steps.release_parameters.outputs.release_version }}

      - name: Scan immutable release image digest
        if: steps.release_parameters.outputs.dry_run != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/taxonomy@${{ steps.release_image.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: sarif
          output: release-image-trivy.sarif
          exit-code: '1'

      - name: Bind release evidence and Helm deployment to immutable image digest
        if: steps.release_parameters.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_parameters.outputs.release_version }}
          IMAGE_DIGEST: ${{ steps.release_image.outputs.digest }}
          RELEASE_SOURCE_SHA: ${{ steps.release_source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return a valid immutable image digest: $IMAGE_DIGEST"
            exit 1
          fi

          tag="v${RELEASE_VERSION}"
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER}/taxonomy"
          immutable_image="${repository}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "$immutable_image" >/dev/null

          artifact_dir="$RUNNER_TEMP/helm-release"
          mkdir -p "$artifact_dir" target
          evidence_file="target/release-image-evidence.json"
          export RELEASE_VERSION IMAGE_DIGEST RELEASE_SOURCE_SHA immutable_image evidence_file
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schemaVersion": 1,
              "releaseVersion": os.environ["RELEASE_VERSION"],
              "sourceCommit": os.environ["RELEASE_SOURCE_SHA"],
              "image": os.environ["immutable_image"],
              "digest": os.environ["IMAGE_DIGEST"],
              "scan": {
                  "tool": "trivy",
                  "severityGate": ["HIGH", "CRITICAL"],
                  "result": "passed",
              },
              "attestations": {
                  "provenance": True,
                  "sbom": True,
              },
          }
          Path(os.environ["evidence_file"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cp "$evidence_file" \
            "$artifact_dir/taxonomy-${RELEASE_VERSION}-image-evidence.json"
          cp release-image-trivy.sarif \
            "$artifact_dir/taxonomy-${RELEASE_VERSION}-image-trivy.sarif"

          release_checksum_inputs=(
            "taxonomy-${RELEASE_VERSION}-image-evidence.json"
            "taxonomy-${RELEASE_VERSION}-image-trivy.sarif"
          )
          if [[ -f deploy/helm/taxonomy/Chart.yaml ]]; then
            digest_manifest="$artifact_dir/taxonomy-${RELEASE_VERSION}-kubernetes-digest.yaml"
            helm lint deploy/helm/taxonomy \
              --set-string image.tag='' \
              --set-string "image.digest=${IMAGE_DIGEST}" \
              --set existingSecret=taxonomy-secrets
            helm template taxonomy deploy/helm/taxonomy \
              --namespace taxonomy \
              --set-string image.tag='' \
              --set-string "image.digest=${IMAGE_DIGEST}" \
              --set existingSecret=taxonomy-secrets \
              > "$digest_manifest"
            grep -Fq "image: \"${immutable_image}\"" "$digest_manifest"
            grep -Fq 'readOnlyRootFilesystem: true' "$digest_manifest"
            grep -Fq 'runAsUser: 10001' "$digest_manifest"
            release_checksum_inputs+=("taxonomy-${RELEASE_VERSION}-kubernetes-digest.yaml")
          fi

          (
            cd "$artifact_dir"
            sha256sum "${release_checksum_inputs[@]}" \
              > "taxonomy-${RELEASE_VERSION}-release.sha256"
          )
          gh release upload "$tag" "$artifact_dir"/* --clobber

      - name: Archive immutable release image evidence
        if: always() && steps.release_parameters.outputs.dry_run != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-image-security-${{ steps.release_parameters.outputs.release_version }}
          path: |
            release-image-trivy.sarif
            target/release-image-evidence.json
          if-no-files-found: warn
          retention-days: 90

      - name: Publish complete release and trigger deployment
        if: steps.release_parameters.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_parameters.outputs.release_version }}
          IMAGE_DIGEST: ${{ steps.release_image.outputs.digest }}
          RELEASE_NOTES_VALIDATOR: ${{ runner.temp }}/validate-reviewed-release-notes.sh
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER}/taxonomy"
          image="${repository}@${IMAGE_DIGEST}"

          RELEASE_NOTES_COMMIT="$tag" \
            RELEASE_NOTES_FILE=release_notes.md \
            "$RELEASE_NOTES_VALIDATOR"

          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for expected in \
            "taxonomy-${RELEASE_VERSION}-image-evidence.json" \
            "taxonomy-${RELEASE_VERSION}-image-trivy.sarif" \
            "taxonomy-${RELEASE_VERSION}-release.sha256"; do
            if ! grep -Fxq "$expected" <<< "$assets"; then
              echo "::error::Draft release is missing required image evidence $expected"
              exit 1
            fi
          done
          if [[ -f deploy/helm/taxonomy/Chart.yaml ]]; then
            for expected in \
              "taxonomy-${RELEASE_VERSION}.tgz" \
              "taxonomy-${RELEASE_VERSION}-kubernetes.yaml" \
              "taxonomy-${RELEASE_VERSION}-kubernetes-digest.yaml" \
              "taxonomy-${RELEASE_VERSION}-helm.sha256"; do
              if ! grep -Fxq "$expected" <<< "$assets"; then
                echo "::error::Draft release is missing required Helm asset $expected"
                exit 1
              fi
            done
          fi

          docker buildx imagetools inspect "$image" >/dev/null
          evidence_digest=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('target/release-image-evidence.json').read_text())['digest'])
          PY
          )
          if [[ "$evidence_digest" != "$IMAGE_DIGEST" ]]; then
            echo "::error::Release image evidence records $evidence_digest, expected $IMAGE_DIGEST"
            exit 1
          fi

          is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
          if [[ "$is_draft" == "true" ]]; then
            gh release edit "$tag" \
              --notes-file release_notes.md \
              --draft=false \
              --latest
          elif [[ "$is_draft" != "false" ]]; then
            echo "::error::Unexpected draft state for $tag: $is_draft"
            exit 1
          fi
          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = false

          if [[ -n "$RENDER_DEPLOY_HOOK_URL" ]]; then
            curl -fSL --retry 3 "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deployment triggered after complete release publication."
          else
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set - skipping Render deploy"
          fi
