name: Analysis exact-source snapshot (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 025d3548abfd70e5b1499169276cec0302636f69
          persist-credentials: false
      - name: Export only tracked source and source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 025d3548abfd70e5b1499169276cec0302636f69
          mkdir -p /tmp/analysis-source
          git rev-parse HEAD HEAD^{tree} > /tmp/analysis-source/identity.txt
          git ls-tree -r HEAD > /tmp/analysis-source/blobs.txt
          git archive --format=zip --output=/tmp/analysis-source/source.zip HEAD -- '*.java' '*.js' '*.mjs' '*.json' '*.xml' '*.md' '*.properties' '*.yml' '*.yaml' '*.sh' 'mvnw' '.mvn'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analysis-source-025d3548
          path: /tmp/analysis-source
          retention-days: 1
          if-no-files-found: error
