name: Patch decision-report bootstrap layering

on:
  push:
    branches:
      - agent/decision-rationale-report-extension
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decision-rationale-report-bootstrap-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: agent/decision-rationale-report-extension

      - name: Add the versioning-owned ad-hoc controller move
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/apply-decision-report-extension.yml'
          grep -Fq 'taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReportController.java' "$workflow"
          grep -Fq '      - name: Register decision-report help documentation' "$workflow"

          cat > /tmp/ad-hoc-controller-step <<'EOF'
                - name: Place ad-hoc report adapter in the versioning layer
                  shell: bash
                  run: |
                    set -euo pipefail
                    old='taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReportController.java'
                    new_dir='taxonomy-app/src/main/java/com/taxonomy/versioning/controller'
                    mkdir -p "$new_dir"
                    mv "$old" "$new_dir/"
                    target="$new_dir/DecisionRationaleReportController.java"
                    perl -0pi -e 's/package com\.taxonomy\.architecture\.decision;\n\n/package com.taxonomy.versioning.controller;\n\nimport com.taxonomy.architecture.decision.DecisionRationaleReport;\nimport com.taxonomy.architecture.decision.DecisionRationaleReportPlugin;\nimport com.taxonomy.architecture.decision.DecisionRationaleReportService;\n/' "$target"
                    grep -Fq 'package com.taxonomy.versioning.controller;' "$target"
                    grep -Fq 'import com.taxonomy.architecture.decision.DecisionRationaleReportService;' "$target"
          EOF
          sed -i 's/^        //' /tmp/ad-hoc-controller-step

          awk '
            /^      - name: Register decision-report help documentation$/ && !inserted {
              while ((getline line < "/tmp/ad-hoc-controller-step") > 0) print line
              close("/tmp/ad-hoc-controller-step")
              inserted = 1
            }
            { print }
            END { if (!inserted) exit 42 }
          ' "$workflow" > /tmp/apply-workflow
          mv /tmp/apply-workflow "$workflow"
          sed -i 's#taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReportController.java#taxonomy-app/src/main/java/com/taxonomy/versioning/controller/DecisionRationaleReportController.java#g' "$workflow"

          test "$(grep -Fc 'Place ad-hoc report adapter in the versioning layer' "$workflow")" -eq 1
          test "$(grep -Fc 'taxonomy-app/src/main/java/com/taxonomy/versioning/controller/DecisionRationaleReportController.java' "$workflow")" -eq 1
          test "$(grep -Fc 'taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReportController.java' "$workflow")" -eq 1

      - name: Commit the one-time bootstrap correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/patch-decision-report-bootstrap.yml
          git add -- .github/workflows/apply-decision-report-extension.yml
          git diff --cached --check
          git commit -m 'Move decision-report HTTP adapter to versioning layer'
          git push origin HEAD:agent/decision-rationale-report-extension
