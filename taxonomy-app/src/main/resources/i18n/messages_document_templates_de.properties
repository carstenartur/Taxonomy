document.templates.upload.file=DOTX-Datei
document.templates.upload.submit=Hochladen und Version erzeugen
document.templates.upload.help=Dieses Formular legt nur neue Vorlagen an. Bei bestehenden Vorlagen in der Liste „Lokal bearbeiten“ wählen, damit die heruntergeladene Ausgangsversion auch nach einem Neuladen geschützt bleibt.
