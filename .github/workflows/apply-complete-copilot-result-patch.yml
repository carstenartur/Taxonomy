name: Apply Complete Copilot Result Patch

on:
  push:
    branches:
      - fix/complete-copilot-run-result-ux
    paths:
      - .github/workflows/apply-complete-copilot-result-patch.yml

permissions:
  contents: write

concurrency:
  group: apply-complete-copilot-result-patch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/complete-copilot-run-result-ux
          fetch-depth: 0

      - name: Apply the already source-verified patch from the final QA recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          recipe = Path('.github/workflows/qa-complete-copilot-result-final.yml')
          content = recipe.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = content.index(marker) + len(marker)
          end = content.index("\n          PY", start)
          script = textwrap.dedent(content[start:end])
          exec(compile(script, str(recipe) + ':embedded-patch', 'exec'))
          PY

          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          git diff --check

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify source contracts
        run: >-
          ./mvnw -B -pl taxonomy-app -am test
          -Dtest=CompleteCopilotResultUiContractTest,RequirementCopilotUiContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Commit the patch and remove temporary recipes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qa-complete-copilot-result-final.yml
          rm .github/workflows/apply-complete-copilot-result-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java \
            taxonomy-app/src/test/java/com/taxonomy/portfolio/CompleteCopilotResultUiContractTest.java \
            .github/workflows/qa-complete-copilot-result-final.yml \
            .github/workflows/apply-complete-copilot-result-patch.yml
          git commit -m 'Apply robust complete Copilot result navigation and labels'
          git push origin HEAD:fix/complete-copilot-run-result-ux
