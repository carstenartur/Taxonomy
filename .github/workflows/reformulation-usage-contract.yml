name: Reformulation usage contract

# Supplemental regression verification; canonical full-reactor gates stay required.
on:
  pull_request:
    paths:
      - 'taxonomy-tooling/**'
      - 'taxonomy-analysis/**'
      - 'taxonomy-portfolio/**'
      - 'taxonomy-app/**'
      - '.github/workflows/reformulation-usage-contract.yml'

permissions:
  contents: read

concurrency:
  group: usage-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Compile dependency-free report verifier
        run: |
          mkdir -p taxonomy-tooling/target/classes
          javac --release 21 -d taxonomy-tooling/target/classes taxonomy-tooling/src/main/java/com/taxonomy/tooling/*.java
      - name: Run all analysis and upstream unit tests
        run: |
          set +e
          ./mvnw -B -ntp -pl taxonomy-tooling,taxonomy-analysis -am test > usage-tests.log 2>&1
          result=$?
          tail -n 100 usage-tests.log
          exit "$result"
      - name: Require the intended suites to have executed
        if: always()
        run: |
          java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-junit-reports \
            taxonomy-tooling/target/surefire-reports/TEST-com.taxonomy.tooling.JunitReportVerifierTest.xml 5 \
            taxonomy-analysis/target/surefire-reports/TEST-com.taxonomy.analysis.service.LlmTransportMeterTest.xml 8 \
            taxonomy-analysis/target/surefire-reports/TEST-com.taxonomy.analysis.service.LlmTransportMeterBoundaryTest.xml 6 \
            taxonomy-analysis/target/surefire-reports/TEST-com.taxonomy.analysis.service.LlmDurableTransportTest.xml 3 \
            taxonomy-analysis/target/surefire-reports/TEST-com.taxonomy.analysis.reformulation.ParallelReformulationMeterTest.xml 1 \
            taxonomy-analysis/target/surefire-reports/TEST-com.taxonomy.analysis.reformulation.GroupedEvidenceFidelityTest.xml 6
      - name: Verify durable per-run accounting and existing architecture boundaries
        run: |
          set +e
          ./mvnw -B -ntp -pl taxonomy-app -am test \
            -Dtest=ReformulationUsageBoundaryTest,ReformulationUsageTest,ReformulationUsageWorkerTest,ReformulationLocalRecoveryTest,ReformulationEncodingTest,ArchitectureContextDependencyRatchetTest \
            -Dsurefire.failIfNoSpecifiedTests=false > usage-persistence-tests.log 2>&1
          result=$?
          tail -n 100 usage-persistence-tests.log
          exit "$result"
      - name: Require persistence suites and positive test counts
        if: always()
        run: |
          java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-junit-reports \
            taxonomy-portfolio/target/surefire-reports/TEST-com.taxonomy.portfolio.reformulation.ReformulationUsageBoundaryTest.xml 3 \
            taxonomy-app/target/surefire-reports/TEST-com.taxonomy.portfolio.reformulation.ReformulationUsageTest.xml 1 \
            taxonomy-app/target/surefire-reports/TEST-com.taxonomy.portfolio.reformulation.ReformulationUsageWorkerTest.xml 2 \
            taxonomy-app/target/surefire-reports/TEST-com.taxonomy.ArchitectureContextDependencyRatchetTest.xml 1 \
            taxonomy-app/target/surefire-reports/TEST-com.taxonomy.portfolio.reformulation.ReformulationLocalRecoveryTest.xml 2 \
            taxonomy-app/target/surefire-reports/TEST-com.taxonomy.portfolio.reformulation.ReformulationEncodingTest.xml 1
      - name: Archive the tested public source tree
        if: always()
        run: git archive --format=zip -o usage-source.zip HEAD
      - name: Preserve actual reports and source identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: usage-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            usage-tests.log
            usage-persistence-tests.log
            usage-source.zip
            taxonomy-*/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
