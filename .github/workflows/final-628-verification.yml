name: Final 628 review verification
on:
  push:
    branches: [work/628-final-review-verification]
    paths: [.github/workflows/final-628-verification.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e87e419d2e344efe92f8fe63dc0f28cd735f5cb6
          persist-credentials: false
      - name: Archive tracked source and exact Git identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git archive --format=tar.gz HEAD > snapshot/source.tar.gz
          git cat-file commit HEAD > snapshot/head-commit.txt
          git rev-parse HEAD > snapshot/source-commit.txt
          git rev-parse HEAD^{tree} > snapshot/source-tree.txt
          sha256sum snapshot/source.tar.gz > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: final-628-source
          path: snapshot/*
          if-no-files-found: error
          retention-days: 1
