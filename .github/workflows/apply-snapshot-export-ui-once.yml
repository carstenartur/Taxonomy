name: Apply snapshot export UI patch once

on:
  push:
    branches:
      - fix/snapshot-bound-architecture-exports
    paths:
      - .github/workflows/apply-snapshot-export-ui-once.yml

permissions:
  contents: write

concurrency:
  group: apply-snapshot-export-ui-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'carstenartur/Taxonomy' && github.actor == 'carstenartur'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Replace only the architecture export control wiring
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('taxonomy-app/src/main/resources/static/js/architecture-workbench.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              text = text.replace(old, new)

          replace_once(
              "    const fullscreenButton = document.getElementById('fullscreenArchitecture');\n",
              "    const fullscreenButton = document.getElementById('fullscreenArchitecture');\n"
              "    const exportFormatSelect = document.getElementById('architectureExportFormat');\n"
              "    const exportButton = document.getElementById('downloadArchitectureExport');\n",
              'control declarations')

          replace_once(
              "            zoomOutButton,\n"
              "            fullscreenButton\n",
              "            zoomOutButton,\n"
              "            fullscreenButton,\n"
              "            exportFormatSelect,\n"
              "            exportButton\n",
              'failure control inventory')

          replace_once(
              "        [fitButton, zoomInButton, zoomOutButton, overviewButton].forEach(function (button) {\n"
              "            button.disabled = false;\n"
              "        });\n",
              "        [\n"
              "            fitButton,\n"
              "            zoomInButton,\n"
              "            zoomOutButton,\n"
              "            overviewButton,\n"
              "            exportFormatSelect,\n"
              "            exportButton\n"
              "        ].forEach(function (control) {\n"
              "            control.disabled = false;\n"
              "        });\n",
              'successful-load control inventory')

          start_marker = "    document.getElementById('downloadArchitectureSvg').addEventListener"
          end_marker = "\n\n    if (!projectId || !snapshotId)"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('legacy download handler block was not found exactly once')
          if text.find(start_marker, start + 1) >= 0:
              raise SystemExit('legacy download handler block is duplicated')
          replacement = (
              "    exportButton.addEventListener('click', function () {\n"
              "        const formatId = exportFormatSelect.value;\n"
              "        const option = exportFormatSelect.options[exportFormatSelect.selectedIndex];\n"
              "        const formatLabel = option ? option.text : formatId;\n"
              "        setStatus('Downloading ' + formatLabel\n"
              "            + ' from persisted snapshot ' + snapshotId + '…');\n"
              "        window.location.assign(\n"
              "            ArchitectureWorkbenchApi.exportUrl(projectId, snapshotId, formatId));\n"
              "    });"
          )
          text = text[:start] + replacement + text[end:]

          forbidden = [
              "downloadArchitectureSvg",
              "downloadArchitecturePdf",
              "ArchitectureWorkbenchApi.svgUrl(projectId, snapshotId)",
              "ArchitectureWorkbenchApi.pdfUrl(projectId, snapshotId)",
          ]
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'legacy export token remains: {token}')

          required = [
              "architectureExportFormat",
              "downloadArchitectureExport",
              "ArchitectureWorkbenchApi.exportUrl(projectId, snapshotId, formatId)",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing export token: {token}')

          path.write_text(text, encoding='utf-8')
          PY

          node --check taxonomy-app/src/main/resources/static/js/architecture-workbench.js
          git diff --check -- taxonomy-app/src/main/resources/static/js/architecture-workbench.js
          rm .github/workflows/apply-snapshot-export-ui-once.yml

      - name: Commit only the final JavaScript patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            taxonomy-app/src/main/resources/static/js/architecture-workbench.js \
            .github/workflows/apply-snapshot-export-ui-once.yml
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/apply-snapshot-export-ui-once.yml' \
            'taxonomy-app/src/main/resources/static/js/architecture-workbench.js' | sort)
          test "$actual" = "$expected"
          git commit -m "Wire workbench downloads to immutable snapshot exports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
