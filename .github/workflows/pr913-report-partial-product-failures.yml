name: Report partial concrete-product analysis failures

on:
  push:
    branches:
      - codex/json-catalogue-overlay
    paths:
      - .github/workflows/pr913-report-partial-product-failures.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/json-catalogue-overlay
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Preserve and expose partial product-scoring failures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          node <<'NODE'
          const fs = require('node:fs');

          const servicePath = 'taxonomy-app/src/main/java/com/taxonomy/analysis/service/LlmService.java';
          let lines = fs.readFileSync(servicePath, 'utf8').split('\n');

          const indent = line => line.match(/^\s*/)[0];
          const trimmed = line => line.trim();

          function methodRange(startToken, endToken) {
            const start = lines.findIndex(line => line.includes(startToken));
            const end = lines.findIndex((line, index) => index > start && line.includes(endToken));
            if (start < 0 || end < 0) {
              throw new Error(`Cannot locate method range ${startToken} .. ${endToken}`);
            }
            return { start, end };
          }

          function uniqueTrimmed(range, value, label) {
            const matches = [];
            for (let index = range.start; index < range.end; index++) {
              if (trimmed(lines[index]) === value) matches.push(index);
            }
            if (matches.length !== 1) {
              throw new Error(`${label}: expected one line, found ${matches.length}`);
            }
            return matches[0];
          }

          function replaceTrimmed(range, before, after, label) {
            const index = uniqueTrimmed(range, before, label);
            lines[index] = indent(lines[index]) + after;
          }

          function insertAfterBlockLine(range, bodyLine, insertedLine, label) {
            const bodyIndex = uniqueTrimmed(range, bodyLine, label);
            let closeIndex = bodyIndex + 1;
            while (closeIndex < range.end && trimmed(lines[closeIndex]) !== '}') closeIndex++;
            if (closeIndex >= range.end) throw new Error(`${label}: closing brace not found`);
            lines.splice(closeIndex + 1, 0, indent(lines[bodyIndex]) + insertedLine);
          }

          let range = methodRange('public AnalysisResult analyzeWithBudget(', 'private void analyzeNodesPropagating(');
          insertAfterBlockLine(
            range,
            'allDiscrepancies.add(rootDetail.getDiscrepancy());',
            'addAnalysisWarning(warnings, root.getCode(), rootDetail);',
            'non-stream root warning'
          );
          range = methodRange('public AnalysisResult analyzeWithBudget(', 'private void analyzeNodesPropagating(');
          replaceTrimmed(
            range,
            'allDiscrepancies, productCoverageGaps, score);',
            'allDiscrepancies, productCoverageGaps, warnings, score);',
            'non-stream first recursion'
          );
          range = methodRange('public AnalysisResult analyzeWithBudget(', 'private void analyzeNodesPropagating(');
          const commentIndex = uniqueTrimmed(
            range,
            '// Some roots had errors but we continued — still treat as PARTIAL if no scores',
            'obsolete success comment'
          );
          lines.splice(commentIndex, 1);
          range = methodRange('public AnalysisResult analyzeWithBudget(', 'private void analyzeNodesPropagating(');
          replaceTrimmed(
            range,
            'result.setStatus(allScores.values().stream().anyMatch(v -> v > 0) ? "SUCCESS" : "PARTIAL");',
            'result.setStatus("PARTIAL");',
            'non-stream final status'
          );

          range = methodRange('private void analyzeNodesPropagating(', 'public void analyzeStreaming(');
          const nonStreamGapParameter = uniqueTrimmed(
            range,
            'List<ProductCoverageGap> productCoverageGaps,',
            'non-stream gap parameter'
          );
          lines.splice(nonStreamGapParameter + 1, 0,
            indent(lines[nonStreamGapParameter]) + 'List<String> warnings,');
          range = methodRange('private void analyzeNodesPropagating(', 'public void analyzeStreaming(');
          insertAfterBlockLine(
            range,
            'allDiscrepancies.add(detail.getDiscrepancy());',
            'addAnalysisWarning(warnings, siblingScope(nodes), detail);',
            'non-stream child warning'
          );
          range = methodRange('private void analyzeNodesPropagating(', 'public void analyzeStreaming(');
          replaceTrimmed(
            range,
            'allDiscrepancies, productCoverageGaps, entry.getValue());',
            'allDiscrepancies, productCoverageGaps, warnings, entry.getValue());',
            'non-stream nested recursion'
          );

          range = methodRange('public void analyzeStreaming(', 'private void analyzeStreamingNodes(');
          const streamGapDeclaration = uniqueTrimmed(
            range,
            'List<ProductCoverageGap> productCoverageGaps = new ArrayList<>();',
            'stream gap declaration'
          );
          lines.splice(streamGapDeclaration + 1, 0,
            indent(lines[streamGapDeclaration]) + 'List<String> warnings = new ArrayList<>();');
          range = methodRange('public void analyzeStreaming(', 'private void analyzeStreamingNodes(');
          insertAfterBlockLine(
            range,
            'allDiscrepancies.add(rootDetail.getDiscrepancy());',
            'addAnalysisWarning(warnings, root.getCode(), rootDetail);',
            'stream root warning'
          );
          range = methodRange('public void analyzeStreaming(', 'private void analyzeStreamingNodes(');
          replaceTrimmed(
            range,
            'allDiscrepancies, productCoverageGaps, callback, rootScore);',
            'allDiscrepancies, productCoverageGaps, warnings, callback, rootScore);',
            'stream first recursion'
          );
          range = methodRange('public void analyzeStreaming(', 'private void analyzeStreamingNodes(');
          const completeIndex = uniqueTrimmed(
            range,
            'callback.onComplete("SUCCESS", allScores, List.of(), allDiscrepancies,',
            'stream completion'
          );
          if (trimmed(lines[completeIndex + 1]) !== 'productCoverageGaps);') {
            throw new Error('stream completion continuation changed');
          }
          lines.splice(
            completeIndex,
            2,
            indent(lines[completeIndex])
              + 'callback.onComplete(warnings.isEmpty() ? "SUCCESS" : "PARTIAL", allScores,',
            indent(lines[completeIndex + 1])
              + 'warnings, allDiscrepancies, productCoverageGaps);'
          );
          range = methodRange('public void analyzeStreaming(', 'private void analyzeStreamingNodes(');
          replaceTrimmed(
            range,
            'allScores, List.of(), allDiscrepancies, productCoverageGaps);',
            'allScores, warnings, allDiscrepancies, productCoverageGaps);',
            'stream error warnings'
          );

          range = methodRange('private void analyzeStreamingNodes(', 'public Map<String, Integer> analyzeSingleBatch(');
          const streamGapParameter = uniqueTrimmed(
            range,
            'List<ProductCoverageGap> productCoverageGaps,',
            'stream gap parameter'
          );
          lines.splice(streamGapParameter + 1, 0,
            indent(lines[streamGapParameter]) + 'List<String> warnings,');
          range = methodRange('private void analyzeStreamingNodes(', 'public Map<String, Integer> analyzeSingleBatch(');
          insertAfterBlockLine(
            range,
            'allDiscrepancies.add(detail.getDiscrepancy());',
            'addAnalysisWarning(warnings, siblingScope(nodes), detail);',
            'stream child warning'
          );
          range = methodRange('private void analyzeStreamingNodes(', 'public Map<String, Integer> analyzeSingleBatch(');
          const streamNestedTail = uniqueTrimmed(
            range,
            'allDiscrepancies, productCoverageGaps, callback, entry.getValue());',
            'stream nested recursion'
          );
          lines.splice(
            streamNestedTail,
            1,
            indent(lines[streamNestedTail])
              + 'allDiscrepancies, productCoverageGaps, warnings, callback,',
            indent(lines[streamNestedTail]) + 'entry.getValue());'
          );

          const hasErrorIndex = lines.findIndex(
            line => trimmed(line) === 'private boolean hasError(LlmCallDetail detail) {'
          );
          if (hasErrorIndex < 0) throw new Error('hasError helper not found');
          const helperLines = `    private void addAnalysisWarning(List<String> warnings,
                                              String scopeCode,
                                              LlmCallDetail detail) {
                  if (!hasError(detail)) {
                      return;
                  }
                  String scope = scopeCode == null || scopeCode.isBlank()
                          ? "unknown taxonomy scope" : scopeCode;
                  String warning = "Incomplete analysis for " + scope + ": "
                          + detail.getError().strip();
                  if (!warnings.contains(warning)) {
                      warnings.add(warning);
                  }
              }
          
              private String siblingScope(List<TaxonomyNode> nodes) {
                  if (nodes == null || nodes.isEmpty()) {
                      return "unknown taxonomy scope";
                  }
                  String parentCode = nodes.get(0).getParentCode();
                  return parentCode == null || parentCode.isBlank()
                          ? nodes.get(0).getCode() : parentCode;
              }
          
          `.split('\n');
          lines.splice(hasErrorIndex, 0, ...helperLines);
          fs.writeFileSync(servicePath, lines.join('\n'));

          const testPath = 'taxonomy-app/src/test/java/com/taxonomy/analysis/service/LlmServiceBranchCoverageTest.java';
          let testLines = fs.readFileSync(testPath, 'utf8').split('\n');
          function uniqueTestLine(value, label) {
            const matches = testLines
              .map((line, index) => trimmed(line) === value ? index : -1)
              .filter(index => index >= 0);
            if (matches.length !== 1) throw new Error(`${label}: found ${matches.length}`);
            return matches[0];
          }
          let importIndex = uniqueTestLine(
            'import static org.mockito.ArgumentMatchers.any;',
            'any import'
          );
          testLines.splice(importIndex + 1, 0,
            'import static org.mockito.ArgumentMatchers.argThat;');
          importIndex = uniqueTestLine(
            'import static org.mockito.ArgumentMatchers.anyString;',
            'anyString import'
          );
          testLines.splice(importIndex + 1, 0,
            'import static org.mockito.ArgumentMatchers.eq;');

          const leafMethod = uniqueTestLine(
            'void leafJustificationCoversMockLocalNoKeySuccessEmptyAndFailure() {',
            'leaf test'
          );
          if (trimmed(testLines[leafMethod - 1]) !== '@Test') {
            throw new Error('leaf test annotation changed');
          }
          const regressionLines = `    @Test
              void productBatchFailureRemainsPartialAndDoesNotCreateCoverageGap() {
                  TaxonomyNode root = node("IP", null, "IP");
                  root.setNameEn("Information Products");
                  TaxonomyNode product = node("IP-P1", "IP", "IP");
                  product.setNameEn("Concrete product");
                  when(catalogueOverlayService.isProduct("IP-P1")).thenReturn(true);
                  when(taxonomyService.getRootNodes()).thenReturn(new ArrayList<>(List.of(root)));
                  when(taxonomyService.getChildrenOf("IP")).thenReturn(List.of(product));
                  when(taxonomyService.getFullTree()).thenReturn(List.of());
                  when(gateway.sendHttpRequest("rendered prompt", "test-key"))
                          .thenReturn("root-body");
                  when(gateway.extractResponseText("root-body")).thenReturn("{\\"IP\\":100}");
                  when(gateway.sendHttpRequest("product prompt", "test-key"))
                          .thenThrow(new LlmTimeoutException("product provider timed out"));
                  ReflectionTestUtils.setField(service, "productMinimumScore", 50);
          
                  AnalysisResult result = service.analyzeWithBudget("requirement");
          
                  assertThat(result.getStatus()).isEqualTo("PARTIAL");
                  assertThat(result.getWarnings())
                          .anyMatch(warning -> warning.contains("IP")
                                  && warning.contains("product provider timed out"));
                  assertThat(result.getProductCoverageGaps()).isEmpty();
          
                  service.analyzeStreaming("requirement", callback);
          
                  verify(callback).onComplete(
                          eq("PARTIAL"),
                          any(),
                          argThat((List<String> warningList) -> warningList.stream()
                                  .anyMatch(warning -> warning.contains("product provider timed out"))),
                          anyList(),
                          anyList());
                  verify(callback, never()).onError(
                          anyString(), anyString(), any(), anyList(), anyList(), anyList());
              }
          
          `.split('\n');
          testLines.splice(leafMethod - 1, 0, ...regressionLines);
          fs.writeFileSync(testPath, testLines.join('\n'));

          const docsPath = 'docs/dev/INFORMATION_PRODUCT_OVERLAY.md';
          let docLines = fs.readFileSync(docsPath, 'utf8').split('\n');
          const parentLine = docLines.findIndex(
            line => line === 'A parent may contain both category and product children. Categories are evaluated with the parent'
          );
          if (parentLine < 0) throw new Error('analysis semantics paragraph not found');
          docLines.splice(parentLine, 0,
            'A failed or incomplete concrete-product batch makes the overall analysis `PARTIAL` and',
            'adds an explicit warning. Its zero placeholders are not treated as evidence of an actual',
            'catalogue gap, so no confirmed `productCoverageGaps` entry is emitted for that batch.',
            '');
          fs.writeFileSync(docsPath, docLines.join('\n'));
          NODE

          git rm .github/workflows/pr913-report-partial-product-failures.yml
          git diff --check
          ./mvnw -B -ntp -pl taxonomy-app -am \
            -DskipITs \
            -Dtest=LlmServiceBranchCoverageTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

          git add -A
          git commit -m 'fix: expose partial concrete-product failures'
          git push origin HEAD:codex/json-catalogue-overlay
