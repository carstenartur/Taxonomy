apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taxonomy-taxonomy
  namespace: taxonomy
  labels:
    app.kubernetes.io/name: taxonomy
    app.kubernetes.io/instance: taxonomy
    app.kubernetes.io/version: "1.3.1-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: taxonomy-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taxonomy
      app.kubernetes.io/instance: taxonomy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - rke2-ingress-nginx
              - ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - {}
