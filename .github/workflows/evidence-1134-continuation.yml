name: Evidence 1134 continuation
on:
  push:
    branches: [maintenance/continue-evidence-1134-20260927]
    paths: [.github/workflows/evidence-1134-continuation.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 993e90aba4e3b63d4d84e139778189a223661267
          fetch-depth: 2
          persist-credentials: false
      - name: Archive exact automatic merge and its Git objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = e47a69f0f06959c905aa4abe3008dfac832761ba
          test "$(git rev-parse HEAD^1)" = 025197b3193f4a86815408a61ed6fb3368967259
          test "$(git rev-parse HEAD^2)" = 2afbea756f0cf964c81428d47f9feb5c7372e242
          mkdir -p /tmp/evidence-1134
          git archive --format=tar HEAD | gzip -n > /tmp/evidence-1134/source.tar.gz
          tar -czf /tmp/evidence-1134/git-objects.tar.gz .git/objects
          git rev-parse HEAD HEAD^{tree} HEAD^1 HEAD^2 > /tmp/evidence-1134/identity.txt
          git cat-file commit HEAD > /tmp/evidence-1134/commit.txt
          cd /tmp/evidence-1134
          sha256sum source.tar.gz git-objects.tar.gz identity.txt commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-1134-recovery-integration
          path: /tmp/evidence-1134
          if-no-files-found: error
          retention-days: 7
