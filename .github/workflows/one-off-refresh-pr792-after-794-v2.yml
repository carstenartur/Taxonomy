name: One-off guarded refresh of PR 792 after PR 794 v2

on:
  push:
    branches:
      - automation/refresh-pr792-after-794-v2-20260818
    paths:
      - .github/workflows/one-off-refresh-pr792-after-794-v2.yml

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: taxonomy-one-off-refresh-pr792-after-pr794
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.head_commit.message == 'chore(agent): stage guarded PR 792 refresh v2'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require PR 794 to be merged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          merged=false
          for attempt in $(seq 1 180); do
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/794")
            if [[ -n "$(jq -r '.merged_at // empty' <<<"$pr")" ]]; then
              merged=true
              break
            fi
            if [[ "$(jq -r '.state' <<<"$pr")" == closed ]]; then
              echo "::error::PR 794 closed without merging" >&2
              exit 1
            fi
            sleep 10
          done
          test "$merged" = true

      - name: Check out the exact PR 792 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/743-analysis-artifact-tenancy
          fetch-depth: 0
          persist-credentials: true

      - name: Merge protected main without hiding conflicts
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/792")
          original_head=$(jq -r '.head.sha' <<<"$current")
          test "$(git rev-parse HEAD)" = "$original_head"
          test "$(jq -r '.head.ref' <<<"$current")" = agent/743-analysis-artifact-tenancy
          test "$(jq -r '.state' <<<"$current")" = open

          git config user.name 'ChatGPT Release Integration'
          git config user.email 'chatgpt-release-integration@users.noreply.github.com'
          git fetch origin main

          changed=false
          if ! git merge-base --is-ancestor origin/main HEAD; then
            set +e
            git merge --no-ff origin/main \
              -m 'Merge protected main after release-hardening PR 794'
            merge_exit=$?
            set -e
            if [[ $merge_exit -ne 0 ]]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              body=$(printf 'The guarded refresh from current `main` stopped without pushing because these conflicts require an explicit resolution:\n\n```text\n%s\n```' "$(printf '%s\n' "${conflicts[@]}")")
              gh api "repos/${GITHUB_REPOSITORY}/issues/792/comments" -f body="$body"
              git merge --abort || true
              exit 1
            fi
            changed=true
          fi

          while IFS= read -r workflow; do
            [[ -n "$workflow" ]] || continue
            if grep -Eqi 'one-off.*(792|analysis artifact)|agent/743-analysis-artifact-tenancy' "$workflow"; then
              git rm "$workflow"
            fi
          done < <(git ls-files '.github/workflows/one-off-*')
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-off PR 792 verification workflows'
            changed=true
          fi

          git diff --check origin/main...HEAD
          echo "original_head=$original_head" >> "$GITHUB_OUTPUT"
          echo "refreshed_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Verify the newly covered tenant model invariants
        shell: bash
        run: |
          ./mvnw -B -pl taxonomy-app -am \
            -DskipITs \
            -Dtest=RequirementRelationMappingTest,RequirementElementMappingTest,RequirementAnalysisSnapshotTest,RequirementAnalysisJobItemTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

      - name: Push the exact verified refresh
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_HEAD: ${{ steps.merge.outputs.original_head }}
          REFRESHED_HEAD: ${{ steps.merge.outputs.refreshed_head }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REFRESHED_HEAD"
          remote_head=$(git ls-remote origin refs/heads/agent/743-analysis-artifact-tenancy | awk '{print $1}')
          if [[ "$remote_head" != "$ORIGINAL_HEAD" ]]; then
            echo "::error::PR 792 moved during guarded verification" >&2
            exit 1
          fi
          git push origin HEAD:agent/743-analysis-artifact-tenancy

      - name: Record the verified refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESHED_HEAD: ${{ steps.merge.outputs.refreshed_head }}
          CHANGED: ${{ steps.merge.outputs.changed }}
        shell: bash
        run: |
          if [[ "$CHANGED" == true ]]; then
            prefix='Guarded refresh completed'
          else
            prefix='Guarded refresh revalidated the already refreshed branch'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/792/comments" \
            -f body="${prefix}: current protected \`main\` is an ancestor of \`${REFRESHED_HEAD}\`, and the focused tenant mapping, snapshot and worker-item model suite passed. The PR remains draft until its complete exact-head matrix is green."

      - name: Delete the temporary automation branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/automation/refresh-pr792-after-794-v2-20260818" \
            || true
