name: Codex source snapshot

on:
  push:
    branches:
      - codex/json-catalogue-overlay
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Archive tracked source
        run: git archive --format=tar.gz --output=taxonomy-source.tar.gz HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxonomy-source-snapshot
          path: taxonomy-source.tar.gz
          if-no-files-found: error
          retention-days: 1
