name: Database Compatibility

on:
  pull_request:
    branches: [ main ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: taxonomy-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: PostgreSQL
            profile: database-postgres
            command: ./mvnw -B verify -Pdatabase-postgres
          - database: Microsoft SQL Server
            profile: database-mssql
            command: ./mvnw -B verify -Pdatabase-mssql
          - database: Oracle
            profile: database-oracle
            command: ./mvnw -B verify -Pdatabase-oracle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Run Maven-owned database suite
        env:
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
          # Container image pulls on hosted runners occasionally exceed the two-minute
          # default and fail the whole matrix leg with a ContainerFetchException.
          TESTCONTAINERS_PULL_PAUSE_TIMEOUT: '600'
          TESTCONTAINERS_PULL_TIMEOUT: '600'
        shell: bash
        run: |
          mkdir -p target
          set -o pipefail
          ${{ matrix.command }} 2>&1 | tee "target/database-${{ matrix.profile }}.log"

      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: database-${{ matrix.profile }}
          path: |
            target/database-${{ matrix.profile }}.log
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 90
