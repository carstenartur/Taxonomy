name: JGit Storage Consumer Contract

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/jgit-storage-hibernate-contract.sh'
      - '.github/workflows/jgit-storage-hibernate-contract.yml'
      - 'pom.xml'
      - 'taxonomy-app/pom.xml'
      - 'taxonomy-app/src/main/java/com/taxonomy/dsl/storage/**'
      - 'taxonomy-app/src/test/java/com/taxonomy/dsl/storage/**'
      - 'taxonomy-app/src/test/java/com/taxonomy/dsl/CommitIndexHibernateSearchTest.java'
  push:
    branches: [ main ]
    paths:
      - '.github/jgit-storage-hibernate-contract.sh'
      - '.github/workflows/jgit-storage-hibernate-contract.yml'
      - 'pom.xml'
      - 'taxonomy-app/pom.xml'
      - 'taxonomy-app/src/main/java/com/taxonomy/dsl/storage/**'
      - 'taxonomy-app/src/test/java/com/taxonomy/dsl/storage/**'
      - 'taxonomy-app/src/test/java/com/taxonomy/dsl/CommitIndexHibernateSearchTest.java'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline:
    name: PostgreSQL migration, validate-startup and indexed-history contract
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Taxonomy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            taxonomy-app/pom.xml

      - name: Validate Docker availability
        run: docker info

      - name: Validate and run the consumer-owned contract
        shell: bash
        env:
          JGIT_STORAGE_HIBERNATE_CONTRACT_MODE: baseline
          GEMINI_API_KEY: ''
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          TAXONOMY_MODEL_DOWNLOAD_SKIP: 'true'
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
        run: |
          set -euo pipefail
          bash -n .github/jgit-storage-hibernate-contract.sh
          .github/jgit-storage-hibernate-contract.sh

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taxonomy-jgit-storage-hibernate-contract
          path: |
            target/jgit-storage-hibernate-contract/**
            taxonomy-app/target/surefire-reports/**
            taxonomy-app/target/failsafe-reports/**
          if-no-files-found: error
