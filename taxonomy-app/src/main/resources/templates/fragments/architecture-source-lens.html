<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="panel(idPrefix,readOnly)" class="editor-lens-panel" th:id="${idPrefix}"
         th:attr="aria-labelledby=${idPrefix + 'Title'}" th:hidden="${readOnly}">
    <div class="relationship-review-toolbar">
        <h3 th:id="${idPrefix + 'Title'}" tabindex="-1" th:text="#{relationshipReview.focus}">Focus investigation</h3>
        <button th:id="${idPrefix + 'Inspect'}" type="button" class="relationship-review-primary" disabled th:text="#{editor.lens.inspect}">Investigate selection</button>
    </div>
    <p th:if="${readOnly}" class="relationship-review-status" th:text="#{sourceLens.readOnly}">Read-only source.</p>
    <p th:id="${idPrefix + 'Summary'}" class="relationship-review-status" role="status" aria-live="polite"></p>
    <p th:id="${idPrefix + 'Error'}" class="relationship-review-error" role="alert" hidden></p>
    <div class="relationship-review-results">
        <div>
            <p th:id="${idPrefix + 'Count'}" class="relationship-review-count"></p>
            <ul th:id="${idPrefix + 'Suggestions'}" class="editor-lens-suggestions"></ul>
            <button th:unless="${readOnly}" th:id="${idPrefix + 'Batch'}" type="button"
                    class="relationship-review-primary relationship-review-batch" hidden></button>
        </div>
        <section th:id="${idPrefix + 'Review'}" class="relationship-review-detail" th:aria-label="#{editor.lens.review}"></section>
    </div>
    <details th:id="${idPrefix + 'Settings'}" class="relationship-review-settings">
        <summary th:text="#{relationshipReview.settings}">Investigation settings and activity</summary>
        <p th:if="${readOnly}" th:id="${idPrefix + 'Source'}" class="relationship-review-status" role="status"></p>
        <p th:text="#{editor.lens.cost}">Each investigation may send one request to the configured provider.</p>
        <div class="relationship-review-toolbar">
            <label class="relationship-review-check"><input th:id="${idPrefix + 'UseAi'}" type="checkbox"/>
                <span th:text="#{editor.lens.useAi}">Use the configured AI provider</span></label>
            <label class="editor-lens-budget">
                <span th:text="#{editor.lens.budget}">Investigation limit</span>
                <input th:id="${idPrefix + 'Budget'}" type="number" min="1" max="128" value="16"/>
            </label>
            <button th:id="${idPrefix + 'Pause'}" type="button" disabled th:text="#{editor.lens.pause}">Pause new investigations</button>
            <button th:if="${readOnly}" th:id="${idPrefix + 'Refresh'}" type="button" th:text="#{sourceLens.refresh}">Refresh source</button>
        </div>
        <p th:id="${idPrefix + 'Activity'}" class="relationship-review-status"></p>
        <ul th:id="${idPrefix + 'States'}" class="editor-lens-states"></ul>
    </details>
</section>
</body>
</html>
