name: One-shot Render delivery truth patch

on:
  push:
    branches:
      - qa/issue-618-render-delivery-truth

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fail-closed delivery transformation
        run: python3 .github/scripts/apply-render-delivery-truth.py

      - name: Verify Python syntax and delivery contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/verify-deployment.py \
            .github/scripts/test-verify-deployment.py \
            .github/scripts/check-delivery-hardening.py
          python3 .github/scripts/test-verify-deployment.py
          python3 .github/scripts/check-delivery-hardening.py
          git diff --check

      - name: Commit transformed delivery sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            .github/workflows/delivery.yml \
            .github/scripts/verify-deployment.py \
            .github/scripts/test-verify-deployment.py \
            .github/scripts/check-delivery-hardening.py; then
            echo "Render delivery sources already match the requested contract."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/delivery.yml \
            .github/scripts/verify-deployment.py \
            .github/scripts/test-verify-deployment.py \
            .github/scripts/check-delivery-hardening.py
          git commit -m "Make Render delivery status fail closed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
