name: Evidence 1134 continuation
on:
  push:
    branches: [maintenance/continue-evidence-1134-20260927]
    paths: [.github/workflows/evidence-1134-continuation.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 64b2262c48a3933dcbc75a799df5ee8703a53d38
          path: product
      - name: Reconstruct and test the exact acceptance-only correction
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = edee69fc915f45966d9e5b3fc3c06ef8619bef67
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          data = lzma.decompress(base64.b64decode(Path('../transport/.github/verification/1134-browser-evidence.b64').read_text(), validate=True))
          assert hashlib.sha256(data).hexdigest() == '4fbfe0b4311ab08097ddd6a63cc2b5273d951532707b45b8808f7c5ea5e5e6e9'
          Path('/tmp/correction.patch').write_bytes(data)
          subprocess.run(['git','apply','--check','/tmp/correction.patch'], check=True)
          subprocess.run(['git','apply','/tmp/correction.patch'], check=True)
          PY
          git diff --check
          git add .
          test "$(git write-tree)" = 97e0919874268598aab74f88e1bf6d9b27a2af85
          mkdir -p /tmp/evidence-1134
          node --test .github/scripts/integrations-review.test.mjs .github/scripts/ui-version-diff.test.mjs .github/scripts/relation-search-report.test.mjs .github/scripts/relation-search-confidence.test.mjs .github/scripts/ui-role-state-isolation.test.mjs .github/scripts/ui-role-state-http-failure-policy.test.mjs 2>&1 | tee /tmp/evidence-1134/node.log
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'test(ui): verify durable exports and isolate relation comparison fixtures'
          git push origin "HEAD:refs/heads/verification/evidence-browser-1134-${GITHUB_RUN_ID}"
          git rev-parse HEAD HEAD^{tree} > /tmp/evidence-1134/identity.txt
          git archive --format=tar HEAD | gzip -n > /tmp/evidence-1134/source.tar.gz
          git cat-file commit HEAD > /tmp/evidence-1134/commit.txt
          git diff HEAD^ HEAD --binary > /tmp/evidence-1134/correction.patch
          cd /tmp/evidence-1134
          sha256sum source.tar.gz identity.txt commit.txt correction.patch node.log > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-1134-browser-candidate
          path: /tmp/evidence-1134
          if-no-files-found: error
          retention-days: 7
