name: Analysis patch identity check (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export transmitted bytes for integrity comparison, not acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,json,os,urllib.request
          from pathlib import Path
          request=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs/ba5a806bc2f464163c591cb3c9e8335a46f566fa',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request) as response: content=base64.b64decode(json.load(response)['content'])
          Path('/tmp/transmitted-patch.txt').write_bytes(content)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analysis-patch-transmission
          path: /tmp/transmitted-patch.txt
          retention-days: 1
          if-no-files-found: error
