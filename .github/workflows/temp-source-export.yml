name: Temporary Bootstrap Alignment

on:
  push:
    branches:
      - dependabot/maven/org.webjars.npm-bootstrap-5.3.8

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dependabot/maven/org.webjars.npm-bootstrap-5.3.8
      - name: Align versioned browser resource paths
        run: |
          set -euo pipefail
          files=(
            taxonomy-app/src/main/resources/templates/index.html
            taxonomy-app/src/main/resources/templates/change-password.html
            taxonomy-app/src/test/java/com/taxonomy/OfflineWebAssetsTest.java
          )
          sed -i 's|/webjars/bootstrap/5\.3\.2/|/webjars/bootstrap/5.3.8/|g' "${files[@]}"
          if grep -R '/webjars/bootstrap/5\.3\.2/' "${files[@]}"; then
            echo 'Old Bootstrap WebJar references remain' >&2
            exit 1
          fi
          grep -R '/webjars/bootstrap/5\.3\.8/' "${files[@]}"
          rm .github/workflows/temp-source-export.yml
          printf 'Bootstrap WebJar paths aligned by temporary maintenance job.\n' > .github/webjar-alignment-applied
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}" .github/webjar-alignment-applied .github/workflows/temp-source-export.yml
          git commit -m 'fix: align Bootstrap WebJar resource paths'
          git push origin HEAD:dependabot/maven/org.webjars.npm-bootstrap-5.3.8
