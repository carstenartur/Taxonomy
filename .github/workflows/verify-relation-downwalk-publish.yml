name: Prepare reviewed relation dependency baseline
on:
  push:
    branches: [verify/relation-downwalk-publish]
permissions:
  contents: write
jobs:
  prepare-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0783f6f4accc831bd3228bd9d0347d2461553205
          persist-credentials: false
      - name: Prepare precisely two reviewed files and an unreferenced commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from pathlib import Path
          parent = '0783f6f4accc831bd3228bd9d0347d2461553205'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == parent
          baseline = Path('.github/architecture-dependency-baseline.json')
          document = Path('docs/dev/requirement-relation-downwalk.md')
          data = json.loads(baseline.read_text())
          source = 'com.taxonomy.analysis.relations'
          for target in ['com.taxonomy.catalog.model', 'com.taxonomy.catalog.service', 'com.taxonomy.relations.service']:
              assert not any(e['fromPackage'] == source and e['toPackage'] == target for e in data['edges'])
              data['edges'].append(dict(fromContext='analysis', fromPackage=source, toContext='knowledge', toPackage=target, classDependencyCount=2))
          data['edges'].sort(key=lambda e: (e['fromContext'], e['fromPackage'], e['toContext'], e['toPackage']))
          baseline.write_text(json.dumps(data, indent=2) + '\n')
          extra = '\n## Reviewed module dependencies\n\nThe hierarchical adapter reuses the existing analysis-to-knowledge direction; it introduces no reverse dependency or new Maven module. `RequirementRelationSearchService` and its scalar catalogue adapter each reference `TaxonomyService` and `TaxonomyNode` (two class pairs per package). `RequirementRelationSearch` and `RequirementRelationSearchService` each reference the existing `RelationCompatibilityMatrix` (two class pairs). These six concrete class pairs are recorded in the architecture dependency baseline. The dependency ratchet remains exact: no wildcard exemptions or general count increases are allowed. Bytecode inspection with `jdeps -verbose:class` confirms these pairs; the regular ArchUnit gate is the authoritative merged-source check.\n'
          assert '## Reviewed module dependencies' not in document.read_text()
          document.write_text(document.read_text() + extra)
          for path, expected in [(baseline, 'da3d4d49a3f095a3f9aaa934ca55c2abc052c334'), (document, '665242f9e4a17495ecba93b1df451dbc53f9c780')]:
              assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == expected
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'add', str(baseline), str(document)], check=True)
          expected_tree = '346d78379b5b61e6da39f028283f620e5cc2103b'
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == expected_tree
          def post(resource, body):
              request = urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/' + resource,
                  data=json.dumps(body).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          tree = post('trees', {'base_tree': '47694e028294b92d7205d27aca7ba6903c18d60f', 'tree': [
              {'path': str(path), 'mode': '100644', 'type': 'blob', 'content': path.read_text()} for path in [baseline, document]]})
          assert tree['sha'] == expected_tree
          commit = post('commits', {'message': 'docs(architecture): record the six scoped relation-search catalogue dependencies\n\nKeep the exact architecture ratchet and all existing dependency counts. No reverse dependency or new module. Actual source pairs checked with jdeps; ordinary merged-source ArchUnit validation remains required.', 'tree': tree['sha'], 'parents': [parent]})
          print('PREPARED_COMMIT=' + commit['sha'])
          print('PREPARED_TREE=' + tree['sha'])
          print('No branch references were moved. Publication is a separate authorized connector operation.')
          PY
