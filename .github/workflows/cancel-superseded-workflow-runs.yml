name: Cancel Superseded Workflow Runs

on:
  push:
    branches:
      - ops/cancel-superseded-workflow-runs-20261116

permissions:
  actions: write
  pull-requests: read

jobs:
  cancel:
    if: github.repository == 'carstenartur/Taxonomy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cancel queued runs of merged pull requests with no jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          
          repo=carstenartur/Taxonomy
          [[ "$GITHUB_REPOSITORY" == "$repo" && "$GITHUB_REF" == "refs/heads/ops/cancel-superseded-workflow-runs-20261116" ]]
          
          while IFS='|' read -r number branch; do
            gh api "repos/$repo/pulls/$number" |
              jq -e --arg branch "$branch" '.merged and .state == "closed" and .head.ref == $branch' >/dev/null
            gh api --method GET "repos/$repo/pulls" -f state=open -f head="carstenartur:$branch" |
              jq -e 'type == "array" and length == 0' >/dev/null
          done <<'MERGED_PULLS'
          1465|implementation/analysis-admission
          1464|implementation/versioned-architecture-brief
          1463|implementation/catalogue-defined-roots
          1462|implementation/compact-project-catalogue
          1461|implementation/verified-ci-reload-and-package-sources
          MERGED_PULLS
          
          oldest_active_epoch="$(date -u -d '3 days ago' +%s)"
          candidates="$(mktemp)"
          trap 'rm -f "$candidates"' EXIT
          
          eligible() {
            local endpoint="$1" branch="$2" head="$3" event="$4" last_updated="$5"
            gh api "$endpoint" |
              jq -e --arg branch "$branch" --arg head "$head" --arg event "$event" \
                --arg last_updated "$last_updated" --argjson cutoff "$oldest_active_epoch" \
                '.head_branch == $branch and .head_sha == $head and .event == $event
                 and .status == "queued" and .run_attempt == 1 and .updated_at == $last_updated
                 and (.created_at | fromdateiso8601) < $cutoff' >/dev/null &&
            gh api "$endpoint/jobs?per_page=1" | jq -e '.total_count == 0' >/dev/null
          }
          
          while IFS='|' read -r id branch head event last_updated; do
            endpoint="repos/$repo/actions/runs/$id"
            if eligible "$endpoint" "$branch" "$head" "$event" "$last_updated"; then
              if gh api --method POST "$endpoint/cancel" >/dev/null; then
                printf 'Cancellation requested for %s\n' "$id"
              else
                printf 'Cancellation request failed for %s\n' "$id"
              fi
              printf '%s|%s|%s|%s|%s\n' "$id" "$branch" "$head" "$event" "$last_updated" >> "$candidates"
            fi
          done <<'VERIFIED_RUNS'
