# Source: taxonomy/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taxonomy-taxonomy
  namespace: taxonomy
  labels:
    app.kubernetes.io/name: taxonomy
    app.kubernetes.io/instance: taxonomy
    app.kubernetes.io/version: "1.4.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: taxonomy-0.1.0
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: taxonomy
      app.kubernetes.io/instance: taxonomy
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: "taxonomy-secrets"
          key: "ADMIN_TOKEN"
