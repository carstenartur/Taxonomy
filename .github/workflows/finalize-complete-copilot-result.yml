name: Finalize Complete Copilot Result

on:
  push:
    branches:
      - fix/complete-copilot-run-screenshot
    paths:
      - .github/workflows/finalize-complete-copilot-result.yml

permissions:
  contents: write

concurrency:
  group: finalize-complete-copilot-result-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    name: Apply, verify and publish the complete result surface
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Apply the permanent result-surface changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          copilot = Path('taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js')
          text = copilot.read_text(encoding='utf-8')

          replacements = [
              (
                  "pass: 'passes complete', provider: 'AI target', operation: 'Operation', phase: 'Phase',",
                  "pass: 'passes complete', provider: 'AI target', operation: 'Operation', phase: 'Phase',\n"
                  "            snapshot: 'Selected snapshot',"
              ),
              (
                  "pass: 'Durchläufe abgeschlossen', provider: 'KI-Ziel', operation: 'Vorgang', phase: 'Phase',",
                  "pass: 'Durchläufe abgeschlossen', provider: 'KI-Ziel', operation: 'Vorgang', phase: 'Phase',\n"
                  "            snapshot: 'Ausgewählter Snapshot',"
              ),
              (
                  "scoring: 'The current verification pass is being evaluated', finalizing: 'Selecting and enriching the best immutable result',",
                  "scoring: 'The current verification pass is being evaluated', finalizing: 'Selecting and enriching the best immutable result',\n"
                  "            completedPhase: 'Completed and ready for review',\n"
                  "            partialPhase: 'Completed with partial results', failedPhase: 'Failed', cancelledPhase: 'Cancelled',"
              ),
              (
                  "scoring: 'Der aktuelle Prüfdurchlauf wird bewertet', finalizing: 'Das beste unveränderliche Ergebnis wird ausgewählt und ergänzt',",
                  "scoring: 'Der aktuelle Prüfdurchlauf wird bewertet', finalizing: 'Das beste unveränderliche Ergebnis wird ausgewählt und ergänzt',\n"
                  "            completedPhase: 'Abgeschlossen und zur Prüfung bereit',\n"
                  "            partialPhase: 'Mit Teilergebnissen abgeschlossen', failedPhase: 'Fehlgeschlagen', cancelledPhase: 'Abgebrochen',"
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected result-copy marker not found: {old}')
              text = text.replace(old, new, 1)

          progress_marker = (
              '                    <div id="copilotOperationProgress" '
              'class="small text-body-secondary mt-1"></div>\n'
              '                    <div class="d-flex flex-wrap justify-content-between '
              'gap-2 mt-2 small text-body-secondary">\n'
          )
          progress_replacement = (
              '                    <div id="copilotOperationProgress" '
              'class="small text-body-secondary mt-1"></div>\n'
              '                    <div id="copilotResultActions"\n'
              '                         class="d-none flex-wrap justify-content-between '
              'align-items-center gap-2 mt-3 p-2 border rounded bg-body-tertiary">\n'
              '                        <span id="copilotSelectedSnapshot" '
              'class="small text-body-secondary"></span>\n'
              '                        <a id="copilotOpenResult" '
              'class="btn btn-sm btn-outline-primary" href="#">Open result</a>\n'
              '                    </div>\n'
              '                    <div class="d-flex flex-wrap justify-content-between '
              'gap-2 mt-2 small text-body-secondary">\n'
          )
          if progress_marker not in text:
              raise SystemExit('Copilot result-action insertion point not found')
          text = text.replace(progress_marker, progress_replacement, 1)

          translate_marker = "        setText('copilotRetryStatus', t('retryStatus'));\n"
          if translate_marker not in text:
              raise SystemExit('Copilot translation insertion point not found')
          text = text.replace(
              translate_marker,
              translate_marker + "        setText('copilotOpenResult', t('openResult'));\n",
              1)

          inventory_marker = "        markControl('copilotRetryStatus', 'retry-status-connection', 'operation');\n"
          if inventory_marker not in text:
              raise SystemExit('Copilot control-inventory insertion point not found')
          text = text.replace(
              inventory_marker,
              inventory_marker + "        markControl('copilotOpenResult', 'open-selected-result', 'navigation');\n",
              1)

          render_marker = (
              "        const phase = operationPhase(operation);\n"
              "        setText('copilotOperationPhase', t('phase') + ': ' + phase.label);\n"
              "        renderProgress(operation, phase);\n\n"
              "        const cancelButton = document.getElementById('copilotCancel');\n"
          )
          render_replacement = (
              "        const phase = operationPhase(operation);\n"
              "        setText('copilotOperationPhase', t('phase') + ': ' + phase.label);\n"
              "        renderProgress(operation, phase);\n"
              "        renderResultAction(operation);\n\n"
              "        const cancelButton = document.getElementById('copilotCancel');\n"
          )
          if render_marker not in text:
              raise SystemExit('Copilot result render insertion point not found')
          text = text.replace(render_marker, render_replacement, 1)

          local_marker = "    function renderLocalState(status, message) {\n"
          result_function = (
              "    function renderResultAction(operation) {\n"
              "        const surface = document.getElementById('copilotResultActions');\n"
              "        const snapshot = document.getElementById('copilotSelectedSnapshot');\n"
              "        const link = document.getElementById('copilotOpenResult');\n"
              "        if (!surface || !snapshot || !link) return;\n\n"
              "        const status = String(operation?.status || '').toUpperCase();\n"
              "        const snapshotId = String(operation?.selectedSnapshotId || '').trim();\n"
              "        const available = (status === 'SUCCESS' || status === 'PARTIAL')\n"
              "            && snapshotId.length > 0;\n"
              "        surface.classList.toggle('d-none', !available);\n"
              "        surface.classList.toggle('d-flex', available);\n"
              "        if (!available) {\n"
              "            snapshot.textContent = '';\n"
              "            link.removeAttribute('href');\n"
              "            link.removeAttribute('aria-label');\n"
              "            return;\n"
              "        }\n\n"
              "        snapshot.textContent = t('snapshot') + ': ' + snapshotId;\n"
              "        const resultUrl = new URL(window.location.href);\n"
              "        resultUrl.searchParams.set('snapshot', snapshotId);\n"
              "        resultUrl.searchParams.set('lang', locale);\n"
              "        link.href = resultUrl.pathname + resultUrl.search + resultUrl.hash;\n"
              "        link.setAttribute('aria-label', t('openResult') + ': ' + snapshotId);\n"
              "    }\n\n"
          )
          if local_marker not in text:
              raise SystemExit('Copilot result-action function insertion point not found')
          text = text.replace(local_marker, result_function + local_marker, 1)

          old_phase = (
              "    function operationPhase(operation) {\n"
              "        const jobs = Array.isArray(operation.jobs) ? operation.jobs : [];\n"
              "        const running = jobs.find(job => job.status === 'RUNNING');\n"
              "        const pending = jobs.find(job => job.status === 'PENDING');\n"
              "        if (operation.status === 'CANCELLING') return { key: 'CANCELLING', label: t('cancelling'), indeterminate: true };\n"
              "        if (operation.status === 'RECONNECTING') return { key: 'RECONNECTING', label: t('reconnecting'), indeterminate: true };\n"
              "        if (running) return { key: 'SCORING', label: t('scoring'), indeterminate: true };\n"
              "        if (pending) return { key: 'QUEUED', label: t('queued'), indeterminate: true };\n"
              "        if (terminal.has(operation.status)) return { key: 'FINAL', label: t('finalizing'), indeterminate: false };\n"
              "        return { key: 'QUEUED', label: t('queued'), indeterminate: true };\n"
              "    }\n"
          )
          new_phase = (
              "    function operationPhase(operation) {\n"
              "        const jobs = Array.isArray(operation.jobs) ? operation.jobs : [];\n"
              "        const running = jobs.find(job => job.status === 'RUNNING');\n"
              "        const pending = jobs.find(job => job.status === 'PENDING');\n"
              "        const status = String(operation.status || '').toUpperCase();\n"
              "        if (status === 'CANCELLING') return { key: 'CANCELLING', label: t('cancelling'), indeterminate: true };\n"
              "        if (status === 'RECONNECTING') return { key: 'RECONNECTING', label: t('reconnecting'), indeterminate: true };\n"
              "        if (status === 'SUCCESS') return { key: 'COMPLETED', label: t('completedPhase'), indeterminate: false };\n"
              "        if (status === 'PARTIAL') return { key: 'PARTIAL', label: t('partialPhase'), indeterminate: false };\n"
              "        if (status === 'FAILED') return { key: 'FAILED', label: t('failedPhase'), indeterminate: false };\n"
              "        if (status === 'CANCELLED') return { key: 'CANCELLED', label: t('cancelledPhase'), indeterminate: false };\n"
              "        if (running) return { key: 'SCORING', label: t('scoring'), indeterminate: true };\n"
              "        if (pending) return { key: 'QUEUED', label: t('queued'), indeterminate: true };\n"
              "        return { key: 'FINALIZING', label: t('finalizing'), indeterminate: true };\n"
              "    }\n"
          )
          if old_phase not in text:
              raise SystemExit('Copilot operationPhase block not found')
          copilot.write_text(text.replace(old_phase, new_phase, 1), encoding='utf-8')

          session = Path('taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java')
          session_text = session.read_text(encoding='utf-8')
          import_line = 'import org.junit.jupiter.api.extension.ExtendWith;\n'
          if import_line not in session_text:
              lines = session_text.splitlines(keepends=True)
              positions = [
                  index for index, line in enumerate(lines)
                  if line.startswith('import org.junit.jupiter.api.')
              ]
              if not positions:
                  raise SystemExit('JUnit import block not found in CompleteCopilotSessionIT')
              lines.insert(positions[-1] + 1, import_line)
              session_text = ''.join(lines)
          annotation = '@ExtendWith(CompleteCopilotScreenshotWatcher.class)\n'
          if annotation not in session_text:
              declaration = 'class CompleteCopilotSessionIT'
              if declaration not in session_text:
                  raise SystemExit('CompleteCopilotSessionIT declaration not found')
              session_text = session_text.replace(declaration, annotation + declaration, 1)
          session.write_text(session_text, encoding='utf-8')

          pom = Path('pom.xml')
          pom_text = pom.read_text(encoding='utf-8')
          old_selector = (
              '<skipITs>false</skipITs>'
              '<it.test>ScreenshotGeneratorIT,ArchitectureWorkbenchUiIT</it.test>'
          )
          new_selector = (
              '<skipITs>false</skipITs>'
              '<it.test>ScreenshotGeneratorIT,ArchitectureWorkbenchUiIT,'
              'CompleteCopilotSessionIT</it.test>'
          )
          if old_selector not in pom_text:
              raise SystemExit('Current screenshot profile selector not found')
          pom.write_text(pom_text.replace(old_selector, new_selector, 1), encoding='utf-8')

          english = Path('docs/en/COPILOT_AUTOPILOT.md')
          english_text = english.read_text(encoding='utf-8')
          english_marker = '## Architecture-node limits\n'
          english_block = (
              '## Complete-run result surface\n\n'
              'After a full analysis reaches an authoritative terminal state, Taxonomy '
              'reloads the requirement with the selected immutable snapshot. The same page '
              'keeps the Copilot operation status, provider, accurate terminal phase, '
              'completed verification passes and server-contact evidence visible above the '
              'result tabs. The selected snapshot is also shown explicitly and remains '
              'available through **Open result**.\n\n'
              '![Complete Copilot run result](../images/72-complete-copilot-run-result.png)\n\n'
              'The screenshot is captured by `CompleteCopilotSessionIT` from the real '
              'successful persisted state. It is not assembled from a browser fixture, and '
              'screenshot generation fails if the selected snapshot, terminal operation and '
              'result tabs are not visible together.\n\n'
          )
          if '72-complete-copilot-run-result.png' in english_text or english_marker not in english_text:
              raise SystemExit('English complete-result documentation insertion contract failed')
          english.write_text(
              english_text.replace(english_marker, english_block + english_marker, 1),
              encoding='utf-8')

          german = Path('docs/de/COPILOT_AUTOPILOT.md')
          german_text = german.read_text(encoding='utf-8')
          german_marker = '## Grenzen der Architekturknoten\n'
          german_block = (
              '## Ergebnisoberfläche eines vollständigen Laufs\n\n'
              'Nach einem autoritativ abgeschlossenen vollständigen Lauf lädt Taxonomy die '
              'Anforderung mit dem ausgewählten unveränderlichen Snapshot neu. Auf derselben '
              'Seite bleiben Operationsstatus, Anbieter, korrekte Endphase, abgeschlossene '
              'Prüfdurchläufe und letzter Serverkontakt oberhalb der Ergebnisregister '
              'sichtbar. Der ausgewählte Snapshot wird außerdem ausdrücklich angezeigt und '
              'bleibt über **Ergebnis öffnen** erreichbar.\n\n'
              '![Ergebnis eines vollständigen Copilot-Laufs](../images/72-complete-copilot-run-result.png)\n\n'
              'Der Screenshot wird durch `CompleteCopilotSessionIT` aus dem echten '
              'erfolgreichen persistenten Zustand aufgenommen. Er wird nicht aus einem '
              'Browser-Fixture zusammengesetzt; die Screenshot-Erzeugung schlägt fehl, wenn '
              'ausgewählter Snapshot, terminale Operation und Ergebnisregister nicht '
              'gemeinsam sichtbar sind.\n\n'
          )
          if '72-complete-copilot-run-result.png' in german_text or german_marker not in german_text:
              raise SystemExit('German complete-result documentation insertion contract failed')
          german.write_text(
              german_text.replace(german_marker, german_block + german_marker, 1),
              encoding='utf-8')

          reference = Path('.github/copilot-ref-screenshots.md')
          reference_text = reference.read_text(encoding='utf-8')
          row71 = '| `71`         | Yes (mock mode) | Persisted Copilot architecture workbench from the owning snapshot acceptance |\n'
          row72 = '| `72`         | Yes (mock mode) | Complete persisted Copilot run result from `CompleteCopilotSessionIT` |\n'
          if row71 not in reference_text or '72-complete-copilot-run-result.png' in reference_text:
              raise SystemExit('Screenshot numbering insertion contract failed')
          reference_text = reference_text.replace(row71, row71 + row72, 1)
          owner_note = (
              '\nThe complete Copilot result screenshot is owned by '
              '`CompleteCopilotSessionIT.java`, because only that acceptance creates, '
              'recovers and opens the authoritative selected snapshot while retaining '
              'the terminal operation evidence.\n\n'
          )
          heading = '## Adding a new screenshot\n'
          if heading not in reference_text:
              raise SystemExit('Screenshot ownership insertion point not found')
          reference.write_text(
              reference_text.replace(heading, owner_note + heading, 1),
              encoding='utf-8')
          PY

          cat > taxonomy-app/src/test/java/com/taxonomy/RequirementCopilotResultSurfaceContractTest.java <<'JAVA'
          package com.taxonomy;

          import org.junit.jupiter.api.Test;

          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          import static org.assertj.core.api.Assertions.assertThat;

          class RequirementCopilotResultSurfaceContractTest {

              @Test
              void terminalRunShowsAccuratePhaseAndAddressableSelectedSnapshot() throws IOException {
                  String source = Files.readString(Path.of(
                          "src/main/resources/static/js/portfolio/requirement-copilot.js"));

                  assertThat(source)
                          .contains("id=\"copilotResultActions\"")
                          .contains("id=\"copilotSelectedSnapshot\"")
                          .contains("id=\"copilotOpenResult\"")
                          .contains("renderResultAction(operation);")
                          .contains("resultUrl.searchParams.set('snapshot', snapshotId)")
                          .contains("status === 'SUCCESS'")
                          .contains("label: t('completedPhase')")
                          .contains("status === 'PARTIAL'")
                          .contains("label: t('partialPhase')")
                          .contains("status === 'FAILED'")
                          .contains("label: t('failedPhase')")
                          .contains("status === 'CANCELLED'")
                          .contains("label: t('cancelledPhase')")
                          .doesNotContain(
                                  "if (terminal.has(operation.status)) return { key: 'FINAL', "
                                          + "label: t('finalizing')");
              }
          }
          JAVA

          cat > taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotScreenshotWatcher.java <<'JAVA'
          package com.taxonomy;

          import org.junit.jupiter.api.extension.AfterTestExecutionCallback;
          import org.junit.jupiter.api.extension.BeforeTestExecutionCallback;
          import org.junit.jupiter.api.extension.ExtensionContext;
          import org.openqa.selenium.Dimension;
          import org.openqa.selenium.JavascriptExecutor;
          import org.openqa.selenium.OutputType;
          import org.openqa.selenium.TakesScreenshot;
          import org.openqa.selenium.WebDriver;

          import java.io.File;
          import java.lang.reflect.Field;
          import java.lang.reflect.Modifier;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardCopyOption;
          import java.time.Duration;
          import java.time.Instant;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.concurrent.atomic.AtomicReference;

          /**
           * Captures the real successful persisted result while the authoritative
           * complete Copilot browser session continues through its later failure cases.
           */
          public final class CompleteCopilotScreenshotWatcher
                  implements BeforeTestExecutionCallback, AfterTestExecutionCallback {

              private static final AtomicBoolean ACTIVE = new AtomicBoolean();
              private static final AtomicBoolean CAPTURED = new AtomicBoolean();
              private static final AtomicReference<Throwable> FAILURE = new AtomicReference<>();
              private static volatile Thread monitor;
              private static volatile boolean required;

              @Override
              public void beforeTestExecution(ExtensionContext context) {
                  required = Boolean.getBoolean("generateScreenshots")
                          && "CompleteCopilotSessionIT".equals(
                                  context.getRequiredTestClass().getSimpleName());
                  if (!required || !ACTIVE.compareAndSet(false, true)) {
                      return;
                  }
                  CAPTURED.set(false);
                  FAILURE.set(null);
                  monitor = Thread.ofPlatform()
                          .name("complete-copilot-screenshot-watcher")
                          .daemon(true)
                          .start(() -> monitor(context.getRequiredTestClass()));
              }

              @Override
              public void afterTestExecution(ExtensionContext context) throws Exception {
                  if (!required) {
                      return;
                  }
                  ACTIVE.set(false);
                  Thread running = monitor;
                  if (running != null) {
                      running.join(Duration.ofSeconds(10));
                  }
                  Throwable failure = FAILURE.get();
                  if (failure != null) {
                      throw new AssertionError("Complete Copilot screenshot watcher failed", failure);
                  }
                  if (!CAPTURED.get()) {
                      throw new AssertionError(
                              "The complete Copilot session never exposed its persisted successful result");
                  }
              }

              private static void monitor(Class<?> testClass) {
                  Instant deadline = Instant.now().plus(Duration.ofMinutes(20));
                  try {
                      while (ACTIVE.get() && !CAPTURED.get() && Instant.now().isBefore(deadline)) {
                          WebDriver driver = findDriver(testClass);
                          if (driver != null && ready(driver)) {
                              capture(driver);
                              CAPTURED.set(true);
                              return;
                          }
                          Thread.sleep(250);
                      }
                  } catch (InterruptedException interrupted) {
                      Thread.currentThread().interrupt();
                  } catch (Throwable throwable) {
                      FAILURE.compareAndSet(null, throwable);
                  }
              }

              private static WebDriver findDriver(Class<?> testClass) {
                  Class<?> current = testClass;
                  while (current != null) {
                      for (Field field : current.getDeclaredFields()) {
                          if (!Modifier.isStatic(field.getModifiers())
                                  || !WebDriver.class.isAssignableFrom(field.getType())) {
                              continue;
                          }
                          try {
                              field.setAccessible(true);
                              return (WebDriver) field.get(null);
                          } catch (ReflectiveOperationException | RuntimeException ignored) {
                              // Browser initialization is asynchronous; retry without changing the test.
                          }
                      }
                      current = current.getSuperclass();
                  }
                  return null;
              }

              private static boolean ready(WebDriver driver) {
                  try {
                      return Boolean.TRUE.equals(((JavascriptExecutor) driver).executeScript("""
                              const operation = document.getElementById('copilotOperation');
                              const status = operation?.dataset.operationStatus;
                              const selectedSnapshot = new URL(location.href).searchParams.get('snapshot');
                              const card = document.getElementById('requirementCopilotCard');
                              const tabs = document.querySelector(
                                  '#requirementMain [role="tablist"], #requirementMain .nav-tabs');
                              const busy = document.querySelector(
                                  '[aria-busy="true"], .portfolio-busy:not(.d-none), '
                                      + '.page-loading:not(.d-none), .loading-overlay:not(.d-none)');
                              return document.readyState === 'complete'
                                  && Boolean(card)
                                  && Boolean(operation)
                                  && (status === 'SUCCESS' || status === 'PARTIAL')
                                  && Boolean(selectedSnapshot)
                                  && Boolean(tabs)
                                  && !busy
                                  && window.innerWidth >= 1100;
                              """));
                  } catch (RuntimeException unavailableDuringNavigation) {
                      return false;
                  }
              }

              private static void capture(WebDriver driver) throws Exception {
                  Dimension previousSize = driver.manage().window().getSize();
                  try {
                      driver.manage().window().setSize(new Dimension(1900, 1200));
                      ((JavascriptExecutor) driver).executeScript("""
                              const card = document.getElementById('requirementCopilotCard');
                              if (card) card.scrollIntoView({block: 'start', inline: 'nearest'});
                              """);
                      Thread.sleep(500);
                      Path output = documentationScreenshotPath();
                      Files.createDirectories(output.getParent());
                      File screenshot = ((TakesScreenshot) driver)
                              .getScreenshotAs(OutputType.FILE);
                      Files.copy(
                              screenshot.toPath(),
                              output,
                              StandardCopyOption.REPLACE_EXISTING);
                  } finally {
                      driver.manage().window().setSize(previousSize);
                  }
              }

              private static Path documentationScreenshotPath() {
                  Path module = Path.of(System.getProperty("project.basedir", "."))
                          .toAbsolutePath()
                          .normalize();
                  Path repository = module.getParent();
                  if (repository == null) {
                      repository = module;
                  }
                  return repository.resolve("docs/images/72-complete-copilot-run-result.png");
              }
          }
          JAVA

          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          git diff --check

      - name: Verify the focused frontend contract
        run: >-
          ./mvnw -B -pl taxonomy-app test
          -Dtest=RequirementCopilotResultSurfaceContractTest
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Exercise the authoritative complete Copilot session and capture the result
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=CompleteCopilotSessionIT
          -DgenerateScreenshots=true
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify screenshot and documentation output
        shell: bash
        run: |
          set -euo pipefail
          image=docs/images/72-complete-copilot-run-result.png
          test -s "$image"
          test "$(wc -c < "$image")" -gt 40000
          file "$image" | grep -F 'PNG image data'
          python3 - <<'PY'
          from pathlib import Path
          import struct

          image = Path('docs/images/72-complete-copilot-run-result.png').read_bytes()
          if image[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Screenshot does not have a PNG signature')
          width, height = struct.unpack('>II', image[16:24])
          if width < 1800 or height < 1000:
              raise SystemExit(f'Screenshot is unexpectedly small: {width}x{height}')
          print(f'Verified screenshot dimensions: {width}x{height}')
          PY
          grep -F '72-complete-copilot-run-result.png' \
            docs/en/COPILOT_AUTOPILOT.md \
            docs/de/COPILOT_AUTOPILOT.md \
            .github/copilot-ref-screenshots.md
          git diff --check

      - name: Upload focused evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-copilot-run-result-final
          path: |
            docs/images/72-complete-copilot-run-result.png
            taxonomy-app/target/failsafe-reports/**
            taxonomy-app/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish only the verified permanent source change
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/complete-copilot-run-screenshot
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

          rm .github/workflows/finalize-complete-copilot-result.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js \
            taxonomy-app/src/test/java/com/taxonomy/RequirementCopilotResultSurfaceContractTest.java \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotScreenshotWatcher.java \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java \
            pom.xml \
            docs/images/72-complete-copilot-run-result.png \
            docs/en/COPILOT_AUTOPILOT.md \
            docs/de/COPILOT_AUTOPILOT.md \
            .github/copilot-ref-screenshots.md \
            .github/workflows/finalize-complete-copilot-result.yml
          git diff --cached --check
          git commit -m 'Document and clarify the complete Copilot run result'
          git push origin HEAD:"$branch"
