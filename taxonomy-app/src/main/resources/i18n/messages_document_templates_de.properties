document.templates.local.title=Vorlage lokal bearbeiten — Taxonomy
document.templates.local.heading=Vorlage lokal bearbeiten — ohne WebDAV
document.templates.local.back=Zurück zu den Vorlagen
document.templates.local.intro=Laden Sie die Vorlage herunter, bearbeiten Sie sie lokal in Word und laden Sie sie in diesem Browser wieder hoch. Word verbindet sich nicht mit Taxonomy; zusätzliche Clients oder Anwendungspasswörter sind nicht erforderlich.
document.templates.local.base=Feste Ausgangsversion:
document.templates.local.keep=Lassen Sie diese Seite geöffnet oder speichern Sie ihre Adresse als Lesezeichen. Die Adresse erhält die Ausgangsversion auch nach Neuladen oder erneuter Anmeldung. Verwenden Sie keinen neuen Bearbeitungslink für eine Datei aus einem älteren Download.
document.templates.local.download.heading=1. Herunterladen und bearbeiten
document.templates.local.word=Öffnen Sie in Word über Datei → Öffnen diese DOTX-Vorlage selbst. Behalten Sie ihre Pflichtplatzhalter bei und speichern Sie als DOTX, nicht als neues DOCX-Dokument. Das Speichern in Word lädt die Datei noch nicht zu Taxonomy hoch.
document.templates.local.download=Diese Ausgangsversion herunterladen
document.templates.local.upload.heading=2. Bearbeitete Vorlage zurückladen
document.templates.local.check=Der Server prüft das DOTX-Paket und gegebenenfalls Pflichtplatzhalter, bevor eine neue aktive Git-Version entsteht. Eine zwischenzeitliche Serveränderung führt zu einem Konflikt, nicht zum Überschreiben.
document.templates.local.file.help=Wählen Sie die Datei, die Sie aus der obigen Ausgangsversion bearbeitet haben. Vorlagen-ID und Name stehen fest. Ihre lokale Datei wird auch bei einem Fehler nicht gelöscht.
document.templates.local.save=Prüfen und als neue Version speichern
document.templates.local.javascript=Für das versionsgeschützte Hochladen ist JavaScript erforderlich. Download und Historie bleiben verfügbar.
document.templates.local.result=3. Gespeichertes Ergebnis prüfen
document.templates.local.compare=Gespeicherte Änderungen vergleichen
document.templates.local.sample=Testbericht aus der aktuellen Vorlage herunterladen
document.templates.local.sample.help=Der Testbericht nutzt die aktuelle Serverversion, die sich seit diesem Speichern geändert haben kann. Er ist keine Prüfung vor der Veröffentlichung.
document.templates.local.history=Historie und Vergleich mit der Ausgangsversion öffnen
document.templates.local.failed=Das versionsgeschützte Hochladen ist nicht verfügbar. Behalten Sie Ihre lokale Datei und kehren Sie zu genau dieser Bearbeitungsadresse zurück.
document.templates.local.invalid=Wählen Sie eine gültige, nicht leere DOTX-Vorlage, kein DOCX-Dokument.
document.templates.local.too-large=Die Datei überschreitet die zulässige Größe für Vorlagenarchive.
document.templates.local.busy=Vorlage wird übertragen und geprüft…
document.templates.local.saved=Die Vorlage wurde erfolgreich geprüft und als neue Git-Version gespeichert. Prüfen Sie die Änderungen unten.
document.templates.local.conflict=Diese Vorlage wurde auf dem Server seit Ihrer Ausgangsversion geändert. Diese Anfrage hat nichts überschrieben. Behalten Sie Ihre lokale Datei und gleichen Sie die Änderungen über die Historie ab. Ein Neuladen dieser Seite umgeht den Konflikt nicht.
document.templates.local.authentication=Ihre Anmeldung ist abgelaufen oder Sie dürfen Vorlagen nicht speichern. Melden Sie sich in einem anderen Tab als Administrator an und kehren Sie zu genau dieser Bearbeitungsadresse zurück. Wählen Sie Ihre lokale Datei bei Bedarf erneut aus.
document.templates.local.uncertain=Das Speicherergebnis konnte nicht bestätigt werden. Behalten Sie Ihre lokale Datei und prüfen Sie vor einem erneuten Versuch die Historie: Der Server könnte bereits gespeichert haben. Es gab keinen automatischen Wiederholungs- oder Überschreibversuch.
