name: One-off guarded merge of PR 794

on:
  push:
    branches:
      - automation/pr794-release-gate-20260818
    paths:
      - .github/workflows/one-off-pr794-release-gate.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: taxonomy-one-off-pr794-release-gate
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.head_commit.message == 'chore(agent): stage guarded PR 794 merge'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the unchanged PR head and every exact-head gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: '794'
        shell: bash
        run: |
          set -euo pipefail

          owner=${GITHUB_REPOSITORY_OWNER}
          name=${GITHUB_REPOSITORY#*/}
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")

          test "$(jq -r '.state' <<<"$pr_json")" = open
          test "$(jq -r '.draft' <<<"$pr_json")" = false
          test "$(jq -r '.head.repo.full_name' <<<"$pr_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.ref' <<<"$pr_json")" = agent/10-day-review-cleanup
          head_sha=$(jq -r '.head.sha' <<<"$pr_json")
          test "$head_sha" != null
          test -n "$head_sha"

          required=(
            'CI / CD'
            'Database Compatibility'
            'CodeQL Source Analysis'
            'Security Scan'
            'JGit Storage Consumer Contract'
          )

          all_green=false
          summary=''
          for attempt in $(seq 1 90); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head_sha}&event=pull_request&per_page=100")
            all_green=true
            summary=''
            for workflow in "${required[@]}"; do
              row=$(jq -r --arg workflow "$workflow" '
                [.workflow_runs[]
                  | select(.name == $workflow)
                  | {id, status, conclusion}]
                | sort_by(.id)
                | last
                | if . == null then "missing|missing|missing"
                  else "\(.id)|\(.status)|\(.conclusion // "pending")" end
              ' <<<"$runs")
              IFS='|' read -r run_id status conclusion <<<"$row"
              summary+="${workflow}: ${status}/${conclusion} (run ${run_id})\n"
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                printf 'Exact-head gate failed for %s at %s:\n%b' "$workflow" "$head_sha" "$summary" >&2
                gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  -f body="Guarded merge stopped: **${workflow}** concluded \`${conclusion}\` on exact head \`${head_sha}\`. No merge was attempted."
                exit 1
              fi
              if [[ "$status" != completed || "$conclusion" != success ]]; then
                all_green=false
              fi
            done
            if [[ "$all_green" == true ]]; then
              break
            fi
            sleep 10
          done

          if [[ "$all_green" != true ]]; then
            printf 'Timed out before every exact-head gate completed for %s:\n%b' "$head_sha" "$summary" >&2
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="Guarded merge stopped because the complete exact-head matrix did not finish successfully for \`${head_sha}\`. No merge was attempted."
            exit 1
          fi

          unresolved=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            -F owner="$owner" \
            -F name="$name" \
            -F number="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          if [[ "$unresolved" != 0 ]]; then
            echo "::error::PR ${PR_NUMBER} has ${unresolved} unresolved review threads" >&2
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="Guarded merge stopped because ${unresolved} review thread(s) remain unresolved. No merge was attempted."
            exit 1
          fi

          mergeable=false
          for attempt in $(seq 1 12); do
            current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            test "$(jq -r '.head.sha' <<<"$current")" = "$head_sha"
            value=$(jq -r '.mergeable' <<<"$current")
            if [[ "$value" == true ]]; then
              mergeable=true
              break
            fi
            if [[ "$value" == false ]]; then
              echo "::error::PR ${PR_NUMBER} is not mergeable" >&2
              exit 1
            fi
            sleep 5
          done
          test "$mergeable" = true

          printf 'All exact-head gates are green for %s:\n%b' "$head_sha" "$summary"
          merge=$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f sha="$head_sha" \
            -f merge_method=squash \
            -f commit_title='Resolve extended review backlog and harden schema consistency (#794)' \
            -f commit_message='Exact-head CI/CD, database compatibility, CodeQL, security, JGit consumer and review-thread gates completed successfully.')
          jq -e '.merged == true' <<<"$merge" >/dev/null
          jq -r '"Merged as " + .sha' <<<"$merge"

      - name: Delete the temporary automation branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/automation/pr794-release-gate-20260818" \
            || true
