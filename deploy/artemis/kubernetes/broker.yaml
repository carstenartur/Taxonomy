# Persistent single-broker example. Read docs/de/ARTEMIS_SETUP.md first.
# Create the messaging namespace and both Secrets before applying this file.
# Keep one replica. Recreate and a PVC provide persistence, not broker HA.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: taxonomy-artemis-data
  namespace: messaging
spec:
  accessModes: [ReadWriteOnce]
  # Uses the default StorageClass. Set storageClassName for your installation.
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxonomy-artemis
  namespace: messaging
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: taxonomy-artemis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxonomy-artemis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: apache/artemis:2.53.0-alpine@sha256:ce784035e4c5c5c91c505d7bd8edb8842559b909f3d5c2fddff968a2accc612e
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The stock 2.53.0 entrypoint copies etc-override only on first creation.
          # Reapply the protected configuration before EVERY start, including
          # existing PVCs. No real password is passed to the creation command.
          command: ["/bin/bash", "-ec"]
          args:
            - |
              set -euo pipefail
              umask 077
              cd /var/lib/artemis-instance
              if [[ ! -f etc/broker.xml ]]; then
                /opt/artemis/bin/artemis create --silent --require-login \
                  --user bootstrap-unused --role taxonomy-admin \
                  --no-web --no-autotune .
              fi
              for file in broker.xml bootstrap.xml login.config artemis-users.properties artemis-roles.properties; do
                test -s "/etc/taxonomy-artemis-config/${file}"
                cp "/etc/taxonomy-artemis-config/${file}" "etc/${file}"
                chmod 0600 "etc/${file}"
              done
              exec ./bin/artemis run
          env:
            - name: JAVA_ARGS
              value: >-
                -Xms128m -Xmx512m -XX:+UseSerialGC
                -Dlog4j2.disableJmx=true
                --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED
          ports:
            - name: core-tls
              containerPort: 61617
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: core-tls
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: core-tls
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: instance
              mountPath: /var/lib/artemis-instance
            - name: configuration
              mountPath: /etc/taxonomy-artemis-config
              readOnly: true
            - name: tls
              mountPath: /etc/artemis/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: instance
          persistentVolumeClaim:
            claimName: taxonomy-artemis-data
        - name: configuration
          secret:
            secretName: taxonomy-artemis-config
            defaultMode: 0440
        - name: tls
          secret:
            secretName: taxonomy-artemis-broker-tls
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: artemis
  namespace: messaging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taxonomy-artemis
  ports:
    - name: core-tls
      port: 61617
      targetPort: core-tls
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taxonomy-artemis
  namespace: messaging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taxonomy-artemis
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: taxonomy
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: taxonomy
      ports:
        - port: 61617
          protocol: TCP
  # This standalone broker makes no outgoing connections to other services.
  egress: []
