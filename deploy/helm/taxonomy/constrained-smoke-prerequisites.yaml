apiVersion: v1
kind: Namespace
metadata:
  name: taxonomy-smoke
  labels:
    kubernetes.io/metadata.name: taxonomy-smoke
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: taxonomy-smoke-quota
  namespace: taxonomy-smoke
spec:
  hard:
    requests.cpu: "750m"
    requests.memory: 1280Mi
    limits.cpu: "1500m"
    limits.memory: 2Gi
    pods: "4"
    services: "4"
    configmaps: "8"
    secrets: "8"
    persistentvolumeclaims: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: taxonomy-smoke-limits
  namespace: taxonomy-smoke
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 1Gi
      min:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1536Mi
    - type: Pod
      max:
        cpu: "1"
        memory: 1536Mi
