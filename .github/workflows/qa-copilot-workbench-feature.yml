name: QA Persisted Copilot Workbench

on:
  push:
    branches:
      - fix/copilot-architecture-workbench-ux
    paths:
      - .github/workflows/qa-copilot-workbench-feature.yml

permissions:
  contents: write

concurrency:
  group: qa-persisted-copilot-workbench
  cancel-in-progress: true

jobs:
  verify:
    name: Verify real persisted-snapshot workbench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/copilot-architecture-workbench-ux
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Verify the shared browser-SVG-PDF projection layout
        run: >-
          ./mvnw -B -pl taxonomy-export -am test
          -Dtest=LayeredDiagramLayoutServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Exercise and capture the real persisted Copilot snapshot
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=ArchitectureWorkbenchUiIT
          -DgenerateScreenshots=true
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify the documentation screenshot
        shell: bash
        run: |
          set -euo pipefail
          image=docs/images/41-copilot-architecture-workbench.png
          test -s "$image"
          test "$(wc -c < "$image")" -gt 50000
          file "$image" | grep -F 'PNG image data'

      - name: Upload screenshot and focused evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: persisted-copilot-workbench-after
          path: |
            docs/images/41-copilot-architecture-workbench.png
            taxonomy-app/target/failsafe-reports/**
            taxonomy-export/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish the verified screenshot and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qa-copilot-workbench-feature.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            docs/images/41-copilot-architecture-workbench.png \
            .github/workflows/qa-copilot-workbench-feature.yml
          git commit -m 'docs: add the persisted Copilot workbench screenshot [skip ci]'
          git push origin HEAD:fix/copilot-architecture-workbench-ux
