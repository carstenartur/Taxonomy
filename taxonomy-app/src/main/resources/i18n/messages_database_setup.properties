database.setup.apply.title=Apply the configuration in your deployment
database.setup.apply.secrets=In Rancher, update the deployment Secret with the database URL, application username and application password. The downloads contain no password.
database.setup.apply.profiles=Apply the displayed connection and profile settings to the Taxonomy workload. Preserve your authentication profiles and review existing overrides and TLS certificate mounts.
database.setup.apply.restart=Redeploy or restart Taxonomy, then check startup and sign in. Startup migrations initialize the PostgreSQL schema. Existing records are not copied.
database.setup.apply.environment=Deployment settings remain authoritative. Environment variables, guided Helm database fields, extraEnv and other overrides may take precedence over a properties file. Review the effective configuration before restarting.
