name: Verify IP official boundary GREEN
on:
  push:
    branches: [ "verify/ip-official-boundary-green-20260923" ]
permissions:
  contents: read
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run catalogue authority contract
        run: ./mvnw -B -ntp -pl taxonomy-knowledge -am -Dtest=CatalogueAuthorityContractTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Run analysis authority contract
        run: ./mvnw -B -ntp -pl taxonomy-analysis -am -Dtest=CatalogueAuthorityAnalysisContractTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Run architecture authority contract
        run: ./mvnw -B -ntp -pl taxonomy-architecture -am -Dtest=CatalogueAuthorityProjectionContractTest -Dsurefire.failIfNoSpecifiedTests=false test
