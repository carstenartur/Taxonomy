name: Final module extraction validation
on:
  push:
    branches: [work/628-completion-verify]
    paths: [.github/workflows/completion-628-validation.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f2722c61ebe0cfb828b0a43d3ce5efed7634c326
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {java-version: '21', distribution: temurin, cache: maven}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.m2/repository
          key: completion-dependencies-f272-${{ github.run_id }}
          restore-keys: completion-dependencies-f272-
      - name: Verify final feature libraries, captured Git scope and packaging
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,pathlib,os,subprocess
          sha='2604eac2ec5cbc5748eb77b33988224a97946e2b'
          req=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=120) as response: data=base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          compile(data,'completion-bootstrap.py','exec')
          path=pathlib.Path('/tmp/completion-bootstrap.py');path.write_bytes(data)
          subprocess.run(['python3',str(path)],check=True)
          PY
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: always()
        with:
          path: ~/.m2/repository
          key: completion-dependencies-f272-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: completion-candidate-evidence
          path: |
            target/completion-*
            **/target/surefire-reports/TEST-*.xml
          retention-days: 7
