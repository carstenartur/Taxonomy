name: Resolve issue 461 against consolidated workflows

on:
  push:
    branches:
      - fix/issue-461-jgit-storage-hibernate
    paths:
      - '.github/workflows/temp-resolve-main-issue-461.yml'

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue-461-jgit-storage-hibernate
          fetch-depth: 0
      - name: Merge main and retain its workflow authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          rm -rf .github/workflows
          git checkout origin/main -- .github/workflows
          rm -f .github/issue-461-merge-conflicts.txt
          rm -f .mvn/github-packages-settings.xml
          unresolved=$(git diff --name-only --diff-filter=U)
          if [[ -n "$unresolved" ]]; then
            echo "Unresolved non-workflow conflicts:"
            echo "$unresolved"
            exit 1
          fi
          git add -A
          git commit -m 'Merge current main and retain Maven-owned workflow orchestration'
          git push origin HEAD:fix/issue-461-jgit-storage-hibernate
