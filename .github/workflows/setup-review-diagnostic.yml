name: Setup review diagnostic (isolated branch)
on:
  push:
    branches: [verify/pr1142-review-regressions-20260928]
permissions:
  contents: read
  actions: read
jobs:
  snapshot:
    name: Export immutable source and runtime for offline review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f5993eba133cd16b006f4548ae4f66bd54708f4a
          persist-credentials: false
      - name: Install repository-pinned Helm
        env: {HELM_VERSION: v3.21.0}
        run: bash .github/scripts/install-helm.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: taxonomy-ui-application
          path: target/review-bundle/application
          run-id: 36466691181
          github-token: ${{ github.token }}
      - name: Export tracked source and Helm (no workspace credentials)
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=target/review-bundle/source.tar.gz HEAD
          cp "$(command -v helm)" target/review-bundle/helm
          git rev-parse HEAD >target/review-bundle/source-commit.txt
          sha256sum target/review-bundle/source.tar.gz target/review-bundle/helm >target/review-bundle/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: setup-second-review-offline-bundle
          path: target/review-bundle/**
          if-no-files-found: error
          retention-days: 1
