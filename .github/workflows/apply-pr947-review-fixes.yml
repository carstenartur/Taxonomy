name: Apply PR 947 Review Fixes

on:
  push:
    branches:
      - fix/copilot-architecture-workbench-ux
    paths:
      - .github/workflows/apply-pr947-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-pr947-review-fixes
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/copilot-architecture-workbench-ux
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Apply focused interaction and performance fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          adapter_path = Path('taxonomy-app/src/main/resources/static/js/architecture-workbench.js')
          adapter = adapter_path.read_text(encoding='utf-8')

          old_error = '''    function showError(error) {
                  alertBox.textContent = error instanceof Error ? error.message : String(error);
                  alertBox.classList.remove('d-none');
                  setStatus('Architecture could not be loaded.');
                  [fitButton, zoomInButton, zoomOutButton, overviewButton, focusButton]
                      .forEach(function (button) { button.disabled = true; });
              }
          '''
          new_error = '''    function showError(error) {
                  alertBox.textContent = error instanceof Error ? error.message : String(error);
                  alertBox.classList.remove('d-none');
                  setStatus('Architecture could not be loaded.');
                  searchInput.value = '';
                  clearSearch.hidden = true;
                  [
                      searchInput,
                      clearSearch,
                      contextCheckbox,
                      overviewButton,
                      focusButton,
                      fitButton,
                      zoomInButton,
                      zoomOutButton,
                      fullscreenButton
                  ].forEach(function (control) { control.disabled = true; });
              }
          '''
          if old_error not in adapter:
              raise SystemExit('showError block not found')
          adapter = adapter.replace(old_error, new_error, 1)

          old_queue = '''        while (queue.length > 0) {
                      const current = queue.shift();
                      const distance = distances.get(current) + 1;
                      adjacency.get(current).forEach(function (neighbor) {
                          if (!distances.has(neighbor)) {
                              distances.set(neighbor, distance);
                              queue.push(neighbor);
                          }
                      });
                  }
          '''
          new_queue = '''        let queueIndex = 0;
                  while (queueIndex < queue.length) {
                      const current = queue[queueIndex++];
                      const distance = distances.get(current) + 1;
                      adjacency.get(current).forEach(function (neighbor) {
                          if (!distances.has(neighbor)) {
                              distances.set(neighbor, distance);
                              queue.push(neighbor);
                          }
                      });
                  }
          '''
          if old_queue not in adapter:
              raise SystemExit('BFS queue block not found')
          adapter = adapter.replace(old_queue, new_queue, 1)

          old_selection = '''    function setSelection(nodeId, edgeId, center) {
                  state.selectedNodeId = nodeId || null;
                  state.selectedEdgeId = edgeId || null;
                  updateModeButtons();
                  updateInteractionStyles();
                  if (state.selectedNodeId) {
                      renderNodeDetails(nodeById.get(state.selectedNodeId));
                  } else if (state.selectedEdgeId) {
                      renderEdgeDetails(edgeById.get(state.selectedEdgeId));
                  } else {
                      clearDetails();
                  }
                  if (center && state.selectedNodeId) centerOnNode(state.selectedNodeId);
              }
          '''
          new_selection = '''    function setSelection(nodeId, edgeId, center) {
                  const leavingFocusMode = !nodeId && state.mode === 'focus';
                  state.selectedNodeId = nodeId || null;
                  state.selectedEdgeId = edgeId || null;
                  if (leavingFocusMode) {
                      state.mode = 'overview';
                      renderDiagram(true);
                      return;
                  }
                  updateModeButtons();
                  updateInteractionStyles();
                  if (state.selectedNodeId) {
                      renderNodeDetails(nodeById.get(state.selectedNodeId));
                  } else if (state.selectedEdgeId) {
                      renderEdgeDetails(edgeById.get(state.selectedEdgeId));
                  } else {
                      clearDetails();
                  }
                  if (center && state.selectedNodeId) centerOnNode(state.selectedNodeId);
              }
          '''
          if old_selection not in adapter:
              raise SystemExit('setSelection block not found')
          adapter = adapter.replace(old_selection, new_selection, 1)
          adapter_path.write_text(adapter, encoding='utf-8')

          ui_path = Path('taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java')
          ui = ui_path.read_text(encoding='utf-8')
          old_focus = '''        driver.findElement(By.id("architectureFocus")).click();
                  wait.until(browser -> {
                      int visible = browser.findElements(By.cssSelector(".architecture-node")).size();
                      return visible > 0 && visible <= overviewNodeCount;
                  });
                  driver.findElement(By.id("architectureOverview")).click();
                  wait.until(browser -> browser.findElements(
                          By.cssSelector(".architecture-node")).size() == overviewNodeCount);
                  fitAndWait();
                  assertDiagramFitsCanvas();
          '''
          new_focus = '''        driver.findElement(By.id("architectureFocus")).click();
                  wait.until(browser -> {
                      int visible = browser.findElements(By.cssSelector(".architecture-node")).size();
                      return visible > 0 && visible <= overviewNodeCount;
                  });
                  javascript().executeScript("""
                          document.getElementById('architectureCanvas')
                              .dispatchEvent(new MouseEvent('click', {bubbles: true}));
                          """);
                  wait.until(browser -> "true".equals(browser.findElement(
                          By.id("architectureOverview")).getAttribute("aria-pressed"))
                          && "false".equals(browser.findElement(
                                  By.id("architectureFocus")).getAttribute("aria-pressed"))
                          && !browser.findElement(By.id("architectureFocus")).isEnabled()
                          && browser.findElements(By.cssSelector(
                                  ".architecture-node")).size() == overviewNodeCount);
                  fitAndWait();
                  assertDiagramFitsCanvas();
          '''
          if old_focus not in ui:
              raise SystemExit('Focus-mode browser acceptance block not found')
          ui_path.write_text(ui.replace(old_focus, new_focus, 1), encoding='utf-8')

          contract_path = Path(
              'taxonomy-app/src/test/java/com/taxonomy/portfolio/workbench/'
              'ArchitectureWorkbenchAssetContractTest.java')
          contract = contract_path.read_text(encoding='utf-8')
          marker = '''    @Test
              void legacyExportControlRoutesOnlyTheActiveArchitectureResultToItsGraph() throws Exception {
          '''
          addition = '''    @Test
              void graphAdapterKeepsFailureControlsInertAndTraversesHopsLinearly() throws Exception {
                  String adapter = resource("static/js/architecture-workbench.js");

                  assertThat(adapter)
                          .contains("let queueIndex = 0")
                          .contains("while (queueIndex < queue.length)")
                          .doesNotContain("queue.shift()")
                          .contains("const leavingFocusMode = !nodeId && state.mode === 'focus'")
                          .contains("state.mode = 'overview'")
                          .contains("searchInput,")
                          .contains("contextCheckbox,")
                          .contains("fullscreenButton")
                          .contains("control.disabled = true");
              }

          ''' + marker
          if marker not in contract:
              raise SystemExit('Asset-contract insertion point not found')
          contract_path.write_text(contract.replace(marker, addition, 1), encoding='utf-8')
          PY

          node --check taxonomy-app/src/main/resources/static/js/architecture-workbench.js
          git diff --check

      - name: Verify focused source contracts
        run: >-
          ./mvnw -B -pl taxonomy-app -am test
          -Dtest=ArchitectureWorkbenchAssetContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify Docker availability
        run: docker info

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify the corrected browser interaction
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=ArchitectureWorkbenchUiIT
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Commit fixes and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-pr947-review-fixes.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/main/resources/static/js/architecture-workbench.js \
            taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java \
            taxonomy-app/src/test/java/com/taxonomy/portfolio/workbench/ArchitectureWorkbenchAssetContractTest.java \
            .github/workflows/apply-pr947-review-fixes.yml
          git commit -m 'Fix Copilot workbench review findings'
          git push origin HEAD:fix/copilot-architecture-workbench-ux
