name: Analysis evidence readout (temporary, no tests rerun)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: read
  actions: read
jobs:
  readout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: analysis-final-regression-evidence
          run-id: 35013367189
          github-token: ${{ github.token }}
          path: evidence
      - name: Validate frozen source and summarize actual completed reports
        shell: python
        run: |
          import collections, hashlib, json, re, xml.etree.ElementTree as ET, zipfile
          from pathlib import Path
          root = Path('evidence')
          folder = root / 'target/final-analysis-evidence'
          manifest = json.loads((folder / 'manifest.json').read_text())
          assert manifest['base'] == '0e8697371f8173716d7240585c33d42714c27ebc'
          assert manifest['tree'] == '06f4f53fdee304a07182da3ba7d6643eaf54b2ff'
          assert manifest['verificationRun'] == '35013367189'
          with zipfile.ZipFile(folder / 'tested-sources.zip') as archive:
              assert set(archive.namelist()) == set(manifest['files'])
              for name, expected in manifest['files'].items():
                  content = archive.read(name)
                  actual = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
                  assert actual == expected, name
          totals = collections.Counter()
          modules = collections.defaultdict(collections.Counter)
          selected = []
          for path in sorted(root.rglob('TEST-*.xml')):
              assert 'surefire-reports' in str(path), path
              suite = ET.parse(path).getroot()
              assert suite.tag == 'testsuite', (path, suite.tag)
              counts = {key: int(suite.attrib.get(key, 0)) for key in ('tests', 'failures', 'errors', 'skipped')}
              totals.update(counts)
              totals['suites'] += 1
              module = str(path.relative_to(root)).split('/')[0]
              modules[module].update(counts)
              modules[module]['suites'] += 1
              if suite.attrib.get('name', '').endswith(('AnalysisApiControllerTest', 'ExplicitCentralAnalysisAdmissionTest', 'LlmServiceBranchCoverageTest')):
                  selected.append({'suite': suite.attrib['name'], **counts,
                      'cases': [case.attrib.get('name') for case in suite.findall('testcase')]})
          assert totals['tests'] > 4000 and totals['failures'] == 0 and totals['errors'] == 0, totals
          assert any(item['suite'].endswith('ExplicitCentralAnalysisAdmissionTest') for item in selected)
          js = (folder / 'js-green.log').read_text()
          node_counts = {key: int(re.findall(r'^# ' + key + r' (\d+)$', js, re.M)[-1])
              for key in ('tests', 'pass', 'fail', 'skipped')}
          assert node_counts['fail'] == 0 and node_counts['pass'] > 50, node_counts
          assert '# fail 6\n' in (folder / 'js-red.log').read_text()
          for name in ('java-focused-green.log', 'unit-green.log', 'ui-contracts.log'):
              assert 'BUILD SUCCESS' in (folder / name).read_text(), name
          summary = {'sourceCommit': 'b744aa5950fc1a32935e1896788a2964e4bedafb',
              'sourceTree': manifest['tree'], 'verificationRun': manifest['verificationRun'],
              'sourceBlobsVerified': len(manifest['files']), 'unitTests': dict(totals),
              'modules': {key: dict(value) for key, value in modules.items()},
              'combinedFocusedNodeRun': node_counts, 'selectedRegressionReports': selected,
              'scope': 'Readout of completed preflight evidence, not a new test run or full integration acceptance'}
          Path('summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analysis-preflight-readout-b744aa59
          path: summary.json
          retention-days: 7
          if-no-files-found: error
