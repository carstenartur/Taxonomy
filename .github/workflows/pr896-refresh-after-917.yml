name: Refresh PR 896 after analysis lifecycle merge

on:
  push:
    branches:
      - dependabot/maven/io.github.carstenartur-jgit-storage-hibernate-core-0.11.2
    paths:
      - .github/workflows/pr896-refresh-after-917.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dependabot/maven/io.github.carstenartur-jgit-storage-hibernate-core-0.11.2
          fetch-depth: 0
      - name: Merge current main and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

          grep -F '<version>4.1.1</version>' pom.xml
          grep -F '<jgit-storage-hibernate.version>0.11.2</jgit-storage-hibernate.version>' pom.xml

          git rm .github/workflows/pr896-refresh-after-917.yml
          test "$(git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/pr896-refresh-after-917.yml$' | sort | tr '\n' ' ')" = 'pom.xml taxonomy-app/src/test/java/com/taxonomy/dsl/storage/JgitStorageSchema091CompatibilityTest.java '

          git commit -m 'chore: remove completed PR 896 refresh workflow'
          git push origin HEAD:dependabot/maven/io.github.carstenartur-jgit-storage-hibernate-core-0.11.2
