database.setup.finding.database.schema.NOT_CHECKED=The connection test checks reachability and login. Schema migrations and write permissions are checked separately during deployment.
database.setup.finding.database.schema-overrides.WARNING=The connection test is independent of existing schema-generation overrides. Those settings currently block configuration export. Review the deployment settings in Help and remove the conflicting overrides or set them to validate.
database.setup.finding.database.tls.WARNING=TLS is disabled explicitly; credentials and data may cross the network without transport protection.
database.setup.finding.database.support.WARNING=SQL Server and Oracle remain evaluation paths. Production migration, persistence, restart and recovery acceptance is not established.
database.setup.finding.database.deployment.NOT_CHECKED=Deployment settings remain authoritative. Review driver, dialect, included profiles and schema overrides before applying configuration and restarting manually.
database.setup.finding.database.transfer.NOT_CHECKED=No existing records are copied. A connection check does not establish target schema readiness or transfer existing data.
database.setup.finding.database.connection.OK=Taxonomy successfully logged in with these connection settings.
database.setup.finding.database.connection.ERROR=The connection failed and the cause could not be identified reliably. Check the database server diagnostics and the connection settings.
database.setup.finding.database.connection.WARNING=Other database connection checks are still running. Try again after they finish.
database.setup.finding.spring.profiles.active.ERROR=Review the profile list. Select only one database engine and one authentication mode.
