name: Diagnose decision-report snapshot fingerprint

on:
  push:
    branches:
      - agent/decision-rationale-report-extension
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-rationale-report-fingerprint-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Merge current protected main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Reconstruct decision-report source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/decision-report-package/part-*.b64 | base64 --decode > /tmp/decision-report-source.tar.gz
          echo 'ff99f3d070e4067b27428ed759b713e9041e089d2677809b8822859f64599cd4  /tmp/decision-report-source.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/decision-report-source
          tar -xzf /tmp/decision-report-source.tar.gz -C /tmp/decision-report-source
          python3 /tmp/decision-report-source/apply_decision_report.py . --allow-different-base

      - name: Apply already verified compatibility corrections
        shell: bash
        run: |
          set -euo pipefail
          taxonomy_service='taxonomy-app/src/main/java/com/taxonomy/catalog/service/TaxonomyService.java'
          if ! grep -q '^import org.springframework.core.io.ClassPathResource;$' "$taxonomy_service"; then
            sed -i '/^import org.springframework.core.io.Resource;$/i import org.springframework.core.io.ClassPathResource;' "$taxonomy_service"
          fi

          renderer='taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleDocxRenderer.java'
          perl -0pi -e 's/        CTTblPr properties = tableXml\.isSetTblPr\(\) \? tableXml\.getTblPr\(\) : tableXml\.addNewTblPr\(\);/        CTTblPr properties = tableXml.getTblPr();\n        if (properties == null) {\n            properties = tableXml.addNewTblPr();\n        }/' "$renderer"
          perl -0pi -e 's/        paragraph\.setKeepNext\(true\);/        if (paragraph.getCTP().getPPr() == null) {\n            paragraph.getCTP().addNewPPr();\n        }\n        paragraph.setKeepNext(true);/g' "$renderer"

          report_service='taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReportService.java'
          sed -i 's/return value == null ? "" : String.valueOf(value)\.strip();/return value == null ? "" : String.valueOf(value);/' "$report_service"

      - name: Instrument exact fingerprint inputs
        shell: bash
        run: |
          set -euo pipefail
          test_file='taxonomy-app/src/test/java/com/taxonomy/DecisionRationaleReportTests.java'
          python3 - "$test_file" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding='utf-8')
          field = '''    @Autowired
              private PortfolioFingerprintService fingerprintService;
          '''
          replacement = '''    @Autowired
              private PortfolioFingerprintService fingerprintService;
              @Autowired
              private com.taxonomy.catalog.repository.TaxonomyNodeRepository diagnosticNodeRepository;
          '''
          if field not in source:
              raise SystemExit('fingerprint service field anchor not found')
          source = source.replace(field, replacement, 1)

          anchor = '''        String taxonomyFingerprint = fingerprintService.taxonomyFingerprint();
          '''
          diagnostic = r'''        String taxonomyFingerprint = fingerprintService.taxonomyFingerprint();
                  List<TaxonomyNode> diagnosticRepositoryNodes = diagnosticNodeRepository.findAll();
                  Map<String, TaxonomyNodeDto> diagnosticFrozenNodes = new java.util.TreeMap<>();
                  java.util.ArrayDeque<TaxonomyNodeDto> diagnosticQueue =
                          new java.util.ArrayDeque<>(frozenTree);
                  while (!diagnosticQueue.isEmpty()) {
                      TaxonomyNodeDto diagnosticNode = diagnosticQueue.removeFirst();
                      diagnosticFrozenNodes.put(diagnosticNode.getCode(), diagnosticNode);
                      if (diagnosticNode.getChildren() != null) {
                          diagnosticQueue.addAll(diagnosticNode.getChildren());
                      }
                  }
                  java.util.Set<String> diagnosticRepositoryCodes = new java.util.TreeSet<>();
                  diagnosticRepositoryNodes.forEach(node -> diagnosticRepositoryCodes.add(node.getCode()));
                  java.util.Set<String> diagnosticMissingFromFrozen =
                          new java.util.TreeSet<>(diagnosticRepositoryCodes);
                  diagnosticMissingFromFrozen.removeAll(diagnosticFrozenNodes.keySet());
                  java.util.Set<String> diagnosticOnlyFrozen =
                          new java.util.TreeSet<>(diagnosticFrozenNodes.keySet());
                  diagnosticOnlyFrozen.removeAll(diagnosticRepositoryCodes);
                  System.err.println("FINGERPRINT_DIAGNOSTIC repositoryCount="
                          + diagnosticRepositoryNodes.size()
                          + " frozenCount=" + diagnosticFrozenNodes.size());
                  System.err.println("FINGERPRINT_DIAGNOSTIC missingFromFrozen="
                          + diagnosticMissingFromFrozen);
                  System.err.println("FINGERPRINT_DIAGNOSTIC onlyFrozen=" + diagnosticOnlyFrozen);
                  java.util.function.Function<Object, String> diagnosticValue =
                          value -> value == null ? "" : String.valueOf(value);
                  int diagnosticDifferenceCount = 0;
                  for (TaxonomyNode diagnosticEntity : diagnosticRepositoryNodes.stream()
                          .sorted(java.util.Comparator.comparing(TaxonomyNode::getCode)).toList()) {
                      TaxonomyNodeDto diagnosticDto = diagnosticFrozenNodes.get(diagnosticEntity.getCode());
                      if (diagnosticDto == null) {
                          continue;
                      }
                      String diagnosticEntityLine = String.join("\u001f",
                              diagnosticValue.apply(diagnosticEntity.getCode()),
                              diagnosticValue.apply(diagnosticEntity.getNameEn()),
                              diagnosticValue.apply(diagnosticEntity.getDescriptionEn()),
                              diagnosticValue.apply(diagnosticEntity.getTaxonomyRoot()),
                              Integer.toString(diagnosticEntity.getLevel())) + "\n";
                      String diagnosticDtoLine = String.join("\u001f",
                              diagnosticValue.apply(diagnosticDto.getCode()),
                              diagnosticValue.apply(diagnosticDto.getNameEn()),
                              diagnosticValue.apply(diagnosticDto.getDescriptionEn()),
                              diagnosticValue.apply(diagnosticDto.getTaxonomyRoot()),
                              Integer.toString(diagnosticDto.getLevel())) + "\n";
                      if (!diagnosticEntityLine.equals(diagnosticDtoLine)) {
                          diagnosticDifferenceCount++;
                          if (diagnosticDifferenceCount <= 100) {
                              System.err.println("FINGERPRINT_DIAGNOSTIC fieldDifference code="
                                      + diagnosticEntity.getCode()
                                      + " entity=" + diagnosticEntityLine.replace("\u001f", "|")
                                      + " dto=" + diagnosticDtoLine.replace("\u001f", "|"));
                          }
                      }
                  }
                  System.err.println("FINGERPRINT_DIAGNOSTIC fieldDifferenceCount="
                          + diagnosticDifferenceCount);
          '''
          if anchor not in source:
              raise SystemExit('taxonomy fingerprint anchor not found')
          path.write_text(source.replace(anchor, diagnostic, 1), encoding='utf-8')
          PY

      - name: Run focused test with diagnostic output
        shell: bash
        run: |
          mkdir -p target/fingerprint-diagnostic
          set -o pipefail
          ./mvnw -B -pl taxonomy-app -am \
            -Dtest=DecisionRationaleReportTests \
            -Dsurefire.failIfNoSpecifiedTests=false test \
            2>&1 | tee target/fingerprint-diagnostic/focused-tests.log

      - name: Upload fingerprint diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: decision-report-fingerprint-diagnostic
          path: |
            target/fingerprint-diagnostic/**
            **/target/surefire-reports/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
