name: Verify relation CI repair
on:
  push:
    branches: [verify/pr1112-pr1113-repair-20260923]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Reconstruct exact four-file correction
        run: |
          cp .verification/repair1112.py /tmp/repair1112.py
          git fetch origin 37142420865bd76b6492908b46ae9c8f060a7d51
          git checkout --detach 37142420865bd76b6492908b46ae9c8f060a7d51
          python3 /tmp/repair1112.py
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Execute unchanged failing suites against repaired source
        run: |
          set -o pipefail
          ./mvnw -B -ntp -pl taxonomy-app -am -Dtest=ArchitectureContextDependencyRatchetTest,ConfigurationReferenceContractTest -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee /tmp/repair1112.log
          test "$(git write-tree)" = 9d6ef7223714aa5a5364131fe010a3dfb99d9cfb
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ['com.taxonomy.ArchitectureContextDependencyRatchetTest','com.taxonomy.config.ConfigurationReferenceContractTest']:
              path=Path('taxonomy-app/target/surefire-reports/TEST-'+name+'.xml')
              root=ET.parse(path).getroot()
              assert int(root.get('tests','0')) > 0
              assert all(int(root.get(key,'0')) == 0 for key in ['failures','errors','skipped'])
              print(name,root.attrib)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr1112-ci-repair-evidence
          path: |
            /tmp/repair1112.log
            taxonomy-app/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
  prepare-commit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Prepare exact verified commit without moving any branch
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          cp .verification/repair1112.py /tmp/repair1112.py
          git fetch origin 37142420865bd76b6492908b46ae9c8f060a7d51
          git checkout --detach 37142420865bd76b6492908b46ae9c8f060a7d51
          python3 /tmp/repair1112.py
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          def post(kind,data):
              request=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/'+kind,data=json.dumps(data).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          files=['.github/architecture-dependency-baseline.json','docs/de/CONFIGURATION_REFERENCE.md','docs/en/CONFIGURATION_REFERENCE.md','docs/dev/requirement-relation-downwalk.md']
          tree=post('trees',{'base_tree':'e58944ce2e3c8cf73e18e7443c7f0d59e8db9023','tree':[{'path':p,'type':'blob','mode':'100644','content':Path(p).read_text()} for p in files]})
          assert tree['sha']=='9d6ef7223714aa5a5364131fe010a3dfb99d9cfb'
          commit=post('commits',{'message':'fix(analysis): align relation configuration and exact dependency inventory\n\nPreserve current main and the existing relation-search implementation. Correct the actual ArchUnit class-pair count and document six server settings in both canonical references. The unchanged architecture and configuration contracts pass in a fresh Java21 Maven source build. No thresholds, test exclusions or canonical workflows change. Full PR CI remains required.','tree':tree['sha'],'parents':['368221424c9b43b46a17e3c7e65586eed77b33ce','f40f58a259dbde09877476d4736f22ec5662523d']})
          print('PREPARED_COMMIT='+commit['sha'])
          print('PREPARED_TREE='+tree['sha'])
          print('No branch references were moved.')
          PY
