name: QA Complete Copilot Result

on:
  push:
    branches:
      - fix/complete-copilot-run-result-ux
    paths:
      - .github/workflows/qa-complete-copilot-result.yml

permissions:
  contents: write

concurrency:
  group: qa-complete-copilot-result
  cancel-in-progress: true

jobs:
  verify:
    name: Verify complete Copilot run result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/complete-copilot-run-result-ux
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Add result contracts, screenshot ownership and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              start_index = text.index(start)
              end_index = text.index(end, start_index)
              return text[:start_index] + replacement.rstrip() + '\n\n' + text[end_index:]

          test_path = Path('taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java')
          text = test_path.read_text(encoding='utf-8')
          replacement = '''    private static void openSelectedSnapshotThroughVisibleAnalysisControls() {
                  // Terminal Copilot success navigates to the selected immutable snapshot.
                  // The result page must now orient the user without another manual tab or
                  // snapshot click.
                  wait.until(browser -> browser.getCurrentUrl().contains("snapshot="));
                  wait.until(ExpectedConditions.visibilityOfElementLocated(By.id("analyses-tab")));
                  wait.until(ExpectedConditions.invisibilityOfElementLocated(
                          By.cssSelector(".portfolio-busy:not(.d-none)")));
                  wait.until(attributeEquals(By.id("analyses-tab"), "aria-selected", "true"));
                  wait.until(ExpectedConditions.visibilityOfElementLocated(
                          By.id("snapshotResultOverview")));
                  wait.until(browser -> browser.findElements(
                          By.cssSelector("[data-decision-report-format]")).size() == 3);

                  assertThat(driver.findElements(By.cssSelector(
                          "#snapshotList [data-snapshot-id].active[aria-current='true']")))
                          .hasSize(1);
                  assertThat(driver.findElements(By.cssSelector(
                          "#snapshotResultOverview .portfolio-result-kpi")))
                          .hasSize(6);

                  String visibleResult = driver.findElement(By.id("snapshotDetail")).getText();
                  assertThat(visibleResult)
                          .contains("Copilot result overview")
                          .contains("Gap analysis")
                          .contains("Detected patterns")
                          .contains("Recommendation")
                          .doesNotContain("\\\"missingRelations\\\"")
                          .doesNotContain("{\\\"businessText\\\"");

                  List<WebElement> findingDetails = driver.findElements(
                          By.cssSelector("#snapshotDetail details.portfolio-finding-details"));
                  assertThat(findingDetails).isNotEmpty();
                  assertThat(findingDetails).allSatisfy(detail ->
                          assertThat(detail.getAttribute("open")).isNull());

                  WebElement firstSummary = findingDetails.getFirst()
                          .findElement(By.cssSelector("summary"));
                  javascript().executeScript("arguments[0].click();", firstSummary);
                  wait.until(browser -> !browser.findElements(By.cssSelector(
                          "#snapshotDetail details.portfolio-finding-details[open] table tr"))
                          .isEmpty());
                  javascript().executeScript("arguments[0].click();", firstSummary);
                  wait.until(browser -> browser.findElements(By.cssSelector(
                          "#snapshotDetail details.portfolio-finding-details[open]")).isEmpty());

                  long resultHeight = ((Number) javascript().executeScript(
                          "return Math.round(document.getElementById('snapshotDetail')"
                                  + ".getBoundingClientRect().height);")).longValue();
                  assertThat(resultHeight)
                          .as("collapsed complete Copilot result height")
                          .isLessThan(2_400L);

                  if (Boolean.getBoolean("generateScreenshots")) {
                      saveCompleteCopilotResultScreenshot();
                  }
              }

              private static void saveCompleteCopilotResultScreenshot() {
                  Dimension previousSize = driver.manage().window().getSize();
                  try {
                      driver.manage().window().setSize(new Dimension(2200, 1600));
                      javascript().executeScript("""
                              document.querySelectorAll('#snapshotDetail details[open]')
                                  .forEach(detail => { detail.open = false; });
                              window.scrollTo(0, 0);
                              """);
                      wait.until(ExpectedConditions.visibilityOfElementLocated(
                              By.id("snapshotResultOverview")));
                      java.nio.file.Path output = documentationScreenshotPath();
                      java.nio.file.Files.createDirectories(output.getParent());
                      java.io.File capture = ((org.openqa.selenium.TakesScreenshot) driver)
                              .getScreenshotAs(org.openqa.selenium.OutputType.FILE);
                      java.nio.file.Files.copy(
                              capture.toPath(),
                              output,
                              java.nio.file.StandardCopyOption.REPLACE_EXISTING);
                  } catch (java.io.IOException exception) {
                      throw new AssertionError(
                              "Could not save complete Copilot result screenshot", exception);
                  } finally {
                      driver.manage().window().setSize(previousSize);
                  }
              }

              private static java.nio.file.Path documentationScreenshotPath() {
                  java.nio.file.Path module = java.nio.file.Path.of(
                          System.getProperty("project.basedir", "."))
                          .toAbsolutePath()
                          .normalize();
                  java.nio.file.Path repository = module.getParent();
                  if (repository == null) {
                      repository = module;
                  }
                  return repository.resolve(
                          "docs/images/72-complete-copilot-run-result.png");
              }
          '''
          text = replace_between(
              text,
              '    private static void openSelectedSnapshotThroughVisibleAnalysisControls() {',
              '    private static void exerciseRequirementWorkspaceControls() {',
              replacement)
          test_path.write_text(text, encoding='utf-8')

          english_path = Path('docs/en/COPILOT_AUTOPILOT.md')
          english = english_path.read_text(encoding='utf-8')
          english_marker = '## Architecture-node limits\n'
          english_section = '''## Complete-run result

          A successful Copilot full analysis opens the selected immutable snapshot directly in the **Analyses** tab. The result surface summarizes mapped elements and relationships, open gaps, pattern coverage, recommendation confidence and confirmed elements before showing the supporting evidence.

          ![Complete Copilot run result](../images/72-complete-copilot-run-result.png)

          The five highest-priority missing relationships remain visible. Longer gap, pattern and relation lists are collapsed by default and open into bounded, scrollable tables. The full provider-neutral payload remains available through the JSON report and the collapsed technical snapshot section; it is no longer dumped into the normal reading flow. The architecture workbench, decision review and solution/product tabs remain explicit next steps because Copilot output is not a binding human decision.

          '''
          if english_marker not in english:
              raise SystemExit('English Copilot documentation insertion point not found')
          english_path.write_text(
              english.replace(english_marker, english_section + english_marker, 1),
              encoding='utf-8')

          german_path = Path('docs/de/COPILOT_AUTOPILOT.md')
          german = german_path.read_text(encoding='utf-8')
          german_marker = '## Grenzen der Architekturknoten\n'
          german_section = '''## Ergebnis eines vollständigen Laufs

          Nach einer erfolgreichen Copilot-Vollanalyse öffnet Taxonomy den ausgewählten unveränderlichen Snapshot unmittelbar im Tab **Analysen**. Die Ergebnisansicht fasst zunächst zugeordnete Elemente und Beziehungen, offene Lücken, Musterabdeckung, Konfidenz der Empfehlung und bestätigte Elemente zusammen und zeigt danach die zugehörige Evidenz.

          ![Ergebnis eines vollständigen Copilot-Laufs](../images/72-complete-copilot-run-result.png)

          Die fünf wichtigsten fehlenden Beziehungen bleiben unmittelbar sichtbar. Längere Lücken-, Muster- und Beziehungslisten sind zunächst eingeklappt und öffnen sich in begrenzten, scrollbareren Tabellen. Die vollständigen anbieterneutralen Nutzdaten bleiben über den JSON-Bericht und den eingeklappten Abschnitt mit technischen Snapshot-Daten verfügbar; sie werden nicht mehr als unstrukturierter JSON-Block in den normalen Lesefluss geschrieben. Architektur-Workbench, Entscheidungsprüfung sowie Lösungs- und Produktansicht bleiben ausdrückliche nächste Schritte, weil Copilot-Ergebnisse keine verbindliche menschliche Entscheidung ersetzen.

          '''
          if german_marker not in german:
              raise SystemExit('German Copilot documentation insertion point not found')
          german_path.write_text(
              german.replace(german_marker, german_section + german_marker, 1),
              encoding='utf-8')

          qa_path = Path('docs/qa/authoritative-copilot-session-e2e.md')
          qa = qa_path.read_text(encoding='utf-8')
          qa_note = '''

          ## Documentation screenshot ownership

          `CompleteCopilotSessionIT` owns `docs/images/72-complete-copilot-run-result.png`. The image is captured only after the real persistent operation reaches `SUCCESS` or `PARTIAL`, the selected immutable snapshot has opened, the **Analyses** tab is active, and the structured result contracts have passed. Do not replace it with a fabricated DOM fixture or an isolated architecture-workbench screenshot.
          '''
          if '72-complete-copilot-run-result.png' not in qa:
              qa_path.write_text(qa.rstrip() + qa_note + '\n', encoding='utf-8')
          PY

          mkdir -p taxonomy-app/src/test/java/com/taxonomy/portfolio
          cat > taxonomy-app/src/test/java/com/taxonomy/portfolio/CompleteCopilotResultUiContractTest.java <<'JAVA'
          package com.taxonomy.portfolio;

          import org.junit.jupiter.api.Test;

          import java.io.IOException;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;
          import java.nio.file.Path;

          import static org.assertj.core.api.Assertions.assertThat;

          class CompleteCopilotResultUiContractTest {

              private static final Path ROOT = locateRoot();

              @Test
              void completeRunUsesStructuredReviewSurfaceInsteadOfRawJson() throws IOException {
                  String detail = read("taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js");

                  assertThat(detail)
                          .contains("activateDetailTab('analyses-tab')")
                          .contains("aria-current", "snapshotResultOverview", "portfolio-result-kpi")
                          .contains("renderGapResult", "renderPatternResult", "renderRecommendationResult")
                          .contains("portfolio-finding-details", "technicalSnapshotData")
                          .contains("architectureWorkbenchUrl", "portfolio-decision-filters")
                          .doesNotContain("gap.summary || gap.description || JSON.stringify(gap)")
                          .doesNotContain("recommendation.summary || recommendation.recommendation || JSON.stringify(recommendation)");
              }

              @Test
              void longEvidenceIsBoundedAndSecondaryDetailsStartCollapsed() throws IOException {
                  String css = read("taxonomy-app/src/main/resources/static/css/taxonomy-portfolio.css");
                  String detail = read("taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js");

                  assertThat(css)
                          .contains(".portfolio-result-kpis")
                          .contains("grid-template-columns: repeat(6")
                          .contains(".portfolio-result-table")
                          .contains("max-height: 34rem")
                          .contains("overflow: auto")
                          .contains(".portfolio-result-table-sm")
                          .contains("@media (max-width: 767.98px)");
                  assertThat(detail)
                          .contains("<details class=\"portfolio-finding-details\"")
                          .doesNotContain("<details class=\"portfolio-finding-details\" open");
              }

              @Test
              void terminalCopilotStateYieldsSpaceToTheResult() throws IOException {
                  String copilot = read("taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js");
                  String css = read("taxonomy-app/src/main/resources/static/css/taxonomy-portfolio.css");

                  assertThat(copilot)
                          .contains("id=\"copilotRunSettings\"")
                          .contains("settings.open = !isTerminal")
                          .contains("classList.toggle('copilot-terminal', isTerminal)");
                  assertThat(css)
                          .contains("#requirementCopilotCard.copilot-terminal")
                          .contains("#copilotProgress")
                          .contains("height: 0.45rem");
              }

              private static String read(String path) throws IOException {
                  return Files.readString(ROOT.resolve(path), StandardCharsets.UTF_8);
              }

              private static Path locateRoot() {
                  Path current = Path.of("").toAbsolutePath().normalize();
                  while (current != null) {
                      if (Files.isRegularFile(current.resolve("pom.xml"))
                              && Files.isDirectory(current.resolve("taxonomy-app"))) {
                          return current;
                      }
                      current = current.getParent();
                  }
                  throw new IllegalStateException("Repository root not found");
              }
          }
          JAVA

          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          git diff --check

      - name: Verify source-level result contracts
        run: >-
          ./mvnw -B -pl taxonomy-app -am test
          -Dtest=CompleteCopilotResultUiContractTest,RequirementCopilotUiContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify Docker availability
        run: docker info

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Exercise and capture the authoritative complete Copilot session
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=CompleteCopilotSessionIT
          -DgenerateScreenshots=true
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify final screenshot and absence of the raw result dump
        shell: bash
        run: |
          set -euo pipefail
          image=docs/images/72-complete-copilot-run-result.png
          test -s "$image"
          test "$(wc -c < "$image")" -gt 75000
          file "$image" | grep -F 'PNG image data'
          ! grep -F 'gap.summary || gap.description || JSON.stringify(gap)' \
              taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js

      - name: Upload screenshot and focused evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-copilot-run-result
          path: |
            docs/images/72-complete-copilot-run-result.png
            taxonomy-app/target/failsafe-reports/**
            taxonomy-app/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified tests, documentation and screenshot
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qa-complete-copilot-result.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java \
            taxonomy-app/src/test/java/com/taxonomy/portfolio/CompleteCopilotResultUiContractTest.java \
            docs/en/COPILOT_AUTOPILOT.md \
            docs/de/COPILOT_AUTOPILOT.md \
            docs/qa/authoritative-copilot-session-e2e.md \
            docs/images/72-complete-copilot-run-result.png \
            .github/workflows/qa-complete-copilot-result.yml
          git commit -m 'Verify and document the complete Copilot run result'
          git push origin HEAD:fix/complete-copilot-run-result-ux
