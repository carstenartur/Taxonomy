name: Physical workspace extraction verification
on:
  push:
    branches: [verification/628-physical-workspace]
    paths:
      - .github/workflows/628-physical-workspace.yml
      - verification/physical_workspace.py
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c0d7bd654ba774daa0701b6e18dfa3fb85c3a92c
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: RED - require the physical workspace module
        run: python3 verification/physical_workspace.py red "$GITHUB_WORKSPACE/source"
      - name: Extract workspace implementation and unit tests
        id: apply
        run: python3 verification/physical_workspace.py apply "$GITHUB_WORKSPACE/source"
      - name: Compile full reactor and enforce architecture
        run: python3 verification/physical_workspace.py architecture "$GITHUB_WORKSPACE/source"
      - name: Verify complete default reactor and Boot JAR packaging
        run: python3 verification/physical_workspace.py verify "$GITHUB_WORKSPACE/source"
      - name: Preserve prepared source tree without changing any branch
        if: always() && steps.apply.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 verification/physical_workspace.py publish "$GITHUB_WORKSPACE/source"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: physical-workspace-evidence
          path: ${{ runner.temp }}/workspace-extraction-evidence/
          retention-days: 7
          if-no-files-found: error
