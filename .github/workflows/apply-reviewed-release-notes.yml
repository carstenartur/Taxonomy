name: Apply reviewed release notes authority fix

on:
  push:
    branches:
      - automation/apply-exact-gate-behavior-contract
    paths:
      - '.github/workflows/apply-reviewed-release-notes.yml'
      - '.github/scripts/apply-reviewed-release-notes.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patch helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: automation/apply-exact-gate-behavior-contract
          path: patcher
          persist-credentials: false

      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/preserve-reviewed-notes
          path: target
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply and verify reviewed-notes authority
        shell: bash
        run: |
          set -euo pipefail
          python3 patcher/.github/scripts/apply-reviewed-release-notes.py target
          cd target
          bash -n .github/scripts/release.sh
          bash -n .github/scripts/validate-reviewed-release-notes.sh
          bash -n .github/scripts/verify-exact-release-gates.sh
          python3 .github/scripts/check-release-delivery-contract.py
          ./mvnw -B -pl taxonomy-build -am \
            -Dtest=ReviewedReleaseNotesContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipITs \
            -Dtaxonomy.model.download.skip=true \
            -Dtaxonomy.quality.skip=true \
            -Dtaxonomy.ui.skip=true test
          git diff --check

      - name: Commit reviewed-notes authority fix
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/release.sh .github/workflows/deploy-release.yml
          git commit -m "Publish exact reviewed release notes"
          git push origin "HEAD:release/preserve-reviewed-notes"
