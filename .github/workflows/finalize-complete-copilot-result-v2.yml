name: Finalize Complete Copilot Result V2

on:
  push:
    branches:
      - fix/complete-copilot-run-result-review
    paths:
      - .github/workflows/finalize-complete-copilot-result-v2.yml

permissions:
  contents: write

concurrency:
  group: finalize-complete-copilot-result
  cancel-in-progress: true

jobs:
  verify-and-publish:
    name: Verify complete-result restart and keyboard behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/complete-copilot-run-result-review
          fetch-depth: 0

      - name: Apply terminal-state, new-version and keyboard corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          copilot_path = Path('taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js')
          copilot = copilot_path.read_text(encoding='utf-8')
          old_terminal = """        const isTerminal = terminal.has(operation.status);
                  const settings = document.getElementById('copilotRunSettings');
                  if (settings) settings.open = !isTerminal;
                  document.getElementById('requirementCopilotCard')?.classList.toggle('copilot-terminal', isTerminal);
                  setControls(!isTerminal);
          """
          new_terminal = """        const isTerminal = terminal.has(operation.status);
                  const resultReady = ['SUCCESS', 'PARTIAL'].includes(status.toUpperCase());
                  const settings = document.getElementById('copilotRunSettings');
                  if (settings) settings.open = !resultReady;
                  document.getElementById('requirementCopilotCard')?.classList.toggle('copilot-terminal', resultReady);
                  setControls(!isTerminal);
          """
          if old_terminal in copilot:
              copilot = copilot.replace(old_terminal, new_terminal, 1)
          elif new_terminal not in copilot:
              raise SystemExit('Copilot terminal-state block not found')

          listener_anchor = """        document.getElementById('copilotRetryStatus')?.addEventListener('click', retryStatusConnection);
                  document.addEventListener('click', interceptDecisionReportExport, true);
          """
          listener_replacement = """        document.getElementById('copilotRetryStatus')?.addEventListener('click', retryStatusConnection);
                  document.addEventListener('taxonomy:requirement-version-created', revealRunSettings);
                  document.addEventListener('click', interceptDecisionReportExport, true);
          """
          if 'taxonomy:requirement-version-created' not in copilot:
              if listener_anchor not in copilot:
                  raise SystemExit('Copilot event-listener insertion point not found')
              copilot = copilot.replace(listener_anchor, listener_replacement, 1)

          function_anchor = """    function showError(error) {
          """
          reveal_function = """    function revealRunSettings() {
                  const settings = document.getElementById('copilotRunSettings');
                  if (settings) settings.open = true;
                  document.getElementById('requirementCopilotCard')
                      ?.classList.remove('copilot-terminal');
              }

          """
          if 'function revealRunSettings()' not in copilot:
              if function_anchor not in copilot:
                  raise SystemExit('Copilot reveal function insertion point not found')
              copilot = copilot.replace(function_anchor, reveal_function + function_anchor, 1)
          copilot_path.write_text(copilot, encoding='utf-8')

          detail_path = Path('taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js')
          detail = detail_path.read_text(encoding='utf-8')
          version_anchor = """            showInfo(t('versionCreated'));
                      await loadAll();
          """
          version_replacement = """            showInfo(t('versionCreated'));
                      await loadAll();
                      document.dispatchEvent(new CustomEvent(
                          'taxonomy:requirement-version-created', {
                              detail: { requirementId: requirementId }
                          }));
          """
          if "document.dispatchEvent(new CustomEvent(\n                    'taxonomy:requirement-version-created'" not in detail:
              if version_anchor not in detail:
                  raise SystemExit('Requirement-version event insertion point not found')
              detail = detail.replace(version_anchor, version_replacement, 1)
          detail_path.write_text(detail, encoding='utf-8')

          contract_path = Path('taxonomy-app/src/test/java/com/taxonomy/portfolio/CompleteCopilotResultUiContractTest.java')
          contract = contract_path.read_text(encoding='utf-8')
          old_contract = """                .contains("settings.open = !isTerminal")
                          .contains("classList.toggle('copilot-terminal', isTerminal)");
          """
          new_contract = """                .contains("const resultReady = ['SUCCESS', 'PARTIAL'].includes(status.toUpperCase())")
                          .contains("settings.open = !resultReady")
                          .contains("classList.toggle('copilot-terminal', resultReady)")
                          .contains("taxonomy:requirement-version-created", "revealRunSettings");
          """
          if old_contract in contract:
              contract = contract.replace(old_contract, new_contract, 1)
          elif 'taxonomy:requirement-version-created' not in contract:
              existing = """                .contains("classList.toggle('copilot-terminal', resultReady)");
          """
              if existing not in contract:
                  raise SystemExit('Complete-result contract insertion point not found')
              contract = contract.replace(existing, new_contract.splitlines()[-1] + '\n', 1)
          contract_path.write_text(contract, encoding='utf-8')

          browser_path = Path('taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java')
          browser = browser_path.read_text(encoding='utf-8')
          cancel_anchor = """        assertThat(driver.findElement(By.id("copilotRun")).isEnabled()).isTrue();
                  return operationId;
          """
          cancel_replacement = """        assertThat(driver.findElement(By.id("copilotRun")).isEnabled()).isTrue();
                  assertThat(driver.findElement(By.id("copilotRunSettings")).getAttribute("open"))
                          .as("run settings stay open after cancellation so a retry remains visible")
                          .isNotNull();
                  return operationId;
          """
          if 'run settings stay open after cancellation' not in browser:
              if cancel_anchor not in browser:
                  raise SystemExit('Cancellation assertion insertion point not found')
              browser = browser.replace(cancel_anchor, cancel_replacement, 1)

          result_anchor = """        wait.until(ExpectedConditions.visibilityOfElementLocated(
                          By.id("snapshotResultOverview")));
          """
          result_replacement = result_anchor + """        assertThat(driver.findElement(By.id("copilotRunSettings")).getAttribute("open"))
                          .as("completed result gives the review surface visual priority")
                          .isNull();
          """
          if 'completed result gives the review surface visual priority' not in browser:
              if result_anchor not in browser:
                  raise SystemExit('Completed-result assertion insertion point not found')
              browser = browser.replace(result_anchor, result_replacement, 1)

          responsive_anchor = """    private static void assertResponsiveAndKeyboardReachable() {
                  driver.manage().window().setSize(new Dimension(390, 844));
          """
          responsive_replacement = """    private static void assertResponsiveAndKeyboardReachable() {
                  openCopilotRunSettings();
                  driver.manage().window().setSize(new Dimension(390, 844));
          """
          if 'private static void assertResponsiveAndKeyboardReachable() {\n        openCopilotRunSettings();' not in browser:
              if responsive_anchor not in browser:
                  raise SystemExit('Responsive assertion insertion point not found')
              browser = browser.replace(responsive_anchor, responsive_replacement, 1)

          helper_anchor = """    private static void assertOneConsolidatedProviderFailure() {
          """
          helper = """    private static void openCopilotRunSettings() {
                  WebElement settings = driver.findElement(By.id("copilotRunSettings"));
                  if (settings.getAttribute("open") != null) return;
                  click(By.cssSelector("#copilotRunSettings > summary"));
                  wait.until(browser -> browser.findElement(By.id("copilotRunSettings"))
                          .getAttribute("open") != null);
              }

          """
          if 'private static void openCopilotRunSettings()' not in browser:
              if helper_anchor not in browser:
                  raise SystemExit('Copilot settings helper insertion point not found')
              browser = browser.replace(helper_anchor, helper + helper_anchor, 1)

          version_ready_anchor = """        wait.until(ExpectedConditions.elementToBeClickable(By.id("copilotRun")));

                  String previousOperationId = driver.findElement(By.id("copilotOperation"))
          """
          version_ready_replacement = """        wait.until(ExpectedConditions.elementToBeClickable(By.id("copilotRun")));
                  assertThat(driver.findElement(By.id("copilotRunSettings")).getAttribute("open"))
                          .as("a new immutable version reveals the controls for its new analysis")
                          .isNotNull();

                  String previousOperationId = driver.findElement(By.id("copilotOperation"))
          """
          if 'a new immutable version reveals the controls for its new analysis' not in browser:
              if version_ready_anchor not in browser:
                  raise SystemExit('New-version rerun assertion insertion point not found')
              browser = browser.replace(version_ready_anchor, version_ready_replacement, 1)
          browser_path.write_text(browser, encoding='utf-8')
          PY

          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          git diff --check

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify focused source contracts
        run: >-
          ./mvnw -B -pl taxonomy-app -am test
          -Dtest=CompleteCopilotResultUiContractTest,RequirementCopilotUiContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify Docker availability
        run: docker info

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Exercise and capture the authoritative complete Copilot session
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=CompleteCopilotSessionIT
          -DgenerateScreenshots=true
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify the real complete-result screenshot
        shell: bash
        run: |
          set -euo pipefail
          image=docs/images/72-complete-copilot-run-result.png
          test -s "$image"
          test "$(wc -c < "$image")" -gt 75000
          file "$image" | grep -F 'PNG image data'
          ! grep -F 'gap.summary || gap.description || JSON.stringify(gap)' \
              taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-copilot-result-v2-evidence
          path: |
            docs/images/72-complete-copilot-run-result.png
            taxonomy-app/target/failsafe-reports/**
            taxonomy-app/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 7

      - name: Publish the verified result surface
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/finalize-complete-copilot-result.yml \
            .github/workflows/finalize-complete-copilot-result-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize complete Copilot result review and restart behavior'
          git push origin HEAD:fix/complete-copilot-run-result-review
