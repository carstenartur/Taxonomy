name: Apply snapshot export browser acceptance patch once

on:
  push:
    branches:
      - fix/snapshot-bound-architecture-exports
    paths:
      - .github/workflows/apply-snapshot-export-browser-test-once.yml

permissions:
  contents: write

concurrency:
  group: apply-snapshot-export-browser-test-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'carstenartur/Taxonomy' && github.actor == 'carstenartur'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Patch only the architecture workbench browser acceptance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java')
          text = path.read_text(encoding='utf-8')

          if 'architectureExportFormat' in text or 'requestTextArtifact(' in text:
              raise SystemExit('browser acceptance appears to be already patched')

          title_start = text.index(
              '        assertThat(driver.findElement(By.id("architectureTitle")).getText())')
          fit_marker = '        fitAndWait();'
          fit_position = text.index(fit_marker, title_start)
          controls = '''        WebElement exportFormat = driver.findElement(
                  By.id("architectureExportFormat"));
              assertThat(exportFormat.isEnabled()).isTrue();
              assertThat(driver.findElement(By.id("downloadArchitectureExport")).isEnabled())
                  .isTrue();
              List<String> exportFormats = exportFormat.findElements(By.tagName("option")).stream()
                  .map(option -> option.getAttribute("value"))
                  .toList();
              assertThat(exportFormats)
                  .containsExactly("json", "svg", "pdf", "archimate", "mermaid", "structurizr")
                  .doesNotContain("visio");

          '''
          text = text[:fit_position] + controls + text[fit_position:]

          exports_start = text.index('        Map<String, Object> svg = requestText(')
          exports_end_marker = '\n\n\n        if (Boolean.getBoolean("generateScreenshots"))'
          exports_end = text.index(exports_end_marker, exports_start)
          exports = '''        String exportBase = "/api/projects/" + projectId
                  + "/architecture-workbench/" + snapshotId + "/exports/";
              Map<String, Object> evidence = requestTextArtifact(
                  exportBase + "json", "application/json");
              Map<String, Object> svg = requestTextArtifact(
                  "/api/projects/" + projectId + "/architecture-workbench/"
                      + snapshotId + ".svg",
                  "image/svg+xml");
              Map<String, Object> pdf = requestBinaryPrefix(
                  "/api/projects/" + projectId + "/architecture-workbench/"
                      + snapshotId + ".pdf");
              Map<String, Object> archiMate = requestTextArtifact(
                  exportBase + "archimate", "application/xml");
              Map<String, Object> mermaid = requestTextArtifact(
                  exportBase + "mermaid", "text/plain");
              Map<String, Object> structurizr = requestTextArtifact(
                  exportBase + "structurizr", "text/plain");

              String graphSha = String.valueOf(evidence.get("graphSha"));
              assertThat(graphSha).hasSize(64);
              for (Map<String, Object> artifact : List.of(
                  evidence, svg, pdf, archiMate, mermaid, structurizr)) {
                  assertThat(number(artifact.get("status"))).isEqualTo(200);
                  assertThat(String.valueOf(artifact.get("snapshotId"))).isEqualTo(snapshotId);
                  assertThat(String.valueOf(artifact.get("graphSha"))).isEqualTo(graphSha);
                  assertThat(String.valueOf(artifact.get("contentSha"))).hasSize(64);
                  assertThat(String.valueOf(artifact.get("profile"))).isNotBlank();
                  assertThat(String.valueOf(artifact.get("role"))).isNotBlank();
              }

              assertThat(String.valueOf(evidence.get("contentType"))).startsWith("application/json");
              assertThat(String.valueOf(evidence.get("role"))).isEqualTo("canonical-evidence");
              assertThat(String.valueOf(evidence.get("text")))
                  .contains(snapshotId)
                  .contains(graphSha)
                  .contains("canonical-evidence")
                  .contains("experimental-model-exchange")
                  .contains("lossy-text-projection");

              assertThat(String.valueOf(svg.get("contentType"))).startsWith("image/svg+xml");
              assertThat(String.valueOf(svg.get("role"))).isEqualTo("stable-human-view");
              assertThat(String.valueOf(svg.get("text")))
                  .contains("<svg")
                  .contains(nodeCode)
                  .doesNotContain("<script")
                  .doesNotContain("Download selected format");

              assertThat(String.valueOf(pdf.get("contentType"))).startsWith("application/pdf");
              assertThat(String.valueOf(pdf.get("role"))).isEqualTo("stable-human-view");
              assertThat(String.valueOf(pdf.get("prefix"))).isEqualTo("%PDF-");
              assertThat(number(pdf.get("length"))).isGreaterThan(500);

              assertThat(String.valueOf(archiMate.get("contentType"))).startsWith("application/xml");
              assertThat(String.valueOf(archiMate.get("role")))
                  .isEqualTo("experimental-model-exchange");
              assertThat(String.valueOf(archiMate.get("text")))
                  .contains("<model")
                  .contains(nodeCode);

              assertThat(String.valueOf(mermaid.get("role"))).isEqualTo("lossy-text-projection");
              assertThat(String.valueOf(mermaid.get("text")))
                  .contains("flowchart")
                  .contains(nodeCode);
              assertThat(String.valueOf(structurizr.get("role")))
                  .isEqualTo("lossy-text-projection");
              assertThat(String.valueOf(structurizr.get("text")))
                  .contains("workspace");'''
          text = text[:exports_start] + exports + text[exports_end:]

          helper_start = text.index(
              '    @SuppressWarnings("unchecked")\n'
              '    private static Map<String, Object> requestText(String path)')
          binary_annotation = (
              '\n\n    @SuppressWarnings("unchecked")\n'
              '    private static Map<String, Object> requestBinaryPrefix')
          helper_end = text.index(binary_annotation, helper_start)
          text_helper = '''    @SuppressWarnings("unchecked")
              private static Map<String, Object> requestTextArtifact(String path, String accept) {
                  return (Map<String, Object>) javascript().executeAsyncScript("""
                      const path = arguments[0];
                      const accept = arguments[1];
                      const done = arguments[arguments.length - 1];
                      fetch(path, {
                          headers: {Accept: accept},
                          credentials: 'same-origin',
                          cache: 'no-store'
                      }).then(async response => done({
                          status: response.status,
                          contentType: response.headers.get('content-type') || '',
                          snapshotId: response.headers.get('x-taxonomy-architecture-snapshot') || '',
                          commitSha: response.headers.get('x-taxonomy-architecture-commit') || '',
                          graphSha: response.headers.get('x-taxonomy-architecture-graph-sha256') || '',
                          profile: response.headers.get('x-taxonomy-export-profile') || '',
                          role: response.headers.get('x-taxonomy-export-role') || '',
                          contentSha: response.headers.get('x-taxonomy-export-content-sha256') || '',
                          text: await response.text()
                      })).catch(error => done({status: 0, error: String(error)}));
                      """, path, accept);
              }'''
          text = text[:helper_start] + text_helper + text[helper_end:]

          binary_start = text.index(
              '    private static Map<String, Object> requestBinaryPrefix')
          binary_end = text.index('\n\n    private static JavascriptExecutor javascript()', binary_start)
          binary_block = text[binary_start:binary_end]
          needle = (
              "contentType: response.headers.get('content-type') || '',\n"
              "                            prefix: prefix,")
          if binary_block.count(needle) != 1:
              raise SystemExit('binary response marker was not found exactly once')
          replacement = (
              "contentType: response.headers.get('content-type') || '',\n"
              "                            snapshotId: response.headers.get('x-taxonomy-architecture-snapshot') || '',\n"
              "                            commitSha: response.headers.get('x-taxonomy-architecture-commit') || '',\n"
              "                            graphSha: response.headers.get('x-taxonomy-architecture-graph-sha256') || '',\n"
              "                            profile: response.headers.get('x-taxonomy-export-profile') || '',\n"
              "                            role: response.headers.get('x-taxonomy-export-role') || '',\n"
              "                            contentSha: response.headers.get('x-taxonomy-export-content-sha256') || '',\n"
              "                            prefix: prefix,")
          binary_block = binary_block.replace(needle, replacement)
          text = text[:binary_start] + binary_block + text[binary_end:]

          for token in ['requestText(', 'downloadArchitectureSvg', 'downloadArchitecturePdf']:
              if token in text:
                  raise SystemExit(f'legacy browser-test token remains: {token}')
          for token in [
              'requestTextArtifact(',
              'x-taxonomy-architecture-graph-sha256',
              'experimental-model-exchange',
              '.doesNotContain("visio")',
          ]:
              if token not in text:
                  raise SystemExit(f'missing browser-test token: {token}')

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check -- taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java
          rm .github/workflows/apply-snapshot-export-browser-test-once.yml

      - name: Commit only the final browser acceptance change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java \
            .github/workflows/apply-snapshot-export-browser-test-once.yml
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/apply-snapshot-export-browser-test-once.yml' \
            'taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java' | sort)
          test "$actual" = "$expected"
          git commit -m "Verify snapshot identity across workbench export formats"
          git push origin "HEAD:${GITHUB_REF_NAME}"
