name: Merged PR review audit

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      since_days:
        description: Number of recent days to audit
        required: false
        default: '35'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: taxonomy-merged-pr-review-audit-${{ github.event_name == 'pull_request_review' && github.event.pull_request.number || 'window' }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit reviews of merged pull requests
    if: github.event_name != 'pull_request_review' || github.event.pull_request.merged_at != null
    # Findings are posted to PR discussions, even though the REST route is
    # /issues/{number}/comments. Grant PR write only to this trusted-code job.
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # pull_request_review uses the PR merge ref for github.sha. Resolve the
          # repository-owned default branch instead, so reviewed code is never run.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install repository-pinned Node runtime
        run: ./mvnw -B -ntp -f .github/ui-verification-pom.xml generate-resources -Pcontracts
      - name: Audit one merged pull request after a review event
        if: github.event_name == 'pull_request_review'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_PR_NUMBER: ${{ github.event.pull_request.number }}
          AUDIT_SINCE_DAYS: '35'
          AUDIT_REVIEWERS: 'copilot-pull-request-reviewer[bot],Copilot'
          AUDIT_COMMENT: 'true'
          AUDIT_FAIL_SEVERITY: 'high'
          AUDIT_OUTPUT_ROOT: target/merged-pr-review-audit
        run: .cache/ui-frontend/node/node .github/scripts/merged-pr-review-audit.mjs
      - name: Collect the retrospective audit window
        if: github.event_name != 'pull_request_review'
        # The collector deliberately exits non-zero when the complete historical
        # report contains high findings. The next step applies the enforceable
        # rollout boundary and fails closed on missing or malformed evidence.
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_PR_NUMBER: ''
          AUDIT_SINCE_DAYS: ${{ inputs.since_days || '35' }}
          AUDIT_REVIEWERS: 'copilot-pull-request-reviewer[bot],Copilot'
          AUDIT_COMMENT: 'false'
          AUDIT_FAIL_SEVERITY: 'high'
          AUDIT_OUTPUT_ROOT: target/merged-pr-review-audit
        run: .cache/ui-frontend/node/node .github/scripts/merged-pr-review-audit.mjs
      - name: Enforce review evidence from the audit rollout onward
        if: always() && github.event_name != 'pull_request_review'
        env:
          AUDIT_PR_NUMBER: ''
          AUDIT_FAIL_SEVERITY: 'high'
          AUDIT_ENFORCE_MERGED_SINCE: '2026-09-02T04:59:06Z'
          AUDIT_REPORT: target/merged-pr-review-audit/audit.json
          AUDIT_ENFORCEMENT_OUTPUT_ROOT: target/merged-pr-review-audit/enforcement
        run: .cache/ui-frontend/node/node .github/scripts/merged-pr-review-enforcement.mjs
      - name: Print review-audit evidence
        if: always()
        run: |
          if [[ -f target/merged-pr-review-audit/audit.md ]]; then
            cat target/merged-pr-review-audit/audit.md
          fi
          if [[ -f target/merged-pr-review-audit/enforcement/enforcement.md ]]; then
            cat target/merged-pr-review-audit/enforcement/enforcement.md
          fi
      - name: Upload review-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: merged-pr-review-audit
          path: target/merged-pr-review-audit/**
          if-no-files-found: error
          retention-days: 90
