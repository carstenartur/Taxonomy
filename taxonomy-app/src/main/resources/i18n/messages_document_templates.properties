document.templates.help.title=Choose the workflow that fits your experience
document.templates.help.edit=Edit template in Word opens the versioned WebDAV resource in the installed Microsoft Word application. Saving in Word creates a new Git version.
document.templates.help.new=New document from template creates a separate Word document without changing the stored template.
document.templates.help.fallback=Recommended for restricted computers: choose Edit locally next to a template, download its fixed starting version, edit in Word and upload on the same page. No WebDAV or application password is required.
document.templates.https.warning=Direct Word editing should use the public HTTPS address of Taxonomy. The current page is not using HTTPS.
document.templates.direct-word.disabled=Direct Word opening is disabled for this authentication profile because desktop Word cannot reuse the browser sign-in. Use Edit locally with the browser sign-in instead; WebDAV remains available for compatible clients.
