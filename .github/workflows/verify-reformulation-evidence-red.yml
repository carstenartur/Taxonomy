name: Reformulation evidence RED

on:
  push:
    branches:
      - verify/reformulation-evidence-red-20260923

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run portable evidence contract
        run: |
          ./mvnw -B -ntp -pl taxonomy-app -am test \
            -Dtest=ReformulationEvidenceRoundTripTest \
            -Dsurefire.failIfNoSpecifiedTests=false
