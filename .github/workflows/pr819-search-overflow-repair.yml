name: Repair PR 819 search overflow

on:
  push:
    branches:
      - agent/630-large-result-release-floor-current
    paths:
      - .github/workflows/pr819-search-overflow-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/630-large-result-release-floor-current
          fetch-depth: 0

      - name: Keep Bootstrap gutters inside the search panel
        shell: bash
        run: |
          set -euo pipefail
          index=taxonomy-app/src/main/resources/templates/index.html
          contract=taxonomy-app/src/test/java/com/taxonomy/ui/TaxonomySearchLargeResultContractTest.java

          old='<div class="row g-2 mb-2">'
          new='<div class="row g-2 mx-0 mb-2">'
          [[ $(grep -Foc "$old" "$index") -ge 1 ]]
          perl -0pi -e 's/(<details id="searchPanel".*?<div class="row) g-2 mb-2"/$1 g-2 mx-0 mb-2"/s' "$index"
          [[ $(grep -Foc "$new" "$index") -eq 1 ]]

          if ! grep -Fq 'searchPanelGuttersStayInsideTheResponsiveContainer' "$contract"; then
            cat > /tmp/search-overflow-contract.txt <<'EOF'
              @Test
              void searchPanelGuttersStayInsideTheResponsiveContainer() throws Exception {
                  Path root = findRepositoryRoot();
                  String index = Files.readString(
                          root.resolve("taxonomy-app/src/main/resources/templates/index.html"),
                          StandardCharsets.UTF_8);
                  int panelStart = index.indexOf("<details id=\"searchPanel\"");
                  int panelEnd = index.indexOf("</details>", panelStart);

                  assertThat(panelStart).isGreaterThanOrEqualTo(0);
                  assertThat(panelEnd).isGreaterThan(panelStart);
                  assertThat(index.substring(panelStart, panelEnd))
                          .contains("<div class=\"row g-2 mx-0 mb-2\">")
                          .doesNotContain("<div class=\"row g-2 mb-2\">");
              }

              private static int count(String value, String needle) {
          EOF
            sed '/^    private static int count(String value, String needle) {/ {
              r /tmp/search-overflow-contract.txt
              d
            }' "$contract" > "$contract.tmp"
            mv "$contract.tmp" "$contract"
          fi

          grep -Fq 'searchPanelGuttersStayInsideTheResponsiveContainer' "$contract"
          git diff --check

      - name: Commit the product fix and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr819-search-overflow-repair.yml
          git add taxonomy-app/src/main/resources/templates/index.html \
                  taxonomy-app/src/test/java/com/taxonomy/ui/TaxonomySearchLargeResultContractTest.java
          git commit -m 'Keep search panel gutters within responsive bounds'
          git push origin HEAD:agent/630-large-result-release-floor-current
