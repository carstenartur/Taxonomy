name: One-shot design-token browser evidence fix

on:
  push:
    branches:
      - qa/issue-623-design-tokens

permissions:
  contents: write

concurrency:
  group: one-shot-design-token-browser-evidence
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-623-design-tokens
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply live semantic-token evidence
        run: python3 .github/scripts/apply-design-token-browser-evidence.py

      - name: Verify syntax, source contract and contrast contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/apply-design-token-browser-evidence.py
          node --check .github/scripts/ui-role-state-flow.mjs
          ./mvnw -B -pl taxonomy-app -am \
            '-Dtest=com.taxonomy.ui.TaxonomyDesignTokenContractTest' \
            -Dsurefire.failIfNoSpecifiedTests=false test
          grep -Fq "architectureContrast.sampleCount === 9" .github/scripts/ui-role-state-flow.mjs
          grep -Fq "missingTokens.length === 0" .github/scripts/ui-role-state-flow.mjs
          git diff --check

      - name: Commit permanent browser evidence correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/ui-role-state-flow.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Measure architecture contrast from semantic CSS tokens'
          git push origin HEAD:qa/issue-623-design-tokens
