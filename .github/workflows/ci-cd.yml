name: CI / CD

on:
  push:
    branches-ignore: [ gh-pages ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify repository version state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test-check-version-state.py
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python3 .github/scripts/check-version-state.py \
              --mode release --tag "${GITHUB_REF_NAME}"
          else
            python3 .github/scripts/check-version-state.py --mode development
          fi

      - name: Verify release and performance-scope contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test-resolve-release-parameters.py
          bash -n .github/scripts/release.sh
          bash -n .github/scripts/install-helm.sh
          bash -n deploy/helm/taxonomy/verify.sh
          python3 .github/scripts/check-release-delivery-contract.py
          python3 .github/scripts/check-observability-performance-scope.py

      - name: Install verified Helm 3.21.0
        env:
          HELM_VERSION: v3.21.0
        shell: bash
        run: bash .github/scripts/install-helm.sh

      - name: Verify Docker availability
        run: docker info

      - name: Validate production Helm chart
        shell: bash
        run: bash deploy/helm/taxonomy/verify.sh target/taxonomy-helm-rendered.yaml

      - name: Detect observability performance changes
        id: observability-performance-scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- \
            observability \
            taxonomy-app/src/test/java/com/taxonomy/ObservabilityContainerIT.java \
            taxonomy-app/src/test/java/com/taxonomy/ObservabilityPerformanceIT.java \
            taxonomy-app/src/test/resources/observability \
            .github/scripts/run-observability-performance.sh \
            docs/dev/OBSERVABILITY_PERFORMANCE.md; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Measure OpenTelemetry performance budget
        if: steps.observability-performance-scope.outputs.run == 'true'
        env:
          TAXONOMY_OBSERVABILITY_PERFORMANCE_ENFORCE: 'true'
        shell: bash
        run: bash .github/scripts/run-observability-performance.sh

      - name: Run the canonical Maven verification suite
        env:
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/bge-small-en-v1.5
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
        shell: bash
        run: |
          mkdir -p target
          set -o pipefail
          ./mvnw -B verify -Pci -DrunOnnxTests=true 2>&1 | tee target/maven-verification.log

      - name: Publish authoritative JUnit results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        continue-on-error: true
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'

      - name: Stage verified reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/quality-reports
          mkdir -p target/quality-reports/tests target/quality-reports/coverage target/quality-reports/evidence
          while IFS= read -r -d '' report; do
            relative=${report#./}
            destination="target/quality-reports/tests/${relative}"
            mkdir -p "$(dirname "$destination")"
            cp "$report" "$destination"
          done < <(find . -type f \
            \( -path '*/target/surefire-reports/*' -o -path '*/target/failsafe-reports/*' \) \
            \( -name 'TEST-*.xml' -o -name '*.txt' -o -name '*.dump' -o -name '*.dumpstream' \) \
            -print0)
          if [ -d taxonomy-coverage/target/site/jacoco-aggregate ]; then
            cp -a taxonomy-coverage/target/site/jacoco-aggregate/. target/quality-reports/coverage/
          fi
          for evidence in \
            target/maven-verification.log \
            target/coverage-gate.txt \
            target/dependency-hygiene-report.txt \
            target/hibernate-search-dependencies.txt \
            target/supply-chain-pins.json \
            target/taxonomy-sbom.json \
            target/taxonomy-sbom.xml \
            target/taxonomy-vex.json \
            target/taxonomy-helm-rendered.yaml; do
            if [ -f "$evidence" ]; then cp "$evidence" target/quality-reports/evidence/; fi
          done
          if [ -d target/observability-performance ]; then
            mkdir -p target/quality-reports/evidence/observability-performance
            cp -a target/observability-performance/. \
              target/quality-reports/evidence/observability-performance/
          fi
          printf 'Verified commit: %s\n' "$GITHUB_SHA" > target/quality-reports/README.txt

      - name: Upload verified reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: quality-reports
          path: target/quality-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload UI verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ui-verification
          path: target/ui-verification/**
          if-no-files-found: warn
          retention-days: 14
