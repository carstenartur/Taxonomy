name: Apply release-notes source reconciliation

on:
  push:
    branches: [docs/reconcile-1.4.0-source-evidence]

permissions:
  contents: write

concurrency:
  group: taxonomy-release-notes-source-reconciliation
  cancel-in-progress: false

jobs:
  apply:
    name: Apply deterministic release-notes reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconcile release notes against current source evidence
        run: node .github/scripts/apply-release-notes-source-reconciliation.mjs
      - name: Remove one-shot apply tooling
        run: |
          rm .github/scripts/apply-release-notes-source-reconciliation.mjs
          rm .github/workflows/apply-release-notes-source-reconciliation.yml
      - name: Verify deterministic diff
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- . ':(exclude)release_notes.md' \
            ':(exclude)taxonomy-build/src/test/java/com/taxonomy/build/ReleaseNotesSourceAlignmentTest.java' \
            ':(exclude).github/scripts/apply-release-notes-source-reconciliation.mjs' \
            ':(exclude).github/workflows/apply-release-notes-source-reconciliation.yml'
          test ! -e .github/scripts/apply-release-notes-source-reconciliation.mjs
          test ! -e .github/workflows/apply-release-notes-source-reconciliation.yml
      - name: Commit against the exact triggering branch head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          TARGET_BRANCH: docs/reconcile-1.4.0-source-evidence
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)
          if [[ "$remote_head" != "$EXPECTED_HEAD" ]]; then
            echo "::error::Branch advanced from $EXPECTED_HEAD to ${remote_head:-missing}; refusing to overwrite it."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release_notes.md \
            taxonomy-build/src/test/java/com/taxonomy/build/ReleaseNotesSourceAlignmentTest.java \
            .github/scripts/apply-release-notes-source-reconciliation.mjs \
            .github/workflows/apply-release-notes-source-reconciliation.yml
          git commit -m 'Reconcile 1.4.0 release notes with source evidence'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
