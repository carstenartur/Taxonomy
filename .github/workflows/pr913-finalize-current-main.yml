name: Finalize PR 913 against current main

on:
  push:
    branches:
      - codex/json-catalogue-overlay
    paths:
      - .github/workflows/pr913-finalize-current-main.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/json-catalogue-overlay
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Finalize exact branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'taxonomy-app/src/main/java/com/taxonomy/analysis/service/LlmService.java';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace(
            /^ {20}addAnalysisWarning\(warnings, root\.getCode\(\), rootDetail\);$/gm,
            '                addAnalysisWarning(warnings, root.getCode(), rootDetail);');
          text = text.replace(
            /^ {12}addAnalysisWarning\(warnings, siblingScope\(nodes\), detail\);$/gm,
            '        addAnalysisWarning(warnings, siblingScope(nodes), detail);');

          const rootWarnings = text.match(/^ {16}addAnalysisWarning\(warnings, root\.getCode\(\), rootDetail\);$/gm) || [];
          const childWarnings = text.match(/^ {8}addAnalysisWarning\(warnings, siblingScope\(nodes\), detail\);$/gm) || [];
          if (rootWarnings.length !== 2 || childWarnings.length !== 2) {
            throw new Error(`unexpected warning propagation shape: roots=${rootWarnings.length}, children=${childWarnings.length}`);
          }
          fs.writeFileSync(path, text);
          NODE

          git rm .github/workflows/pr913-finalize-current-main.yml
          rm -f .github/workflows/pr913-refresh-after-storage.yml
          git diff --check

          ./mvnw -B -ntp -pl taxonomy-app -am \
            -DskipITs \
            -Dtest=CatalogueOverlayServiceTest,LlmServiceBranchCoverageTest,AnalysisApiControllerTest,AnalysisSseEventMapperTest,StreamRequirementAnalysisUseCaseTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: finalize information-product overlay on current main'
          git push origin HEAD:codex/json-catalogue-overlay
