name: Reformulation usage contract

# Supplemental, fast feedback on this incremental branch. Does not replace any
# canonical verification, database, coverage, or security gate.
on:
  push:
    branches: [feature/requirement-reformulation-05-usage]
  pull_request:
    paths:
      - 'taxonomy-analysis/**/LlmTransport*'
      - 'taxonomy-analysis/**/OpenAiCompatibleGateway.java'
      - 'taxonomy-analysis/**/GeminiGateway.java'
      - '.github/workflows/reformulation-usage-contract.yml'

permissions:
  contents: read

concurrency:
  group: usage-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Execute actual transport contract tests
        run: >-
          ./mvnw -B -ntp -pl taxonomy-analysis -am test
          -Dtest=LlmTransportMeterTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Require the intended suite to have executed
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('taxonomy-analysis/target/surefire-reports/TEST-com.taxonomy.analysis.service.LlmTransportMeterTest.xml')
          root = ET.parse(report).getroot()
          tests = int(root.attrib['tests'])
          failures = int(root.attrib.get('failures', '0')) + int(root.attrib.get('errors', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          print(f'Transport contract: {tests} tests, {failures} failures/errors, {skipped} skipped')
          assert tests >= 8 and failures == 0 and skipped == 0
          PY
