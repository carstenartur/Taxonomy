name: One-shot responsive Selenium viewport fix

on:
  push:
    branches:
      - qa/issue-619-responsive-task-navigation

permissions:
  contents: write

concurrency:
  group: one-shot-responsive-selenium-viewport
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-619-responsive-task-navigation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply explicit desktop viewport
        run: python3 .github/scripts/apply-responsive-selenium-viewport.py

      - name: Compile test sources and verify hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/apply-responsive-selenium-viewport.py
          ./mvnw -B -pl taxonomy-app -am -DskipTests test-compile
          git diff --check
          for file in \
            taxonomy-app/src/test/java/com/taxonomy/CoreUiAcceptanceIT.java \
            taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java \
            taxonomy-app/src/test/java/com/taxonomy/PortfolioAnalysisUiDiagnosticIT.java \
            taxonomy-app/src/test/java/com/taxonomy/PortfolioUiAcceptanceIT.java; do
            grep -Fq 'new Dimension(1440, 1000)' "$file"
          done

      - name: Commit permanent test correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taxonomy-app/src/test/java/com/taxonomy/CoreUiAcceptanceIT.java \
            taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java \
            taxonomy-app/src/test/java/com/taxonomy/PortfolioAnalysisUiDiagnosticIT.java \
            taxonomy-app/src/test/java/com/taxonomy/PortfolioUiAcceptanceIT.java
          git diff --cached --quiet && exit 0
          git commit -m 'Run desktop Selenium acceptance at an explicit desktop viewport'
          git push origin HEAD:qa/issue-619-responsive-task-navigation
