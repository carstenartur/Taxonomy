name: Align PR 463 WebJar assets

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-align-pr-463-webjars.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/issue-461-jgit-storage-hibernate
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Restore merged WebJar versions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('taxonomy-app/pom.xml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<artifactId>bootstrap</artifactId>\n            <version>5.3.2</version>':
                  '<artifactId>bootstrap</artifactId>\n            <version>5.3.8</version>',
              '<artifactId>jspdf</artifactId>\n            <version>4.2.0</version>':
                  '<artifactId>jspdf</artifactId>\n            <version>4.2.1</version>',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify resolved browser assets
        run: >-
          ./mvnw -B -pl taxonomy-app -am
          -Dtest=OfflineWebAssetsTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Commit verified alignment and remove this workflow
        run: |
          set -euo pipefail
          rm .github/workflows/temp-align-pr-463-webjars.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taxonomy-app/pom.xml taxonomy-app/src/test/java/com/taxonomy/OfflineWebAssetsTest.java .github/workflows/temp-align-pr-463-webjars.yml
          git commit -m 'Restore WebJar version alignment and package contract'
          git push origin HEAD:fix/issue-461-jgit-storage-hibernate
