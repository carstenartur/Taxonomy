name: One-shot refresh responsive navigation against main

on:
  push:
    branches:
      - qa/issue-619-responsive-task-navigation

permissions:
  contents: write

concurrency:
  group: one-shot-refresh-responsive-main
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-619-responsive-task-navigation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Merge current main and retain both CSS features
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          css='taxonomy-app/src/main/resources/static/css/taxonomy-ergonomics.css'
          git show "HEAD:${css}" > /tmp/responsive-feature.css
          git fetch origin main
          if git merge --no-edit origin/main; then
            exit 0
          fi

          conflicts=$(git diff --name-only --diff-filter=U)
          if [[ "$conflicts" != "$css" ]]; then
            echo 'Unexpected conflicted paths:' >&2
            printf '%s\n' "$conflicts" >&2
            git status --short >&2
            exit 1
          fi

          # Main owns the already merged overlay/accessibility rules. Append the
          # responsive navigation block from this feature branch afterwards.
          git checkout --theirs "$css"
          python3 - <<'PY'
          from pathlib import Path

          target = Path('taxonomy-app/src/main/resources/static/css/taxonomy-ergonomics.css')
          feature = Path('/tmp/responsive-feature.css').read_text(encoding='utf-8')
          marker = '/* Discoverable responsive primary navigation. */'
          if marker not in feature:
              raise SystemExit('Responsive navigation CSS marker is missing from feature side')
          block = feature[feature.index(marker):].strip() + '\n'
          current = target.read_text(encoding='utf-8').rstrip() + '\n'
          if marker not in current:
              current += '\n' + block
          target.write_text(current, encoding='utf-8')
          PY
          git add "$css"
          git commit --no-edit

      - name: Verify responsive contracts and real login after integration
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/ui-role-fixtures.mjs
          node --check .github/scripts/ui-role-state-flow.mjs
          node --check taxonomy-app/src/main/resources/static/js/shared/taxonomy-utils.js
          ./mvnw -B -pl taxonomy-app -am verify \
            -DskipITs=false \
            -Dtest=com.taxonomy.ui.TaxonomyResponsiveNavigationContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=PortfolioUiAcceptanceIT \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -Dtaxonomy.model.download.skip=true \
            -Dtaxonomy.ui.skip=true \
            -Dtaxonomy.quality.skip=true
          git diff --check

      - name: Push integrated branch
        run: git push origin HEAD:qa/issue-619-responsive-task-navigation
