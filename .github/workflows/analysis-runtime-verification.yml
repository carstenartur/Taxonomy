name: Export exact analysis review source (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7bada07047ad49f2f15428b3236111e535145483
          persist-credentials: false
          fetch-depth: 1
      - name: Export immutable source without build output or credentials
        run: |
          test "$(git rev-parse HEAD)" = 7bada07047ad49f2f15428b3236111e535145483
          test "$(git rev-parse HEAD^{tree})" = f1ff619755ed2ee368183ba9935b58c06f714efd
          mkdir -p /tmp/analysis-source
          git archive --format=tar HEAD > /tmp/analysis-source/source.tar
          git rev-parse HEAD HEAD^{tree} > /tmp/analysis-source/identity.txt
          sha256sum /tmp/analysis-source/source.tar > /tmp/analysis-source/source.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analysis-source-7bada070
          path: /tmp/analysis-source
          retention-days: 7
          if-no-files-found: error
