name: Temporary jgit-storage 0.9.1 schema adaptation

on:
  push:
    branches:
      - compat/jgit-storage-0.9.1-reflog-key

permissions:
  contents: write

concurrency:
  group: temporary-jgit-storage-091-schema-adaptation
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adaptation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: compat/jgit-storage-0.9.1-reflog-key
          fetch-depth: 0

      - name: Apply exact schema adaptation
        run: python3 .github/scripts/apply-jgit-storage-091-schema-adaptation.py

      - name: Commit the adaptation and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply-jgit-storage-091-schema-adaptation.py
          rm .github/workflows/temporary-adapt-jgit-storage-091.yml
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Accept exact Core 0.9.1 reflog-key schemas'
          git push origin HEAD:compat/jgit-storage-0.9.1-reflog-key
