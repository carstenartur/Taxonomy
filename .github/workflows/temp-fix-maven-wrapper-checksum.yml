name: Repair Maven wrapper checksum

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-fix-maven-wrapper-checksum.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/issue-461-jgit-storage-hibernate
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Derive checksum from the verified Apache distribution
        run: |
          set -euo pipefail
          properties=.mvn/wrapper/maven-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' "$properties")
          test -n "$url"
          curl --fail --location --retry 4 --output /tmp/apache-maven-bin.zip "$url"
          expected_sha512=ed41650d42485cfc243fad22158caf9cbb5dc408ce7a09ddb94dd42a019de929ca43065bfa450612cf12bf78b5cafa3884b96c090de326ff590448c933454af3
          echo "$expected_sha512  /tmp/apache-maven-bin.zip" | sha512sum --check --strict
          sha256=$(sha256sum /tmp/apache-maven-bin.zip | cut -d' ' -f1)
          python3 - "$properties" "$sha256" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          sha256 = sys.argv[2]
          lines = path.read_text(encoding='utf-8').splitlines()
          replaced = False
          result = []
          for line in lines:
              if line.startswith('distributionSha256Sum='):
                  result.append(f'distributionSha256Sum={sha256}')
                  replaced = True
              else:
                  result.append(line)
          if not replaced:
              result.append(f'distributionSha256Sum={sha256}')
          path.write_text('\n'.join(result) + '\n', encoding='utf-8')
          PY
          grep '^distributionSha256Sum=' "$properties"
      - name: Verify the checked-in wrapper
        run: ./mvnw --version
      - name: Verify credential-free source container build
        run: docker build --progress=plain --target build -t taxonomy-source-build-check .
      - name: Commit verified checksum
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .mvn/wrapper/maven-wrapper.properties
          git commit -m 'Correct Maven 3.9.16 wrapper distribution checksum'
          git push origin HEAD:fix/issue-461-jgit-storage-hibernate
