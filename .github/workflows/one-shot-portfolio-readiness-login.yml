name: One-shot portfolio readiness login

on:
  push:
    branches:
      - qa/issue-619-responsive-task-navigation

permissions:
  contents: write

concurrency:
  group: one-shot-portfolio-readiness-login
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-619-responsive-task-navigation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply readiness-backed login correction
        run: python3 .github/scripts/apply-portfolio-readiness-login.py

      - name: Verify source contract and real portfolio browser login
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/apply-portfolio-readiness-login.py
          ./mvnw -B -pl taxonomy-app -am verify \
            -DskipITs=false \
            -Dtest=com.taxonomy.ui.TaxonomyResponsiveNavigationContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=PortfolioUiAcceptanceIT \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -Dtaxonomy.model.download.skip=true \
            -Dtaxonomy.ui.skip=true \
            -Dtaxonomy.quality.skip=true
          git diff --check

      - name: Commit permanent readiness correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/test/java/com/taxonomy/ContainerTestUtils.java \
            taxonomy-app/src/test/java/com/taxonomy/PortfolioUiAcceptanceIT.java \
            taxonomy-app/src/test/java/com/taxonomy/ui/TaxonomyResponsiveNavigationContractTest.java
          git diff --cached --quiet && exit 0
          git commit -m 'Wait for readiness before portfolio browser authentication'
          git push origin HEAD:qa/issue-619-responsive-task-navigation
