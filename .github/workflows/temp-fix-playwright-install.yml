name: Fix Playwright dependency installation

on:
  push:
    branches:
      - fix/issue-461-jgit-storage-hibernate
    paths:
      - '.github/workflows/temp-fix-playwright-install.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/issue-461-jgit-storage-hibernate
          fetch-depth: 0
      - name: Forward Playwright arguments through npm exec
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path('pom.xml')
          text = path.read_text(encoding='utf-8')
          old = '<taxonomy.playwright.install.arguments>exec playwright install --with-deps chromium firefox webkit</taxonomy.playwright.install.arguments>'
          new = '<taxonomy.playwright.install.arguments>exec -- playwright install --with-deps chromium firefox webkit</taxonomy.playwright.install.arguments>'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one Playwright install argument property')
          path.write_text(text.replace(old, new), encoding='utf-8')
          ET.parse(path)
          PY
          python3 -m json.tool .github/ui-acceptance-matrix.json >/dev/null
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml .github/ui-acceptance-matrix.json
          git commit -m 'build: install Playwright browser dependencies correctly'
          git push origin HEAD:fix/issue-461-jgit-storage-hibernate
