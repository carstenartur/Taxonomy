name: PR1054 support ownership direct probe
on:
  push:
    branches: [verify/pr1054-support-ownership]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '21'
          distribution: temurin
      - name: Compile and execute pure graph counterexample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr1054-probe/com/taxonomy /tmp/pr1054-classes
          cat > /tmp/pr1054-probe/com/taxonomy/SupportOwnershipProbe.java <<'JAVA'
          package com.taxonomy;
          import java.util.List;
          import java.util.Set;
          public final class SupportOwnershipProbe {
            private static final String APP = "taxonomy-app";
            private static final String FEATURE = "taxonomy-a";
            private static final String SUPPORT = "taxonomy-domain";
            private static final ArchitectureModuleGraph.Policy POLICY = new ArchitectureModuleGraph.Policy(
                APP, Set.of("AppConfig.java"), List.of(
                  new ArchitectureModuleGraph.Context("a", FEATURE, List.of("com.taxonomy.a..")),
                  new ArchitectureModuleGraph.Context("composition", APP, List.of("com.taxonomy.composition..", "com.taxonomy.shared.."))));
            public static void main(String[] args) {
              var misplaced = ArchitectureModuleGraph.evaluate(POLICY, Set.of(SUPPORT), Set.of(FEATURE, SUPPORT),
                  List.of(new ArchitectureModuleGraph.ClassOwner("com.taxonomy.a.Service", FEATURE, "Service.java"),
                          new ArchitectureModuleGraph.ClassOwner("com.taxonomy.a.Other", SUPPORT, "Other.java")), List.of());
              boolean rejected = misplaced.violations().stream().anyMatch(v -> v.contains("com.taxonomy.a.Other")
                  && v.contains(SUPPORT) && v.contains("planned owner is " + FEATURE));
              if (!rejected) throw new AssertionError("feature-context class in support module was accepted: " + misplaced.violations());
              var shared = ArchitectureModuleGraph.evaluate(POLICY, Set.of(SUPPORT), Set.of(FEATURE, SUPPORT),
                  List.of(new ArchitectureModuleGraph.ClassOwner("com.taxonomy.a.Service", FEATURE, "Service.java"),
                          new ArchitectureModuleGraph.ClassOwner("com.taxonomy.shared.Contract", SUPPORT, "Contract.java")), List.of());
              if (!shared.violations().isEmpty()) throw new AssertionError("shared support class must remain allowed: " + shared.violations());
            }
          }
          JAVA
          javac -d /tmp/pr1054-classes taxonomy-build/src/test/java/com/taxonomy/ArchitectureModuleGraph.java /tmp/pr1054-probe/com/taxonomy/SupportOwnershipProbe.java
          java -cp /tmp/pr1054-classes com.taxonomy.SupportOwnershipProbe
