name: Reformulation usage contract

# Supplemental regression verification; canonical full-reactor gates stay required.
on:
  pull_request:
    paths:
      - 'taxonomy-analysis/**'
      - 'taxonomy-portfolio/**'
      - 'taxonomy-app/**'
      - '.github/workflows/reformulation-usage-contract.yml'

permissions:
  contents: read

concurrency:
  group: usage-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run all analysis and upstream unit tests
        run: |
          set +e
          ./mvnw -B -ntp -pl taxonomy-analysis -am test > usage-tests.log 2>&1
          result=$?
          tail -n 100 usage-tests.log
          exit "$result"
      - name: Require the intended suites to have executed
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          suites = {'service.LlmTransportMeterTest': 8, 'service.LlmTransportMeterBoundaryTest': 6, 'service.LlmDurableTransportTest': 3,
                    'reformulation.ParallelReformulationMeterTest': 1}
          errors = 0
          for name, minimum in suites.items():
              report = Path(f'taxonomy-analysis/target/surefire-reports/TEST-com.taxonomy.analysis.{name}.xml')
              root = ET.parse(report).getroot()
              tests = int(root.attrib['tests'])
              failed = int(root.attrib.get('failures', '0')) + int(root.attrib.get('errors', '0'))
              skipped = int(root.attrib.get('skipped', '0'))
              print(f'{name}: {tests} tests, {failed} failures/errors, {skipped} skipped')
              errors += int(tests < minimum or failed != 0 or skipped != 0)
          assert errors == 0
          PY
      - name: Verify durable per-run accounting and existing architecture boundaries
        run: |
          set +e
          ./mvnw -B -ntp -pl taxonomy-app -am test \
            -Dtest=ReformulationUsageBoundaryTest,ReformulationUsageTest,ReformulationUsageWorkerTest,ArchitectureContextDependencyRatchetTest \
            -Dsurefire.failIfNoSpecifiedTests=false > usage-persistence-tests.log 2>&1
          result=$?
          tail -n 100 usage-persistence-tests.log
          exit "$result"
      - name: Require persistence suites and positive test counts
        if: always()
        run: |
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          suites = [('taxonomy-portfolio', 'com.taxonomy.portfolio.reformulation.ReformulationUsageBoundaryTest', 3),
                    ('taxonomy-app', 'com.taxonomy.portfolio.reformulation.ReformulationUsageTest', 1),
                    ('taxonomy-app', 'com.taxonomy.portfolio.reformulation.ReformulationUsageWorkerTest', 2)]
          for module, name, count in suites:
              root = ET.parse(Path(module) / 'target/surefire-reports' / f'TEST-{name}.xml').getroot()
              print(name, root.attrib)
              assert int(root.attrib['tests']) >= count
              assert all(int(root.attrib.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped'))
          PYTEST
      - name: Archive the tested public source tree
        if: always()
        run: git archive --format=zip -o usage-source.zip HEAD
      - name: Preserve actual reports and source identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: usage-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            usage-tests.log
            usage-persistence-tests.log
            usage-source.zip
            taxonomy-*/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
