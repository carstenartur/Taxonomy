name: Verify owner POM boundary (temporary)
on:
  push:
    branches: [verify/628-boundary-regressions-20260916]
    paths: [.github/workflows/628-owner-pom-verification.yml, .github/scripts/build-pom-boundary-review.py]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: harness, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a690921d849fc8da58b509b105d4c31ec20647bd
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Add counterexamples with behavior-preserving explicit-root test seam
        run: |
          mkdir -p /tmp/628-owner-pom
          python harness/.github/scripts/build-pom-boundary-review.py tests candidate
          git -C candidate diff --check
      - name: Execute the current unsafe read and valid-alias controls
        working-directory: candidate
        run: |
          set +e
          ./mvnw -B -ntp -pl taxonomy-build -am test '-Dtest=ArchitectureModuleGraphTest#ownerPom*' -Dsurefire.failIfNoSpecifiedTests=false > /tmp/628-owner-pom/red.log 2>&1
          result=$?
          cp taxonomy-build/target/surefire-reports/TEST-com.taxonomy.ArchitectureModuleGraphTest.xml /tmp/628-owner-pom/red.xml
          tail -45 /tmp/628-owner-pom/red.log
          test "$result" -eq 1
      - name: Require two behavior failures and two passing controls
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/628-owner-pom/red.xml').getroot()
          counts={k:int(root.get(k,'0')) for k in ('tests','failures','errors','skipped')}
          assert counts=={'tests':4,'failures':2,'errors':0,'skipped':0},counts
          print(counts)
      - name: Correct the real-path boundary and run every affected guard
        working-directory: candidate
        run: |
          set -o pipefail
          python ../harness/.github/scripts/build-pom-boundary-review.py patch .
          ./mvnw -B -ntp test '-Dtest=ArchitectureModuleGraphTest,ArchitectureModuleExtractionTest,ArchitectureSelectorSynchronizationTest,ArchitectureExceptionLedgerTest' -Dsurefire.failIfNoSpecifiedTests=false > /tmp/628-owner-pom/green.log 2>&1 || { tail -140 /tmp/628-owner-pom/green.log; exit 1; }
          tail -35 /tmp/628-owner-pom/green.log
      - name: Inspect actual reports, not just a successful Maven exit
        shell: python
        run: |
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          suites={}
          for path in Path('candidate').glob('**/target/surefire-reports/TEST-*.xml'):
              root=ET.parse(path).getroot()
              counts={k:int(root.get(k,'0')) for k in ('tests','failures','errors','skipped')}
              assert counts['failures']==counts['errors']==counts['skipped']==0,(path,counts)
              suites[root.get('name')]=counts
          assert len(suites)==4,suites
          assert suites['com.taxonomy.ArchitectureModuleGraphTest']['tests']==131,suites
          assert suites['com.taxonomy.ArchitectureExceptionLedgerTest']['tests']==6,suites
          Path('/tmp/628-owner-pom/green-counts.json').write_text(json.dumps(suites,indent=2)+'\n')
          print(suites)
      - name: Publish verified source and native candidate identities without changing PR heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python harness/.github/scripts/build-pom-boundary-review.py publish-candidates candidate /tmp/628-owner-pom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: owner-pom-boundary-evidence
          path: |
            /tmp/628-owner-pom
            candidate/**/target/surefire-reports/TEST-*.xml
          retention-days: 7
          if-no-files-found: error
