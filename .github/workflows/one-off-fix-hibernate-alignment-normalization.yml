name: One-off fix Hibernate alignment normalization

on:
  push:
    branches:
      - qa/685-build-review-backlog
    paths:
      - .github/workflows/one-off-fix-hibernate-alignment-normalization.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/685-build-review-backlog
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Preserve normalized policy parameters
        shell: bash
        run: |
          set -euo pipefail
          policy=taxonomy-build/src/test/java/com/taxonomy/build/HibernateSearchAlignmentPolicy.java
          workflow=.github/workflows/one-off-fix-hibernate-alignment-normalization.yml

          test "$(grep -Fc 'requireText(expectedSearchVersion, "expectedSearchVersion");' "$policy")" -eq 1
          test "$(grep -Fc 'requireText(expectedOrmPrefix, "expectedOrmPrefix");' "$policy")" -eq 1
          test "$(grep -Fc 'requireText(expectedLuceneVersion, "expectedLuceneVersion");' "$policy")" -eq 1

          perl -0pi -e 's/requireText\(expectedSearchVersion, "expectedSearchVersion"\);/expectedSearchVersion = requireText(expectedSearchVersion, "expectedSearchVersion");/' "$policy"
          perl -0pi -e 's/requireText\(expectedOrmPrefix, "expectedOrmPrefix"\);/expectedOrmPrefix = requireText(expectedOrmPrefix, "expectedOrmPrefix");/' "$policy"
          perl -0pi -e 's/requireText\(expectedLuceneVersion, "expectedLuceneVersion"\);/expectedLuceneVersion = requireText(expectedLuceneVersion, "expectedLuceneVersion");/' "$policy"

          rm "$workflow"
          git diff --check

          ./mvnw -B -pl taxonomy-build -am \
            -DskipITs \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=HibernateSearchAlignmentPolicyTest,HibernateSearchAlignmentWhitespaceTest \
            test

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$policy" "$workflow"
          git commit -m 'fix(build): retain normalized Hibernate alignment versions'
          git push origin HEAD:qa/685-build-review-backlog
