name: Final analysis frontend preflight (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7bada07047ad49f2f15428b3236111e535145483
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Assemble final candidate and prove unchanged Java source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          out=Path('/tmp/analysis-final');out.mkdir()
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          for i,sha in enumerate(['a7f7dfa2ee0c2593cf7f3d52836646f6b747867f','e7b94cef8c93fd335c634fbcce15772f37226b29','7fe586d8ec20eead69e11f941dd38b47de232918']):
              with urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs/'+sha,headers=headers)) as response: data=base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              data=data.replace(b'\n diff --git ',b'\ndiff --git ')
              patch=out/(str(i)+'.patch');patch.write_bytes(data)
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              subprocess.run(['git','apply',str(patch)],check=True)
              if i==1:
                  subprocess.run(['git','add','-u'],check=True)
                  assert git('write-tree')=='4f163fcca94f7330a5bf03420f5943406238d2d0'
                  java={p:git('hash-object',p) for p in git('diff','--cached','--name-only').splitlines() if p.endswith('.java')}
          assert all(git('hash-object',p)==sha for p,sha in java.items())
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','-u'],check=True)
          tree=git('write-tree');assert tree=='274e4fd7e2ae30dcf4ad6a01a65048b04ba615f2',tree
          paths=git('diff','--cached','--name-only').splitlines();assert len(paths)==9
          files={p:git('hash-object',p) for p in paths}
          (out/'manifest.json').write_text(json.dumps({'base':git('rev-parse','HEAD'),'tree':tree,'files':files,'javaSourcePreflightRun':35032701025,'run':os.environ['GITHUB_RUN_ID']},indent=2)+'\n')
      - name: Complete Maven-owned frontend and strict bootstrap contracts
        run: |
          set -o pipefail
          ./mvnw -B -ntp -f .github/ui-verification-pom.xml verify -Pcontracts 2>&1 | tee /tmp/analysis-final/frontend.log
          node .github/scripts/test-taxonomy-base-path.mjs | tee /tmp/analysis-final/base-path.log
      - name: Publish final source blobs only, not refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,json,os,subprocess,urllib.request,zipfile
          from pathlib import Path
          out=Path('/tmp/analysis-final');manifest=json.loads((out/'manifest.json').read_text())
          with zipfile.ZipFile(out/'tested-sources.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path,sha in manifest['files'].items():
                  content=Path(path).read_bytes();assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha
                  request=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs',
                      data=json.dumps({'content':base64.b64encode(content).decode(),'encoding':'base64'}).encode(),
                      headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
                  with urllib.request.urlopen(request) as response: assert json.load(response)['sha']==sha
                  archive.writestr(path,content)
          assert subprocess.check_output(['git','diff','--name-only'],text=True).strip()==''
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: analysis-final-frontend-${{ github.sha }}
          path: /tmp/analysis-final
          retention-days: 7
          if-no-files-found: error
