name: Complete analysis candidate preflight (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7bada07047ad49f2f15428b3236111e535145483
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Assemble immutable final candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          out=Path('/tmp/analysis-complete');out.mkdir()
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')=='7bada07047ad49f2f15428b3236111e535145483'
          for i,sha in enumerate(['a7f7dfa2ee0c2593cf7f3d52836646f6b747867f','e7b94cef8c93fd335c634fbcce15772f37226b29','7fe586d8ec20eead69e11f941dd38b47de232918']):
              with urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs/'+sha,headers=headers)) as response: data=base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              patch=out/(str(i)+'.patch');patch.write_bytes(data.replace(b'\n diff --git ',b'\ndiff --git '))
              subprocess.run(['git','apply','--check',str(patch)],check=True)
              subprocess.run(['git','apply',str(patch)],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','-u'],check=True)
          tree=git('write-tree');assert tree=='274e4fd7e2ae30dcf4ad6a01a65048b04ba615f2',tree
          paths=git('diff','--cached','--name-only').splitlines();assert len(paths)==9
          (out/'manifest.json').write_text(json.dumps({'base':git('rev-parse','HEAD'),'tree':tree,'files':{p:git('hash-object',p) for p in paths},'run':os.environ['GITHUB_RUN_ID']},indent=2)+'\n')
      - name: Restore canonical pinned embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: models/bge-small-en-v1.5
          key: ${{ runner.os }}-taxonomy-bge-small-en-v1.5-${{ hashFiles('.github/scripts/download-embedding-model.sh') }}
      - name: Complete reactor unit tests including ONNX
        env:
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/bge-small-en-v1.5
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
        run: |
          set -o pipefail
          ./mvnw -B -ntp test -Pci -DrunOnnxTests=true -DexcludedGroups=real-llm 2>&1 | tee /tmp/analysis-complete/reactor-unit.log
      - name: Complete Maven-owned frontend and strict bootstrap contracts
        run: |
          set -o pipefail
          ./mvnw -B -ntp -f .github/ui-verification-pom.xml verify -Pcontracts 2>&1 | tee /tmp/analysis-complete/frontend.log
          node .github/scripts/test-taxonomy-base-path.mjs | tee /tmp/analysis-complete/base-path.log
      - name: Verify source identity after all tests
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          doc=json.loads(Path('/tmp/analysis-complete/manifest.json').read_text())
          for path,sha in doc['files'].items(): assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          assert subprocess.check_output(['git','diff','--name-only'],text=True).strip()==''
          assert subprocess.check_output(['git','write-tree'],text=True).strip()==doc['tree']
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: analysis-complete-preflight-${{ github.sha }}
          path: |
            /tmp/analysis-complete
            **/target/surefire-reports/TEST-*.xml
          retention-days: 7
          if-no-files-found: error
