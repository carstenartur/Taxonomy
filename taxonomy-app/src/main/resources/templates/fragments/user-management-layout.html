<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{users.title} + ' — Taxonomy'">User management — Taxonomy</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/taxonomy.css}"/>
    <link rel="stylesheet" th:href="@{/css/taxonomy-ergonomics.css}"/>
    <th:block th:replace="~{fragments/application-chrome :: styles}"></th:block>
    <th:block th:replace="~{fragments/context-help :: styles}"></th:block>
    <th:block th:replace="~{fragments/customer-stylesheet :: link}"></th:block>
</head>
<body>
<th:block th:fragment="navigation">
    <a class="skip-link" href="#userManagementMain" th:text="#{users.skip}">Skip to user management</a>
    <nav th:replace="~{fragments/application-chrome :: navigation('admin', ~{:: localActions}, 'SECURITY', 'user-management')}">
        <th:block th:fragment="localActions"><div>
            <a id="userManagementHome" class="btn btn-outline-light" th:href="@{/admin/users(lang=${#locale.language})}"
               th:text="#{users.title}">User management</a>
            <a class="btn btn-outline-light" th:href="@{/(lang=${#locale.language})}"
               th:text="#{users.back}">Back to application</a>
        </div></th:block>
    </nav>
    <script th:src="@{/js/taxonomy-i18n.js}"></script>
    <th:block th:replace="~{fragments/application-chrome :: navigationScript}"></th:block>
</th:block>
<div th:fragment="feedback">
    <div th:if="${errorKey}" class="alert alert-danger" role="alert"
         th:text="${#messages.msg(errorKey)}"></div>
    <div th:if="${successKey}" class="alert alert-success" role="status" aria-live="polite"
         th:text="${#messages.msg(successKey)}"></div>
</div>
</body>
</html>
