name: One-shot aggregate coverage ratchet

on:
  push:
    branches:
      - qa/issue-641-coverage-ratchet

permissions:
  contents: write

concurrency:
  group: one-shot-coverage-ratchet
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-641-coverage-ratchet
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply multi-counter coverage policy
        run: python3 .github/scripts/apply-coverage-ratchet.py

      - name: Verify policy, script contracts and Maven model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/apply-coverage-ratchet.py \
            .github/scripts/check-coverage.py \
            .github/scripts/test-check-coverage.py
          python3 .github/scripts/test-check-coverage.py
          python3 - <<'PY'
          from pathlib import Path
          counters = ''.join(
              f'<counter type="{name}" missed="5" covered="95"/>'
              for name in ('INSTRUCTION', 'LINE', 'BRANCH', 'METHOD', 'CLASS'))
          groups = ''.join(
              f'<group name="{name}">{counters}</group>'
              for name in (
                  'taxonomy-domain', 'taxonomy-dsl', 'taxonomy-export',
                  'taxonomy-extension-api', 'taxonomy-app'))
          Path('target').mkdir(exist_ok=True)
          Path('target/coverage-fixture.xml').write_text(
              f'<report name="fixture">{groups}{counters}</report>', encoding='utf-8')
          PY
          python3 .github/scripts/check-coverage.py \
            --xml target/coverage-fixture.xml \
            --policy .github/coverage-policy.json \
            --report target/coverage-fixture.txt
          grep -Fq 'BRANCH: 95.00%' target/coverage-fixture.txt
          grep -Fq 'CLASS: 95.00%' target/coverage-fixture.txt
          ./mvnw -B -pl taxonomy-build -am \
            -DskipTests -DskipITs=true \
            -Dtaxonomy.ui.skip=true -Dtaxonomy.quality.skip=true validate
          git diff --check

      - name: Commit permanent coverage ratchet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/coverage-policy.json \
            .github/scripts/check-coverage.py \
            .github/scripts/test-check-coverage.py \
            docs/dev/REACTOR_COVERAGE.md \
            taxonomy-build/pom.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce a versioned aggregate branch-coverage ratchet'
          git push origin HEAD:qa/issue-641-coverage-ratchet
