sessions.unidentified=Sessions with unsupported identity types (not included in the identified user count)
sessions.truncated=Only the first 200 user rows are displayed. Counts include all registered sessions in this instance.
sessions.empty=No browser sessions are registered in this instance.
sessions.authentication=Sign-in type
sessions.oidc=OIDC browser sign-in
sessions.local=Local browser sign-in
sessions.lastRequest=Last registered request (UTC)
sessions.privacy=Read-only administrator view. No session IDs, passwords, tokens, IP addresses or separate email attributes are exposed. A displayed sign-in name may itself be an email address. Names are not exported as telemetry labels. Separate identities can have the same display name.
