name: Resolve addressed PR 913 review

on:
  push:
    branches:
      - codex/json-catalogue-overlay
    paths:
      - .github/workflows/pr913-resolve-review.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/json-catalogue-overlay
          fetch-depth: 0
      - name: Reply to and resolve addressed label review
        shell: bash
        run: |
          set -euo pipefail
          gh api graphql -f query='query {
            repository(owner: "carstenartur", name: "Taxonomy") {
              pullRequest(number: 913) {
                reviewThreads(first: 100) {
                  nodes {
                    id
                    isResolved
                    path
                    comments(first: 20) { nodes { body } }
                  }
                }
              }
            }
          }' > /tmp/threads.json

          mapfile -t threads < <(jq -r '
            .data.repository.pullRequest.reviewThreads.nodes[]
            | select(.isResolved == false)
            | select(
                (.path | test("messages(_de)?\\.properties$"))
                or ([.comments.nodes[].body] | join(" ")
                    | test("mappingReview\\.(status\\.rejected|badge\\.reviewPending)"; "i"))
              )
            | .id' /tmp/threads.json)

          for thread in "${threads[@]}"; do
            gh api graphql \
              -f threadId="$thread" \
              -f body='Behoben: Die Status- und Prüfkennzeichnungen sind jetzt sprachlich eindeutig und in Englisch und Deutsch konsistent (`Rejected`/`Abgelehnt`, `Review required`/`Prüfung erforderlich`).' \
              -f query='mutation($threadId: ID!, $body: String!) {
                addPullRequestReviewThreadReply(input: {
                  pullRequestReviewThreadId: $threadId,
                  body: $body
                }) { comment { id } }
              }' >/dev/null
            gh api graphql \
              -f threadId="$thread" \
              -f query='mutation($threadId: ID!) {
                resolveReviewThread(input: {threadId: $threadId}) {
                  thread { id isResolved }
                }
              }' >/dev/null
          done

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr913-resolve-review.yml
          git commit -m 'ci: remove temporary PR 913 review workflow'
          git push origin HEAD:codex/json-catalogue-overlay
