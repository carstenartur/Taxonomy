name: Analysis exact source snapshot (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8620c8856f8b417c688b72aa522591ae73219c29
          persist-credentials: false
      - name: Export exact tracked source only (not a test result)
        run: |
          test "$(git rev-parse HEAD)" = 8620c8856f8b417c688b72aa522591ae73219c29
          test -z "$(git status --porcelain)"
          git archive --format=zip HEAD -o /tmp/taxonomy-source-8620c885.zip
          git rev-parse HEAD HEAD^{tree} > /tmp/source-identity.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: taxonomy-exact-source-8620c885
          path: |
            /tmp/taxonomy-source-8620c885.zip
            /tmp/source-identity.txt
          retention-days: 1
          if-no-files-found: error
