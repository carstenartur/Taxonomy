name: CI / CD

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify repository version state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test-check-version-state.py
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            python3 .github/scripts/check-version-state.py \
              --mode release --tag "${GITHUB_REF_NAME}"
          else
            python3 .github/scripts/check-version-state.py --mode development
          fi

      - name: Verify release and delivery contracts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test-resolve-release-parameters.py
          python3 .github/scripts/test-check-release-plan.py
          python3 .github/scripts/test-generate-quality-site.py
          python3 .github/scripts/test-verify-quality-publication.py
          python3 .github/scripts/test-verify-deployment.py
          python3 .github/scripts/test-check-frontend-api-boundary.py
          node .github/scripts/test-taxonomy-base-path.mjs
          bash -n .github/scripts/release.sh
          bash -n .github/scripts/install-helm.sh
          bash -n .github/scripts/download-embedding-model.sh
          bash -n deploy/helm/taxonomy/verify.sh
          python3 .github/scripts/check-release-delivery-contract.py
          python3 .github/scripts/check-delivery-hardening.py
          python3 .github/scripts/check-observability-performance-scope.py

          frontend_base="${PR_BASE_SHA:-HEAD^}"
          python3 .github/scripts/check-frontend-api-boundary.py --base-ref "$frontend_base"

          current_version=$(./mvnw -q -DforceStdout help:evaluate \
            -Dexpression=project.version)
          if [[ "$current_version" == *-SNAPSHOT ]]; then
            release_version=${current_version%-SNAPSHOT}
            IFS='.' read -r major minor patch <<< "$release_version"
            next_version="${major}.${minor}.$((patch + 1))-SNAPSHOT"
            ./mvnw -B -Prelease-check validate \
              -DreleaseVersion="$release_version" \
              -DnextDevelopmentVersion="$next_version"
          fi

      - name: Install verified Helm 3.21.0
        env:
          HELM_VERSION: v3.21.0
        shell: bash
        run: bash .github/scripts/install-helm.sh

      - name: Verify Docker availability
        run: docker info

      - name: Validate production and Rancher Helm profiles
        shell: bash
        run: bash deploy/helm/taxonomy/verify.sh target/taxonomy-helm-rendered.yaml

      - name: Detect performance-sensitive changes
        id: observability-performance-scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- \
            pom.xml \
            Dockerfile \
            taxonomy-app/pom.xml \
            taxonomy-app/src/main \
            ':(exclude)taxonomy-app/src/main/resources/static/**' \
            ':(exclude)taxonomy-app/src/main/resources/templates/**' \
            taxonomy-app/src/test/java/com/taxonomy/ObservabilityContainerIT.java \
            taxonomy-app/src/test/java/com/taxonomy/ObservabilityPerformanceIT.java \
            taxonomy-app/src/test/resources/observability \
            observability \
            .github/scripts/run-observability-performance.sh \
            docs/dev/OBSERVABILITY_PERFORMANCE.md; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Measure OpenTelemetry performance budget
        if: github.event_name != 'pull_request' || steps.observability-performance-scope.outputs.run == 'true'
        env:
          TAXONOMY_OBSERVABILITY_PERFORMANCE_ENFORCE: 'true'
        shell: bash
        run: bash .github/scripts/run-observability-performance.sh

      - name: Restore pinned embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: models/bge-small-en-v1.5
          key: ${{ runner.os }}-taxonomy-bge-small-en-v1.5-${{ hashFiles('.github/scripts/download-embedding-model.sh') }}

      - name: Run the canonical Maven verification suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/bge-small-en-v1.5
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
        shell: bash
        run: |
          mkdir -p target
          set -o pipefail
          ./mvnw -B verify -Pci -DrunOnnxTests=true 2>&1 | tee target/maven-verification.log

      - name: Publish authoritative JUnit results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        continue-on-error: true
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'

      - name: Stage commit-bound verified reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/quality-reports
          mkdir -p target/quality-reports/tests target/quality-reports/coverage target/quality-reports/evidence
          while IFS= read -r -d '' report; do
            relative=${report#./}
            destination="target/quality-reports/tests/${relative}"
            mkdir -p "$(dirname "$destination")"
            cp "$report" "$destination"
          done < <(find . -type f \
            \( -path '*/target/surefire-reports/*' -o -path '*/target/failsafe-reports/*' \) \
            \( -name 'TEST-*.xml' -o -name '*.txt' -o -name '*.dump' -o -name '*.dumpstream' \) \
            -print0)
          if [ ! -f taxonomy-coverage/target/site/jacoco-aggregate/jacoco.xml ]; then
            echo "::error::Aggregate JaCoCo XML is missing; refusing to publish a stale coverage badge."
            exit 1
          fi
          cp -a taxonomy-coverage/target/site/jacoco-aggregate/. target/quality-reports/coverage/
          for evidence in \
            target/maven-verification.log \
            target/coverage-gate.txt \
            target/dependency-hygiene-report.txt \
            target/hibernate-search-dependencies.txt \
            target/supply-chain-pins.json \
            target/taxonomy-sbom.json \
            target/taxonomy-sbom.xml \
            target/taxonomy-vex.json \
            target/taxonomy-helm-rendered.yaml \
            target/taxonomy-helm-rancher-rke2-rendered.yaml; do
            if [ -f "$evidence" ]; then cp "$evidence" target/quality-reports/evidence/; fi
          done
          if [ -d target/observability-performance ]; then
            mkdir -p target/quality-reports/evidence/observability-performance
            cp -a target/observability-performance/. \
              target/quality-reports/evidence/observability-performance/
          fi

          source_tree=$(git rev-parse "${GITHUB_SHA}^{tree}")
          build_id="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          java_version=$(java -version 2>&1 | sed -n '1p')
          maven_version=$(./mvnw -version 2>&1 | sed -n '1p')
          python3 .github/scripts/generate-quality-site.py \
            --root target/quality-reports \
            --commit "$GITHUB_SHA" \
            --source-tree "$source_tree" \
            --build-id "$build_id" \
            --tool "java=$java_version" \
            --tool "maven=$maven_version" \
            --tool "codeql-action=v4.37.6" \
            --tool "trivy-action=v0.36.0"
          python3 .github/scripts/verify-quality-publication.py \
            --root target/quality-reports \
            --expected-commit "$GITHUB_SHA"
          printf 'Verified commit: %s\nSource tree: %s\nBuild ID: %s\n' \
            "$GITHUB_SHA" "$source_tree" "$build_id" > target/quality-reports/README.txt

      - name: Upload verified reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: quality-reports
          path: target/quality-reports/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

      - name: Upload UI verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ui-verification
          path: target/ui-verification/**
          if-no-files-found: warn
          retention-days: 90
