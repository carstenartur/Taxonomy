name: One-shot canonical API transport

on:
  push:
    branches:
      - qa/issue-644-api-transport

permissions:
  contents: write

concurrency:
  group: one-shot-api-transport
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-644-api-transport
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Correct VM-realm event assertion
        run: python3 .github/scripts/fix-api-transport-test-realm.py

      - name: Apply canonical API transport
        run: python3 .github/scripts/apply-api-transport.py

      - name: Register the contract in the Maven frontend lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/ci-cd.yml
          python3 .github/scripts/install-api-transport-maven-hook.py

      - name: Verify transport behavior and source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/scripts/apply-api-transport.py \
            .github/scripts/fix-api-transport-test-realm.py \
            .github/scripts/install-api-transport-maven-hook.py
          node --check taxonomy-app/src/main/resources/static/js/api/taxonomy-api-client.js
          node --check .github/scripts/test-taxonomy-api-client.mjs
          node .github/scripts/test-taxonomy-api-client.mjs
          ./mvnw -B -pl taxonomy-app -am \
            -Dtest=com.taxonomy.ui.TaxonomyApiClientContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
          ./mvnw -B -pl taxonomy-build -am \
            -DskipTests -DskipITs=true \
            -Dtaxonomy.ui.skip=true -Dtaxonomy.quality.skip=true validate
          python3 .github/scripts/check-frontend-api-boundary.py \
            --base-ref origin/main
          git diff --check

      - name: Commit permanent transport changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/package.json \
            .github/scripts/test-taxonomy-api-client.mjs \
            taxonomy-app/src/main/resources/static/js/api/taxonomy-api-client.js \
            taxonomy-app/src/test/java/com/taxonomy/ui/TaxonomyApiClientContractTest.java \
            taxonomy-build/pom.xml
          git diff --cached --quiet && exit 0
          git commit -m 'Harden the canonical frontend API transport'
          git push origin HEAD:qa/issue-644-api-transport
