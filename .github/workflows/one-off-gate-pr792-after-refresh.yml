name: One-off guarded integration of PR 792

on:
  push:
    branches:
      - automation/gate-pr792-after-refresh-20260818
    paths:
      - .github/workflows/one-off-gate-pr792-after-refresh.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: taxonomy-one-off-pr792-integration-gate
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.head_commit.message == 'chore(agent): stage guarded PR 792 integration'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository history for ancestry validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require refreshed ancestry, exact-head gates and resolved reviews
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: '792'
        shell: bash
        run: |
          set -euo pipefail

          owner=${GITHUB_REPOSITORY_OWNER}
          name=${GITHUB_REPOSITORY#*/}
          refreshed=false
          head_sha=''
          for attempt in $(seq 1 210); do
            pr794=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/794")
            if [[ -z "$(jq -r '.merged_at // empty' <<<"$pr794")" ]]; then
              sleep 10
              continue
            fi

            git fetch --quiet origin main agent/743-analysis-artifact-tenancy
            if ! git merge-base --is-ancestor \
                origin/main origin/agent/743-analysis-artifact-tenancy; then
              sleep 10
              continue
            fi

            pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            test "$(jq -r '.state' <<<"$pr")" = open
            test "$(jq -r '.base.ref' <<<"$pr")" = main
            test "$(jq -r '.head.ref' <<<"$pr")" = agent/743-analysis-artifact-tenancy
            test "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY"
            head_sha=$(jq -r '.head.sha' <<<"$pr")
            test "$head_sha" = "$(git rev-parse origin/agent/743-analysis-artifact-tenancy)"
            refreshed=true
            break
          done
          if [[ "$refreshed" != true ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body='Guarded integration stopped: PR #792 was not refreshed onto the merged protected `main` within the gate window. No draft transition or merge was attempted.'
            exit 1
          fi

          required=(
            'CI / CD'
            'Database Compatibility'
            'CodeQL Source Analysis'
            'Security Scan'
            'JGit Storage Consumer Contract'
          )
          all_green=false
          summary=''
          for attempt in $(seq 1 210); do
            current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            if [[ "$(jq -r '.head.sha' <<<"$current")" != "$head_sha" ]]; then
              echo "::error::PR 792 moved while its exact-head matrix was being evaluated" >&2
              exit 1
            fi
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head_sha}&event=pull_request&per_page=100")
            all_green=true
            summary=''
            for workflow in "${required[@]}"; do
              row=$(jq -r --arg workflow "$workflow" '
                [.workflow_runs[]
                  | select(.name == $workflow)
                  | {id, status, conclusion}]
                | sort_by(.id)
                | last
                | if . == null then "missing|missing|missing"
                  else "\(.id)|\(.status)|\(.conclusion // "pending")" end
              ' <<<"$runs")
              IFS='|' read -r run_id status conclusion <<<"$row"
              summary+="${workflow}: ${status}/${conclusion} (run ${run_id})\n"
              if [[ "$status" == completed && "$conclusion" != success ]]; then
                printf 'Exact-head gate failed for %s at %s:\n%b' "$workflow" "$head_sha" "$summary" >&2
                gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                  -f body="Guarded integration stopped: **${workflow}** concluded \`${conclusion}\` on exact head \`${head_sha}\`. The PR remains draft and no merge was attempted."
                exit 1
              fi
              if [[ "$status" != completed || "$conclusion" != success ]]; then
                all_green=false
              fi
            done
            if [[ "$all_green" == true ]]; then
              break
            fi
            sleep 10
          done
          if [[ "$all_green" != true ]]; then
            printf 'Matrix did not complete for %s:\n%b' "$head_sha" "$summary" >&2
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="Guarded integration stopped because the complete exact-head matrix did not finish successfully for \`${head_sha}\`. The PR remains draft."
            exit 1
          fi

          unresolved=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            -F owner="$owner" \
            -F name="$name" \
            -F number="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          if [[ "$unresolved" != 0 ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="Guarded integration stopped because ${unresolved} review thread(s) remain unresolved. The PR remains draft."
            exit 1
          fi

          node_id=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.node_id')
          draft=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.draft')
          if [[ "$draft" == true ]]; then
            gh api graphql \
              -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' \
              -F id="$node_id" \
              --jq '.data.markPullRequestReadyForReview.pullRequest.isDraft' \
              | grep -Fx false
          fi

          mergeable=false
          for attempt in $(seq 1 18); do
            current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            test "$(jq -r '.head.sha' <<<"$current")" = "$head_sha"
            value=$(jq -r '.mergeable' <<<"$current")
            if [[ "$value" == true ]]; then
              mergeable=true
              break
            fi
            if [[ "$value" == false ]]; then
              echo "::error::PR 792 is not mergeable after its successful gate" >&2
              exit 1
            fi
            sleep 5
          done
          test "$mergeable" = true

          printf 'All exact-head gates are green for %s:\n%b' "$head_sha" "$summary"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Merge the unchanged verified head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          merge=$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/792/merge" \
            -f sha="$HEAD_SHA" \
            -f merge_method=squash \
            -f commit_title='Bind analysis jobs snapshots and mappings to exact tenant scope (#792)' \
            -f commit_message='The refreshed exact head passed CI/CD, database compatibility, CodeQL, security, JGit consumer and review-thread gates.')
          jq -e '.merged == true' <<<"$merge" >/dev/null
          jq -r '"Merged as " + .sha' <<<"$merge"

      - name: Delete the temporary automation branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/automation/gate-pr792-after-refresh-20260818" \
            || true
