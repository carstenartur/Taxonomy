name: Finalize Complete Result Navigation

on:
  push:
    branches:
      - fix/complete-copilot-run-screenshot
    paths:
      - .github/workflows/finalize-complete-result-navigation.yml

permissions:
  contents: write

concurrency:
  group: finalize-complete-result-navigation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Make snapshot URLs open the loaded Analyses result directly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          detail_path = Path('taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js')
          detail = detail_path.read_text(encoding='utf-8')
          old_initialize = '''    async function initialize() {
                  translateSurface();
                  wireEvents();
                  await loadAll();
                  const requestedSnapshot = new URLSearchParams(window.location.search).get('snapshot');
                  if (requestedSnapshot) await selectSnapshot(requestedSnapshot);
                  else if (state.snapshots.length) await selectSnapshot(state.snapshots[0].id);
              }
          '''
          new_initialize = '''    async function initialize() {
                  translateSurface();
                  wireEvents();
                  await loadAll();
                  const requestedSnapshot = new URLSearchParams(window.location.search).get('snapshot');
                  if (requestedSnapshot) {
                      await selectSnapshot(requestedSnapshot);
                      activateDetailTab('analyses-tab');
                  } else if (state.snapshots.length) {
                      await selectSnapshot(state.snapshots[0].id);
                  }
              }
          '''
          if old_initialize not in detail:
              raise SystemExit('Requirement detail initialization block not found')
          detail = detail.replace(old_initialize, new_initialize, 1)

          tab_marker = "    function setTabText(id, value) { document.getElementById(id).textContent = value; }\n"
          tab_function = tab_marker + '''

              function activateDetailTab(tabId) {
                  const trigger = document.getElementById(tabId);
                  if (!trigger) return;
                  if (window.bootstrap && window.bootstrap.Tab) {
                      window.bootstrap.Tab.getOrCreateInstance(trigger).show();
                  } else {
                      trigger.click();
                  }
              }
          '''
          if tab_marker not in detail:
              raise SystemExit('Detail-tab helper insertion point not found')
          detail_path.write_text(detail.replace(tab_marker, tab_function, 1), encoding='utf-8')

          session_path = Path('taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java')
          session = session_path.read_text(encoding='utf-8')
          method_start = session.index(
              '    private static void openSelectedSnapshotThroughVisibleAnalysisControls() {')
          method_end = session.index(
              '\n    private static void saveCompleteCopilotRunResultScreenshot()', method_start)
          replacement = '''    private static void openSelectedSnapshotThroughVisibleAnalysisControls() {
                  // The selected immutable result must be the visible destination of
                  // terminal Copilot navigation; no compensating tab or snapshot click.
                  wait.until(browser -> browser.getCurrentUrl().contains("snapshot="));
                  wait.until(ExpectedConditions.visibilityOfElementLocated(By.id("analyses-tab")));
                  wait.until(ExpectedConditions.invisibilityOfElementLocated(
                          By.cssSelector(".portfolio-busy:not(.d-none)")));
                  wait.until(attributeEquals(By.id("analyses-tab"),
                          "aria-selected", "true"));
                  wait.until(ExpectedConditions.visibilityOfElementLocated(
                          By.id("snapshotResultOverview")));
                  wait.until(browser -> browser.findElements(
                          By.cssSelector("[data-decision-report-format]")).size() == 3);

                  assertThat(driver.findElements(By.cssSelector(
                          "#snapshotList [data-snapshot-id].active[aria-current='true']")))
                          .hasSize(1);
                  assertThat(driver.findElements(By.cssSelector(
                          "#snapshotResultOverview .portfolio-result-kpi")))
                          .hasSize(6);

                  String visibleResult = driver.findElement(By.id("snapshotDetail")).getText();
                  assertThat(visibleResult)
                          .contains("Copilot result overview")
                          .contains("Gap analysis")
                          .contains("Detected patterns")
                          .contains("Recommendation")
                          .doesNotContain("missingRelations")
                          .doesNotContain("businessText");

                  List<WebElement> findingDetails = driver.findElements(
                          By.cssSelector("#snapshotDetail details.portfolio-finding-details"));
                  assertThat(findingDetails).isNotEmpty();
                  assertThat(findingDetails).allSatisfy(detail ->
                          assertThat(detail.getAttribute("open")).isNull());
                  assertThat(driver.findElement(By.id("technicalSnapshotData"))
                          .getAttribute("open")).isNull();

                  if (Boolean.getBoolean("generateScreenshots")) {
                      saveCompleteCopilotRunResultScreenshot();
                  }
              }
          '''
          session_path.write_text(
              session[:method_start] + replacement + session[method_end:],
              encoding='utf-8')

          contract_path = Path(
              'taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotResultUiContractTest.java')
          contract = contract_path.read_text(encoding='utf-8')
          class_end = contract.rfind('\n}')
          if class_end < 0:
              raise SystemExit('Result UI contract terminator not found')
          navigation_test = '''

              @Test
              void snapshotBoundUrlsActivateTheResultOnlyAfterItHasLoaded()
                      throws IOException {
                  String detail = Files.readString(Path.of(
                          "src/main/resources/static/js/portfolio/requirement-detail.js"));
                  String session = Files.readString(Path.of(
                          "src/test/java/com/taxonomy/CompleteCopilotSessionIT.java"));

                  assertThat(detail)
                          .contains("await selectSnapshot(requestedSnapshot);")
                          .contains("activateDetailTab('analyses-tab');")
                          .contains("window.bootstrap.Tab.getOrCreateInstance(trigger).show();");
                  assertThat(session)
                          .contains("aria-selected", "snapshotResultOverview")
                          .contains("no compensating tab or snapshot click")
                          .doesNotContain("click(By.id(\\\"analyses-tab\\\"))")
                          .doesNotContain(
                                  "click(By.cssSelector(\\\"#snapshotList [data-snapshot-id]\\\"))");
              }
          '''
          contract_path.write_text(
              contract[:class_end] + navigation_test + contract[class_end:],
              encoding='utf-8')

          for path, marker, sentence in [
              (
                  Path('docs/en/COPILOT_AUTOPILOT.md'),
                  'The selected snapshot is also shown explicitly and remains available through **Open result**.',
                  ' Snapshot-bound links open the loaded **Analyses** result directly rather than leaving it hidden behind the default text tab.'
              ),
              (
                  Path('docs/de/COPILOT_AUTOPILOT.md'),
                  'Der ausgewählte Snapshot wird außerdem ausdrücklich angezeigt und bleibt über **Ergebnis öffnen** erreichbar.',
                  ' Snapshot-gebundene Links öffnen das geladene Ergebnis direkt im Register **Analysen**, statt es hinter dem standardmäßigen Textregister zu verbergen.'
              )
          ]:
              value = path.read_text(encoding='utf-8')
              if marker not in value:
                  raise SystemExit(f'Documentation navigation marker not found in {path}')
              path.write_text(value.replace(marker, marker + sentence, 1), encoding='utf-8')
          PY

          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          git diff --check

      - name: Verify focused result contracts
        run: >-
          ./mvnw -B -pl taxonomy-app -am test
          -Dtest=RequirementCopilotResultSurfaceContractTest,CompleteCopilotResultUiContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Exercise direct terminal navigation and regenerate screenshot 72
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=CompleteCopilotSessionIT
          -DgenerateScreenshots=true
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify final evidence
        shell: bash
        run: |
          set -euo pipefail
          image=docs/images/72-complete-copilot-run-result.png
          test -s "$image"
          test "$(wc -c < "$image")" -gt 50000
          file "$image" | grep -F 'PNG image data'
          grep -F 'Tests run: 1, Failures: 0, Errors: 0' \
            taxonomy-app/target/failsafe-reports/com.taxonomy.CompleteCopilotSessionIT.txt
          git diff --check

      - name: Upload direct-navigation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-copilot-direct-result
          path: |
            docs/images/72-complete-copilot-run-result.png
            taxonomy-app/target/failsafe-reports/**
            taxonomy-app/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish only permanent navigation, test, documentation and screenshot changes
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/complete-copilot-run-screenshot
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotResultUiContractTest.java \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java \
            docs/images/72-complete-copilot-run-result.png \
            docs/en/COPILOT_AUTOPILOT.md \
            docs/de/COPILOT_AUTOPILOT.md
          git diff --cached --check
          git commit -m 'Open selected Copilot snapshots in the result tab'
          git push origin HEAD:"$branch"
