name: Civilian architecture acceptance

on:
  pull_request:
    paths:
      - 'taxonomy-*/**'
      - 'pom.xml'
      - '.mvn/verification-suites.json'
      - '.github/workflows/civilian-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civilian-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run sourced civilian scenario with real browser and remote LLM playback
        run: >-
          ./mvnw -B -ntp -pl taxonomy-app -am test -Pcivilian-acceptance
      - name: Preserve architecture, exports, screenshots and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: civilian-architecture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            taxonomy-app/target/civilian-acceptance/**
            taxonomy-app/target/surefire-reports/*Civilian*
            taxonomy-app/target/surefire-reports/*ScenarioLlm*
          if-no-files-found: error
          retention-days: 14
