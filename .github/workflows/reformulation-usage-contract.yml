name: Reformulation usage contract

# Supplemental feedback; canonical verification and all its gates stay required.
on:
  pull_request:
    paths:
      - 'taxonomy-analysis/**'
      - '.github/workflows/reformulation-usage-contract.yml'

permissions:
  contents: read

concurrency:
  group: usage-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  transport-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Execute actual transport contract tests
        run: >-
          ./mvnw -B -ntp -pl taxonomy-analysis -am test
          -Dtest=LlmTransportMeterTest,ParallelReformulationMeterTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Require the intended suites to have executed
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          suites = {'service.LlmTransportMeterTest': 8, 'reformulation.ParallelReformulationMeterTest': 1}
          errors = 0
          for name, minimum in suites.items():
              report = Path(f'taxonomy-analysis/target/surefire-reports/TEST-com.taxonomy.analysis.{name}.xml')
              root = ET.parse(report).getroot()
              tests = int(root.attrib['tests'])
              failed = int(root.attrib.get('failures', '0')) + int(root.attrib.get('errors', '0'))
              skipped = int(root.attrib.get('skipped', '0'))
              print(f'{name}: {tests} tests, {failed} failures/errors, {skipped} skipped')
              errors += int(tests < minimum or failed != 0 or skipped != 0)
          assert errors == 0
          PY
