name: Integrate result impact map renderer

on:
  push:
    branches:
      - fix/usable-result-impact-map
    paths:
      - .github/workflows/apply-result-impact-map-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/usable-result-impact-map
          fetch-depth: 0

      - name: Add the stylesheet and replacement renderer to the page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('taxonomy-app/src/main/resources/templates/index.html')
          content = page.read_text(encoding='utf-8')

          css_line = '    <link rel="stylesheet" th:href="@{/css/taxonomy-impact-map.css}"/>'
          css_anchor = '    <link rel="stylesheet" th:href="@{/css/taxonomy-ergonomics.css}"/>'
          if css_line not in content:
              if css_anchor not in content:
                  raise SystemExit('CSS integration anchor not found in index.html')
              content = content.replace(css_anchor, css_anchor + '\n' + css_line, 1)

          script_line = '<script th:src="@{/js/shared/taxonomy-impact-map.js}"></script>'
          script_anchor = '<script th:src="@{/js/shared/taxonomy-graph.js}"></script>'
          if script_line not in content:
              if script_anchor not in content:
                  raise SystemExit('JavaScript integration anchor not found in index.html')
              content = content.replace(script_anchor, script_anchor + '\n' + script_line, 1)

          page.write_text(content, encoding='utf-8')
          PY

          node --check taxonomy-app/src/main/resources/static/js/shared/taxonomy-impact-map.js
          node --test .github/scripts/taxonomy-impact-map.test.mjs
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taxonomy-app/src/main/resources/templates/index.html
          git commit -m "Load the usable result impact map renderer"
          git push origin HEAD:fix/usable-result-impact-map
