name: Setup review diagnostic (isolated branch)
on:
  push:
    branches: [verify/pr1142-review-regressions-20260928]
permissions:
  contents: read
jobs:
  export:
    name: Export exact review baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2bc9426f2427f099ba9283a506a0afa39f83eb14
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/setup-source
          git rev-parse HEAD > /tmp/setup-source/commit.txt
          git archive --format=tar.gz HEAD > /tmp/setup-source/source.tar.gz
          sha256sum /tmp/setup-source/source.tar.gz > /tmp/setup-source/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: setup-third-review-source
          path: /tmp/setup-source/
          retention-days: 1
          if-no-files-found: error
