name: Architecture extraction validation
on:
  push:
    branches: [work/628-architecture-validation]
    paths: [.github/workflows/architecture-extraction-validation.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b9e66644bd17dd370cfb4860245137088601631f
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Verify exact architecture extraction from a clean build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import urllib.request, json, base64, pathlib, hashlib, os, subprocess
          sha='8470b8d317d9b8bee731581f5ec59239b507dc74'
          request=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=60) as response: data=base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          path=pathlib.Path('/tmp/architecture-validation.py'); path.write_bytes(data)
          subprocess.run(['python3',str(path)],check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: architecture-extraction-evidence
          path: |
            target/architecture-*
            **/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
