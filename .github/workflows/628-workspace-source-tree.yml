name: Workspace source tree for review
on:
  push:
    branches: [verification/628-physical-workspace]
    paths: [.github/workflows/628-workspace-source-tree.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c28a1a5208f95c9d9592bfd5965e57d3b75ae29
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8cd4395d93ba56c80ae6ea5dff031944772e7771
          path: source
          persist-credentials: false
      - name: Reproduce immutable extraction source without a test claim
        run: python3 verification/workspace_direct.py prepare "$GITHUB_WORKSPACE/source"
      - name: Retain code and export workflow blob identities for authorized publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verification/physical_workspace.py')
          text=p.read_text()
          old="    tree=api('git/trees',{'base_tree':git('rev-parse',BASE+'^{tree}'),'tree':entries})['sha']\n    assert tree==git('write-tree')"
          new="""    workflows=[entry for entry in entries if entry['path'].startswith('.github/workflows/')]
              code_entries=[entry for entry in entries if not entry['path'].startswith('.github/workflows/')]
              code_tree=api('git/trees',{'base_tree':git('rev-parse',BASE+'^{tree}'),'tree':code_entries})['sha']
              tree=git('write-tree')
              print('SOURCE_PUBLICATION '+json.dumps({'base':BASE,'codeTree':code_tree,'fullTree':tree,'workflowEntries':workflows}),flush=True)
              (out/'workflow-publication.json').write_text(json.dumps({'base':BASE,'codeTree':code_tree,'fullTree':tree,'workflowEntries':workflows},indent=2)+'\\n')"""
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          assert text.count(old)==1
          p.write_text(text.replace(old,new,1))
          PY
          python3 verification/workspace_direct.py publish "$GITHUB_WORKSPACE/source"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: physical-workspace-source-identity
          path: ${{ runner.temp }}/workspace-extraction-evidence/
          retention-days: 7
          if-no-files-found: error
