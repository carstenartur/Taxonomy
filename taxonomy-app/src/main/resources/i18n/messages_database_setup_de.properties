database.setup.menu=Datenbank einrichten
database.setup.title=Datenbankverbindung vorbereiten
database.setup.intro=Bereiten Sie eine externe Datenbankverbindung vor. Sie können den Assistenten jederzeit schließen und mit der vorhandenen Konfiguration weiterarbeiten.
database.setup.prompt.title=Externe Datenbank einrichten?
database.setup.prompt.body=Taxonomy verwendet zurzeit eingebettete HSQLDB. Der optionale Assistent unterstützt die Vorbereitung einer Remote-Datenbank und verlinkt die Anleitung für einen Datenbank-Pod. Sie finden ihn später wieder in den Einstellungen.
database.setup.prompt.memory=Taxonomy verwendet zurzeit HSQLDB im Arbeitsspeicher; die Daten bleiben nur bis zum Herunterfahren erhalten. Der optionale Assistent hilft bei der Vorbereitung einer externen Datenbank. Sie können jetzt weiterarbeiten und ihn später in den Einstellungen öffnen.
database.setup.prompt.start=Datenbankassistent öffnen
database.setup.continue=Mit vorhandener Konfiguration weiterarbeiten
database.setup.close=Schließen und mit vorhandener Konfiguration weiterarbeiten
database.setup.dismiss.failed=Sie können weiterarbeiten. Die Entscheidung zum Datenbankassistenten konnte nicht gespeichert werden; der Hinweis kann nach dem Neuladen erneut erscheinen.
database.setup.steps=Einrichtungsschritte
database.setup.step.type=1. Datenbank
database.setup.step.connection=2. Verbindung
database.setup.step.deployment=3. Deployment
database.setup.current=Aktuelle Datenbank: {0}
database.setup.current.memory=HSQLDB im Arbeitsspeicher
database.setup.current.hsqldb=HSQLDB
database.setup.current.hsqldb-file=Dateibasierte HSQLDB
database.setup.current.postgres=PostgreSQL
database.setup.current.mssql=Microsoft SQL Server
database.setup.current.oracle=Oracle Database
database.setup.current.unknown=Aktive Datenbank konnte nicht ermittelt werden
database.setup.type=Zieldatenbank
database.setup.support.postgres=PostgreSQL: der unterstützte Weg für eine externe Datenbank mit freigegebenen Schemamigrationen. Der Verbindungstest bestätigt noch keine vollständige Betriebsbereitschaft.
database.setup.support.evaluation=Nur zur Evaluierung: SQL Server und Oracle besitzen Verbindungsprofile. Ihre vollständige Migrations-, Persistenz- und Wiederherstellungsstrecke ist jedoch nicht für die Produktion abgenommen.
database.setup.server.required=Richten Sie zuerst Datenbankserver, Datenbank und Anwendungskonto ein. Die Hilfe erklärt Service-DNS, dauerhafte Volumes, Secrets, TLS und Netzwerkzugriff in Rancher/Kubernetes.
database.setup.no.transfer=Vorhandene HSQLDB-Daten werden nicht übernommen. Bewahren Sie die Quelldatenbank und eine geprüfte Sicherung auf, wenn deren Datensätze erhalten bleiben müssen.
database.setup.help=Hilfe zur Datenbank- und Pod-Einrichtung (öffnet einen neuen Tab)
database.setup.connection.title=Verbindung vom Taxonomy-Server
database.setup.host=Host / Service-DNS
database.setup.host.help=Verwenden Sie die von Taxonomy erreichbare Adresse, etwa postgres.database.svc.cluster.local. localhost bezeichnet den Taxonomy-Server, nicht Ihren Browser.
database.setup.port=Port
database.setup.name=Datenbankname
database.setup.name.help=Für Datenbank- und Dienstnamen akzeptiert dieser Assistent Buchstaben, Ziffern, Punkte, Unterstriche und Bindestriche.
database.setup.service=Oracle-Dienstname
database.setup.username=Datenbankbenutzer
database.setup.password=Passwort für den Verbindungstest
database.setup.password.help=Nur für den Verbindungstest. Es wird weder in Einstellungen noch in Downloads gespeichert und beim Schließen gelöscht. Sie können die Konfiguration auch ohne Passworteingabe vorbereiten.
database.setup.tls=TLS mit Prüfung von Zertifikat und Serveridentität
database.setup.tls.warning=TLS ist deaktiviert. Zugangsdaten und Daten können ungeschützt über das Netzwerk übertragen werden. Aktivieren Sie geprüftes TLS für Ihr Deployment.
database.setup.ca=Optionaler PostgreSQL-CA-Pfad auf dem Taxonomy-Server
database.setup.ca.help=Ein bereits eingebundener absoluter Serverpfad, beispielsweise /etc/taxonomy-db-ca/ca.crt. Dies ist weder ein Datei-Upload noch ein Pfad auf dem Browser-Rechner.
database.setup.jvm.trust=SQL Server und Oracle verwenden den vorhandenen JVM-Truststore. Hinterlegen Sie dort vor dem Test die vertrauenswürdige Datenbank-CA; der Assistent installiert keine Zertifikate.
database.setup.check=Verbindung testen
database.setup.check.scope=Optional: Der Test öffnet eine separate Verbindung mit Read-only-Hinweis. Er prüft Erreichbarkeit und Anmeldung ohne Schreibzugriffe auf Anwendungsdaten oder DDL. Schema, Migrationsrechte und Produktionsreife bleiben ungeprüft.
database.setup.checking=Verbindung vom Taxonomy-Server wird geprüft …
database.setup.check.finished=Verbindungsprüfung abgeschlossen. Beachten Sie die Ergebnisse unten.
database.setup.next=Weiter
database.setup.back=Zurück
database.setup.prepare=Konfiguration vorbereiten
database.setup.preparing=Passwortfreie Konfiguration wird vorbereitet …
database.setup.preview.ready=Konfiguration vorbereitet. Es wurde nichts angewendet oder neu gestartet.
database.setup.invalid=Prüfen Sie Host, Port, Datenbank-/Dienstname, Benutzer und CA-Pfad. Verwenden Sie einen reinen Hostnamen ohne URL-Optionen, Port 1–65535 und einen absoluten PostgreSQL-CA-Pfad nur bei aktiviertem TLS.
database.setup.request.failed=Die Anfrage konnte nicht abgeschlossen werden. Ihre aktuelle Konfiguration bleibt erhalten. Prüfen Sie die Verbindung und Ihre Administratoranmeldung und versuchen Sie es erneut.
database.setup.schema.conflict=Vorhandene Einstellungen zur Schemaerzeugung würden diese Vorlage übersteuern. Prüfen Sie die in der Hilfe beschriebenen Deployment-Einstellungen und entfernen Sie die Überschreibungen oder setzen Sie sie auf validate. Danach können Sie den Export erneut versuchen. Der Verbindungstest ist weiterhin möglich.
database.setup.properties=Spring-Properties
database.setup.helm=Helm-Werte und Secret-Anweisungen
database.setup.download.properties=Properties herunterladen
database.setup.download.helm=Helm-Werte herunterladen
database.setup.copy=Kopieren
database.setup.copied=Ohne Passwort kopiert.
database.setup.copy.failed=Kein Zugriff auf die Zwischenablage. Markieren und kopieren Sie den Text oder laden Sie die Datei herunter.
database.setup.apply.title=Über Ihr Deployment anwenden
database.setup.apply.secrets=Hinterlegen Sie SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME und SPRING_DATASOURCE_PASSWORD im vorhandenen Deployment-Secret oder in geschützter Spring-Konfiguration. Die Downloads enthalten bewusst keine Passwort-Eigenschaft.
database.setup.apply.profiles=Übernehmen Sie die vorgeschlagenen Einstellungen in Ihr Deployment. Erhalten Sie die vorgesehenen Anmeldeprofile, prüfen Sie Treiber/Dialekt und Schema-Überschreibungen und richten Sie TLS-Vertrauen sowie Netzwerkzugriff ein. Der Assistent ergänzt das Profil production nicht automatisch.
database.setup.apply.restart=Deployen oder starten Sie nach der Prüfung bewusst neu und prüfen Sie danach Start, Anmeldung und Anwendungsverhalten. Bei PostgreSQL initialisieren die freigegebenen Startmigrationen das Zielschema; Quelldatensätze werden nicht kopiert.
database.setup.apply.environment=Die Deployment-Einstellungen bleiben maßgeblich. Umgebungsvariablen, geführte Helm-Datenbankfelder, extraEnv und weitere Überschreibungen können Vorrang vor einer Properties-Datei haben. Prüfen Sie vor dem Neustart die wirksame Konfiguration.
database.setup.status.OK=OK
database.setup.status.WARNING=Warnung
database.setup.status.ERROR=Fehler
database.setup.status.NOT_CHECKED=Nicht geprüft
database.setup.finding.database.schema.NOT_CHECKED=Es werden weder Schemamigrationen noch Tests der Schreibrechte oder eines Rollbacks ausgeführt.
database.setup.finding.database.schema-overrides.WARNING=Der Verbindungstest ist unabhängig von vorhandenen Überschreibungen zur Schemaerzeugung. Diese Einstellungen verhindern zurzeit den Konfigurationsexport. Prüfen Sie die Deployment-Einstellungen in der Hilfe und entfernen Sie die widersprüchlichen Überschreibungen oder setzen Sie sie auf validate.
database.setup.finding.database.tls.OK=TLS mit Prüfung der Serveridentität ist ausgewählt. Stellen Sie die vertrauenswürdigen CA-Zertifikate in der Zielumgebung bereit.
database.setup.finding.database.tls.WARNING=TLS ist ausdrücklich deaktiviert; Zugangsdaten und Daten können ungeschützt über das Netzwerk übertragen werden.
database.setup.finding.database.support.WARNING=SQL Server und Oracle bleiben Evaluierungsoptionen. Die Abnahme für produktive Migration, Persistenz, Neustart und Wiederherstellung steht aus.
database.setup.finding.database.deployment.NOT_CHECKED=Die Deployment-Einstellungen bleiben maßgeblich. Prüfen Sie Treiber, Dialekt, eingebundene Profile und Schema-Überschreibungen, bevor Sie die Konfiguration anwenden und manuell neu starten.
database.setup.finding.database.transfer.NOT_CHECKED=Vorhandene Datensätze werden nicht kopiert. Ein Verbindungstest bestätigt weder die Eignung des Zielschemas noch eine Datenübernahme.
database.setup.finding.database.connection.OK=Die separate JDBC-Verbindung wurde mit Read-only-Hinweis geprüft. Schema und Migrationsrechte bleiben ungeprüft.
database.setup.finding.database.connection.ERROR=Die Verbindung konnte nicht bestätigt werden oder der Test wurde unterbrochen. Prüfen Sie DNS, NetworkPolicies, TLS-Vertrauen und Datenbankzugangsdaten in der Zielumgebung.
database.setup.finding.database.connection.WARNING=Andere Datenbanktests laufen noch. Versuchen Sie es nach deren Abschluss erneut.
database.setup.finding.spring.profiles.active.ERROR=Prüfen Sie die Profilliste. Wählen Sie nur eine Datenbank-Engine und einen Anmeldemodus.
