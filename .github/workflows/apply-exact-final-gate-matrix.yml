name: Apply exact final release gate matrix

on:
  push:
    branches:
      - release/exact-final-gate-matrix
    paths:
      - '.github/workflows/apply-exact-final-gate-matrix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/exact-final-gate-matrix
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply bounded release gate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          BACKSLASH = chr(92)
          EXPR_OPEN = "$" + "{{"
          EXPR_CLOSE = "}" + "}"

          def find_unique(lines: list[str], value: str, label: str) -> int:
              matches = [index for index, line in enumerate(lines) if line == value]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one match, found {len(matches)}"
                  )
              return matches[0]

          workflow_path = Path('.github/workflows/deploy-release.yml')
          workflow_lines = workflow_path.read_text(encoding='utf-8').splitlines()

          index = find_unique(
              workflow_lines, '    timeout-minutes: 180', 'release timeout'
          )
          workflow_lines[index] = '    timeout-minutes: 300'

          index = find_unique(
              workflow_lines,
              '          cp .github/scripts/generate-vex.py "$RUNNER_TEMP/generate-vex.py"',
              'preserve helper insertion point',
          )
          workflow_lines[index + 1:index + 1] = [
              '          cp .github/scripts/verify-exact-release-gates.sh ' + BACKSLASH,
              '            "$RUNNER_TEMP/verify-exact-release-gates.sh"',
          ]

          index = find_unique(
              workflow_lines,
              '            "$RUNNER_TEMP/generate-vex.py"',
              'helper chmod insertion point',
          )
          workflow_lines[index] = workflow_lines[index] + ' ' + BACKSLASH
          workflow_lines.insert(
              index + 1,
              '            "$RUNNER_TEMP/verify-exact-release-gates.sh"',
          )

          index = find_unique(
              workflow_lines,
              '          bash -n .github/scripts/release.sh',
              'helper syntax-check insertion point',
          )
          workflow_lines.insert(
              index + 1,
              '          bash -n .github/scripts/verify-exact-release-gates.sh',
          )

          old_gate = find_unique(
              workflow_lines,
              '      - name: Verify exact final main snapshot with canonical CI',
              'obsolete single CI gate',
          )
          publication = find_unique(
              workflow_lines,
              '      - name: Publish complete release and trigger deployment',
              'publication step',
          )
          del workflow_lines[old_gate:publication]

          immutable_checkout = find_unique(
              workflow_lines,
              '      - name: Checkout immutable release source',
              'immutable checkout',
          )
          exact_gate_step = [
              '      - name: Verify exact final main release gate matrix',
              "        if: steps.release_parameters.outputs.dry_run != 'true'",
              '        env:',
              f'          GH_TOKEN: {EXPR_OPEN} github.token {EXPR_CLOSE}',
              f'          EXPECTED_MAIN_SHA: {EXPR_OPEN} steps.final_main.outputs.sha {EXPR_CLOSE}',
              '        shell: bash',
              '        run: bash "$RUNNER_TEMP/verify-exact-release-gates.sh"',
              '',
          ]
          workflow_lines[immutable_checkout:immutable_checkout] = exact_gate_step
          workflow_path.write_text(
              '\n'.join(workflow_lines) + '\n', encoding='utf-8'
          )

          contract_path = Path('.github/scripts/check-release-delivery-contract.py')
          contract_lines = contract_path.read_text(encoding='utf-8').splitlines()

          index = find_unique(
              contract_lines,
              'RELEASE_IMAGE_GATE = ROOT / ".github" / "scripts" / "check-release-image-gate.py"',
              'gate helper constant insertion point',
          )
          contract_lines.insert(
              index + 1,
              'RELEASE_GATE_HELPER = ROOT / ".github" / "scripts" / "verify-exact-release-gates.sh"',
          )

          index = find_unique(
              contract_lines,
              '    script = RELEASE_SCRIPT.read_text(encoding="utf-8")',
              'gate helper read insertion point',
          )
          contract_lines.insert(
              index + 1,
              '    gate_helper = RELEASE_GATE_HELPER.read_text(encoding="utf-8")',
          )

          index = find_unique(
              contract_lines,
              '        "DEFER_RELEASE_PUBLICATION: \'true\'",',
              'workflow required needles insertion point',
          )
          contract_lines[index + 1:index + 1] = [
              '        "cp .github/scripts/verify-exact-release-gates.sh",',
              '        "bash -n .github/scripts/verify-exact-release-gates.sh",',
              '        "timeout-minutes: 300",',
          ]

          old_step = find_unique(
              contract_lines,
              '        "- name: Verify exact final main snapshot with canonical CI",',
              'old workflow gate requirement',
          )
          contract_lines[old_step] = (
              '        "- name: Verify exact final main release gate matrix",'
          )
          for obsolete in (
              '        \'--commit "$EXPECTED_MAIN_SHA"\',',
              '        "run_sha=$(gh run view \\\"$run_id\\\" --json headSha --jq \'.headSha\')",',
          ):
              index = find_unique(contract_lines, obsolete, 'obsolete inline CI requirement')
              contract_lines.pop(index)

          index = find_unique(
              contract_lines,
              '        "EXPECTED_MAIN_SHA: ' + EXPR_OPEN + ' steps.final_main.outputs.sha ' + EXPR_CLOSE + '",',
              'gate helper invocation requirement',
          )
          contract_lines.insert(
              index + 1,
              '        \'run: bash "$RUNNER_TEMP/verify-exact-release-gates.sh"\',',
          )

          forbidden_index = find_unique(
              contract_lines, '    for forbidden in (', 'helper contract insertion point'
          )
          helper_contract = [
              '    for needle in (',
              '        "EXPECTED_MAIN_SHA=${EXPECTED_MAIN_SHA:-}",',
              '        "readonly -a REQUIRED_WORKFLOWS=(",',
              '        "ci-cd.yml",',
              '        "database-compatibility.yml",',
              '        "codeql.yml",',
              '        "security-scan.yml",',
              '        "assert_main_unchanged",',
              '        \'--branch main\',',
              '        \'--commit "$EXPECTED_MAIN_SHA"\',',
              '        \'gh workflow run "$workflow" --ref main\',',
              (
                  '        "run_sha=$(gh run view ' + BACKSLASH + '"$run_id'
                  + BACKSLASH + '" --json headSha --jq ' + chr(39)
                  + '.headSha' + chr(39) + ')",'
              ),
              '        \'gh run watch "$run_id" --exit-status\',',
              '        \'if [[ "$status" != "completed" || "$conclusion" != "success" ]]\',',
              '        \'echo "All exact release gates passed\',',
              '    ):',
              '        require(gate_helper, needle, RELEASE_GATE_HELPER, failures)',
              '',
              '    if gate_helper.count("assert_main_unchanged") < 4:',
              '        failures.append(',
              '            "verify-exact-release-gates.sh must bind discovery, dispatch "',
              '            "and final readiness to unchanged main"',
              '        )',
              '',
          ]
          contract_lines[forbidden_index:forbidden_index] = helper_contract

          index = find_unique(
              contract_lines,
              '        final_ci = workflow.index(',
              'final gate variable',
          )
          contract_lines[index] = '        final_gates = workflow.index('
          if contract_lines[index + 1] != (
              '            "- name: Verify exact final main snapshot with canonical CI"'
          ):
              raise SystemExit('final gate step name did not match expected source')
          contract_lines[index + 1] = (
              '            "- name: Verify exact final main release gate matrix"'
          )

          index = find_unique(
              contract_lines,
              '        if not checkout < resolve < stage < resume < record_main < checkout_tag < package < image < scan < bind < archive < final_ci < publish:',
              'release step ordering',
          )
          contract_lines[index] = (
              '        if not checkout < resolve < stage < resume < record_main '
              '< final_gates < checkout_tag < package < image < scan < bind '
              '< archive < publish:'
          )

          old_block_start = find_unique(
              contract_lines,
              '        final_ci_block = workflow[final_ci:publish]',
              'old final CI block',
          )
          publish_block = find_unique(
              contract_lines,
              '        publish_block = workflow[publish:]',
              'publish block',
          )
          contract_lines[old_block_start:publish_block] = [
              '        final_gate_block = workflow[final_gates:checkout_tag]',
              '        for needle in (',
              '            "EXPECTED_MAIN_SHA: ' + EXPR_OPEN + ' steps.final_main.outputs.sha ' + EXPR_CLOSE + '",',
              '            \'run: bash "$RUNNER_TEMP/verify-exact-release-gates.sh"\',',
              '        ):',
              '            if needle not in final_gate_block:',
              '                failures.append(',
              '                    f"Exact final gate step is missing {needle!r}"',
              '                )',
              '',
          ]

          contract = '\n'.join(contract_lines) + '\n'
          contract = contract.replace(
              'the exact main snapshot is checked, and publication remains the final gate.',
              'the exact main snapshot passes CI, database, CodeQL and security gates before immutable artifact work, and publication remains the final operation.',
          )
          contract_path.write_text(contract, encoding='utf-8')
          PY

          rm .github/workflows/apply-exact-final-gate-matrix.yml
          bash -n .github/scripts/verify-exact-release-gates.sh
          python3 -m py_compile .github/scripts/check-release-delivery-contract.py
          python3 .github/scripts/check-release-delivery-contract.py
          git diff --check

      - name: Commit bounded release hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require exact final release gate matrix"
          git push origin "HEAD:release/exact-final-gate-matrix"
