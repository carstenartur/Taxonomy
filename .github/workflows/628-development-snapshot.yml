name: Workspace extraction development snapshot

on:
  push:
    branches: [refactor/628-workspace-module]
    paths: [.github/workflows/628-development-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bundle tracked repository history only
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/628-history.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/628-history.bundle"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/628-history-identity.txt"
          cd "$RUNNER_TEMP"
          sha256sum 628-history.bundle > 628-history.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-extraction-history
          path: |
            ${{ runner.temp }}/628-history.bundle
            ${{ runner.temp }}/628-history-identity.txt
            ${{ runner.temp }}/628-history.sha256
          if-no-files-found: error
          retention-days: 1
