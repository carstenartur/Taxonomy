name: Run staged decision report product-gap patch

on:
  push:
    branches:
      - codex/json-catalogue-overlay
    paths:
      - .github/workflows/pr913-run-decision-report-product-gaps.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/json-catalogue-overlay
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Execute and verify the staged patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          sed -i "1c import fs from 'node:fs';" \
            .github/scripts/pr913-decision-report-product-gaps.mjs
          node --check .github/scripts/pr913-decision-report-product-gaps.mjs
          git rm .github/workflows/pr913-run-decision-report-product-gaps.yml
          git add .github/scripts/pr913-decision-report-product-gaps.mjs
          git commit -m 'fix: use ESM in decision report product-gap patch script'
          git push origin HEAD:codex/json-catalogue-overlay

          node .github/scripts/pr913-decision-report-product-gaps.mjs
          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-browse.js
          node --check .github/scripts/document-template-report-download.mjs
          git diff --check
          ./mvnw -B -ntp -pl taxonomy-app -am \
            -DskipITs \
            -Dtest=DecisionRationaleReportTests,DecisionRationaleSnapshotReportTest,DecisionRationaleTemplateRendererTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

          git rm .github/scripts/pr913-decision-report-product-gaps.mjs
          git add -A
          git commit -m 'fix: preserve product coverage gaps in decision reports'
          git push origin HEAD:codex/json-catalogue-overlay
