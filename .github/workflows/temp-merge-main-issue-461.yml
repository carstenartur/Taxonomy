name: Inspect main merge for issue 461

on:
  push:
    branches:
      - fix/issue-461-jgit-storage-hibernate
    paths:
      - '.github/workflows/temp-merge-main-issue-461.yml'

permissions:
  contents: write

jobs:
  merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue-461-jgit-storage-hibernate
          fetch-depth: 0
      - name: Merge or record conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort
            {
              echo 'Merge conflicts against current main:'
              printf '%s\n' "$conflicts"
            } > .github/issue-461-merge-conflicts.txt
            rm .github/workflows/temp-merge-main-issue-461.yml
            git add -A
            git commit -m 'Record issue 461 merge conflicts'
            git push origin HEAD:fix/issue-461-jgit-storage-hibernate
            exit 0
          fi
          rm .github/workflows/temp-merge-main-issue-461.yml
          rm -f .github/issue-461-merge-conflicts.txt
          git add -A
          git commit -m 'Merge current main into issue 461 integration'
          git push origin HEAD:fix/issue-461-jgit-storage-hibernate
