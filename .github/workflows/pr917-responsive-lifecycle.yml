name: Make PR 917 lifecycle controls responsive

on:
  push:
    branches:
      - fix/repeatable-analysis-reset-and-lifecycle-menu
    paths:
      - .github/workflows/pr917-responsive-lifecycle.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repeatable-analysis-reset-and-lifecycle-menu
          fetch-depth: 0
      - name: Add responsive lifecycle layout and accessibility hooks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          css = root / 'taxonomy-app/src/main/resources/static/css/analysis-lifecycle.css'
          css.write_text('''/* Lifecycle controls remain reachable at high zoom and narrow widths. */
          .analysis-lifecycle-menu-group,
          .analysis-primary-actions {
              min-width: 0;
              flex-wrap: wrap;
          }

          .analysis-lifecycle-menu-group > *,
          .analysis-primary-actions > * {
              min-width: 0;
              max-width: 100%;
          }

          #fileMenuButton,
          #projectMenuButton,
          #cancelAnalysisBtn {
              max-width: 100%;
              white-space: normal;
          }

          @media (max-width: 575.98px) {
              .analysis-lifecycle-menu-group {
                  width: 100%;
                  align-items: stretch !important;
              }

              .analysis-lifecycle-menu-group .dropdown {
                  flex: 1 1 calc(50% - .25rem);
                  min-width: 0;
              }

              .analysis-lifecycle-menu-group .dropdown-toggle {
                  width: 100%;
                  white-space: normal;
              }

              .analysis-lifecycle-menu-group .dropdown-menu {
                  max-width: calc(100vw - 1rem);
                  overflow-wrap: anywhere;
              }

              .analysis-primary-actions {
                  width: 100%;
                  align-items: stretch !important;
              }

              .analysis-primary-actions > .btn,
              .analysis-primary-actions > .btn-group,
              .analysis-primary-actions > div {
                  flex: 1 1 100%;
                  width: 100%;
              }

              .analysis-primary-actions .btn {
                  max-width: 100%;
                  white-space: normal;
              }
          }
          ''', encoding='utf-8')

          template = root / 'taxonomy-app/src/main/resources/templates/index.html'
          text = template.read_text(encoding='utf-8')
          link = '    <link rel="stylesheet" th:href="@{/css/analysis-lifecycle.css}">\n'
          if 'analysis-lifecycle.css' not in text:
              text = text.replace('</head>', link + '</head>', 1)

          def add_attribute(source, element_id, attribute):
              pattern = re.compile(r'(<[^>]+\bid="' + re.escape(element_id) + r'")(?![^>]*\b' +
                                   re.escape(attribute.split('=', 1)[0]) + r'=)')
              return pattern.sub(r'\1 ' + attribute, source, count=1)

          text = add_attribute(text, 'projectNewAction',
                               'data-analysis-session-action="new-project"')
          text = add_attribute(text, 'projectAddRequirementAction',
                               'data-analysis-session-action="add-requirement"')
          text = add_attribute(text, 'fileMenuButton', 'aria-haspopup="true"')
          text = add_attribute(text, 'projectMenuButton', 'aria-haspopup="true"')
          template.write_text(text, encoding='utf-8')

          projects = root / 'taxonomy-app/src/main/resources/static/js/core/taxonomy-analysis-session-projects.js'
          text = projects.read_text(encoding='utf-8')
          marker = '    function installLifecycleCommands() {\n'
          hook = '''    function installResponsiveLifecycleLayout() {
              var fileMenu = document.getElementById('fileMenuButton');
              var projectMenu = document.getElementById('projectMenuButton');
              var menuGroup = fileMenu && fileMenu.closest
                  ? fileMenu.closest('.d-flex') : null;
              if (!menuGroup && projectMenu && projectMenu.closest) {
                  menuGroup = projectMenu.closest('.d-flex');
              }
              if (menuGroup) menuGroup.classList.add('analysis-lifecycle-menu-group');

              var cancel = document.getElementById('cancelAnalysisBtn');
              var analyze = document.getElementById('analyzeBtn');
              var actions = cancel && cancel.closest ? cancel.closest('.d-flex') : null;
              if (actions && analyze && !actions.contains(analyze)) {
                  actions = analyze.closest ? analyze.closest('.d-flex') : actions;
              }
              if (actions) actions.classList.add('analysis-primary-actions');
          }

'''
          if 'function installResponsiveLifecycleLayout()' not in text:
              text = text.replace(marker, hook + marker, 1)
          call_marker = '    function installLifecycleCommands() {\n'
          if "        installResponsiveLifecycleLayout();\n" not in text:
              text = text.replace(call_marker,
                                  call_marker + '        installResponsiveLifecycleLayout();\n', 1)
          projects.write_text(text, encoding='utf-8')

          contract = root / 'taxonomy-app/src/test/java/com/taxonomy/AnalysisSessionFrontendContractTest.java'
          text = contract.read_text(encoding='utf-8')
          insertion = '''
    @Test
    void lifecycleControlsRemainReachableAtHighZoomAndRespectRoleHooks()
            throws IOException {
        String template = resource("/templates/index.html");
        String projects = resource(
                "/static/js/core/taxonomy-analysis-session-projects.js");
        String css = resource("/static/css/analysis-lifecycle.css");

        assertThat(template)
                .contains("analysis-lifecycle.css")
                .contains("data-analysis-session-action=\\\"new-project\\\"")
                .contains("data-analysis-session-action=\\\"add-requirement\\\"")
                .contains("aria-haspopup=\\\"true\\\"");
        assertThat(projects)
                .contains("installResponsiveLifecycleLayout")
                .contains("analysis-lifecycle-menu-group")
                .contains("analysis-primary-actions");
        assertThat(css)
                .contains("@media (max-width: 575.98px)")
                .contains("flex-wrap: wrap")
                .contains("overflow-wrap: anywhere");
    }
'''
          anchor = '\n    @Test\n    void workingDraftIsWorkspacePinnedSerializedAndOptimisticallyVersioned()'
          if 'lifecycleControlsRemainReachableAtHighZoomAndRespectRoleHooks' not in text:
              text = text.replace(anchor, insertion + anchor, 1)
          contract.write_text(text, encoding='utf-8')
          PY

          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-analysis-session-projects.js
          git diff --check
          ./mvnw -B -ntp -pl taxonomy-app -am \
            -DskipITs \
            -Dtest=AnalysisSessionFrontendContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/pr917-responsive-lifecycle.yml
          git add -A
          git commit -m 'fix: keep analysis lifecycle controls reachable at high zoom'
          git push origin HEAD:fix/repeatable-analysis-reset-and-lifecycle-menu
