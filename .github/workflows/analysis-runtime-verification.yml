name: Analysis runtime clean-source verification (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: analysis-runtime-clean-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 077429a2aae4c7f68a321021a647722f64537171
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Verify exact clean published source
        run: |
          test "$(git rev-parse HEAD)" = 077429a2aae4c7f68a321021a647722f64537171
          test "$(git rev-parse HEAD^{tree})" = 2dda03a5c85de465cc2646704d8d3d9d43ee6861
          test -z "$(git status --porcelain)"
          test ! -e .github/scripts/workbench-analysis-review.py
          test ! -e .github/scripts/workbench-analysis-baseline.py
          test ! -e .github/workflows/analysis-runtime-verification.yml
          mkdir -p target
          git rev-parse HEAD HEAD^{tree} | tee target/analysis-source-identity.log
      - name: Complete default verification
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify -DexcludedGroups=real-llm 2>&1 | tee target/analysis-clean-full.log
      - name: JavaScript and strict base-path contract
        run: |
          set -o pipefail
          node --test .github/scripts/analysis-live-progress.test.mjs .github/scripts/analysis-operation-controller.test.mjs 2>&1 | tee target/analysis-clean-js.log
          node .github/scripts/test-taxonomy-base-path.mjs 2>&1 | tee target/analysis-clean-base-path.log
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Preserve exact-source execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analysis-clean-077429a2
          path: |
            target/analysis-*.log
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
            **/target/analysis-ui-evidence/**
          retention-days: 7
          if-no-files-found: warn
