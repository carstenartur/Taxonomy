name: One-shot OpenTelemetry memory review fixes

on:
  push:
    branches:
      - qa/issue-636-stable-otel-memory

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-636-stable-otel-memory
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply fail-closed review fixes
        run: python3 .github/scripts/apply-otel-memory-review-fixes.py

      - name: Verify focused memory contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ./mvnw -B -pl taxonomy-app -am \
            -Dtest=com.taxonomy.ObservabilityPerformanceMemoryTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Commit permanent fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/test/java/com/taxonomy/ObservabilityPerformanceIT.java \
            taxonomy-app/src/test/java/com/taxonomy/ObservabilityPerformanceMemoryTest.java
          git diff --cached --quiet && exit 0
          git commit -m 'Harden OpenTelemetry memory fallback and budget tests'
          git push
