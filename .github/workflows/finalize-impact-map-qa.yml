name: Finalize impact map QA

on:
  push:
    branches:
      - fix/usable-result-impact-map
    paths:
      - .github/workflows/finalize-impact-map-qa.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/usable-result-impact-map
          fetch-depth: 0

      - name: Apply and verify final usability refinements
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/finalize-impact-map-qa.py
          node --check taxonomy-app/src/main/resources/static/js/shared/taxonomy-impact-map.js
          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js
          node --check .github/scripts/ui-acceptance.mjs
          node --test .github/scripts/taxonomy-impact-map.test.mjs
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            taxonomy-app/src/main/resources/static/js/shared/taxonomy-impact-map.js \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js \
            .github/scripts/taxonomy-impact-map.test.mjs \
            .github/scripts/ui-acceptance.mjs
          git commit -m "Complete impact map usability verification"
          git push origin HEAD:fix/usable-result-impact-map
