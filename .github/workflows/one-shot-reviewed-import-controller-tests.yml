name: One-shot reviewed import controller tests

on:
  push:
    branches:
      - qa/issue-647-reviewed-import-controller

permissions:
  contents: write

concurrency:
  group: one-shot-reviewed-import-controller-tests
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-647-reviewed-import-controller
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Correct test hygiene
        run: python3 .github/scripts/fix-reviewed-import-controller-test.py

      - name: Run focused controller branch tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/fix-reviewed-import-controller-test.py
          ./mvnw -B -pl taxonomy-app -am \
            -Dtest=com.taxonomy.portfolio.PortfolioReviewedImportControllerTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
          git diff --check

      - name: Commit permanent tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taxonomy-app/src/test/java/com/taxonomy/portfolio/PortfolioReviewedImportControllerTest.java
          git diff --cached --quiet && exit 0
          git commit -m 'Cover reviewed import controller branches'
          git push origin HEAD:qa/issue-647-reviewed-import-controller
