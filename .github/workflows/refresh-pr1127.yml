name: Reviewed module-ownership refresh
on:
  push:
    branches: [maintenance/refresh-pr1127-20260926]
    paths: [.github/maintenance/**, .github/workflows/refresh-pr1127.yml]
permissions: {}
jobs:
  prepare-reviewed-tree:
    if: github.repository == 'carstenartur/Taxonomy' && github.ref == 'refs/heads/maintenance/refresh-pr1127-20260926'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify bounded relocations and their resource contracts on the exact main
        run: node .github/maintenance/refresh-pr1127.mjs prepare
      - name: Publish reviewed tree objects without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/maintenance/refresh-pr1127.mjs publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reviewed-pr1127-refresh
          path: |
            pr1127-automatic-merge.txt
            pr1127-refresh-candidate.json
            pr1127-refresh.patch
            pr1127-refresh-receipt.json
          if-no-files-found: error
          retention-days: 7
