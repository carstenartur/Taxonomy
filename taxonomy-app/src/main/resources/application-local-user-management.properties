# Opt-in HTML account administration. Registration additionally requires !keycloak
# and taxonomy.security.local-users-enabled=true (the existing local-mode default).
# Do NOT force local-users-enabled here: external identity providers take precedence.
# Newly created/reset passwords must be changed by their owner by default.
taxonomy.security.require-password-change=${TAXONOMY_REQUIRE_PASSWORD_CHANGE:true}
