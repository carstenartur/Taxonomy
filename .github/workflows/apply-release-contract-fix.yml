name: Apply release contract fix

on:
  push:
    branches:
      - fix/free-next-version-and-release-resume
    paths:
      - '.github/workflows/apply-release-contract-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/free-next-version-and-release-resume
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Align authoritative source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-release.yml')
          text = workflow.read_text(encoding='utf-8')
          old_source = 'SOURCE_BRANCH: $' + '{{ github.ref_name }}'
          if text.count(old_source) != 1:
              raise SystemExit(f'Expected one {old_source!r}, found {text.count(old_source)}')
          workflow.write_text(
              text.replace(old_source, 'SOURCE_BRANCH: main'),
              encoding='utf-8',
          )

          contract = Path('.github/scripts/check-release-delivery-contract.py')
          text = contract.read_text(encoding='utf-8')
          old_checkout = '        "ref: main",\n'
          new_checkout = (
              '        "github.event_name == \'push\' && github.sha || \'main\'",\n'
          )
          if text.count(old_checkout) != 1:
              raise SystemExit(
                  f'Expected one checkout contract, found {text.count(old_checkout)}'
              )
          contract.write_text(
              text.replace(old_checkout, new_checkout),
              encoding='utf-8',
          )
          PY

      - name: Verify release contracts
        run: |
          set -euo pipefail
          python3 .github/scripts/test-resolve-release-parameters.py
          python3 .github/scripts/check-release-delivery-contract.py

      - name: Commit patch and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-release-contract-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-release.yml \
            .github/scripts/check-release-delivery-contract.py \
            .github/workflows/apply-release-contract-fix.yml
          git commit -m 'Align release source and delivery contract'
          git push origin HEAD:fix/free-next-version-and-release-resume
