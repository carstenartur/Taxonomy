name: Release Workflow

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-request.json'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version without leading v, for example 1.2.3. Must match the current SNAPSHOT base.'
        required: true
        type: string
      next_development_version:
        description: 'Next development version, for example 1.2.4-SNAPSHOT. Leave empty to increment patch.'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests in a dry run only. Published releases always run the canonical verification suite.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate and build without changing remote refs, releases, images or deploy hooks.'
        required: false
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  issues: read
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish and advance to the next snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Resolve release parameters
        id: release_parameters
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_NEXT_DEVELOPMENT_VERSION: ${{ inputs.next_development_version }}
          INPUT_SKIP_TESTS: ${{ inputs.skip_tests }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "push":
              request_path = Path(".github/release-request.json")
              request = json.loads(request_path.read_text(encoding="utf-8"))
              release_version = request["release_version"]
              next_version = request.get("next_development_version", "")
              skip_tests = str(bool(request.get("skip_tests", False))).lower()
              dry_run = str(bool(request.get("dry_run", False))).lower()
          else:
              release_version = os.environ["INPUT_RELEASE_VERSION"]
              next_version = os.environ["INPUT_NEXT_DEVELOPMENT_VERSION"]
              skip_tests = os.environ["INPUT_SKIP_TESTS"] or "false"
              dry_run = os.environ["INPUT_DRY_RUN"] or "false"

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              print(f"release_version={release_version}", file=output)
              print(f"next_development_version={next_version}", file=output)
              print(f"skip_tests={skip_tests}", file=output)
              print(f"dry_run={dry_run}", file=output)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install verified Helm 3.21.0
        env:
          HELM_VERSION: v3.21.0
        shell: bash
        run: bash .github/scripts/install-helm.sh

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Verify release Helm chart before publication
        if: hashFiles('deploy/helm/taxonomy/Chart.yaml') != ''
        shell: bash
        run: bash deploy/helm/taxonomy/verify.sh "$RUNNER_TEMP/taxonomy-helm-preflight.yaml"

      - name: Preserve release scripts
        run: |
          cp .github/scripts/release.sh "$RUNNER_TEMP/release.sh"
          cp .github/scripts/update-release-metadata.py \
            "$RUNNER_TEMP/update-release-metadata.py"
          cp .github/scripts/check-version-state.py \
            "$RUNNER_TEMP/check-version-state.py"
          cp .github/scripts/generate-vex.py "$RUNNER_TEMP/generate-vex.py"
          chmod +x "$RUNNER_TEMP/release.sh" \
            "$RUNNER_TEMP/update-release-metadata.py" \
            "$RUNNER_TEMP/check-version-state.py" \
            "$RUNNER_TEMP/generate-vex.py"

      - name: Test version-state guard
        run: python3 .github/scripts/test-check-version-state.py

      - name: Build, publish and prepare next development version
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_parameters.outputs.release_version }}
          NEXT_VERSION_INPUT: ${{ steps.release_parameters.outputs.next_development_version }}
          SKIP_TESTS: ${{ steps.release_parameters.outputs.skip_tests }}
          DRY_RUN: ${{ steps.release_parameters.outputs.dry_run }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          METADATA_HELPER: ${{ runner.temp }}/update-release-metadata.py
          VERSION_STATE_HELPER: ${{ runner.temp }}/check-version-state.py
          VEX_HELPER: ${{ runner.temp }}/generate-vex.py
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/bge-small-en-v1.5
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
        run: "$RUNNER_TEMP/release.sh"

      - name: Checkout immutable release source
        if: steps.release_parameters.outputs.dry_run != 'true'
        run: git checkout --detach "v${{ steps.release_parameters.outputs.release_version }}"

      - name: Package and publish immutable Helm artifacts
        if: steps.release_parameters.outputs.dry_run != 'true' && hashFiles('deploy/helm/taxonomy/Chart.yaml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_parameters.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          artifact_dir="$RUNNER_TEMP/helm-release"
          mkdir -p "$artifact_dir"

          python3 .github/scripts/check-version-state.py \
            --mode release --expected-version "$RELEASE_VERSION" --tag "$tag"
          helm lint deploy/helm/taxonomy \
            --set "image.tag=${tag}" \
            --set existingSecret=taxonomy-secrets
          helm package deploy/helm/taxonomy \
            --destination "$artifact_dir" \
            --version "$RELEASE_VERSION" \
            --app-version "$RELEASE_VERSION"
          chart_archive="$artifact_dir/taxonomy-${RELEASE_VERSION}.tgz"
          test -f "$chart_archive"

          chart_version=$(helm show chart "$chart_archive" \
            | awk '$1 == "version:" {print $2; exit}')
          app_version=$(helm show chart "$chart_archive" \
            | awk '$1 == "appVersion:" {gsub(/\"/, "", $2); print $2; exit}')
          test "$chart_version" = "$RELEASE_VERSION"
          test "$app_version" = "$RELEASE_VERSION"

          manifest="$artifact_dir/taxonomy-${RELEASE_VERSION}-kubernetes.yaml"
          helm template taxonomy deploy/helm/taxonomy \
            --namespace taxonomy \
            --set "image.tag=${tag}" \
            --set existingSecret=taxonomy-secrets \
            > "$manifest"
          grep -Fq "image: \"ghcr.io/carstenartur/taxonomy:${tag}\"" "$manifest"
          grep -Fq 'readOnlyRootFilesystem: true' "$manifest"
          grep -Fq 'runAsUser: 10001' "$manifest"

          (
            cd "$artifact_dir"
            sha256sum "taxonomy-${RELEASE_VERSION}.tgz" \
              "taxonomy-${RELEASE_VERSION}-kubernetes.yaml" \
              > "taxonomy-${RELEASE_VERSION}-helm.sha256"
          )
          gh release upload "$tag" "$artifact_dir"/* --clobber

      - name: Describe immutable release source
        id: release_source
        if: steps.release_parameters.outputs.dry_run != 'true'
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.release_parameters.outputs.dry_run != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable release image
        if: steps.release_parameters.outputs.dry_run != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/taxonomy:v${{ steps.release_parameters.outputs.release_version }}
          labels: |
            org.opencontainers.image.title=Taxonomy Architecture Analyzer
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release_parameters.outputs.release_version }}
            org.opencontainers.image.revision=${{ steps.release_source.outputs.sha }}
          build-args: |
            BUILD_DATE=${{ steps.release_source.outputs.created }}
            VCS_REF=${{ steps.release_source.outputs.sha }}
            VERSION=${{ steps.release_parameters.outputs.release_version }}

      - name: Verify final main snapshot with canonical CI
        if: steps.release_parameters.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          main_sha=$(git rev-parse origin/main)
          gh workflow run ci-cd.yml --ref main

          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh run list \
              --workflow ci-cd.yml \
              --event workflow_dispatch \
              --commit "$main_sha" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [[ -n "$run_id" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Could not locate the post-release CI run for $main_sha"
            exit 1
          fi
          gh run watch "$run_id" --exit-status
