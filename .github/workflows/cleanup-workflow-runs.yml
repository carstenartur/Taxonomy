name: Cleanup Old Workflow Runs

on:
  workflow_run:
    workflows: ['CI / CD']
    types: [requested]
  schedule:
    - cron: '17 2 * * *' # Daily at 02:17 UTC.
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Retain completed runs of active workflows for this many days'
        required: false
        type: number
        default: '5'
      historical_retain_days:
        description: 'Retain runs of removed one-off workflows for this many days'
        required: false
        type: number
        default: '2'
      keep_minimum_runs:
        description: 'Keep at least this many recent runs per active workflow'
        required: false
        type: number
        default: '3'
      dry_run:
        description: 'Only report the deletion plan; do not delete runs'
        required: false
        type: boolean
        default: true
      max_deletions:
        description: 'Maximum deletions in one execution'
        required: false
        type: number
        default: '1500'

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  superseded-pr-verification:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted maintenance script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Release a superseded PR verification waiting on its final job
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-superseded-pr-verification.mjs

  cleanup:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: workflow-run-cleanup
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the retention policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }

      - name: Plan and apply workflow-run retention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RETAIN_DAYS: ${{ inputs.retain_days || '5' }}
          HISTORICAL_RETAIN_DAYS: ${{ inputs.historical_retain_days || '2' }}
          KEEP_MINIMUM_RUNS: ${{ inputs.keep_minimum_runs || '3' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          MAX_DELETIONS: ${{ inputs.max_deletions || '1500' }}
        run: bash .github/scripts/cleanup-workflow-runs.sh
