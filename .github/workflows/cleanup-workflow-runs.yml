name: Cleanup Old Workflow Runs

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Delete ordinary runs older than this many days'
        required: false
        type: number
        default: '10'
      evidence_retain_days:
        description: 'Retain release/QA/security evidence runs for at least this many days'
        required: false
        type: number
        default: '90'
      keep_minimum_runs:
        description: 'Always keep at least this many recent runs per workflow'
        required: false
        type: number
        default: '5'
      dry_run:
        description: 'Dry run — log what would be deleted without actually deleting'
        required: false
        type: boolean
        default: false
      max_deletions:
        description: 'Maximum number of runs to delete per execution (prevents rate limiting)'
        required: false
        type: number
        default: '500'

env:
  DEFAULT_RETAIN_DAYS: '10'
  EVIDENCE_RETAIN_DAYS: '90'
  DEFAULT_KEEP_MINIMUM_RUNS: '5'
  DEFAULT_MAX_DELETIONS: '500'

permissions:
  actions: write  # Required to delete workflow runs

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
    - name: Delete old workflow runs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        RETAIN_DAYS: ${{ inputs.retain_days || env.DEFAULT_RETAIN_DAYS }}
        EVIDENCE_RETAIN_DAYS: ${{ inputs.evidence_retain_days || env.EVIDENCE_RETAIN_DAYS }}
        KEEP_MINIMUM_RUNS: ${{ inputs.keep_minimum_runs || env.DEFAULT_KEEP_MINIMUM_RUNS }}
        DRY_RUN: ${{ inputs.dry_run || 'false' }}
        MAX_DELETIONS: ${{ inputs.max_deletions || env.DEFAULT_MAX_DELETIONS }}
      shell: bash
      run: |
        set -euo pipefail

        RETAIN_DAYS=${RETAIN_DAYS%.*}
        EVIDENCE_RETAIN_DAYS=${EVIDENCE_RETAIN_DAYS%.*}
        KEEP_MINIMUM_RUNS=${KEEP_MINIMUM_RUNS%.*}
        MAX_DELETIONS=${MAX_DELETIONS%.*}

        if (( EVIDENCE_RETAIN_DAYS < 90 )); then
          echo "::error::Evidence retention cannot be reduced below 90 days."
          exit 1
        fi

        TOTAL_DELETED=0
        TOTAL_RETAINED=0
        SUMMARY_ROWS=""

        is_evidence_workflow() {
          case "$1" in
            "CI / CD"|"Database Compatibility"|"Security Scan"|"CodeQL Source Analysis"|\
            "Release Workflow"|"QA Summary"|"Publish QA Summary"|"Pages QA Publication")
              return 0
              ;;
            *)
              return 1
              ;;
          esac
        }

        echo "ordinary_retention=${RETAIN_DAYS}d evidence_retention=${EVIDENCE_RETAIN_DAYS}d minimum_runs=${KEEP_MINIMUM_RUNS} dry_run=${DRY_RUN}"

        WORKFLOWS=$(gh api "repos/${REPO}/actions/workflows?per_page=100" \
          --paginate \
          --jq '.workflows[] | "\(.id)\t\(.name)"')

        while IFS=$'\t' read -r WF_ID WF_NAME; do
          [ -n "$WF_ID" ] || continue

          WF_RETAIN_DAYS="$RETAIN_DAYS"
          RETENTION_CLASS="ordinary"
          if is_evidence_workflow "$WF_NAME"; then
            WF_RETAIN_DAYS="$EVIDENCE_RETAIN_DAYS"
            RETENTION_CLASS="evidence"
          fi
          WF_CUTOFF=$(date -d "-${WF_RETAIN_DAYS} days" +%s)

          echo ""
          echo "Processing ${WF_NAME} (id=${WF_ID}, class=${RETENTION_CLASS}, retention=${WF_RETAIN_DAYS}d)"

          RUNS=$(gh api \
            "repos/${REPO}/actions/workflows/${WF_ID}/runs?status=completed&per_page=100" \
            --paginate \
            --jq '.workflow_runs[] | "\(.id)\t\(.created_at)"' || true)

          WF_NAME_SAFE="${WF_NAME//|/\\|}"
          if [ -z "$RUNS" ]; then
            SUMMARY_ROWS="${SUMMARY_ROWS}| ${WF_NAME_SAFE} | ${RETENTION_CLASS} | ${WF_RETAIN_DAYS} | 0 | 0 |\n"
            continue
          fi

          WF_DELETED=0
          WF_RETAINED=0
          RUN_INDEX=0

          while IFS=$'\t' read -r RUN_ID RUN_CREATED; do
            RUN_INDEX=$((RUN_INDEX + 1))

            if [ "$RUN_INDEX" -le "$KEEP_MINIMUM_RUNS" ]; then
              WF_RETAINED=$((WF_RETAINED + 1))
              continue
            fi

            RUN_TS=$(date -d "$RUN_CREATED" +%s)
            if [ "$RUN_TS" -ge "$WF_CUTOFF" ]; then
              WF_RETAINED=$((WF_RETAINED + 1))
              continue
            fi

            if [ "$TOTAL_DELETED" -ge "$MAX_DELETIONS" ]; then
              echo "Reached deletion cap ${MAX_DELETIONS}; remaining cleanup continues next run."
              break 2
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "[DRY RUN] Would delete ${WF_NAME} run ${RUN_ID} from ${RUN_CREATED}"
            else
              echo "Deleting ${WF_NAME} run ${RUN_ID} from ${RUN_CREATED}"
              if ! gh api --method DELETE "repos/${REPO}/actions/runs/${RUN_ID}"; then
                echo "::warning::Could not delete run ${RUN_ID}; leaving it for a later cleanup."
                continue
              fi
              sleep 1
            fi
            WF_DELETED=$((WF_DELETED + 1))
            TOTAL_DELETED=$((TOTAL_DELETED + 1))
          done <<< "$RUNS"

          TOTAL_RETAINED=$((TOTAL_RETAINED + WF_RETAINED))
          SUMMARY_ROWS="${SUMMARY_ROWS}| ${WF_NAME_SAFE} | ${RETENTION_CLASS} | ${WF_RETAIN_DAYS} | ${WF_RETAINED} | ${WF_DELETED} |\n"
        done <<< "$WORKFLOWS"

        {
          if [ "$DRY_RUN" = "true" ]; then
            echo "### Workflow Runs Cleanup — Dry Run"
          else
            echo "### Workflow Runs Cleanup"
          fi
          echo ""
          echo "Release, QA, database and security evidence workflows are protected for at least ${EVIDENCE_RETAIN_DAYS} days."
          echo ""
          echo "| Workflow | Class | Retention days | Retained | Deleted |"
          echo "| --- | --- | ---: | ---: | ---: |"
          printf "%b" "$SUMMARY_ROWS"
          echo ""
          echo "Total retained: ${TOTAL_RETAINED}; total deleted: ${TOTAL_DELETED}."
        } >> "$GITHUB_STEP_SUMMARY"
