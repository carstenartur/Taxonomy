name: Isolated consolidated preflight
on:
  push:
    branches: [verify/llm-consolidated-20260922]
permissions:
  contents: read
  actions: read
jobs:
  failure-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the exact application assertion and preceding events
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/carstenartur/Taxonomy/actions/jobs/106886806797/logs > sql.log
          node <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('sql.log','utf8').replace(/\x1b\[[0-9;]*m/g,'').split('\n');
          const start = lines.findIndex(line => line.includes('Running com.taxonomy.CivilianArchitectureAcceptanceTest'));
          const end = lines.findIndex((line,index) => index > start && line.includes('<<< FAILURE! -- in com.taxonomy.CivilianArchitectureAcceptanceTest'));
          console.log('CIVILIAN_FAILURE_CONTEXT\n'+lines.slice(Math.max(start, end - 35), end + 185).join('\n'));
          console.log('MEMORY_EVENTS\n'+lines.filter(line => /MEMORY_PRESSURE|OutOfMemoryError|headroom|Heap:|memory pressure/.test(line)).slice(-30).join('\n'));
          NODE
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Compile and run combined analysis, lifecycle, budget and parser regressions
        run: |
          mkdir -p target/consolidated-preflight
          set -o pipefail
          ./mvnw -B -ntp test '-Dtest=Analysis*Test,PromptBudgetEnforcingLlmGatewayTest,LlmResponse*Test,LlmDiagnosticTest' -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee target/consolidated-preflight/java-green.log
      - name: Run diagnostic and editor lifecycle contracts
        if: always()
        run: |
          mkdir -p target/consolidated-preflight
          set -o pipefail
          node --check .github/scripts/browser-sessions-acceptance.mjs
          node --test .github/scripts/analysis-*.test.mjs .github/scripts/taxonomy-dsl-validation.test.mjs 2>&1 | tee target/consolidated-preflight/js-green.log
      - name: Record the exact candidate and reviewed diff
        if: always()
        run: |
          git fetch --depth=1 origin ca27cebbc04e7f0f80bc03d38ec4d1e85fba2374
          git diff --check ca27cebbc04e7f0f80bc03d38ec4d1e85fba2374
          git diff --stat ca27cebbc04e7f0f80bc03d38ec4d1e85fba2374
          git diff ca27cebbc04e7f0f80bc03d38ec4d1e85fba2374 -- taxonomy-analysis/src/main/java .github/scripts > target/consolidated-preflight/candidate.patch
          git rev-parse HEAD > target/consolidated-preflight/commit.txt
          git ls-tree -r HEAD -- taxonomy-analysis/src/main/java .github/scripts/browser-sessions-acceptance.mjs .github/scripts/browser-sessions-departure.test.mjs .github/scripts/taxonomy-dsl-validation.test.mjs taxonomy-analysis/src/test/java/com/taxonomy/analysis/service/AnalysisPromptEvidenceTest.java > target/consolidated-preflight/source-blobs.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consolidated-preflight-green
          path: |
            target/consolidated-preflight/**
            taxonomy-analysis/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 3
