name: Verify remaining IP authority RED
on:
  push:
    branches: [ "verify/ip-authority-parts-red-20260923" ]
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp -pl taxonomy-architecture -am -Dtest=CatalogueAuthorityProjectionContractTest -Dsurefire.failIfNoSpecifiedTests=false test
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp -pl taxonomy-tooling -am -Dtest=CatalogueHierarchyAuthorityTest -Dsurefire.failIfNoSpecifiedTests=false test
