name: Apply exact next-version release contract

on:
  push:
    branches:
      - fix/resume-staged-release-1.2.9
    paths:
      - '.github/workflows/apply-exact-next-version-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/resume-staged-release-1.2.9
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Restore exact next development version input
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-release.yml')
          text = path.read_text(encoding='utf-8')

          old_inputs = """      next_version_increment:
                description: 'Select how the development version advances after this release.'
                required: true
                type: choice
                default: patch
                options:
                  - patch
                  - minor
                  - major
          """
          new_inputs = """      next_development_version:
                description: 'Exact next development version (X.Y.Z-SNAPSHOT). Overrides the increment choice; leave empty to derive it.'
                required: false
                type: string
                default: ''
              next_version_increment:
                description: 'Fallback only when the exact next development version is empty.'
                required: false
                type: choice
                default: patch
                options:
                  - patch
                  - minor
                  - major
          """
          if text.count(old_inputs) != 1:
              raise SystemExit('Expected exactly one old next-version input block')
          text = text.replace(old_inputs, new_inputs)

          old_env = """          EVENT_NAME: ${{ github.event_name }}
                    INPUT_NEXT_VERSION_INCREMENT: ${{ inputs.next_version_increment }}
          """
          new_env = """          EVENT_NAME: ${{ github.event_name }}
                    INPUT_NEXT_DEVELOPMENT_VERSION: ${{ inputs.next_development_version }}
                    INPUT_NEXT_VERSION_INCREMENT: ${{ inputs.next_version_increment }}
          """
          if text.count(old_env) != 1:
              raise SystemExit('Expected exactly one release parameter environment block')
          text = text.replace(old_env, new_env)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify release input and delivery contracts
        run: |
          set -euo pipefail
          python3 .github/scripts/test-resolve-release-parameters.py
          python3 .github/scripts/check-release-delivery-contract.py

      - name: Commit final patch and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-exact-next-version-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-release.yml \
            .github/workflows/apply-exact-next-version-contract.yml
          git commit -m 'Restore freely selectable next development versions'
          git push origin HEAD:fix/resume-staged-release-1.2.9
