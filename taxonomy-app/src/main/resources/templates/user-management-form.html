<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/user-management-layout :: head}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/user-management-layout :: navigation}"></header>
<main id="userManagementMain" class="container py-4">
    <div class="row justify-content-center"><div class="col-12 col-lg-8">
        <h1 th:text="${creating} ? #{users.create} : #{users.edit}">Edit user</h1>
        <div th:replace="~{fragments/user-management-layout :: feedback}"></div>
        <form id="userProfileForm" class="card card-body mb-4" method="post" th:object="${form}"
              th:action="${creating} ? @{/admin/users(lang=${#locale.language})} : @{/admin/users/{id}(id=${account.id},lang=${#locale.language})}">
            <div class="mb-3">
                <label class="form-label" for="username" th:text="#{users.username}">Username</label>
                <input class="form-control" id="username" th:field="*{username}" required maxlength="255"
                       th:readonly="${!creating}" autocomplete="off" aria-describedby="usernameHelp"/>
                <div id="usernameHelp" class="form-text" th:text="#{users.usernameHelp}"></div>
                <p class="text-danger" th:if="${#fields.hasErrors('username')}" th:text="#{users.error.username}"></p>
            </div>
            <div class="mb-3">
                <label class="form-label" for="displayName" th:text="#{users.displayName}">Display name</label>
                <input class="form-control" id="displayName" th:field="*{displayName}" maxlength="255" autocomplete="off"/>
                <p class="text-danger" th:if="${#fields.hasErrors('displayName')}" th:text="#{users.error.displayName}"></p>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email" th:text="#{users.email}">Email</label>
                <input class="form-control" id="email" th:field="*{email}" type="email" maxlength="255" autocomplete="off"/>
                <p class="text-danger" th:if="${#fields.hasErrors('email')}" th:text="#{users.error.email}"></p>
            </div>
            <fieldset class="mb-3" aria-describedby="rolesHelp">
                <legend class="fs-6" th:text="#{users.roles}">Roles</legend>
                <div class="form-check" th:each="role : ${availableRoles}">
                    <input class="form-check-input" type="checkbox" th:field="*{roles}" th:value="${role}"/>
                    <label class="form-check-label" th:for="${#ids.prev('roles')}" th:text="${#messages.msg('users.role.' + role)}"></label>
                </div>
                <p id="rolesHelp" class="form-text" th:text="#{users.rolesHelp}"></p>
                <p class="text-danger" th:if="${#fields.hasErrors('roles*')}" th:text="#{users.error.roles}"></p>
            </fieldset>
            <th:block th:if="${creating}">
                <div th:replace="~{:: passwordFields}"></div>
            </th:block>
            <div class="d-flex flex-wrap gap-2">
                <button id="saveUserButton" type="submit" class="btn btn-primary" th:text="${creating} ? #{users.create} : #{users.save}">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/users(lang=${#locale.language})}" th:text="#{users.cancel}">Cancel</a>
            </div>
        </form>
        <section th:unless="${creating}" class="card card-body">
            <h2 class="h4" th:text="#{users.resetPassword}">Reset password</h2>
            <p th:text="#{users.resetHelp}"></p>
            <form id="userPasswordForm" method="post" th:action="@{/admin/users/{id}/password(id=${account.id},lang=${#locale.language})}">
                <div th:replace="~{:: passwordFields}"></div>
                <button type="submit" class="btn btn-outline-primary" th:text="#{users.resetPassword}">Reset password</button>
            </form>
        </section>
    </div></div>
</main>
<!-- This fragment is only rendered where explicitly included above. Passwords are never model attributes. -->
<th:block th:if="${false}">
    <div th:fragment="passwordFields">
        <p th:if="${temporaryPasswords}" class="alert alert-info" th:text="#{users.temporaryPassword}"></p>
        <p th:unless="${temporaryPasswords}" class="alert alert-warning" th:text="#{users.permanentPassword}"></p>
        <div class="mb-3">
            <label class="form-label" for="newPassword" th:text="#{users.newPassword}">New password</label>
            <input class="form-control" id="newPassword" name="newPassword" type="password" required
                   th:minlength="${minimumPasswordLength}" maxlength="72" autocomplete="new-password" aria-describedby="passwordHelp"/>
            <p class="form-text" id="passwordHelp" th:text="#{users.passwordHelp}"></p>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword" th:text="#{users.confirmPassword}">Confirm password</label>
            <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" required
                   th:minlength="${minimumPasswordLength}" maxlength="72" autocomplete="new-password"/>
        </div>
    </div>
</th:block>
</body>
</html>
