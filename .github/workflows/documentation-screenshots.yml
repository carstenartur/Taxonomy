name: Documentation Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/documentation-screenshots.yml'
      - '.github/scripts/decision-export-browser.mjs'
      - '.github/scripts/install-playwright-github.sh'
      - '.github/package.json'
      - '.github/package-lock.json'
      - '.github/scripts/document-template-*.mjs'
      - 'pom.xml'
      - 'taxonomy-build/pom.xml'
      - 'taxonomy-build/src/test/java/com/taxonomy/build/*Capture*'
      - 'taxonomy-build/src/test/java/com/taxonomy/build/*Screenshot*'
      - 'taxonomy-build/src/test/java/com/taxonomy/build/ScreenshotDocumentationIT.java'
      - 'taxonomy-build/src/test/java/com/taxonomy/build/DocumentTemplateReportDownloadIT.java'
      - 'taxonomy-app/src/test/java/com/taxonomy/ScreenshotGeneratorIT.java'
      - 'taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java'
      - 'taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java'
      - 'taxonomy-app/src/main/resources/templates/**'
      - 'taxonomy-app/src/main/resources/static/**'
      - 'docs/de/**'
      - 'docs/en/**'

permissions:
  contents: read

concurrency:
  group: taxonomy-documentation-screenshots-${{ github.ref }}
  cancel-in-progress: false

env:
  EMBEDDING_MODEL_REVISION: e8f8c211226b894fcb81acc59f3b34ba3efd5f42

jobs:
  generate:
    name: Generate screenshot artifact
    runs-on: ubuntu-latest
    env:
      TAXONOMY_DOCS_IMAGE_DIR: ${{ github.workspace }}/target/generated-screenshots
    permissions:
      contents: read
    steps:
      - name: Validate invocation
        run: |
          case "${GITHUB_EVENT_NAME}" in workflow_dispatch|pull_request) ;; *) exit 1 ;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
            .mvn/dependency-cache-epoch

      - name: Configure and verify Docker Hub cache
        run: bash .github/scripts/configure-docker-mirror.sh

      - name: Install document rendering tools
        uses: ./.github/actions/document-rendering

      - name: Download and verify pinned embedding model
        env:
          MODEL_REVISION: ${{ env.EMBEDDING_MODEL_REVISION }}
        run: bash .github/scripts/download-embedding-model.sh

      - name: Prepare fresh screenshot output
        run: |
          set -euo pipefail
          # Every screenshot owner honors TAXONOMY_DOCS_IMAGE_DIR. Retained docs
          # remain available for link checks and application resource packaging.
          mkdir -p target/generated-screenshots
          find target/generated-screenshots -maxdepth 1 -type f \( -name '*.png' -o -name '*.json' \) -delete

      - name: Generate deterministic documentation screenshots
        env:
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/multilingual-minilm
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
        run: ./mvnw -B verify -Pscreenshots

      - name: Stage screenshot artifact
        run: |
          set -euo pipefail
          test -s target/generated-screenshots/documentation-screenshots.json

      - name: Upload screenshot failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation-screenshot-failures
          path: |
            target/screenshot-failures/
            taxonomy-app/target/failsafe-reports/
            taxonomy-build/target/failsafe-reports/
            target/junit-drivers/
            target/ui-verification/document-template-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload generated screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-documentation-screenshots
          path: |
            target/generated-screenshots/*.png
            target/generated-screenshots/*.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish screenshots to main
    needs: generate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate publication target
        run: |
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git branch --show-current)" = "main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Download verified screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-documentation-screenshots
          path: docs/images

      - name: Commit verified screenshots and provenance
        run: |
          jq -e --arg sha "${GITHUB_SHA}" '.sourceCommit == $sha and .sourceDirty == false' \
            docs/images/documentation-screenshots.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/images/*.png docs/images/documentation-screenshots.json docs/images/decision-export-screenshots.json
          if git diff --staged --quiet; then
            echo "No screenshot changes to publish."
            exit 0
          fi
          git commit -m 'docs: regenerate documentation screenshots [skip ci]'
          git push origin HEAD:main
