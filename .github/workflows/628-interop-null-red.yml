name: Reproduce nullable interop requirements
on:
  push:
    branches: [verification/628-review-followup]
    paths: [.github/workflows/628-interop-null-red.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          ref: cd3b71b1c979e0a49fc175b6572e4096539f88d6
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: eba5039c2731005f4a76e2f47b120403e8684b1b
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: source/**/pom.xml
      - name: Introduce the consumer behavior regressions only
        run: |
          cp ../control/verification/IntegrationNullableRequirementTest.java taxonomy-interop/src/test/java/com/taxonomy/interop/
          git diff --exit-code
      - name: Require six assertion failures and no execution errors
        run: |
          set +e
          ./mvnw -B -ntp -Dsurefire.failIfNoSpecifiedTests=false -Dtest=IntegrationNullableRequirementTest test > "$RUNNER_TEMP/red.log" 2>&1
          result=$?
          set -e
          if [[ "$result" == 0 ]]; then echo 'Expected null-handling regressions unexpectedly passed'; exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import os, xml.etree.ElementTree as ET
          path = Path('taxonomy-interop/target/surefire-reports/TEST-com.taxonomy.interop.IntegrationNullableRequirementTest.xml')
          if not path.is_file():
              print(Path(os.environ['RUNNER_TEMP'], 'red.log').read_text()[-12000:])
              raise SystemExit('No JUnit result: compilation/infrastructure failure is not the reproduced defect')
          result = ET.parse(path).getroot()
          counts = {key: int(result.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
          assert counts == {'tests': 6, 'failures': 6, 'errors': 0, 'skipped': 0}, counts
          for case in result.findall('testcase'):
              print('REPRODUCED', case.get('name'), case.find('failure').get('message'))
          print('NULL REQUIREMENT REGRESSIONS', counts)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: interop-null-red
          path: |
            ${{ runner.temp }}/red.log
            source/taxonomy-interop/target/surefire-reports/TEST-com.taxonomy.interop.IntegrationNullableRequirementTest.xml
          retention-days: 7
          if-no-files-found: error
