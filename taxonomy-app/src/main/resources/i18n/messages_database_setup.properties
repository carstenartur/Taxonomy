database.setup.support.evaluation=Evaluation only: SQL Server and Oracle have connection profiles, but their complete migration, persistence and recovery path is not qualified for production.
database.setup.server.required=The database server must already be running. In Rancher, expose the PostgreSQL workload through a ClusterIP Service before continuing.
