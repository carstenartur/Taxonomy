name: Delivery

on:
  workflow_run:
    workflows: [ "CI / CD" ]
    types: [ completed ]
    branches:
      - main
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/taxonomy

jobs:
  publish-reports:
    name: Publish reports
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: taxonomy-quality-report-publication
      cancel-in-progress: false
    steps:
      - name: Checkout verified quality tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download verified report artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: quality-reports
          path: quality-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify report provenance and badge consistency
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-quality-publication.py \
            --root quality-reports \
            --expected-commit "$EXPECTED_SHA"

      - name: Publish reports to GitHub Pages atomically
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: quality-reports
          keep_files: false
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Publish verified quality reports ${{ github.event.workflow_run.head_sha }}'

      - name: Verify published GitHub Pages evidence
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          CONFIGURED_BASE_URL: ${{ vars.QUALITY_REPORT_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CONFIGURED_BASE_URL" ]]; then
            base_url="$CONFIGURED_BASE_URL"
          else
            repo_name="${GITHUB_REPOSITORY#*/}"
            base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo_name}"
          fi
          python3 .github/scripts/verify-quality-publication.py \
            --base-url "$base_url" \
            --expected-commit "$EXPECTED_SHA" \
            --attempts 60 \
            --interval-seconds 10

  publish-image:
    name: Publish Docker Image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (
        github.event.workflow_run.head_branch == github.event.repository.default_branch ||
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch }}
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch }}
            type=raw,value=${{ github.event.workflow_run.head_branch }},enable=${{ startsWith(github.event.workflow_run.head_branch, 'v') }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
          annotations: |
            org.opencontainers.image.title=Taxonomy Architecture Analyzer
            org.opencontainers.image.description=Spring Boot web application for C3-taxonomy catalogue analysis
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Carsten Hammer
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.event.workflow_run.head_sha }}
            VERSION=${{ steps.meta.outputs.version }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
            github_actor=${{ github.actor }}

  deploy-render:
    name: Deploy to Render
    needs: publish-image
    if: >-
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout verified delivery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Trigger and verify Render deployment
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          BASE_URL: ${{ vars.RENDER_BASE_URL || 'https://taxonomy-analyzer.onrender.com' }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HOOK_URL" ]]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured; Render deployment is disabled."
            exit 0
          fi
          mkdir -p target/delivery-evidence
          deploy_url=$(python3 - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          url = os.environ["HOOK_URL"]
          expected = os.environ["EXPECTED_SHA"]
          parts = urlsplit(url)
          query = dict(parse_qsl(parts.query, keep_blank_values=True))
          query["ref"] = expected
          print(urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment)))
          PY
          )
          curl --fail --silent --show-error --retry 3 \
            --output target/delivery-evidence/render-deploy-hook.json \
            "$deploy_url"
          echo "Render deployment triggered for the verified commit; waiting for readiness."
          python3 .github/scripts/verify-deployment.py \
            --base-url "$BASE_URL" \
            --expected-commit "$EXPECTED_SHA" \
            --evidence-file target/delivery-evidence/render-verification.json

      - name: Archive Render deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: render-deployment-evidence-${{ github.event.workflow_run.head_sha }}
          path: target/delivery-evidence/**
          if-no-files-found: warn
          retention-days: 90
