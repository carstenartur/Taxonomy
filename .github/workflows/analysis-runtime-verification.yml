name: Analysis exact source snapshot (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e952154a242da558a4df8544f31eac335d026dd1
          persist-credentials: false
      - name: Archive unchanged source, not a build or acceptance claim
        run: |
          test "$(git rev-parse HEAD)" = e952154a242da558a4df8544f31eac335d026dd1
          test "$(git rev-parse HEAD^{tree})" = 94348e138f1ca8dda5eb19219b8c075adfb1aa7f
          git archive --format=zip HEAD > /tmp/taxonomy-e952154a-source.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: taxonomy-e952154a-source
          path: /tmp/taxonomy-e952154a-source.zip
          retention-days: 1
          if-no-files-found: error
