name: Reconcile architecture export user guides once

on:
  push:
    branches:
      - fix/snapshot-bound-architecture-exports
    paths:
      - .github/workflows/reconcile-export-user-guides-once.yml

permissions:
  contents: write

concurrency:
  group: reconcile-export-user-guides-once
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'carstenartur/Taxonomy' && github.actor == 'carstenartur'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Reconcile English and German export guidance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new)

          en_path = Path('docs/en/USER_GUIDE.md')
          en = en_path.read_text(encoding='utf-8')
          en = replace_once(
              en,
              '## 10. Exporting Results\n\n',
              '''## 10. Exporting Results

          ### Reviewed snapshot handoff versus ad-hoc convenience export

          For external review or evidence, open the persisted result in the **Copilot Architecture Workbench** and use its **Export format** selector. That workflow addresses one immutable project analysis snapshot and serializes the exact graph shown in the workbench; downloading does **not** invoke the LLM again.

          The buttons on the ad-hoc analysis screen described below are convenience exports from the current browser/analysis context. They are not yet proof that a file represents an immutable reviewed portfolio snapshot. Do not use them as authoritative handoff evidence.

          The snapshot-bound workbench offers Evidence JSON, SVG, PDF, experimental ArchiMate Exchange XML, Mermaid, and Structurizr DSL. Visio is deliberately withheld there until VSDX compatibility is certified. See **[Architecture Handoff from an Immutable Snapshot](ARCHITECTURE_HANDOFF.md)** for format roles, provenance headers, fingerprints, and current limitations.

          ''',
              'English section introduction')
          en = replace_once(
              en,
              '''### Visio (.vsdx) Architecture Diagram

          Click **📥 Visio** to download a structured Microsoft Visio file (`.vsdx`) representing the Architecture View. The diagram includes the anchor nodes, related elements, and labelled relationships.

          > **Requires:** The Architecture View checkbox must have been enabled before running the analysis.
          ''',
              '''### Visio (.vsdx) Architecture Diagram — Experimental Convenience Export

          The existing **📥 Visio** button produces an experimental convenience export from the ad-hoc analysis path. It is not certified as a reliable editable Microsoft Visio handoff, is not offered by the immutable-snapshot workbench, and must not be used as authoritative evidence. Package/schema repair and real Microsoft Visio open-edit-save-reopen validation are tracked in #965.

          > **Requires:** The Architecture View checkbox must have been enabled before running the analysis. Even then, use SVG/PDF plus snapshot Evidence JSON for a current review handoff.
          ''',
              'English Visio guidance')
          en = replace_once(
              en,
              '''### ArchiMate XML Architecture Diagram

          Click **📥 ArchiMate** to download an ArchiMate 3.x XML file suitable for import into tools such as Archi or Sparx EA.

          > **Requires:** The Architecture View checkbox must have been enabled before running the analysis.
          ''',
              '''### ArchiMate Exchange XML — Experimental Model Exchange

          For a reviewed result, select **ArchiMate Exchange XML (experimental)** in the immutable-snapshot workbench. It is derived from the same stored graph as the accompanying Evidence JSON, SVG, and PDF. The ad-hoc **📥 ArchiMate** button described by older screenshots is not snapshot-authoritative.

          The exporter is being validated against the ArchiMate 3.1 exchange schemas, but its type mapping is intentionally lossy and independent-tool semantic round-trip evidence is not yet complete. Do not describe the file as universally lossless or fully interoperable; #967 tracks the remaining certification work.
          ''',
              'English ArchiMate guidance')
          en = replace_once(
              en,
              '''> **Semantic distinction:** A score of `0` in the JSON means the node was _evaluated and found not relevant_. A node code that is _absent_ from the JSON was never evaluated.
          ''',
              '''> **Semantic distinction:** A score of `0` in the JSON means the node was _evaluated and found not relevant_. A node code that is _absent_ from the JSON was never evaluated.

          > **Different JSON contracts:** `SavedAnalysis` JSON supports score export/import on the ad-hoc analysis screen. **Evidence JSON** from the architecture workbench is the handoff record for an immutable architecture snapshot and additionally embeds snapshot/commit coordinates, the canonical graph fingerprint, render projection, warnings, and declared format roles.
          ''',
              'English JSON distinction')
          en_path.write_text(en, encoding='utf-8')

          de_path = Path('docs/de/USER_GUIDE.md')
          de = de_path.read_text(encoding='utf-8')
          de = replace_once(
              de,
              '## 10. Ergebnisse exportieren\n\n',
              '''## 10. Ergebnisse exportieren

          ### Geprüften Snapshot übergeben oder Ad-hoc-Komfortexport verwenden

          Für externe Reviews oder Nachweise öffnen Sie das persistierte Ergebnis in der **Copilot Architecture Workbench** und verwenden dort die Auswahl **Export format**. Dieser Ablauf adressiert genau einen unveränderlichen Projektanalyse-Snapshot und serialisiert den in der Workbench sichtbaren Graphen; beim Download wird das LLM **nicht** erneut aufgerufen.

          Die nachfolgend beschriebenen Schaltflächen der Ad-hoc-Analyseansicht sind Komfortexporte aus dem aktuellen Browser-/Analysekontext. Sie belegen noch nicht, dass eine Datei einen unveränderlichen geprüften Portfolio-Snapshot darstellt. Verwenden Sie sie nicht als autoritative Übergabeevidenz.

          Die snapshotgebundene Workbench bietet Evidenz-JSON, SVG, PDF, experimentelles ArchiMate Exchange XML, Mermaid und Structurizr DSL. Visio wird dort bewusst nicht angeboten, bis die VSDX-Kompatibilität zertifiziert ist. Siehe **[Architekturübergabe aus einem unveränderlichen Snapshot](ARCHITECTURE_HANDOFF.md)** für Formatrollen, Provenienz-Header, Fingerprints und aktuelle Grenzen.

          ''',
              'German section introduction')
          de = replace_once(
              de,
              '''### Visio (.vsdx) Architekturdiagramm

          Klicken Sie auf **📥 Visio**, um eine strukturierte Microsoft Visio-Datei (`.vsdx`) herunterzuladen, die die Architekturansicht darstellt. Das Diagramm enthält die Anker-Knoten, verwandte Elemente und beschriftete Beziehungen.

          > **Voraussetzung:** Die Checkbox „Architecture View" muss vor der Durchführung der Analyse aktiviert worden sein.
          ''',
              '''### Visio (.vsdx) Architekturdiagramm — experimenteller Komfortexport

          Die bisherige Schaltfläche **📥 Visio** erzeugt einen experimentellen Komfortexport aus dem Ad-hoc-Analysepfad. Er ist nicht als zuverlässige editierbare Microsoft-Visio-Übergabe zertifiziert, wird in der Workbench für unveränderliche Snapshots nicht angeboten und darf nicht als autoritative Evidenz verwendet werden. Paket-/Schemareparatur und ein realer Öffnen-Bearbeiten-Speichern-Wiederöffnen-Test in Microsoft Visio werden in #965 verfolgt.

          > **Voraussetzung:** Die Checkbox „Architecture View" muss vor der Analyse aktiviert worden sein. Verwenden Sie für eine derzeitige Review-Übergabe dennoch SVG/PDF zusammen mit dem snapshotgebundenen Evidenz-JSON.
          ''',
              'German Visio guidance')
          de = replace_once(
              de,
              '''### ArchiMate XML-Architekturdiagramm

          Klicken Sie auf **📥 ArchiMate**, um eine ArchiMate 3.x XML-Datei herunterzuladen, die zum Import in Tools wie Archi oder Sparx EA geeignet ist.

          > **Voraussetzung:** Die Checkbox „Architecture View" muss vor der Durchführung der Analyse aktiviert worden sein.
          ''',
              '''### ArchiMate Exchange XML — experimenteller Modellaustausch

          Wählen Sie für ein geprüftes Ergebnis in der Workbench für unveränderliche Snapshots **ArchiMate Exchange XML (experimental)**. Die Datei wird aus demselben gespeicherten Graphen wie Evidenz-JSON, SVG und PDF erzeugt. Die aus älteren Screenshots bekannte Ad-hoc-Schaltfläche **📥 ArchiMate** ist nicht snapshotautorativ.

          Der Exporter wird gegen die ArchiMate-3.1-Exchange-Schemata validiert; seine Typabbildung ist jedoch bewusst verlustbehaftet, und der semantische Roundtrip durch unabhängige Werkzeuge ist noch nicht vollständig nachgewiesen. Bezeichnen Sie die Datei nicht als universell verlustfrei oder vollständig interoperabel; #967 verfolgt die verbleibende Zertifizierung.
          ''',
              'German ArchiMate guidance')
          de = replace_once(
              de,
              '''> **Semantische Unterscheidung:** Ein Wert von `0` im JSON bedeutet, dass der Knoten _bewertet und als nicht relevant eingestuft_ wurde. Ein Knoten-Code, der im JSON _fehlt_, wurde nie bewertet.
          ''',
              '''> **Semantische Unterscheidung:** Ein Wert von `0` im JSON bedeutet, dass der Knoten _bewertet und als nicht relevant eingestuft_ wurde. Ein Knoten-Code, der im JSON _fehlt_, wurde nie bewertet.

          > **Unterschiedliche JSON-Verträge:** `SavedAnalysis`-JSON dient dem Export und erneuten Laden von Bewertungen in der Ad-hoc-Analyseansicht. Das **Evidenz-JSON** der Architektur-Workbench ist der Übergabenachweis für einen unveränderlichen Architektur-Snapshot und enthält zusätzlich Snapshot-/Commit-Koordinaten, den kanonischen Graph-Fingerprint, Renderprojektion, Warnungen und deklarierte Formatrollen.
          ''',
              'German JSON distinction')
          de_path.write_text(de, encoding='utf-8')
          PY

          git diff --check -- docs/en/USER_GUIDE.md docs/de/USER_GUIDE.md
          grep -Fq 'Architecture Handoff from an Immutable Snapshot' docs/en/USER_GUIDE.md
          grep -Fq 'Architekturübergabe aus einem unveränderlichen Snapshot' docs/de/USER_GUIDE.md
          ! grep -Fq 'suitable for import into tools such as Archi or Sparx EA' docs/en/USER_GUIDE.md
          ! grep -Fq 'zum Import in Tools wie Archi oder Sparx EA geeignet' docs/de/USER_GUIDE.md
          rm .github/workflows/reconcile-export-user-guides-once.yml

      - name: Commit only the final guide reconciliation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/en/USER_GUIDE.md \
            docs/de/USER_GUIDE.md \
            .github/workflows/reconcile-export-user-guides-once.yml
          actual=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/reconcile-export-user-guides-once.yml' \
            'docs/de/USER_GUIDE.md' \
            'docs/en/USER_GUIDE.md' | sort)
          test "$actual" = "$expected"
          git commit -m "Distinguish snapshot handoff from ad-hoc exports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
