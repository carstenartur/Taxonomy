name: Report Maven wrapper checksum

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-report-wrapper-checksum.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify Apache distribution and report SHA-256
        run: |
          set -euo pipefail
          properties=.mvn/wrapper/maven-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' "$properties")
          curl --fail --location --retry 4 --output /tmp/apache-maven-bin.zip "$url"
          expected_sha512=ed41650d42485cfc243fad22158caf9cbb5dc408ce7a09ddb94dd42a019de929ca43065bfa450612cf12bf78b5cafa3884b96c090de326ff590448c933454af3
          echo "$expected_sha512  /tmp/apache-maven-bin.zip" | sha512sum --check --strict
          sha256sum /tmp/apache-maven-bin.zip | cut -d' ' -f1 > wrapper-checksum.txt
          test $(wc -c < wrapper-checksum.txt) -eq 65
      - name: Upload verified checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-maven-wrapper-checksum
          path: wrapper-checksum.txt
          if-no-files-found: error
          retention-days: 2
