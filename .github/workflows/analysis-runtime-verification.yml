name: Prepare offline analysis test dependencies (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download pinned public test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/analysis-test-dependencies
          for path in \
            org/junit/platform/junit-platform-console-standalone/6.0.3/junit-platform-console-standalone-6.0.3.jar \
            com/jayway/jsonpath/json-path/2.10.0/json-path-2.10.0.jar \
            net/minidev/json-smart/2.6.0/json-smart-2.6.0.jar \
            net/minidev/accessors-smart/2.6.0/accessors-smart-2.6.0.jar \
            org/ow2/asm/asm/9.9.1/asm-9.9.1.jar; do
            curl --fail --silent --show-error --location --retry 2 "https://repo.maven.apache.org/maven2/$path" -o "/tmp/analysis-test-dependencies/${path##*/}"
          done
          cd /tmp/analysis-test-dependencies
          sha256sum *.jar > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analysis-pinned-test-dependencies
          path: /tmp/analysis-test-dependencies
          retention-days: 7
          if-no-files-found: error
