name: Verify PR 463 review fixes

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.env.example'
      - 'docs/*/CONTAINER_IMAGE.md'
      - 'taxonomy-app/src/main/java/com/taxonomy/security/config/AuthorizationRulesConfigurer.java'
      - 'taxonomy-app/src/test/java/com/taxonomy/SecurityTests.java'
      - 'taxonomy-app/src/test/java/com/taxonomy/ProductionHardeningTests.java'
      - '.github/workflows/temp-verify-pr-463-review-fixes.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Reject obsolete authenticated build wiring
        run: |
          set -euo pipefail
          ! grep -R -n -E 'github-packages-settings|GITHUB_ACTOR|GITHUB_TOKEN|read:packages|GitHub Packages' \
            Dockerfile docker-compose*.yml .env.example docs/en/CONTAINER_IMAGE.md docs/de/CONTAINER_IMAGE.md
      - name: Validate production Compose model
        env:
          DOMAIN: taxonomy.example.com
          TAXONOMY_ADMIN_PASSWORD: test-only-password
        run: docker compose -f docker-compose.prod.yml config >/dev/null
      - name: Verify authorization and rate-limit regressions
        run: >-
          ./mvnw -B -pl taxonomy-app -am
          -Dtest=SecurityTests,ProductionHardeningTests
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Build source stage without credentials
        id: docker_build
        continue-on-error: true
        run: |
          set -o pipefail
          docker build --progress=plain --target build -t taxonomy-source-build-check . 2>&1 | tee docker-build.log
      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: credential-free-docker-build-log
          path: docker-build.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Docker build result
        if: steps.docker_build.outcome != 'success'
        run: exit 1
