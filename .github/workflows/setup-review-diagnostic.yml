name: Setup review diagnostic (isolated branch)
on:
  push:
    branches: [verify/pr1142-review-regressions-20260928]
permissions:
  contents: read
jobs:
  helm:
    name: Inspect Helm regression input and error boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6e8ec0d69b7b4fbad91f598288cc883b86086ef8
          persist-credentials: false
      - name: Install repository-pinned Helm
        env: {HELM_VERSION: v3.21.0}
        run: bash .github/scripts/install-helm.sh
      - name: Inspect synthetic credential rejection without printing values
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          common=(--set image.tag=sha-0123456789abcdef0123456789abcdef01234567 --set existingSecret=taxonomy-secrets)
          for key in ADMIN_TOKEN customApiKey; do
            echo "Schema diagnostic for $key"
            if helm template taxonomy deploy/helm/taxonomy "${common[@]}" --set-json "config={\"$key\":\"redacted-test-input\"}" >"$tmp/out" 2>"$tmp/error"; then
              echo ACCEPTED
            else
              sed 's/redacted-test-input/[redacted]/g' "$tmp/error"
            fi
          done
          printf '%s' 'https://identity.example.invalid\evil/realm' >"$tmp/endpoint"
          echo 'Literal endpoint file diagnostic'
          if helm template taxonomy deploy/helm/taxonomy "${common[@]}" --set authentication.mode=keycloak --set config.KEYCLOAK_CLIENT_ID=taxonomy-app --set-file "config.KEYCLOAK_ISSUER_URI=$tmp/endpoint" >"$tmp/out" 2>"$tmp/error"; then
            echo ACCEPTED
          else
            cat "$tmp/error"
          fi
