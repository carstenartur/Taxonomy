name: Diagnose CI workflow syntax

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate the proposed CI workflow
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          # The target workflow deliberately stores two unexpanded shell snippets
          # as fail-closed contract literals. Ignore only those two SC2016 sites;
          # every other actionlint and ShellCheck finding remains authoritative.
          ./actionlint -color \
            -ignore 'SC2016:info:(6|8):3: Expressions don.t expand in single quotes' \
            .github/workflows/ci-cd.yml
