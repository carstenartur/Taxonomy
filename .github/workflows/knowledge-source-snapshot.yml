name: Knowledge extraction source snapshot
on:
  push:
    branches: [work/628-knowledge-source-snapshot]
    paths: [.github/workflows/knowledge-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 604635ce2fa3de1847b786b003565dc6e464f435
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Compile baseline and verify existing initialization regression
        run: ./mvnw -B -ntp -pl taxonomy-app -am -Dtest=AppInitializationStateServiceTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Archive tracked source and dependency caches without credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git archive --format=tar.gz HEAD > snapshot/source.tar.gz
          git rev-parse HEAD > snapshot/source-commit.txt
          tar -czf snapshot/maven-cache.tar.gz -C "$HOME/.m2" repository wrapper
          sha256sum snapshot/*.tar.gz > snapshot/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: knowledge-source-and-test-cache
          path: snapshot/*
          if-no-files-found: error
          retention-days: 1
