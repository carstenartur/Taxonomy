name: Kubernetes Constrained Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [ main, feat/artemis-execution-base, 'implementation/**' ]
    paths:
      - '.github/scripts/configure-docker-mirror.sh'
      - 'Dockerfile'
      - 'pom.xml'
      - 'taxonomy-tooling/**'
      - 'taxonomy-domain/**'
      - 'taxonomy-dsl/**'
      - 'taxonomy-sparx-mapping/**'
      - 'taxonomy-export/**'
      - 'taxonomy-extension-api/**'
      - 'taxonomy-extension-runtime/**'
      - 'taxonomy-app/**'
      - 'taxonomy-workspace/**'
      - 'taxonomy-templates/**'
      - 'taxonomy-templates-api/**'
      - 'plugins/**'
      - '!plugins/*/README.md'
      - '!plugins/*/README_DE.md'
      - 'taxonomy-interop/**'
      - 'taxonomy-analysis/**'
      - 'taxonomy-knowledge/**'
      - 'taxonomy-architecture/**'
      - 'taxonomy-reporting/**'
      - 'taxonomy-reporting-api/**'
      - 'taxonomy-build/**'
      - 'deploy/artemis/**'
      - 'deploy/helm/taxonomy/**'
      - '.github/workflows/kubernetes-constrained-smoke.yml'
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/configure-docker-mirror.sh'
      - 'Dockerfile'
      - 'pom.xml'
      - 'taxonomy-tooling/**'
      - 'taxonomy-domain/**'
      - 'taxonomy-dsl/**'
      - 'taxonomy-sparx-mapping/**'
      - 'taxonomy-export/**'
      - 'taxonomy-extension-api/**'
      - 'taxonomy-extension-runtime/**'
      - 'taxonomy-app/**'
      - 'taxonomy-workspace/**'
      - 'taxonomy-templates/**'
      - 'taxonomy-templates-api/**'
      - 'plugins/**'
      - 'taxonomy-interop/**'
      - 'taxonomy-analysis/**'
      - 'taxonomy-knowledge/**'
      - 'taxonomy-architecture/**'
      - 'taxonomy-reporting/**'
      - 'taxonomy-reporting-api/**'
      - 'taxonomy-build/**'
      - 'deploy/artemis/**'
      - 'deploy/helm/taxonomy/**'
      - '.github/workflows/kubernetes-constrained-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-kubernetes-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  constrained-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ResourceQuota, readiness and restricted egress
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure and verify Docker Hub cache
        run: bash .github/scripts/configure-docker-mirror.sh

      - name: Set up Java 25 for Maven metadata and fixture trust stores
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Install verified kind 0.31.0
        env:
          KIND_VERSION: v0.31.0
          KIND_MODULE_SUM: h1:UcT4nzm+YM7YEbqiAKECk+b6dsvc/HRZZu9U0FolL1g=
        shell: bash
        run: |
          set -euo pipefail
          asset="kind-linux-amd64"
          base="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}"
          curl_flags=(-fsSL --retry 3 --retry-max-time 120 --connect-timeout 10 --max-time 60)
          if curl "${curl_flags[@]}" -o "$RUNNER_TEMP/kind" "${base}/${asset}" \
            && curl "${curl_flags[@]}" -o "$RUNNER_TEMP/kind.sha256sum" "${base}/${asset}.sha256sum"; then
            expected=$(awk 'NF {print $1; exit}' "$RUNNER_TEMP/kind.sha256sum")
            test "${#expected}" -eq 64
            printf '%s  %s\n' "$expected" "$RUNNER_TEMP/kind" \
              | sha256sum -c -
          else
            # The Go proxy is independent of the GitHub release download.
            export GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org GOTOOLCHAIN=local
            module="sigs.k8s.io/kind@${KIND_VERSION}"
            go mod download -json "$module" \
              | jq -e --arg sum "$KIND_MODULE_SUM" '.Sum == $sum' >/dev/null
            GOBIN="$RUNNER_TEMP/kind-from-source" go install "$module"
            mv "$RUNNER_TEMP/kind-from-source/kind" "$RUNNER_TEMP/kind"
          fi
          sudo install -m 0755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kind version

      - name: Install verified kubectl 1.35.0
        env:
          KUBECTL_VERSION: v1.35.0
        shell: bash
        run: |
          set -euo pipefail
          base="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64"
          curl -fsSLo "$RUNNER_TEMP/kubectl" "${base}/kubectl"
          curl -fsSLo "$RUNNER_TEMP/kubectl.sha256" "${base}/kubectl.sha256"
          expected=$(awk 'NF {print $1; exit}' "$RUNNER_TEMP/kubectl.sha256")
          test "${#expected}" -eq 64
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/kubectl" \
            | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          kubectl version --client

      - name: Install verified Helm 3.21.0
        env:
          HELM_VERSION: v3.21.0
        shell: bash
        run: bash .github/scripts/install-helm.sh

      - name: Create constrained kind cluster
        shell: bash
        run: |
          set -euo pipefail
          kind create cluster --name taxonomy-smoke --wait 180s
          # Pods pull through each node's containerd, independently of dockerd.
          # kind 0.31 enables /etc/containerd/certs.d; hosts files reload live.
          nodes=$(kind get nodes --name taxonomy-smoke)
          test -n "$nodes"
          for node in $nodes; do
            docker exec "$node" mkdir -p /etc/containerd/certs.d/docker.io
            printf '%s\n' \
              'server = "https://registry-1.docker.io"' \
              '[host."https://mirror.gcr.io"]' \
              '  capabilities = ["pull", "resolve"]' \
              | docker exec -i "$node" tee /etc/containerd/certs.d/docker.io/hosts.toml >/dev/null
          done

      - name: Build, install and verify Taxonomy under quota
        env:
          KIND_CLUSTER_NAME: taxonomy-smoke
          SOURCE_SHA: ${{ github.sha }}
          KEEP_RESOURCES: 'true'
        shell: bash
        run: bash deploy/helm/taxonomy/constrained-smoke.sh

      - name: Verify external Artemis, shared database and worker-loss recovery
        env:
          KIND_CLUSTER_NAME: taxonomy-smoke
          SOURCE_SHA: ${{ github.sha }}
          KEEP_RESOURCES: 'true'
        shell: bash
        run: bash deploy/helm/taxonomy/artemis-constrained-smoke.sh

      - name: Collect secret-free cluster diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p target/kubernetes-smoke
          kubectl get nodes -o wide \
            > target/kubernetes-smoke/nodes.txt 2>&1 || true
          kubectl get pods,services,networkpolicies,resourcequotas,limitranges \
            --all-namespaces -o wide \
            > target/kubernetes-smoke/cluster-resources.txt 2>&1 || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp \
            > target/kubernetes-smoke/events.txt 2>&1 || true

      - name: Upload constrained-cluster evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kubernetes-constrained-smoke
          path: target/kubernetes-smoke/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90

      - name: Delete kind cluster
        if: always()
        shell: bash
        run: kind delete cluster --name taxonomy-smoke || true
