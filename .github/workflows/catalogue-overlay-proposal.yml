name: Catalogue Overlay Proposal

on:
  pull_request:
    paths:
      - 'taxonomy-tooling/**'
      - 'tools/catalogue-overlay/**'
      - 'taxonomy-app/src/main/resources/data/C3_Taxonomy_Catalogue_25AUG2025.xlsx'
      - 'taxonomy-app/src/main/resources/data/nato-taxonomy.json'
      - 'docs/en/CATALOGUE_OVERLAY_PROPOSALS.md'
      - 'docs/de/CATALOGUE_OVERLAY_PROPOSALS.md'
      - '.github/workflows/catalogue-overlay-proposal.yml'
  push:
    branches: [main]
    paths:
      - 'taxonomy-tooling/**'
      - 'tools/catalogue-overlay/**'
      - 'taxonomy-app/src/main/resources/data/C3_Taxonomy_Catalogue_25AUG2025.xlsx'
      - 'taxonomy-app/src/main/resources/data/nato-taxonomy.json'
      - '.github/workflows/catalogue-overlay-proposal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-overlay-proposal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proposal:
    name: Deterministic proposal and review report
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test repository tooling
        run: >-
          ./mvnw -B -pl taxonomy-tooling -am verify
          -Dtaxonomy.ui.skip=true
          -Dtaxonomy.quality.skip=true

      - name: Generate review-only proposal
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find taxonomy-tooling/target -maxdepth 1 -type f \
            -name 'taxonomy-tooling-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | sort)
          if [[ ${#jars[@]} -ne 1 ]]; then
            printf 'Expected exactly one taxonomy-tooling runtime JAR, found %d\n' "${#jars[@]}" >&2
            exit 1
          fi
          java -cp "${jars[0]}" \
            com.taxonomy.tooling.CatalogueOverlayProposalGenerator \
            --root "${GITHUB_WORKSPACE}"

      - name: Upload proposal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: catalogue-overlay-proposal
          path: target/catalogue-overlay/**
          if-no-files-found: error
          retention-days: 90
