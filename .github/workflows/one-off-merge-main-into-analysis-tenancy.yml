name: One-off merge current main into analysis tenancy

on:
  push:
    branches:
      - agent/743-analysis-artifact-tenancy
    paths:
      - .github/workflows/one-off-merge-main-into-analysis-tenancy.yml

permissions:
  contents: write

concurrency:
  group: taxonomy-analysis-tenancy-main-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.event.head_commit.message == 'Prepare guarded main integration for analysis tenancy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/743-analysis-artifact-tenancy
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact branch and main heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "da9f682ef783a07dba78e1ee4ddc524f7376eddb"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "11b8559fa842db0ba9152552b9c7d8bb0bee3eb7"

      - name: Merge main with explicit conflict authority
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -gt 1 ]]; then
            echo "::error::git merge failed with status $merge_status" >&2
            exit "$merge_status"
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          allowed=(
            "taxonomy-app/src/main/java/com/taxonomy/versioning/service/HypothesisService.java"
            "taxonomy-app/src/test/java/com/taxonomy/dsl/storage/TaxonomySchemaPostgresMigrationIT.java"
          )
          for conflict in "${conflicts[@]}"; do
            if [[ "$conflict" != "${allowed[0]}" && "$conflict" != "${allowed[1]}" ]]; then
              echo "::error::Unexpected merge conflict: $conflict" >&2
              exit 1
            fi
          done

          for file in "${allowed[@]}"; do
            if printf '%s\n' "${conflicts[@]}" | grep -Fxq "$file"; then
              git checkout --ours -- "$file"
            fi
          done

          hypothesis="${allowed[0]}"
          perl -0pi -e 's/RepositoryContext tenant = requireContext\(context\);/RepositoryContext tenant = requireWritableContext(context);/' "$hypothesis"
          grep -Fq 'RepositoryContext tenant = requireWritableContext(context);' "$hypothesis"
          grep -Fq 'persistFromAnalysisAfterCommit' "$hypothesis"
          grep -Fq 'TransactionSynchronizationManager.registerSynchronization' "$hypothesis"

          migration_test="${allowed[1]}"
          perl -0pi -e 's/where success = true order by installed_rank/where success = true and version is not null order by installed_rank/g' "$migration_test"
          grep -Fq '"14", "15"' "$migration_test"
          grep -Fq 'where success = true and version is not null' "$migration_test"

          git add "$hypothesis" "$migration_test"
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-off-analysis-artifact-model-tests.yml
          rm -f .github/workflows/one-off-merge-main-into-analysis-tenancy.yml
          git add -A
          git diff --cached --check

      - name: Run focused merged contracts
        shell: bash
        run: |
          ./mvnw -B -pl taxonomy-app -am \
            -DskipITs \
            -Dtaxonomy.model.download.skip=true \
            -Dtest=RequirementRelationMappingTest,RequirementElementMappingTest,RequirementAnalysisSnapshotTest,RequirementAnalysisJobItemTest,HypothesisCommitBoundaryTest,HypothesisMutationScopeTest,HypothesisLegacyRepositoryRoutingTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

      - name: Commit and push guarded merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Codex Connector'
          git config user.email 'chatgpt-codex-connector@users.noreply.github.com'
          test "$(git rev-parse origin/main)" = "11b8559fa842db0ba9152552b9c7d8bb0bee3eb7"
          git commit -m 'Merge release-hardened main into analysis artifact tenancy'
          git push origin HEAD:agent/743-analysis-artifact-tenancy
