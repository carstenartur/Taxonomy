apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taxonomy-taxonomy
  namespace: taxonomy
  labels:
    app.kubernetes.io/name: taxonomy
    app.kubernetes.io/instance: taxonomy
    app.kubernetes.io/version: "1.4.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: taxonomy-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taxonomy
      app.kubernetes.io/instance: taxonomy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchExpressions:
            - key: k8s-app
              operator: In
              values:
              - kube-dns
              - coredns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
