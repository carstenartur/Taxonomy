name: Apply decision rationale report extension

on:
  push:
    branches:
      - agent/decision-rationale-report-extension
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decision-rationale-report-extension
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Check out integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Merge current protected main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit origin/main
          echo "INTEGRATION_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply audited integration payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/decision-report-package/part-*.b64 | base64 --decode > /tmp/decision-report-source.tar.gz
          echo 'ff99f3d070e4067b27428ed759b713e9041e089d2677809b8822859f64599cd4  /tmp/decision-report-source.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/decision-report-source
          tar -xzf /tmp/decision-report-source.tar.gz -C /tmp/decision-report-source
          python3 /tmp/decision-report-source/apply_decision_report.py . --allow-different-base
          rm -rf .github/tmp/decision-report-package
          rm -f .github/workflows/apply-decision-report-extension.yml
          rm -f .github/workflows/diagnose-decision-report-fingerprint.yml

      - name: Correct verified reactor and hierarchy issues
        shell: bash
        run: |
          set -euo pipefail

          taxonomy_service='taxonomy-app/src/main/java/com/taxonomy/catalog/service/TaxonomyService.java'
          if ! grep -q '^import org.springframework.core.io.ClassPathResource;$' "$taxonomy_service"; then
            sed -i '/^import org.springframework.core.io.Resource;$/i import org.springframework.core.io.ClassPathResource;' "$taxonomy_service"
          fi

          python3 - "$taxonomy_service" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding='utf-8')
          old = '''        nonRoots.sort(Comparator.comparingInt(TaxonomyNode::getLevel));

                  int count = 0;
                  for (TaxonomyNode node : nonRoots) {
                      // Replace the in-memory parent reference with a lightweight managed proxy so
                      // that the FK column is set correctly even after earlier PC.clear() calls.
                      // getReference() returns an uninitialized proxy whose ID is set immediately;
                      // no SELECT is issued because only the FK value (the ID) is needed for the INSERT.
                      String parentCode = node.getParentCode();
                      if (parentCode != null && codeToId.containsKey(parentCode)) {
                          node.setParent(entityManager.getReference(TaxonomyNode.class,
                                  codeToId.get(parentCode)));
                      }
                      entityManager.persist(node);
                      codeToId.put(node.getCode(), node.getId());
                      count++;
                      if (count % BATCH_SIZE == 0) {
                          entityManager.flush();
                          entityManager.clear();
                      }
                  }
                  entityManager.flush();
                  entityManager.clear();
          '''
          new = '''        nonRoots.sort(Comparator.comparingInt(TaxonomyNode::getLevel)
                          .thenComparing(TaxonomyNode::getCode));

                  // The catalogue level is descriptive data and is not guaranteed to form a
                  // strict persistence order. Persist only nodes whose actual parent has already
                  // received an ID. This prevents a same-level child that precedes its parent in
                  // the workbook from being inserted with a null parent_id.
                  Map<String, TaxonomyNode> pending = new LinkedHashMap<>();
                  for (TaxonomyNode node : nonRoots) {
                      pending.put(node.getCode(), node);
                  }

                  int count = 0;
                  while (!pending.isEmpty()) {
                      boolean madeProgress = false;
                      Iterator<Map.Entry<String, TaxonomyNode>> iterator =
                              pending.entrySet().iterator();
                      while (iterator.hasNext()) {
                          TaxonomyNode node = iterator.next().getValue();
                          String parentCode = node.getParentCode();
                          Long parentId = parentCode != null ? codeToId.get(parentCode) : null;
                          if (parentId == null) {
                              continue;
                          }

                          // Replace the in-memory parent reference with a lightweight managed
                          // proxy so the FK remains correct across Persistence Context clears.
                          node.setParent(entityManager.getReference(TaxonomyNode.class, parentId));
                          entityManager.persist(node);
                          codeToId.put(node.getCode(), node.getId());
                          iterator.remove();
                          madeProgress = true;
                          count++;
                          if (count % BATCH_SIZE == 0) {
                              entityManager.flush();
                              entityManager.clear();
                          }
                      }

                      if (!madeProgress) {
                          List<String> unresolvedParents = pending.values().stream()
                                  .map(node -> node.getCode() + "->" + node.getParentCode())
                                  .sorted()
                                  .limit(20)
                                  .toList();
                          throw new IllegalStateException(
                                  "Cannot persist taxonomy hierarchy; unresolved parent references: "
                                          + unresolvedParents);
                      }
                  }
                  entityManager.flush();
                  entityManager.clear();
          '''
          if old not in source:
              raise SystemExit('Expected level-only persistence block was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

          renderer='taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleDocxRenderer.java'
          grep -Fq 'CTTblPr properties = tableXml.isSetTblPr() ? tableXml.getTblPr() : tableXml.addNewTblPr();' "$renderer"
          perl -0pi -e 's/        CTTblPr properties = tableXml\.isSetTblPr\(\) \? tableXml\.getTblPr\(\) : tableXml\.addNewTblPr\(\);/        CTTblPr properties = tableXml.getTblPr();\n        if (properties == null) {\n            properties = tableXml.addNewTblPr();\n        }/' "$renderer"
          test "$(grep -Fc 'paragraph.setKeepNext(true);' "$renderer")" -eq 2
          perl -0pi -e 's/        paragraph\.setKeepNext\(true\);/        if (paragraph.getCTP().getPPr() == null) {\n            paragraph.getCTP().addNewPPr();\n        }\n        paragraph.setKeepNext(true);/g' "$renderer"

          report_service='taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReportService.java'
          grep -Fq 'return value == null ? "" : String.valueOf(value).strip();' "$report_service"
          sed -i 's/return value == null ? "" : String.valueOf(value)\.strip();/return value == null ? "" : String.valueOf(value);/' "$report_service"

      - name: Verify exact change scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-decision-report-files <<'EOF'
          docs/de/DECISION_RATIONALE_REPORT.md
          docs/dev/07-extension-points.md
          docs/dev/tasks/add-report-family.md
          docs/en/DECISION_RATIONALE_REPORT.md
          taxonomy-app/src/main/java/com/taxonomy/analysis/service/LlmService.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionChapterDiagramRenderer.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleDocxRenderer.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleHtmlRenderer.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleJsonRenderer.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReport.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReportController.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReportPlugin.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReportService.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleSnapshotReportController.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleSnapshotReportService.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionReportBuildMetadataService.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionReportLabels.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/decision/TaxonomyCatalogueMetadataService.java
          taxonomy-app/src/main/java/com/taxonomy/architecture/report/ReportRendererRegistry.java
          taxonomy-app/src/main/java/com/taxonomy/catalog/service/TaxonomyService.java
          taxonomy-app/src/main/java/com/taxonomy/security/config/AuthorizationRulesConfigurer.java
          taxonomy-app/src/main/resources/application.properties
          taxonomy-app/src/main/resources/i18n/messages.properties
          taxonomy-app/src/main/resources/i18n/messages_de.properties
          taxonomy-app/src/main/resources/static/js/api/portfolio-api.js
          taxonomy-app/src/main/resources/static/js/core/taxonomy-browse.js
          taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js
          taxonomy-app/src/main/resources/static/js/core/taxonomy-state.js
          taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          taxonomy-app/src/main/resources/templates/index.html
          taxonomy-app/src/test/java/com/taxonomy/DecisionRationaleReportTests.java
          taxonomy-domain/src/main/java/com/taxonomy/dto/AnalysisResult.java
          taxonomy-extension-api/src/main/java/com/taxonomy/extension/api/report/ReportRenderContext.java
          taxonomy-extension-api/src/main/java/com/taxonomy/extension/api/report/ReportRendererExtension.java
          EOF
          sed -i 's/^          //' /tmp/expected-decision-report-files
          sort -o /tmp/expected-decision-report-files /tmp/expected-decision-report-files

          cat > /tmp/expected-transient-files <<'EOF'
          .github/tmp/decision-report-package/part-00.b64
          .github/tmp/decision-report-package/part-01.b64
          .github/tmp/decision-report-package/part-02.b64
          .github/tmp/decision-report-package/part-03a.b64
          .github/tmp/decision-report-package/part-03b.b64
          .github/tmp/decision-report-package/part-04.b64
          .github/tmp/decision-report-package/part-05.b64
          .github/tmp/decision-report-package/part-06a.b64
          .github/tmp/decision-report-package/part-06b.b64
          .github/tmp/decision-report-package/part-07a.b64
          .github/tmp/decision-report-package/part-07b.b64
          .github/tmp/decision-report-package/part-08a.b64
          .github/tmp/decision-report-package/part-08b.b64
          .github/workflows/apply-decision-report-extension.yml
          .github/workflows/diagnose-decision-report-fingerprint.yml
          EOF
          sed -i 's/^          //' /tmp/expected-transient-files

          {
            cat /tmp/expected-decision-report-files
            cat /tmp/expected-transient-files
          } | sort -u > /tmp/expected-all-files
          {
            git diff --name-only "$INTEGRATION_BASE"
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual-all-files
          diff -u /tmp/expected-all-files /tmp/actual-all-files

          test ! -e .github/tmp/decision-report-package
          test ! -e .github/workflows/apply-decision-report-extension.yml
          test ! -e .github/workflows/diagnose-decision-report-fingerprint.yml

      - name: Create local final-state commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t report_files < /tmp/expected-decision-report-files
          mapfile -t transient_files < /tmp/expected-transient-files
          git add -- "${report_files[@]}" "${transient_files[@]}"
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/staged-files
          diff -u /tmp/expected-all-files /tmp/staged-files
          git commit -m 'Add hierarchical decision rationale report extension'
          test -z "$(git status --porcelain)"

      - name: Run focused decision-report tests
        shell: bash
        run: |
          mkdir -p target/decision-report-diagnostics
          set -o pipefail
          ./mvnw -B -pl taxonomy-app -am \
            -Dtest=DecisionRationaleReportTests \
            -Dsurefire.failIfNoSpecifiedTests=false test \
            2>&1 | tee target/decision-report-diagnostics/focused-tests.log

      - name: Upload focused-test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: decision-report-focused-diagnostics
          path: |
            target/decision-report-diagnostics/**
            **/target/surefire-reports/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Run canonical verification
        shell: bash
        run: |
          mkdir -p target/decision-report-diagnostics
          set -o pipefail
          ./mvnw -B verify -Pci \
            2>&1 | tee target/decision-report-diagnostics/full-verify.log

      - name: Upload full-verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: decision-report-full-diagnostics
          path: |
            target/decision-report-diagnostics/**
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Push validated integration
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${TARGET_BRANCH}"
