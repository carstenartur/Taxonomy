name: PR 1054 corrected support ownership
on:
  push:
    branches: [verify/1054-support-class-ownership-20260917]
    paths: [.github/workflows/1054-support-ownership.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f62679f9127f25479f1a09f8464a04dfc1be096f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: {java-version: '21', distribution: temurin, cache: maven}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: support-ownership-red
          run-id: 35185423463
          github-token: ${{ github.token }}
          path: /tmp/support-red
      - name: Apply the reproduced tests and minimal ownership correction
        shell: python
        run: |
          from pathlib import Path
          import json,subprocess
          out=Path('/tmp/support-green');out.mkdir()
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')=='f62679f9127f25479f1a09f8464a04dfc1be096f'
          patches=list(Path('/tmp/support-red').rglob('tests.patch'))
          summaries=list(Path('/tmp/support-red').rglob('summary.json'))
          assert len(patches)==len(summaries)==1
          red=json.loads(summaries[0].read_text())
          assert red['source']==git('rev-parse','HEAD')
          assert red['suite']['failures']=='11' and red['suite']['errors']=='0'
          (out/'red-summary.json').write_text(json.dumps(red,indent=2)+'\n')
          subprocess.run(['git','apply','--index',str(patches[0])],check=True)
          def replace(path,old,new):
              file=Path(path);text=file.read_text();assert text.count(old)==1,(path,old)
              file.write_text(text.replace(old,new))
          graph='taxonomy-build/src/test/java/com/taxonomy/ArchitectureModuleGraph.java'
          tests='taxonomy-build/src/test/java/com/taxonomy/ArchitectureModuleGraphTest.java'
          docs='docs/dev/MODULE_EXTRACTION_GATE.md'
          replace(graph,
              '        if (supportModules.contains(physical)) {\n            return new Ownership(physical, physical, "existing support module");\n        }\n', '')
          replace(graph,'        String planned;\n        String reason;',
              '        // Shared/foundation packages keep their existing physical owner, but an\n'
              '        // explicit feature assignment cannot be hidden in a support module.\n'
              '        boolean featureContext = context != null && context.targetModule() != null\n'
              '                && !context.targetModule().equals(policy.compositionModule());\n'
              '        if (supportModules.contains(physical) && !featureContext) {\n'
              '            return new Ownership(physical, physical, "existing support module");\n'
              '        }\n'
              '        String planned;\n        String reason;')
          replace(graph,
              '                        && owner.physicalModule().equals(policy.compositionModule())) {',
              '                        && !owner.physicalModule().equals(owner.module())) {')
          replace(graph,
              '                            + ": still physically owned by " + policy.compositionModule());',
              '                            + ": still physically owned by " + owner.physicalModule());')
          text=Path(tests).read_text()
          start=text.index('    @org.junit.jupiter.params.ParameterizedTest\n',text.index('void rootCompositionClassAndItsNestedClassesCannotEvadeTheGraph'))
          end=text.index('    @Test\n    void exactPhysicalOwnershipRecognizesExistingModulesDespiteOverlappingAppPackages()',start)
          added=text[start:end]
          old='.contains(displaced, "invalid physical owner " + support, "planned owner is " + A));'
          assert added.count(old)==1
          added=added.replace(old,old+'\n        if (extracted) assertThat(result.blockers().get(A)).anySatisfy(message -> assertThat(message)\n                .contains(displaced, "still physically owned by " + support));')
          Path(tests).write_text(text[:start]+added+text[end:])
          replace(docs,
              'Their real dependencies remain in the graph. In particular,',
              'An explicit feature-context mapping is checked even for classes physically\n'
              'stored in a support library; such classes cannot evade their planned owner\n'
              'before or after extraction. Shared, unmapped and unresolved-target support\n'
              'packages retain their existing physical ownership. Displaced feature classes\n'
              'also appear in the affected feature assessment, including disconnected classes.\n'
              'Their real dependencies remain in the graph. In particular,')
          subprocess.run(['git','add','--',graph,tests,docs],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          paths=git('diff','--cached','--name-only').splitlines()
          assert set(paths)=={graph,tests,docs},paths
          doc={'base':git('rev-parse','HEAD'),'tree':git('write-tree'),
               'files':{p:git('hash-object',p) for p in paths},'redRun':35185423463}
          (out/'manifest.json').write_text(json.dumps(doc,indent=2)+'\n')
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--full-index','--binary']))
          subprocess.run(['git','-c','user.name=Architecture verification','-c','user.email=verification@invalid.example','commit','-m','Verify support ownership candidate locally on runner'],check=True)
          assert git('status','--porcelain')==''
          print(json.dumps(doc,indent=2))
      - name: Execute the complete architecture profile on this exact tree
        run: |
          set -o pipefail
          ./mvnw -B -ntp test -Parchitecture-tests -Dsurefire.failIfNoSpecifiedTests=false -Dtaxonomy.ui.skip=true 2>&1 | tee /tmp/support-green/architecture.log
      - name: Require actual successful guard execution and all counterexamples
        shell: python
        run: |
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          out=Path('/tmp/support-green');report={}
          for name in ('ArchitectureModuleGraphTest','ArchitectureModuleExtractionTest','ArchitectureSelectorSynchronizationTest'):
              path=Path('taxonomy-build/target/surefire-reports')/('TEST-com.taxonomy.'+name+'.xml')
              root=ET.parse(path).getroot()
              assert int(root.get('tests','0'))>0,root.attrib
              for key in ('failures','errors','skipped'): assert int(root.get(key,'0'))==0,root.attrib
              if name=='ArchitectureModuleGraphTest': assert int(root.get('tests'))==155,root.attrib
              report[name]=root.attrib
          anchors=list(Path('taxonomy-app/target/surefire-reports').glob('TEST-*selector-anchor*.xml'))
          assert len(anchors)==1,anchors
          root=ET.parse(anchors[0]).getroot()
          assert int(root.get('tests','0'))>0,root.attrib
          for key in ('failures','errors','skipped'): assert int(root.get(key,'0'))==0,root.attrib
          report['independent-anchor']=root.attrib
          (out/'test-counts.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
      - name: Complete frontend and delivery contracts
        run: |
          set -o pipefail
          ./mvnw -B -ntp -f .github/ui-verification-pom.xml verify -Pcontracts 2>&1 | tee /tmp/support-green/frontend.log
      - name: Publish exact tested blobs only, never move product refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,subprocess,urllib.request,zipfile
          from pathlib import Path
          out=Path('/tmp/support-green');doc=json.loads((out/'manifest.json').read_text())
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^{tree}')==doc['tree']
          assert git('diff','--name-only')==''
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          with zipfile.ZipFile(out/'tested-sources.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path,sha in doc['files'].items():
                  data=Path(path).read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha,path
                  req=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs',headers=headers,
                      data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST')
                  with urllib.request.urlopen(req) as response: assert json.load(response)['sha']==sha
                  archive.writestr(path,data)
          doc['verificationRun']=os.environ['GITHUB_RUN_ID']
          doc['verification']='Complete architecture profile and frontend contracts passed; full canonical PR CI remains separate'
          (out/'manifest.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: support-ownership-green
          path: |
            /tmp/support-green
            taxonomy-build/target/surefire-reports/TEST-*.xml
            taxonomy-build/target/architecture-module-graph.txt
            taxonomy-app/target/surefire-reports/*selector-anchor*.xml
          retention-days: 7
          if-no-files-found: error
