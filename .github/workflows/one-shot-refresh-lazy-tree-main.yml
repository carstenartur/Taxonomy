name: One-shot refresh lazy tree against main

on:
  push:
    branches:
      - qa/issue-611-ui-performance

permissions:
  contents: write

concurrency:
  group: one-shot-refresh-lazy-tree-main
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-611-ui-performance
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Merge current main without discarding either feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            echo 'Conflicted paths:' >&2
            git diff --name-only --diff-filter=U >&2
            git status --short >&2
            exit 1
          fi

      - name: Verify lazy-tree contracts after integration
        shell: bash
        run: |
          set -euo pipefail
          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-browse.js
          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js
          node --check taxonomy-app/src/main/resources/static/js/shared/taxonomy-search.js
          ./mvnw -B -pl taxonomy-app -am \
            -Dtest=com.taxonomy.TaxonomyLazyTreeContractTest,com.taxonomy.ui.TaxonomyLazyTreeContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
          git diff --check

      - name: Push integrated branch
        run: git push origin HEAD:qa/issue-611-ui-performance
