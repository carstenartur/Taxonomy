name: Temporary #1007 browser compatibility repair

on:
  push:
    branches:
      - fix/1006-product-score-semantics
    paths:
      - .github/workflows/tmp-fix-1007-browser-compat.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/1006-product-score-semantics
          fetch-depth: 0
      - name: Apply bounded compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'Object.hasOwn(S.currentRawScores, code)':
                  'Object.prototype.hasOwnProperty.call(S.currentRawScores, code)',
              'Object.hasOwn(rawScores, detail.parentCode)':
                  'Object.prototype.hasOwnProperty.call(rawScores, detail.parentCode)',
          }
          for old, new in replacements.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              source = source.replace(old, new, 1)
          if 'Object.hasOwn(' in source:
              raise SystemExit('Unexpected Object.hasOwn call remains after bounded repair')
          path.write_text(source, encoding='utf-8')
          PY
          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-fix-1007-browser-compat.yml
          git add taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use compatible own-property checks in score streaming'
          git push origin HEAD:fix/1006-product-score-semantics
