name: Analysis memory workbench
on:
  push:
    branches: [workbench/analysis-memory-live-progress-20260914]
    paths: [.github/workflows/analysis-memory-workbench.yml]
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_OPTS: -Xmx1536m
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 024a660d040b481a1354fa4c0dc7d475595ce032
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install additional behavioral regressions
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 024a660d040b481a1354fa4c0dc7d475595ce032
          python ../tools/.github/scripts/analysis-live-pipeline-tests.py
          cp ../tools/taxonomy-app/src/test/java/com/taxonomy/AnalysisLiveProgressUiIT.java taxonomy-app/src/test/java/com/taxonomy/
          git diff --check
      - name: Execute pipeline and HTTP regressions with existing controls
        working-directory: candidate
        run: |
          set +e
          ./mvnw -B -pl taxonomy-app -am '-Dtest=AnalysisMemoryGuardTest,AnalysisProgressRegistryTest,GatewayInterruptedAnalysisTest,HsqldbFileProfileTest,LlmTranscriptBoundsTest,AnalysisCapacityTest,AnalysisApiControllerTest,AnalysisProgressControllerTest,AnalysisApiWorkspaceBoundaryTest,AnalyzeRequirementUseCaseTest,StreamRequirementAnalysisUseCaseTest,LlmService*,GeminiGatewayTest,OpenAiCompatibleGatewayTest,*ConfigurationReference*' -Dsurefire.failIfNoSpecifiedTests=false test > "$RUNNER_TEMP/analysis-pipeline.log" 2>&1
          code=$?
          grep -E 'ERROR|Tests run:|BUILD SUCCESS|BUILD FAILURE' "$RUNNER_TEMP/analysis-pipeline.log" | tail -100
          mkdir -p "$RUNNER_TEMP/pipeline-xml"
          cp taxonomy-app/target/surefire-reports/TEST-*.xml "$RUNNER_TEMP/pipeline-xml/"
          exit "$code"
      - name: Execute real-browser component acceptance
        working-directory: candidate
        run: |
          set +e
          ./mvnw -B -pl taxonomy-app -am -Dtest=AnalysisLiveProgressUiIT -DexcludedGroups=real-llm -Dsurefire.failIfNoSpecifiedTests=false test > "$RUNNER_TEMP/analysis-browser.log" 2>&1
          code=$?
          grep -E 'ERROR|Tests run:|BUILD SUCCESS|BUILD FAILURE' "$RUNNER_TEMP/analysis-browser.log" | tail -100
          exit "$code"
      - name: Node live lifecycle and existing ordering controls
        working-directory: candidate
        run: node --test .github/scripts/analysis-live-progress.test.mjs .github/scripts/analysis-operation-controller.test.mjs
      - name: Check actual test counts and publish staged tested source
        working-directory: candidate
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as E
          totals=[0,0,0,0]
          for p in Path(os.environ['RUNNER_TEMP'],'pipeline-xml').glob('TEST-*.xml'):
              r=E.parse(p).getroot();v=[int(r.get(k,0)) for k in ('tests','failures','errors','skipped')]
              print(r.get('name'),v);totals=[a+b for a,b in zip(totals,v)]
          print('PIPELINE TOTAL:',totals)
          assert totals[0]>=105 and totals[1:]==[0,0,0],totals
          r=E.parse('taxonomy-app/target/surefire-reports/TEST-com.taxonomy.AnalysisLiveProgressUiIT.xml').getroot()
          v=[int(r.get(k,0)) for k in ('tests','failures','errors','skipped')]
          print('BROWSER TOTAL:',v);assert v==[2,0,0,0],v
          PY
          git add taxonomy-app/src/test/java/com/taxonomy/analysis/service/LlmServiceBranchCoverageTest.java taxonomy-app/src/test/java/com/taxonomy/analysis/controller/AnalysisProgressControllerTest.java taxonomy-app/src/test/java/com/taxonomy/AnalysisLiveProgressUiIT.java
          git diff --cached --check
          git -c user.name='OpenAI Assistant' -c user.email='assistant@openai.com' commit -m 'test(analysis): verify preserved partial evidence and visible live browser feedback'
          git rev-parse HEAD HEAD^{tree} | tee "$RUNNER_TEMP/analysis-acceptance-source.txt"
          git push origin HEAD:refs/heads/staging/analysis-live-acceptance-20260914
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-live-acceptance-evidence
          path: |
            ${{ runner.temp }}/analysis-pipeline.log
            ${{ runner.temp }}/analysis-browser.log
            ${{ runner.temp }}/analysis-acceptance-source.txt
            ${{ runner.temp }}/pipeline-xml/*.xml
            candidate/**/target/surefire-reports/*.xml
            candidate/taxonomy-app/target/analysis-ui-evidence/*
          retention-days: 7
