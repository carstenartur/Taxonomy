name: QA Final Complete Copilot Result

on:
  push:
    branches:
      - fix/complete-copilot-run-result-ux
    paths:
      - .github/workflows/qa-complete-copilot-result-final.yml

permissions:
  contents: write

concurrency:
  group: qa-final-complete-copilot-result
  cancel-in-progress: true

jobs:
  verify:
    name: Verify authoritative complete Copilot result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/complete-copilot-run-result-ux
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify source-level result contracts
        run: >-
          ./mvnw -B -pl taxonomy-app -am test
          -Dtest=CompleteCopilotResultUiContractTest,RequirementCopilotUiContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify Docker availability
        run: docker info

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Exercise and capture the authoritative complete Copilot session
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=CompleteCopilotSessionIT
          -DgenerateScreenshots=true
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify the final result screenshot
        shell: bash
        run: |
          set -euo pipefail
          image=docs/images/72-complete-copilot-run-result.png
          test -s "$image"
          test "$(wc -c < "$image")" -gt 75000
          file "$image" | grep -F 'PNG image data'
          ! grep -F 'gap.summary || gap.description || JSON.stringify(gap)' \
              taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js

      - name: Upload screenshot and focused evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-copilot-run-result
          path: |
            docs/images/72-complete-copilot-run-result.png
            taxonomy-app/target/failsafe-reports/**
            taxonomy-app/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish the verified screenshot and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qa-complete-copilot-result-final.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            docs/images/72-complete-copilot-run-result.png \
            .github/workflows/qa-complete-copilot-result-final.yml
          git commit -m 'docs: add the complete Copilot run result screenshot [skip ci]'
          git push origin HEAD:fix/complete-copilot-run-result-ux
