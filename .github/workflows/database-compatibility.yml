name: Database Compatibility

on:
  pull_request:
    branches: [ main, feat/artemis-execution-base, 'implementation/**' ]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

concurrency:
  group: taxonomy-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: PostgreSQL
            profile: database-postgres
            command: ./mvnw -B verify -Pdatabase-postgres,ci-database-compatibility
          - database: Microsoft SQL Server
            profile: database-mssql
            command: ./mvnw -B verify -Pdatabase-mssql,ci-database-compatibility
          - database: Oracle
            profile: database-oracle
            command: ./mvnw -B verify -Pdatabase-oracle,ci-database-compatibility
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Install verified Helm 3.21.0
        run: bash .github/scripts/install-helm.sh

      - name: Configure and verify Docker Hub cache
        run: bash .github/scripts/configure-docker-mirror.sh

      - name: Run Maven-owned database suite
        env:
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
          # Container image pulls on hosted runners occasionally exceed the two-minute
          # default and fail the whole matrix leg with a ContainerFetchException.
          TESTCONTAINERS_PULL_PAUSE_TIMEOUT: '600'
          TESTCONTAINERS_PULL_TIMEOUT: '600'
        shell: bash
        run: |
          mkdir -p target
          set -o pipefail
          ${{ matrix.command }} 2>&1 | tee "target/database-${{ matrix.profile }}.log"

      - name: Upload database evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: database-${{ matrix.profile }}
          path: |
            target/database-${{ matrix.profile }}.log
            **/target/failsafe-reports/**
            taxonomy-app/target/surefire-reports/adopted-lineage/**
          if-no-files-found: warn
          retention-days: 90
