name: Analysis memory workbench
on:
  push:
    branches: [workbench/analysis-memory-live-progress-20260914]
    paths: [.github/workflows/analysis-memory-workbench.yml]
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29b9ef036882f5dbfc62924d9aca63038c098d4e
          persist-credentials: false
      - name: Archive immutable source for isolated offline work
        run: |
          test "$(git rev-parse HEAD)" = 29b9ef036882f5dbfc62924d9aca63038c098d4e
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/taxonomy-source.tar.gz"
          sha256sum "$RUNNER_TEMP/taxonomy-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-source-29b9ef03
          path: ${{ runner.temp }}/taxonomy-source.tar.gz
          retention-days: 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Execute existing analysis boundary tests
        run: |
          set -o pipefail
          ./mvnw -B -pl taxonomy-app -am -Dtest=AnalysisApiControllerTest,StreamRequirementAnalysisUseCaseTest -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee "$RUNNER_TEMP/analysis-baseline.log"
      - name: Archive dependencies without credentials
        if: always()
        run: |
          tar -czf "$RUNNER_TEMP/taxonomy-maven.tar.gz" -C "$HOME/.m2" repository wrapper
          du -h "$RUNNER_TEMP/taxonomy-maven.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-offline-dependencies
          path: ${{ runner.temp }}/taxonomy-maven.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-baseline-evidence
          path: |
            ${{ runner.temp }}/analysis-baseline.log
            **/target/surefire-reports/*.xml
          retention-days: 7
