name: Apply secondary action contrast correction

on:
  push:
    branches:
      - fix/1004-report-pattern-percentages
    paths:
      - .github/scripts/fix-secondary-action-contrast.patch
      - .github/workflows/apply-secondary-action-contrast.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify disabled action contrast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/1004-report-pattern-percentages
          fetch-depth: 0

      - name: Apply deterministic correction
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/scripts/fix-secondary-action-contrast.patch
          git apply .github/scripts/fix-secondary-action-contrast.patch
          node --test .github/scripts/copilot-session-ui-regression.test.mjs
          git diff --check

      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/fix-secondary-action-contrast.patch .github/workflows/apply-secondary-action-contrast.yml
          git add taxonomy-app/src/main/resources/static/css/taxonomy-analysis-workflow.css \
                  .github/scripts/copilot-session-ui-regression.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Preserve contrast for disabled focused analysis"
          git push origin HEAD:fix/1004-report-pattern-percentages
