name: Report partial concrete-product analysis failures

on:
  push:
    branches:
      - codex/json-catalogue-overlay
    paths:
      - .github/workflows/pr913-report-partial-product-failures.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/json-catalogue-overlay
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Preserve and expose partial product-scoring failures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(text, before, after, label) {
            const first = text.indexOf(before);
            const last = text.lastIndexOf(before);
            if (first < 0 || first !== last) {
              throw new Error(`${label}: expected exactly one match`);
            }
            return text.slice(0, first) + after + text.slice(first + before.length);
          }

          const servicePath = 'taxonomy-app/src/main/java/com/taxonomy/analysis/service/LlmService.java';
          let service = fs.readFileSync(servicePath, 'utf8');

          service = replaceOnce(service,
          `                if (rootDetail.getDiscrepancy() != null) {
                              allDiscrepancies.add(rootDetail.getDiscrepancy());
                          }
                          int score = rootScore.getOrDefault(root.getCode(), 0);`,
          `                if (rootDetail.getDiscrepancy() != null) {
                              allDiscrepancies.add(rootDetail.getDiscrepancy());
                          }
                          addAnalysisWarning(warnings, root.getCode(), rootDetail);
                          int score = rootScore.getOrDefault(root.getCode(), 0);`,
          'non-stream root warning');

          service = replaceOnce(service,
          `                        analyzeNodesPropagating(
                                  businessText, level1Children, allScores, allReasons,
                                  allDiscrepancies, productCoverageGaps, score);`,
          `                        analyzeNodesPropagating(
                                  businessText, level1Children, allScores, allReasons,
                                  allDiscrepancies, productCoverageGaps, warnings, score);`,
          'non-stream first recursion');

          service = replaceOnce(service,
          `        } else if (!warnings.isEmpty()) {
                      // Some roots had errors but we continued — still treat as PARTIAL if no scores
                      result.setStatus(allScores.values().stream().anyMatch(v -> v > 0) ? "SUCCESS" : "PARTIAL");
                  } else {`,
          `        } else if (!warnings.isEmpty()) {
                      result.setStatus("PARTIAL");
                  } else {`,
          'non-stream final status');

          service = replaceOnce(service,
          `                                          List<TaxonomyDiscrepancy> allDiscrepancies,
                                          List<ProductCoverageGap> productCoverageGaps,
                                          int parentScore) {`,
          `                                          List<TaxonomyDiscrepancy> allDiscrepancies,
                                          List<ProductCoverageGap> productCoverageGaps,
                                          List<String> warnings,
                                          int parentScore) {`,
          'non-stream recursive signature');

          service = replaceOnce(service,
          `        if (detail.getDiscrepancy() != null) {
                      allDiscrepancies.add(detail.getDiscrepancy());
                  }
          
                  List<TaxonomyNode> productNodes = nodes.stream().filter(this::isProduct).toList();`,
          `        if (detail.getDiscrepancy() != null) {
                      allDiscrepancies.add(detail.getDiscrepancy());
                  }
                  addAnalysisWarning(warnings, siblingScope(nodes), detail);
          
                  List<TaxonomyNode> productNodes = nodes.stream().filter(this::isProduct).toList();`,
          'non-stream child warning');

          service = replaceOnce(service,
          `                    analyzeNodesPropagating(
                              businessText, children, allScores, allReasons,
                              allDiscrepancies, productCoverageGaps, entry.getValue());`,
          `                    analyzeNodesPropagating(
                              businessText, children, allScores, allReasons,
                              allDiscrepancies, productCoverageGaps, warnings, entry.getValue());`,
          'non-stream nested recursion');

          service = replaceOnce(service,
          `        Map<String, Integer> allScores = new HashMap<>();
                  List<TaxonomyDiscrepancy> allDiscrepancies = new ArrayList<>();
                  List<ProductCoverageGap> productCoverageGaps = new ArrayList<>();
                  try {`,
          `        Map<String, Integer> allScores = new HashMap<>();
                  List<TaxonomyDiscrepancy> allDiscrepancies = new ArrayList<>();
                  List<ProductCoverageGap> productCoverageGaps = new ArrayList<>();
                  List<String> warnings = new ArrayList<>();
                  try {`,
          'stream warning accumulator');

          service = replaceOnce(service,
          `                if (rootDetail.getDiscrepancy() != null) {
                              allDiscrepancies.add(rootDetail.getDiscrepancy());
                          }
                          callback.onScores(rootDetail.getScores(), rootDetail.getReasons(),`,
          `                if (rootDetail.getDiscrepancy() != null) {
                              allDiscrepancies.add(rootDetail.getDiscrepancy());
                          }
                          addAnalysisWarning(warnings, root.getCode(), rootDetail);
                          callback.onScores(rootDetail.getScores(), rootDetail.getReasons(),`,
          'stream root warning');

          service = replaceOnce(service,
          `                        analyzeStreamingNodes(businessText, level1Children, allScores,
                                  allDiscrepancies, productCoverageGaps, callback, rootScore);`,
          `                        analyzeStreamingNodes(businessText, level1Children, allScores,
                                  allDiscrepancies, productCoverageGaps, warnings, callback,
                                  rootScore);`,
          'stream first recursion');

          service = replaceOnce(service,
          `            callback.onComplete("SUCCESS", allScores, List.of(), allDiscrepancies,
                              productCoverageGaps);
                  } catch (Exception e) {
                      log.error("Streaming analysis failed", e);
                      callback.onError("PARTIAL", "Analysis failed: " + e.getMessage(),
                              allScores, List.of(), allDiscrepancies, productCoverageGaps);`,
          `            callback.onComplete(warnings.isEmpty() ? "SUCCESS" : "PARTIAL", allScores,
                              warnings, allDiscrepancies, productCoverageGaps);
                  } catch (Exception e) {
                      log.error("Streaming analysis failed", e);
                      callback.onError("PARTIAL", "Analysis failed: " + e.getMessage(),
                              allScores, warnings, allDiscrepancies, productCoverageGaps);`,
          'stream completion contract');

          service = replaceOnce(service,
          `                                        List<TaxonomyDiscrepancy> allDiscrepancies,
                                        List<ProductCoverageGap> productCoverageGaps,
                                        AnalysisEventCallback callback,`,
          `                                        List<TaxonomyDiscrepancy> allDiscrepancies,
                                        List<ProductCoverageGap> productCoverageGaps,
                                        List<String> warnings,
                                        AnalysisEventCallback callback,`,
          'stream recursive signature');

          service = replaceOnce(service,
          `        if (detail.getDiscrepancy() != null) {
                      allDiscrepancies.add(detail.getDiscrepancy());
                  }
                  callback.onScores(detail.getScores(), detail.getReasons(),`,
          `        if (detail.getDiscrepancy() != null) {
                      allDiscrepancies.add(detail.getDiscrepancy());
                  }
                  addAnalysisWarning(warnings, siblingScope(nodes), detail);
                  callback.onScores(detail.getScores(), detail.getReasons(),`,
          'stream child warning');

          service = replaceOnce(service,
          `                    analyzeStreamingNodes(businessText, children, allScores,
                              allDiscrepancies, productCoverageGaps, callback, entry.getValue());`,
          `                    analyzeStreamingNodes(businessText, children, allScores,
                              allDiscrepancies, productCoverageGaps, warnings, callback,
                              entry.getValue());`,
          'stream nested recursion');

          service = replaceOnce(service,
          `    private boolean hasError(LlmCallDetail detail) {
                  return detail != null && detail.getError() != null && !detail.getError().isBlank();
              }`,
          `    private void addAnalysisWarning(List<String> warnings,
                                              String scopeCode,
                                              LlmCallDetail detail) {
                  if (!hasError(detail)) {
                      return;
                  }
                  String scope = scopeCode == null || scopeCode.isBlank()
                          ? "unknown taxonomy scope" : scopeCode;
                  String warning = "Incomplete analysis for " + scope + ": "
                          + detail.getError().strip();
                  if (!warnings.contains(warning)) {
                      warnings.add(warning);
                  }
              }
          
              private String siblingScope(List<TaxonomyNode> nodes) {
                  if (nodes == null || nodes.isEmpty()) {
                      return "unknown taxonomy scope";
                  }
                  String parentCode = nodes.get(0).getParentCode();
                  return parentCode == null || parentCode.isBlank()
                          ? nodes.get(0).getCode() : parentCode;
              }
          
              private boolean hasError(LlmCallDetail detail) {
                  return detail != null && detail.getError() != null && !detail.getError().isBlank();
              }`,
          'warning helpers');

          fs.writeFileSync(servicePath, service);

          const testPath = 'taxonomy-app/src/test/java/com/taxonomy/analysis/service/LlmServiceBranchCoverageTest.java';
          let test = fs.readFileSync(testPath, 'utf8');
          test = replaceOnce(test,
          `import static org.mockito.ArgumentMatchers.any;
          import static org.mockito.ArgumentMatchers.anyInt;`,
          `import static org.mockito.ArgumentMatchers.any;
          import static org.mockito.ArgumentMatchers.argThat;
          import static org.mockito.ArgumentMatchers.anyInt;`,
          'argThat import');
          test = replaceOnce(test,
          `import static org.mockito.ArgumentMatchers.anyString;
          import static org.mockito.Mockito.lenient;`,
          `import static org.mockito.ArgumentMatchers.anyString;
          import static org.mockito.ArgumentMatchers.eq;
          import static org.mockito.Mockito.lenient;`,
          'eq import');

          const regression = `    @Test
              void productBatchFailureRemainsPartialAndDoesNotCreateCoverageGap() {
                  TaxonomyNode root = node("IP", null, "IP");
                  root.setNameEn("Information Products");
                  TaxonomyNode product = node("IP-P1", "IP", "IP");
                  product.setNameEn("Concrete product");
                  when(catalogueOverlayService.isProduct("IP-P1")).thenReturn(true);
                  when(taxonomyService.getRootNodes()).thenReturn(new ArrayList<>(List.of(root)));
                  when(taxonomyService.getChildrenOf("IP")).thenReturn(List.of(product));
                  when(taxonomyService.getFullTree()).thenReturn(List.of());
                  when(gateway.sendHttpRequest("rendered prompt", "test-key"))
                          .thenReturn("root-body");
                  when(gateway.extractResponseText("root-body")).thenReturn("{\\"IP\\":100}");
                  when(gateway.sendHttpRequest("product prompt", "test-key"))
                          .thenThrow(new LlmTimeoutException("product provider timed out"));
                  ReflectionTestUtils.setField(service, "productMinimumScore", 50);
          
                  AnalysisResult result = service.analyzeWithBudget("requirement");
          
                  assertThat(result.getStatus()).isEqualTo("PARTIAL");
                  assertThat(result.getWarnings())
                          .anyMatch(warning -> warning.contains("IP")
                                  && warning.contains("product provider timed out"));
                  assertThat(result.getProductCoverageGaps()).isEmpty();
          
                  service.analyzeStreaming("requirement", callback);
          
                  verify(callback).onComplete(
                          eq("PARTIAL"),
                          any(),
                          argThat((List<String> warnings) -> warnings.stream()
                                  .anyMatch(warning -> warning.contains("product provider timed out"))),
                          anyList(),
                          anyList());
                  verify(callback, never()).onError(
                          anyString(), anyString(), any(), anyList(), anyList(), anyList());
              }
          
          `;
          test = replaceOnce(test,
          `    @Test
              void leafJustificationCoversMockLocalNoKeySuccessEmptyAndFailure() {`,
          regression + `    @Test
              void leafJustificationCoversMockLocalNoKeySuccessEmptyAndFailure() {`,
          'partial product failure regression');
          fs.writeFileSync(testPath, test);

          const docsPath = 'docs/dev/INFORMATION_PRODUCT_OVERLAY.md';
          let docs = fs.readFileSync(docsPath, 'utf8');
          docs = replaceOnce(docs,
          `6. when a relevant product family has no product above that threshold, the analysis returns a
             structured \`productCoverageGaps\` entry.
          
          A parent may contain both category and product children.`,
          `6. when a relevant product family has no product above that threshold, the analysis returns a
             structured \`productCoverageGaps\` entry.
          
          A failed or incomplete concrete-product batch makes the overall analysis \`PARTIAL\` and
          adds an explicit warning. Its zero placeholders are not treated as evidence of an actual
          catalogue gap, so no confirmed \`productCoverageGaps\` entry is emitted for that batch.
          
          A parent may contain both category and product children.`,
          'partial product failure documentation');
          fs.writeFileSync(docsPath, docs);
          NODE

          git rm .github/workflows/pr913-report-partial-product-failures.yml
          git diff --check
          ./mvnw -B -ntp -pl taxonomy-app -am \
            -DskipITs \
            -Dtest=LlmServiceBranchCoverageTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

          git add -A
          git commit -m 'fix: expose partial concrete-product failures'
          git push origin HEAD:codex/json-catalogue-overlay
