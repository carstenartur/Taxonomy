# Application test contexts rebuild the same in-memory HSQLDB schema. Close the
# previous context (including its executors, JPA factory and pools) before the
# next context is loaded. Pausing a cached context does not release those resources.
# Keep this Spring Test setting on the test classpath so Failsafe and IDE runs
# receive the same isolation already configured for Surefire in taxonomy-app/pom.xml.
spring.test.context.cache.maxSize=1
