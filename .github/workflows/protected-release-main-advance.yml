name: Protected Release Main Advance

run-name: Advance main to ${{ inputs.next_version }} (${{ inputs.expected_sha }})

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version whose staging branch is being advanced
        required: true
        type: string
      next_version:
        description: Exact next development version
        required: true
        type: string
      temp_branch:
        description: Release staging branch containing the next-development commit
        required: true
        type: string
      expected_sha:
        description: Exact next-development commit SHA
        required: true
        type: string
      expected_base_sha:
        description: Exact main SHA from which the release started
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: protected-release-main-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  advance:
    name: Verify and merge next development snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout authoritative main workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Preserve Java release tooling
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -pl taxonomy-tooling -am package -DskipTests
          tooling_jar=$(find taxonomy-tooling/target -maxdepth 1 -type f \
            -name 'taxonomy-tooling-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)
          if [[ -z "$tooling_jar" || ! -f "$tooling_jar" ]]; then
            echo "::error::Java release tooling jar was not produced"
            exit 1
          fi
          cp "$tooling_jar" "$RUNNER_TEMP/taxonomy-tooling.jar"

      - name: Validate immutable handoff
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION: ${{ inputs.next_version }}
          TEMP_BRANCH: ${{ inputs.temp_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version $RELEASE_VERSION"
            exit 1
          fi
          if ! [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::Invalid next development version $NEXT_VERSION"
            exit 1
          fi
          if [[ "$TEMP_BRANCH" != "release-temp-${RELEASE_VERSION}" ]]; then
            echo "::error::Unexpected staging branch $TEMP_BRANCH"
            exit 1
          fi
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release handoff must use full immutable commit SHAs"
            exit 1
          fi

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TEMP_BRANCH}:refs/remotes/origin/${TEMP_BRANCH}" --force
          actual_main=$(git rev-parse origin/main)
          actual_head=$(git rev-parse "origin/${TEMP_BRANCH}")
          test "$actual_main" = "$EXPECTED_BASE_SHA" || {
            echo "::error::main moved from $EXPECTED_BASE_SHA to $actual_main before release handoff"
            exit 1
          }
          test "$actual_head" = "$EXPECTED_SHA" || {
            echo "::error::$TEMP_BRANCH points to $actual_head, expected $EXPECTED_SHA"
            exit 1
          }
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$EXPECTED_SHA" || {
            echo "::error::next-development commit is not descended from the release source main"
            exit 1
          }
          git checkout --detach "$EXPECTED_SHA"
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-version-state \
            --root . --mode development --expected-version "$NEXT_VERSION"

      - name: Create protected-main pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ inputs.next_version }}
          TEMP_BRANCH: ${{ inputs.temp_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number=$(gh pr list \
            --state open --base main --head "$TEMP_BRANCH" \
            --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$EXPECTED_SHA\") | .number" \
            | head -n 1)
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head "$TEMP_BRANCH" \
              --title "Prepare next development version $NEXT_VERSION" \
              --body "Release automation prepared this exact next-development snapshot. The branch is merged only after the complete required pull-request gate matrix succeeds on $EXPECTED_SHA."
            pr_number=$(gh pr list \
              --state open --base main --head "$TEMP_BRANCH" \
              --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"$EXPECTED_SHA\") | .number" \
              | head -n 1)
          fi
          test -n "$pr_number" || {
            echo "::error::Could not create or locate protected-main release PR"
            exit 1
          }
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Run canonical verification on exact snapshot
        id: canonical
        env:
          GH_TOKEN: ${{ github.token }}
          TEMP_BRANCH: ${{ inputs.temp_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci-cd.yml --ref "$TEMP_BRANCH"

          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh run list \
              --workflow ci-cd.yml \
              --event workflow_dispatch \
              --commit "$EXPECTED_SHA" \
              --limit 20 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | last | .databaseId // empty')
            if [[ -n "$run_id" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Could not locate canonical CI for $EXPECTED_SHA"
            exit 1
          fi
          run_sha=$(gh run view "$run_id" --json headSha --jq '.headSha')
          test "$run_sha" = "$EXPECTED_SHA" || {
            echo "::error::Selected CI run $run_id verifies $run_sha, expected $EXPECTED_SHA"
            exit 1
          }
          gh run watch "$run_id" --exit-status
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for complete protected-main pull-request gates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          head_before=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          test "$head_before" = "$EXPECTED_SHA" || {
            echo "::error::PR #$PR_NUMBER moved to $head_before before gate verification, expected $EXPECTED_SHA"
            exit 1
          }

          required_count=0
          checks_json='[]'
          for _ in $(seq 1 60); do
            set +e
            checks_json=$(gh pr checks "$PR_NUMBER" \
              --required \
              --json name,bucket,state 2>/dev/null)
            checks_exit=$?
            set -e
            if [[ "$checks_exit" -eq 0 || "$checks_exit" -eq 8 ]]; then
              required_count=$(jq 'length' <<< "$checks_json")
              if [[ "$required_count" -gt 0 ]]; then
                break
              fi
            fi
            sleep 5
          done
          if [[ "$required_count" -eq 0 ]]; then
            echo "::error::No required PR checks were registered for #$PR_NUMBER"
            exit 1
          fi
          jq -r '.[] | "Required check registered: \(.name) [\(.bucket)]"' \
            <<< "$checks_json"

          gh pr checks "$PR_NUMBER" --required --watch --fail-fast

          head_after=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          test "$head_after" = "$EXPECTED_SHA" || {
            echo "::error::PR #$PR_NUMBER moved to $head_after while its gates were running, expected $EXPECTED_SHA"
            exit 1
          }

      - name: Merge through protected main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          NEXT_VERSION: ${{ inputs.next_version }}
          TEMP_BRANCH: ${{ inputs.temp_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/main:refs/remotes/origin/main" --force
          current_main=$(git rev-parse origin/main)
          test "$current_main" = "$EXPECTED_BASE_SHA" || {
            echo "::error::main moved to $current_main while release snapshot was verified"
            exit 1
          }
          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          test "$head_sha" = "$EXPECTED_SHA" || {
            echo "::error::PR #$PR_NUMBER moved to $head_sha, expected $EXPECTED_SHA"
            exit 1
          }

          gh pr merge "$PR_NUMBER" --merge --match-head-commit "$EXPECTED_SHA"

          git fetch origin "refs/heads/main:refs/remotes/origin/main" --force
          git merge-base --is-ancestor "$EXPECTED_SHA" origin/main || {
            echo "::error::Protected merge did not place $EXPECTED_SHA in main history"
            exit 1
          }
          git checkout --detach origin/main
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-version-state \
            --root . --mode development --expected-version "$NEXT_VERSION"
          git push origin ":refs/heads/${TEMP_BRANCH}" || true
