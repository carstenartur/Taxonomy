name: Relation downwalk baseline source
on:
  push:
    branches: [verify/relation-downwalk-source]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Archive exact unmodified baseline source
        run: |
          mkdir -p /tmp/relation-source
          git archive --format=tar.gz 409562e3eb739569aac3c56619207acd45bd09a8 > /tmp/relation-source/source.tar.gz
          printf '%s\n' 409562e3eb739569aac3c56619207acd45bd09a8 > /tmp/relation-source/source.sha
          sha256sum /tmp/relation-source/source.tar.gz > /tmp/relation-source/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: relation-downwalk-baseline-source, path: '/tmp/relation-source/*', if-no-files-found: error, retention-days: 1}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Compile and package unmodified baseline
        run: ./mvnw -B -ntp -DskipTests package
      - name: Stage packaged runtime
        run: bash .github/scripts/stage-ui-application.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: relation-downwalk-baseline-runtime, path: 'target/ui-application/**', if-no-files-found: error, retention-days: 1}
