name: Analysis memory workbench
on:
  push:
    branches: [workbench/analysis-memory-live-progress-20260914]
    paths: [.github/workflows/analysis-memory-workbench.yml]
permissions:
  contents: read
jobs:
  live-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_OPTS: -Xmx1536m
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 618da4aaadea9d71f50b19185c7108ce0135e228
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install focused live runtime and regressions
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 618da4aaadea9d71f50b19185c7108ce0135e228
          python ../tools/.github/scripts/analysis-live-tests.py
          python ../tools/.github/scripts/analysis-live-integration.py
          cp ../tools/taxonomy-app/src/main/java/com/taxonomy/analysis/controller/AnalysisProgressController.java taxonomy-app/src/main/java/com/taxonomy/analysis/controller/
          git diff --check
      - name: Execute live runtime and compatibility tests
        working-directory: candidate
        run: |
          set +e
          ./mvnw -B -pl taxonomy-app -am '-Dtest=AnalysisMemoryGuardTest,AnalysisProgressRegistryTest,GatewayInterruptedAnalysisTest,HsqldbFileProfileTest,LlmTranscriptBoundsTest,AnalysisCapacityTest,AnalysisApiControllerTest,AnalysisApiWorkspaceBoundaryTest,AnalyzeRequirementUseCaseTest,StreamRequirementAnalysisUseCaseTest,LlmService*,GeminiGatewayTest,OpenAiCompatibleGatewayTest' -Dsurefire.failIfNoSpecifiedTests=false test > "$RUNNER_TEMP/analysis-live.log" 2>&1
          code=$?
          grep -E 'ERROR|Tests run:|BUILD SUCCESS|BUILD FAILURE' "$RUNNER_TEMP/analysis-live.log" | tail -100
          exit "$code"
      - name: Browser ordering controls
        working-directory: candidate
        run: node --test .github/scripts/analysis-operation-controller.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-live-runtime-evidence
          path: |
            ${{ runner.temp }}/analysis-live.log
            candidate/**/target/surefire-reports/*.xml
          retention-days: 7
