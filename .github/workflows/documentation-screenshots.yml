name: Documentation Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - docs/refresh-impact-map-screenshot
    paths:
      - .github/workflows/documentation-screenshots.yml
      - .github/scripts/fix-screenshot-style-restoration.py

permissions:
  contents: read

concurrency:
  group: taxonomy-documentation-screenshots-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  apply-review-fix:
    name: Apply and verify screenshot state restoration
    if: github.ref == 'refs/heads/docs/refresh-impact-map-screenshot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/refresh-impact-map-screenshot
          fetch-depth: 0

      - name: Preserve and restore the previous browser state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix-screenshot-style-restoration.py
          git diff --check
          grep -q 'previousImpactMapStyle' taxonomy-app/src/test/java/com/taxonomy/ScreenshotGeneratorIT.java
          grep -q 'previousBodyOverflow' taxonomy-app/src/test/java/com/taxonomy/ScreenshotGeneratorIT.java
          grep -q 'previousWindowSize' taxonomy-app/src/test/java/com/taxonomy/ScreenshotGeneratorIT.java

      - name: Compile the patched screenshot test
        run: |
          ./mvnw -B -pl taxonomy-app -am test-compile \
            -DskipTests \
            -Dtaxonomy.model.download.skip=true

      - name: Commit the verified review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add taxonomy-app/src/test/java/com/taxonomy/ScreenshotGeneratorIT.java
          if git diff --staged --quiet; then
            echo 'The review fix is already applied.'
            exit 0
          fi
          git commit -m 'test: restore the prior impact-map capture state'
          git push origin HEAD:docs/refresh-impact-map-screenshot
