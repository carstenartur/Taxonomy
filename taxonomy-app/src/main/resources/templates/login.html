<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="#{login.title} + ' — ' + #{app.title}">Sign in — Taxonomy Architecture Analyzer</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}"
          href="/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<a href="#loginForm" class="visually-hidden-focusable position-absolute top-0 start-0 p-2 bg-primary text-white"
   th:text="#{login.skip}">Skip to sign-in form</a>
<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 card-title text-center mb-4" th:text="#{login.title}">Sign in</h1>
                    <div th:if="${param.error != null}" class="alert alert-danger" role="alert"
                         th:text="#{login.error}">Invalid username or password.</div>
                    <div th:if="${param.logout != null}" class="alert alert-success" role="status"
                         th:text="#{login.loggedOut}">You have been signed out.</div>
                    <form id="loginForm" method="post" th:action="@{/login}">
                        <div class="mb-3">
                            <label for="username" class="form-label" th:text="#{login.username}">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   required autofocus autocomplete="username"/>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label" th:text="#{login.password}">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   required autocomplete="current-password"/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" th:text="#{login.submit}">Sign in</button>
                    </form>
                    <nav class="mt-3 text-center" th:attr="aria-label=#{login.language}">
                        <a th:href="@{/login(lang='de')}" lang="de" hreflang="de">Deutsch</a>
                        <span aria-hidden="true"> · </span>
                        <a th:href="@{/login(lang='en')}" lang="en" hreflang="en">English</a>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
