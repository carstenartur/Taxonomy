name: Temporary PR 1007 snapshot diff ordering correction

on:
  push:
    branches: [fix/1006-product-score-semantics]

permissions:
  contents: write

concurrency:
  group: temporary-pr-1007-snapshot-diff-order
  cancel-in-progress: false

jobs:
  correct-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Apply and verify deterministic snapshot diff contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent


          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)


          dto_path = Path('taxonomy-app/src/main/java/com/taxonomy/portfolio/dto/PortfolioDtos.java')
          dto = dto_path.read_text(encoding='utf-8')
          dto = replace_once(dto, 'import java.util.List;\n',
                             'import java.util.Collections;\nimport java.util.LinkedHashMap;\nimport java.util.List;\n', 'map imports')
          dto = replace_once(dto, 'import java.util.Map;\n',
                             'import java.util.Map;\nimport java.util.TreeMap;\n', 'sorted-map import')
          old = '            boolean providerChanged) {\n    }\n'
          new = '''            boolean providerChanged) {

                  public SnapshotDiff {
                      Map<String, ScoreChange> canonicalScoreChanges = new TreeMap<>();
                      if (scoreChanges != null) {
                          canonicalScoreChanges.putAll(scoreChanges);
                      }
                      scoreChanges = Collections.unmodifiableMap(
                              new LinkedHashMap<>(canonicalScoreChanges));
                  }
              }
          '''
          dto = replace_once(dto, old, new, 'snapshot diff constructor')
          dto_path.write_text(dto, encoding='utf-8')

          service_path = Path('taxonomy-app/src/main/java/com/taxonomy/portfolio/service/PortfolioAnalysisPersistenceService.java')
          service = service_path.read_text(encoding='utf-8')
          service = replace_once(service, '                Map.copyOf(scoreChanges),\n',
                                 '                scoreChanges,\n', 'snapshot diff delegation')
          service_path.write_text(service, encoding='utf-8')

          test_path = Path('taxonomy-app/src/test/java/com/taxonomy/portfolio/dto/PortfolioDtosSnapshotDiffTest.java')
          if test_path.exists():
              raise SystemExit('Refusing to overwrite an existing regression test')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(dedent('''\
              package com.taxonomy.portfolio.dto;

              import com.taxonomy.portfolio.dto.PortfolioDtos.ScoreChange;
              import com.taxonomy.portfolio.dto.PortfolioDtos.SnapshotDiff;
              import org.junit.jupiter.api.Test;

              import java.util.ArrayList;
              import java.util.LinkedHashMap;
              import java.util.List;
              import java.util.Map;

              import static org.junit.jupiter.api.Assertions.assertEquals;
              import static org.junit.jupiter.api.Assertions.assertThrows;

              class PortfolioDtosSnapshotDiffTest {

                  @Test
                  void scoreChangesRemainCanonicalAndImmutableAtTheRestBoundary() {
                      Map<String, ScoreChange> changes = new LinkedHashMap<>();
                      changes.put("Z", new ScoreChange(1, 2));
                      changes.put("A", new ScoreChange(2, 3));
                      changes.put("M", new ScoreChange(3, 4));

                      SnapshotDiff diff = new SnapshotDiff(
                              "old", "new", changes,
                              List.of(), List.of(), List.of(), List.of(),
                              false, false, false);
                      changes.clear();

                      assertEquals(List.of("A", "M", "Z"),
                              new ArrayList<>(diff.scoreChanges().keySet()));
                      assertEquals(new ScoreChange(2, 3), diff.scoreChanges().get("A"));
                      assertThrows(UnsupportedOperationException.class,
                              () -> diff.scoreChanges().put("B", new ScoreChange(4, 5)));
                  }

                  @Test
                  void absentScoreChangesBecomeAnImmutableEmptyMap() {
                      SnapshotDiff diff = new SnapshotDiff(
                              "old", "new", null,
                              List.of(), List.of(), List.of(), List.of(),
                              false, false, false);

                      assertEquals(Map.of(), diff.scoreChanges());
                      assertThrows(UnsupportedOperationException.class,
                              () -> diff.scoreChanges().put("B", new ScoreChange(4, 5)));
                  }
              }
              '''), encoding='utf-8')
          PY
          ./mvnw -B -ntp -pl taxonomy-app -am \
            -Dtest=PortfolioDtosSnapshotDiffTest,AnalysisScoreDiffTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtaxonomy.ui.skip=true \
            -Dtaxonomy.quality.skip=true \
            -Dcyclonedx.skip=true \
            -Dlicense.skip=true \
            test
          git diff --check
      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/main/java/com/taxonomy/portfolio/dto/PortfolioDtos.java \
            taxonomy-app/src/main/java/com/taxonomy/portfolio/service/PortfolioAnalysisPersistenceService.java \
            taxonomy-app/src/test/java/com/taxonomy/portfolio/dto/PortfolioDtosSnapshotDiffTest.java
          git rm .github/workflows/temporary-pr1007-snapshot-diff-order.yml
          git commit -m 'Preserve deterministic snapshot diff order'
          git push origin HEAD:fix/1006-product-score-semantics
