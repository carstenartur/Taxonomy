import java.util.LinkedHashMap;
import java.util.List;
import java.util.Map;

/**
 * Signals that a relevant product family was evaluated but none of its catalogued products
 * reached the configured suitability threshold.
 *
 * <p>The candidate list, threshold and final evaluated scores are immutable snapshot evidence.
 * A score of zero means that the product was processed and did not reach the threshold; it must
 * never be used for a failed or unprocessed product batch.</p>
 */
public record ProductCoverageGap(
        String productFamilyCode,
        String productFamilyName,
        int familyScore,
        List<String> candidateCodes,
        int suitabilityThreshold,
        Map<String, Integer> evaluatedProductScores,
        String reason) {

    public ProductCoverageGap {
        candidateCodes = candidateCodes == null ? List.of() : List.copyOf(candidateCodes);
        Map<String, Integer> immutableScores = new LinkedHashMap<>();
        if (evaluatedProductScores != null) {
            evaluatedProductScores.forEach((code, score) -> {
                if (code != null && !code.isBlank() && score != null) {
                    immutableScores.put(code.strip(), score);
                }
            });
        }
        for (String candidateCode : candidateCodes) {
            if (candidateCode != null && !candidateCode.isBlank()) {
                immutableScores.putIfAbsent(candidateCode.strip(), 0);
            }
        }
        evaluatedProductScores = Map.copyOf(immutableScores);
    }

    /** Backward-compatible constructor for historical snapshots created before score evidence. */
    public ProductCoverageGap(
            String productFamilyCode,
            String productFamilyName,
            int familyScore,
            List<String> candidateCodes,
            String reason) {
        this(productFamilyCode, productFamilyName, familyScore, candidateCodes,
                0, Map.of(), reason);
    }
}
`);

