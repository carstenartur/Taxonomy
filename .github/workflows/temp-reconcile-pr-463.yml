name: Reconcile PR 463 with main UI contracts

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-reconcile-pr-463.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/issue-461-jgit-storage-hibernate
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Restore current main UI and account contracts
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            taxonomy-app/src/main/java/com/taxonomy/security/controller/AccountContextController.java \
            taxonomy-app/src/main/resources/static/css/git-status.css \
            taxonomy-app/src/main/resources/static/css/taxonomy-ergonomics.css \
            taxonomy-app/src/main/resources/static/js/api/taxonomy-api-client.js \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js \
            taxonomy-app/src/main/resources/static/js/security/taxonomy-role-surface.js \
            taxonomy-app/src/main/resources/static/js/security/taxonomy-ui-semantics.js \
            taxonomy-app/src/main/resources/static/js/shared/taxonomy-document-import.js \
            taxonomy-app/src/main/resources/static/js/shared/taxonomy-operation-result.js \
            taxonomy-app/src/main/resources/templates/change-password.html \
            taxonomy-app/src/main/resources/templates/index.html \
            taxonomy-app/src/test/java/com/taxonomy/OfflineWebAssetsTest.java \
            taxonomy-app/src/test/java/com/taxonomy/ProductionHardeningTests.java \
            taxonomy-app/src/test/java/com/taxonomy/security/controller/AccountContextControllerTest.java \
            taxonomy-app/src/test/java/com/taxonomy/ui/DocumentImportCspContractTest.java \
            taxonomy-app/src/test/java/com/taxonomy/ui/UiSemanticsBridgeContractTest.java
          python3 - <<'PY'
          from pathlib import Path
          path = Path('taxonomy-app/src/main/java/com/taxonomy/workspace/service/WorkspaceManager.java')
          text = path.read_text(encoding='utf-8')
          old = '    private void ensurePersistentWorkspace(String username) {'
          new = '    private synchronized void ensurePersistentWorkspace(String username) {'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one workspace initialization method')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify restored contracts and concurrency regression
        run: >-
          ./mvnw -B -pl taxonomy-app -am
          -Dtest=WorkspaceManagerConcurrencyTest,AccountContextControllerTest,OfflineWebAssetsTest,ProductionHardeningTests,DocumentImportCspContractTest,UiSemanticsBridgeContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Commit verified reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taxonomy-app/src/main taxonomy-app/src/test 
          git commit -m 'Restore main UI contracts and serialize workspace initialization'
          git push origin HEAD:fix/issue-461-jgit-storage-hibernate
