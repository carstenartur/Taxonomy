name: Analysis terminal-label correction (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 077429a2aae4c7f68a321021a647722f64537171
          persist-credentials: false
      - name: Verify exact one-line correction
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const path='.github/scripts/ui-role-state-flow.mjs';
          const hash=content=>createHash('sha1').update('blob '+Buffer.byteLength(content)+'\0').update(content).digest('hex');
          const before=readFileSync(path,'utf8');
          assert.equal(hash(before),'c68e0e614b28ec69a33aaee9b44c0888a5dd68cd');
          assert.equal(before.split('/Analysis ended|Analyse beendet/').length,2);
          const after=before.replace('/Analysis ended|Analyse beendet/','/Analysis finished|Analyse beendet/');
          assert.equal(hash(after),'5ffcef2a6cec915ebaa12ec98983edfdf724ba6b');
          writeFileSync(path,after);
          JS
          git diff --check
          git diff --stat
          node --check .github/scripts/ui-role-state-flow.mjs
          node --test .github/scripts/analysis-live-progress.test.mjs .github/scripts/analysis-operation-controller.test.mjs
          node .github/scripts/test-taxonomy-base-path.mjs
      - name: Upload verified blob only; never change a product ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const response=await fetch('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs',{
            method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'Content-Type':'application/json',Accept:'application/vnd.github+json'},
            body:JSON.stringify({content:readFileSync('.github/scripts/ui-role-state-flow.mjs','utf8'),encoding:'utf-8'})
          });
          assert.equal(response.status,201);
          const blob=await response.json();
          assert.equal(blob.sha,'5ffcef2a6cec915ebaa12ec98983edfdf724ba6b');
          console.log('Verified terminal-label blob:',blob.sha);
          JS
