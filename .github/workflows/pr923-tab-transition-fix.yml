name: PR 923 one-shot tab transition synchronization

on:
  push:
    branches:
      - qa/922-complete-ai-session
    paths:
      - .github/workflows/pr923-tab-transition-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply PR 923 tab synchronization fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/922-complete-ai-session
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the minimal synchronization fix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test = Path('taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java')
          text = test.read_text(encoding='utf-8')
          old = '''            click(By.id(tabId));
                      WebElement tab = driver.findElement(By.id(tabId));
                      assertThat(tab.getAttribute("aria-selected")).isEqualTo("true");
                      String target = tab.getAttribute("data-bs-target");
                      assertThat(driver.findElement(By.cssSelector(target)).isDisplayed()).isTrue();'''
          new = '''            click(By.id(tabId));
                      WebElement tab = driver.findElement(By.id(tabId));
                      String target = tab.getAttribute("data-bs-target");
                      wait.until(attributeEquals(By.id(tabId), "aria-selected", "true"));
                      WebElement panel = wait.until(ExpectedConditions.visibilityOfElementLocated(
                              By.cssSelector(target)));
                      assertThat(tab.getAttribute("aria-selected"))
                              .as("selected state for %s", tabId)
                              .isEqualTo("true");
                      assertThat(panel.isDisplayed())
                              .as("visible panel for %s", tabId)
                              .isTrue();'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one unsynchronized workspace-tab block')
          test.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/pr923-tab-transition-fix.yml').unlink()
          PY

          git diff --check
          git config user.name 'Taxonomy CI'
          git config user.email 'actions@users.noreply.github.com'
          git add taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java \
                  .github/workflows/pr923-tab-transition-fix.yml
          git commit -m 'test: wait for completed workspace tab transitions'
          git push origin HEAD:qa/922-complete-ai-session
