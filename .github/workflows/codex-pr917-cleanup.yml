name: Codex PR 917 scope cleanup

on:
  push:
    branches:
      - fix/repeatable-analysis-reset-and-lifecycle-menu

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repeatable-analysis-reset-and-lifecycle-menu
          fetch-depth: 0

      - name: Remove catalogue quality assessment and fix unresolved reset review
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          for name in [
              'docs/data/C3_Taxonomy_Catalogue_25AUG2025_audit.csv',
              'docs/en/C3_TAXONOMY_CATALOGUE_DATA_QUALITY.md',
              'docs/de/.analysis-reset-delivery-marker',
              'taxonomy-app/src/test/java/com/taxonomy/catalog/CatalogueWorkbookDataQualityDocumentationTest.java',
          ]:
              path = Path(name)
              if path.exists():
                  path.unlink()

          replace_exact(
              'taxonomy-app/pom.xml',
              '                                        <include>data/**</include>\n',
              ''
          )
          replace_exact(
              'taxonomy-app/src/main/java/com/taxonomy/shared/controller/HelpController.java',
              '        new String[]{"C3_TAXONOMY_CATALOGUE_DATA_QUALITY", "🧹",\n'
              '                "help.toc.C3_TAXONOMY_CATALOGUE_DATA_QUALITY", "help.audience.developers"},\n',
              ''
          )
          replace_exact(
              'taxonomy-app/src/main/resources/i18n/messages.properties',
              '\nhelp.toc.C3_TAXONOMY_CATALOGUE_DATA_QUALITY=C3 catalogue data quality report',
              ''
          )
          replace_exact(
              'taxonomy-app/src/main/resources/i18n/messages_de.properties',
              '\nhelp.toc.C3_TAXONOMY_CATALOGUE_DATA_QUALITY=Datenqualit\\u00e4tsbericht zum C3-Katalog',
              ''
          )

          replace_exact(
              'taxonomy-app/src/main/resources/static/js/core/taxonomy-analysis-session-projects.js',
              '        return resetDraft().then(function (view) {\n'
              '            invalidate({',
              '        return resetDraft().then(function (view) {\n'
              '            if (!view) {\n'
              "                throw new Error(text('newAnalysisWorkspaceUnavailable'));\n"
              '            }\n'
              '            invalidate({'
          )
          replace_exact(
              'taxonomy-app/src/main/resources/static/js/core/taxonomy-analysis-session-core.js',
              "            newAnalysisFailed: 'The working draft could not be reset.',\n",
              "            newAnalysisFailed: 'The working draft could not be reset.',\n"
              "            newAnalysisWorkspaceUnavailable: 'The analysis workspace is not ready yet. Wait for initialization and try again.',\n"
          )
          replace_exact(
              'taxonomy-app/src/main/resources/static/js/core/taxonomy-analysis-session-core.js',
              "            newAnalysisFailed: 'Der Arbeitsentwurf konnte nicht zurückgesetzt werden.',\n",
              "            newAnalysisFailed: 'Der Arbeitsentwurf konnte nicht zurückgesetzt werden.',\n"
              "            newAnalysisWorkspaceUnavailable: 'Der Analyse-Workspace ist noch nicht bereit. Warten Sie die Initialisierung ab und versuchen Sie es erneut.',\n"
          )
          replace_exact(
              'taxonomy-app/src/test/java/com/taxonomy/AnalysisSessionFrontendContractTest.java',
              '                .contains("resetDraft().then");',
              '                .contains("resetDraft().then")\n'
              '                .contains("if (!view)")\n'
              '                .contains("newAnalysisWorkspaceUnavailable");'
          )

          workflow = Path('.github/workflows/codex-pr917-cleanup.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Verify focused frontend contracts
        run: |
          git diff --check
          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-analysis-session-core.js
          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-analysis-session-projects.js
          node --test .github/scripts/analysis-session-draft.test.mjs
          node --test .github/scripts/analysis-session-draft-serialization.test.mjs

      - name: Commit cleaned PR scope
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep PR 917 focused on repeatable analysis lifecycle"
          git push origin HEAD:fix/repeatable-analysis-reset-and-lifecycle-menu
