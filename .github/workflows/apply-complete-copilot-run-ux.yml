name: Apply and Verify Complete Copilot Run UX

on:
  push:
    branches:
      - fix/complete-copilot-run-result-ux
    paths:
      - .github/workflows/apply-complete-copilot-run-ux.yml

permissions:
  contents: write

concurrency:
  group: apply-complete-copilot-run-ux
  cancel-in-progress: true

jobs:
  verify:
    name: Verify real complete Copilot run overview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/complete-copilot-run-result-ux
          fetch-depth: 0

      - name: Reassemble and apply the reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/complete-copilot-run-ux/chunk-* > /tmp/complete-copilot-run-ux.b64
          base64 --decode /tmp/complete-copilot-run-ux.b64 > /tmp/complete-copilot-run-ux.tar.gz
          echo '55187fa9680c756f2a9ca052b22553445ade97c85d97e78652cb463ab3496edc  /tmp/complete-copilot-run-ux.tar.gz' | sha256sum --check
          mkdir -p /tmp/complete-copilot-run-ux
          tar -xzf /tmp/complete-copilot-run-ux.tar.gz -C /tmp/complete-copilot-run-ux

          python3 - <<'PY'
          from pathlib import Path

          script = Path('/tmp/complete-copilot-run-ux/apply_complete_copilot_run_ux.py')
          text = script.read_text(encoding='utf-8')
          screenshot = "    'docs/images/72-complete-copilot-run-result.png',\n"
          if screenshot not in text:
              raise SystemExit('Expected screenshot entry missing from source-bundle apply script')
          script.write_text(text.replace(screenshot, '', 1), encoding='utf-8')
          PY

          python3 /tmp/complete-copilot-run-ux/apply_complete_copilot_run_ux.py \
            "$GITHUB_WORKSPACE" --base "$GITHUB_WORKSPACE"

      - name: Distinguish exhaustive verification results
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js')
          text = js_path.read_text(encoding='utf-8')

          english = "            resultReady: 'The immutable Copilot result is ready for review.'\n"
          english_new = (
              "            resultReady: 'The immutable Copilot result is ready for review.',\n"
              "            verificationResult: 'Verification result {0} of {1}',\n"
              "            requirementVersionLabel: 'Requirement v{0}'\n"
          )
          if english not in text:
              raise SystemExit('English result label insertion point not found')
          text = text.replace(english, english_new, 1)

          german = "            resultReady: 'Das unveränderliche Copilot-Ergebnis ist zur Prüfung bereit.'\n"
          german_new = (
              "            resultReady: 'Das unveränderliche Copilot-Ergebnis ist zur Prüfung bereit.',\n"
              "            verificationResult: 'Prüfergebnis {0} von {1}',\n"
              "            requirementVersionLabel: 'Anforderung v{0}'\n"
          )
          if german not in text:
              raise SystemExit('German result label insertion point not found')
          text = text.replace(german, german_new, 1)

          helper = "    function t(key) { return (text[locale] && text[locale][key]) || text.en[key] || key; }\n"
          if helper not in text:
              raise SystemExit('Translation helper insertion point not found')
          text = text.replace(helper, helper + """

              function formatText(key, ...values) {
                  return t(key).replace(/\{(\d+)\}/g, (match, index) => {
                      const valueIndex = Number(index);
                      return valueIndex < values.length ? String(values[valueIndex]) : match;
                  });
              }
          """, 1)

          start = text.index('    function renderSnapshots() {')
          end = text.index('\n    async function selectSnapshot', start)
          replacement = """    function snapshotSequence(snapshot) {
                  const versionIdentity = snapshot.requirementVersionId
                      || snapshot.requirementVersionNumber;
                  const siblings = state.snapshots.filter(candidate => String(
                      candidate.requirementVersionId || candidate.requirementVersionNumber
                  ) === String(versionIdentity)).slice().sort((left, right) => {
                      const leftTime = Date.parse(left.createdAt || '') || 0;
                      const rightTime = Date.parse(right.createdAt || '') || 0;
                      return leftTime - rightTime || String(left.id).localeCompare(String(right.id));
                  });
                  const position = siblings.findIndex(candidate =>
                      String(candidate.id) === String(snapshot.id));
                  return {
                      index: Math.max(0, position) + 1,
                      total: Math.max(1, siblings.length)
                  };
              }

              function snapshotDisplayTitle(snapshot) {
                  const sequence = snapshotSequence(snapshot);
                  return sequence.total > 1
                      ? formatText('verificationResult', sequence.index, sequence.total)
                      : formatText('requirementVersionLabel', snapshot.requirementVersionNumber);
              }

              function renderSnapshots() {
                  const select = document.getElementById('snapshotSelect');
                  select.textContent = '';
                  if (!state.snapshots.length) {
                      const option = document.createElement('option');
                      option.value = '';
                      option.textContent = t('noSnapshots');
                      select.appendChild(option);
                      select.disabled = true;
                      renderEmpty(document.getElementById('snapshotDetail'), t('noSnapshots'));
                      return;
                  }
                  select.disabled = false;
                  state.snapshots.forEach(snapshot => {
                      const option = document.createElement('option');
                      option.value = snapshot.id;
                      option.textContent = `${snapshotDisplayTitle(snapshot)} · ${humanize(snapshot.status)}`;
                      option.selected = state.selectedSnapshot
                          && String(state.selectedSnapshot.id) === String(snapshot.id);
                      select.appendChild(option);
                  });
              }
          """
          text = text[:start] + replacement + text[end:]

          heading = """            + `<h2 class=\"h4 mb-1\">${escapeHtml(t('snapshot'))} v${summary.requirementVersionNumber}</h2>`
                      + `<p class=\"small text-body-secondary mb-0\">${escapeHtml(t('resultReady'))}</p>`
          """
          heading_new = """            + `<h2 class=\"h4 mb-1\">${escapeHtml(snapshotDisplayTitle(state.selectedSnapshot || summary))}</h2>`
                      + `<p class=\"small text-body-secondary mb-0\">`
                      + `${escapeHtml(formatText('requirementVersionLabel', summary.requirementVersionNumber))}`
                      + ` · ${escapeHtml(t('resultReady'))}</p>`
          """
          if heading not in text:
              raise SystemExit('Snapshot detail heading insertion point not found')
          js_path.write_text(text.replace(heading, heading_new, 1), encoding='utf-8')

          test_path = Path('taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotResultScreenshotIT.java')
          test = test_path.read_text(encoding='utf-8')
          marker = """        wait.until(browser -> new Select(browser.findElement(By.id("snapshotSelect")))
                          .getOptions().size() >= 1);
                  assertThat(new Select(driver.findElement(By.id("snapshotSelect")))
                          .getFirstSelectedOption().getAttribute("value"))
                          .isEqualTo(snapshotId);
          """
          assertion = marker + """        List<String> snapshotLabels = new Select(driver.findElement(By.id("snapshotSelect")))
                          .getOptions().stream()
                          .map(WebElement::getText)
                          .toList();
                  assertThat(snapshotLabels)
                          .hasSizeGreaterThanOrEqualTo(2)
                          .doesNotHaveDuplicates()
                          .allMatch(label -> label.contains("Verification result"));
          """
          if marker not in test:
              raise SystemExit('Snapshot-selector assertion insertion point not found')
          test_path.write_text(test.replace(marker, assertion, 1), encoding='utf-8')
          PY

          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          git diff --check

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Verify focused source contracts
        run: >-
          ./mvnw -B -pl taxonomy-app -am test
          -Dtest=RequirementCopilotUiContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Exercise and capture the complete Copilot run overview
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=CompleteCopilotResultScreenshotIT
          -DgenerateScreenshots=true
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Re-run the authoritative complete-session release floor
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=CompleteCopilotSessionIT
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify screenshot and result contracts
        shell: bash
        run: |
          set -euo pipefail
          image=docs/images/72-complete-copilot-run-result.png
          test -s "$image"
          test "$(wc -c < "$image")" -gt 75000
          file "$image" | grep -F 'PNG image data'
          grep -F 'id="run-overview-tab"' taxonomy-app/src/main/resources/templates/requirement-detail.html
          grep -F 'runStageList' taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          grep -F 'snapshotDisplayTitle' taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          ! grep -F 'JSON.stringify(gap)' taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js

      - name: Upload screenshot and focused evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-copilot-run-overview
          path: |
            docs/images/72-complete-copilot-run-result.png
            taxonomy-app/target/failsafe-reports/**
            taxonomy-app/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified UX and remove temporary assembly files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/tmp/complete-copilot-run-ux
          rm .github/workflows/apply-complete-copilot-run-ux.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make complete Copilot run results usable [skip ci]'
          git push origin HEAD:fix/complete-copilot-run-result-ux
