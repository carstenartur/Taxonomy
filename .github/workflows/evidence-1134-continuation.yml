name: Evidence 1134 continuation
on:
  push:
    branches: [maintenance/continue-evidence-1134-20260927]
    paths: [.github/workflows/evidence-1134-continuation.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b0f77b47243ad708c8b77ea459571ca802bf3400
          persist-credentials: false
      - name: Archive exact product sources without transport files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b0f77b47243ad708c8b77ea459571ca802bf3400
          test "$(git rev-parse HEAD^{tree})" = f845eed6e82bf6af2cb528c3e84119468a26dd34
          mkdir -p /tmp/evidence-1134
          git archive --format=tar HEAD | gzip -n > /tmp/evidence-1134/source.tar.gz
          git cat-file commit HEAD > /tmp/evidence-1134/commit.txt
          git rev-parse HEAD HEAD^{tree} > /tmp/evidence-1134/identity.txt
          cd /tmp/evidence-1134
          sha256sum source.tar.gz commit.txt identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-1134-source
          path: /tmp/evidence-1134
          if-no-files-found: error
          retention-days: 7
