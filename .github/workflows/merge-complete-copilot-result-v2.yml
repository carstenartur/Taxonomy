name: Merge Verified Complete Copilot Result V2

on:
  push:
    branches:
      - fix/complete-copilot-run-result-review
    paths:
      - .github/workflows/merge-complete-copilot-result-v2.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: merge-complete-copilot-result-v2
  cancel-in-progress: true

jobs:
  clean-check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/complete-copilot-run-result-review
          fetch-depth: 0

      - name: Require successful authoritative verification and feature payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow 'Finalize Complete Copilot Result V4' \
            --branch fix/complete-copilot-run-result-review \
            --limit 1 \
            --json databaseId,status,conclusion,url)"
          test "$(jq -r '.[0].status // empty' <<<"$run_json")" = completed
          test "$(jq -r '.[0].conclusion // empty' <<<"$run_json")" = success
          echo "AUTHORITATIVE_RUN_URL=$(jq -r '.[0].url' <<<"$run_json")" >> "$GITHUB_ENV"

          test -s docs/images/72-complete-copilot-run-result.png
          test "$(wc -c < docs/images/72-complete-copilot-run-result.png)" -gt 75000
          test -f taxonomy-app/src/test/java/com/taxonomy/portfolio/CompleteCopilotResultUiContractTest.java
          grep -F 'snapshotResultOverview' \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          grep -F "const resultReady = ['SUCCESS', 'PARTIAL'].includes(status.toUpperCase())" \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          grep -F 'taxonomy:requirement-version-created' \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          ! grep -F 'gap.summary || gap.description || JSON.stringify(gap)' \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          git diff --check

      - name: Publish a workflow-free final head and trigger regular checks
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/merge-complete-copilot-result.yml \
            .github/workflows/merge-complete-copilot-result-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove complete-result merge bootstrap'
          git push origin HEAD:fix/complete-copilot-run-result-review
          echo "CLEAN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for regular checks and merge the exact clean head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head fix/complete-copilot-run-result-review \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          test -n "$number"
          if [ "$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready "$number" --repo "$GITHUB_REPOSITORY"
          fi
          gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body \
            "Authoritative complete-session verification passed: $AUTHORITATIVE_RUN_URL. This final head contains no one-shot workflow and is now undergoing the repository's regular checks."

          for attempt in $(seq 1 80); do
            current="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            test "$current" = "$CLEAN_HEAD"
            check_json="$(gh pr checks "$number" --repo "$GITHUB_REPOSITORY" --json name,state,bucket,link 2>/dev/null || true)"
            if [ -n "$check_json" ] && [ "$(jq 'length' <<<"$check_json")" -gt 0 ]; then
              failures="$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$check_json")"
              pending="$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$check_json")"
              test "$failures" -eq 0
              if [ "$pending" -eq 0 ]; then
                break
              fi
            fi
            sleep 30
          done

          check_json="$(gh pr checks "$number" --repo "$GITHUB_REPOSITORY" --json name,state,bucket,link)"
          test "$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel" or .bucket == "pending")] | length' <<<"$check_json")" -eq 0
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" \
            --squash --match-head-commit "$CLEAN_HEAD" \
            --subject 'Make complete Copilot results reviewable' \
            --body 'Render completed Copilot analyses as a structured, accessible review surface; keep retry controls visible for cancelled, failed, or stale runs; and document the real browser-verified result.'
