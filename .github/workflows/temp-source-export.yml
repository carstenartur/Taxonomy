name: Temporary Source Export

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'dependabot/maven/org.webjars.npm-bootstrap-5.3.8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: temporary-webjar-source
          path: |
            taxonomy-app/pom.xml
            taxonomy-app/src/main/resources/templates/index.html
            taxonomy-app/src/main/resources/templates/change-password.html
            taxonomy-app/src/test/java/com/taxonomy/OfflineWebAssetsTest.java
          if-no-files-found: error
          retention-days: 1
