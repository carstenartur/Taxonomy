name: Workspace extraction development snapshot

on:
  push:
    branches: [refactor/628-workspace-module]
    paths: [.github/workflows/628-development-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Native architecture baseline (supplementary, not release verification)
        run: ./mvnw -B -Parchitecture-tests -Dsurefire.failIfNoSpecifiedTests=false verify
      - name: Archive tracked source and build artifacts only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/628-source.tar.gz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/628-source-tree.txt"
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/628-source-identity.txt"
          tar -C "$HOME/.m2" -czf "$RUNNER_TEMP/628-maven-inputs.tar.gz" repository wrapper/dists
          cd "$RUNNER_TEMP"
          sha256sum 628-source.tar.gz 628-maven-inputs.tar.gz > 628-source.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: workspace-extraction-build-inputs
          path: |
            ${{ runner.temp }}/628-source.tar.gz
            ${{ runner.temp }}/628-source-tree.txt
            ${{ runner.temp }}/628-source-identity.txt
            ${{ runner.temp }}/628-source.sha256
            ${{ runner.temp }}/628-maven-inputs.tar.gz
            taxonomy-build/target/architecture-module-graph.txt
            **/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 1
