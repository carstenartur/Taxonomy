name: One-off fix Copilot latest-operation ordering

on:
  push:
    branches:
      - qa/795-copilot-review-backlog
    paths:
      - .github/workflows/one-off-fix-copilot-latest-operation.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out QA branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/795-copilot-review-backlog
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Select latest Copilot operation by its first persisted pass
        shell: bash
        run: |
          set -euo pipefail
          service=taxonomy-app/src/main/java/com/taxonomy/portfolio/service/CopilotAutomationService.java
          workflow=.github/workflows/one-off-fix-copilot-latest-operation.yml

          if grep -Fq '.filter(entry -> entry.key().pass() == 1)' "$service"; then
            echo 'First-pass selection already present; refusing an ambiguous replay.' >&2
            exit 1
          fi

          perl -0pi -e 's/(\.flatMap\(Optional::stream\)\n)(\s*)\.max\(Comparator\.comparing\(entry -> entry\.job\(\)\.createdAt\(\)\)\)/$1$2.filter(entry -> entry.key().pass() == 1)\n$2.max(Comparator.comparing(entry -> entry.job().createdAt()))/' "$service"

          test "$(grep -Fc '.filter(entry -> entry.key().pass() == 1)' "$service")" -eq 1
          git diff --check -- "$service"
          rm "$workflow"

          ./mvnw -B -pl taxonomy-app -am \
            -DskipITs \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=CopilotOperationConsistencyTest,CopilotSupportingServicesCoverageTest,RequirementCopilotUiContractTest \
            test

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$service" "$workflow"
          git commit -m 'fix(copilot): select latest operation by first pass'
          git push origin HEAD:qa/795-copilot-review-backlog
