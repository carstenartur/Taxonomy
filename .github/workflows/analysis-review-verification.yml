name: Analysis review evidence (temporary)
on:
  push:
    branches: [fix/analysis-review-verification]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 24ba60d112b81a12bdd908c1ec6abd5e2632cc61
          persist-credentials: false
      - name: Export exact product sources for offline verification
        run: |
          test "$(git rev-parse HEAD)" = 24ba60d112b81a12bdd908c1ec6abd5e2632cc61
          git archive --format=zip --output="$RUNNER_TEMP/taxonomy-source.zip" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-identity.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analysis-source-24ba60d1
          path: |
            ${{ runner.temp }}/taxonomy-source.zip
            ${{ runner.temp }}/source-identity.txt
          retention-days: 2
