name: Analysis admission-race verification (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Prepare exact locally verified candidate
        run: |
          node .github/scripts/workbench-admission.mjs prepare
          git diff --check
          mkdir -p target
      - name: Verify admission, isolation and existing call boundaries
        run: |
          set -o pipefail
          ./mvnw -B -ntp test '-Dtest=AnalysisProgress*Test,AnalysisRunAuthorizationTest,AnalysisRunControlBoundaryTest' -Dsurefire.failIfNoSpecifiedTests=false 2>&1 | tee target/admission-java.log
          node --test .github/scripts/analysis-live-progress.test.mjs .github/scripts/analysis-operation-controller.test.mjs 2>&1 | tee target/admission-js.log
          node .github/scripts/test-taxonomy-base-path.mjs
      - name: Publish only the four verified blobs, never refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/workbench-admission.mjs publish
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analysis-admission-${{ github.sha }}
          path: |
            target/admission-*.log
            target/admission-manifest.json
            **/target/surefire-reports/TEST-*.xml
          retention-days: 7
