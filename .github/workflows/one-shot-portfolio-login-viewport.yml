name: One-shot portfolio login viewport fix

on:
  push:
    branches:
      - qa/issue-619-responsive-task-navigation

permissions:
  contents: write

concurrency:
  group: one-shot-portfolio-login-viewport
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-619-responsive-task-navigation
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply viewport before portfolio login
        run: python3 .github/scripts/apply-portfolio-login-viewport.py

      - name: Verify focused browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/apply-portfolio-login-viewport.py
          grep -Fq $'driver = browserSession.driver();\n        driver.manage().window().setSize(new Dimension(1440, 1000));\n        driver.setFileDetector' \
            taxonomy-app/src/test/java/com/taxonomy/PortfolioUiAcceptanceIT.java
          ./mvnw -B -pl taxonomy-app -am \
            -Dit.test=com.taxonomy.PortfolioUiAcceptanceIT \
            -DskipUnitTests=true verify
          git diff --check

      - name: Commit permanent test correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taxonomy-app/src/test/java/com/taxonomy/PortfolioUiAcceptanceIT.java
          git diff --cached --quiet && exit 0
          git commit -m 'Set portfolio browser viewport before login'
          git push origin HEAD:qa/issue-619-responsive-task-navigation
