name: Setup review diagnostic (isolated branch)
on:
  push:
    branches: [verify/pr1142-review-regressions-20260928]
permissions:
  contents: read
jobs:
  java:
    name: Setup Java regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6e8ec0d69b7b4fbad91f598288cc883b86086ef8
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {java-version: '21', distribution: temurin}
      - name: Compile actual setup sources and dependency-free contracts
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          mkdir -p target/setup-review
          javac -encoding UTF-8 -d target/setup-review \
            taxonomy-app/src/main/java/com/taxonomy/setup/LocalSetup.java \
            taxonomy-app/src/main/java/com/taxonomy/setup/SetupChecks.java \
            taxonomy-app/src/main/java/com/taxonomy/setup/SetupProbe.java \
            taxonomy-app/src/test/java/com/taxonomy/setup/SetupContractCases.java \
            taxonomy-app/src/test/java/com/taxonomy/setup/SetupReviewRegressionCases.java
      - name: Existing contracts
        shell: bash
        run: java -cp target/setup-review com.taxonomy.setup.SetupContractCases
      - name: Review regressions
        shell: bash
        run: java -cp target/setup-review com.taxonomy.setup.SetupReviewRegressionCases
  helm:
    name: Setup Helm render regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6e8ec0d69b7b4fbad91f598288cc883b86086ef8
          persist-credentials: false
      - name: Install repository-pinned Helm
        env: {HELM_VERSION: v3.21.0}
        run: bash .github/scripts/install-helm.sh
      - name: Existing render contracts
        run: bash deploy/helm/taxonomy/verify-setup.sh
      - name: Security render regressions
        run: bash deploy/helm/taxonomy/verify-setup-security.sh
