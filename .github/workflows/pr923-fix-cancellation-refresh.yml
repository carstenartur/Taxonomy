name: PR 923 fix cancellation refresh

on:
  push:
    branches:
      - qa/922-complete-ai-session

permissions:
  contents: write

concurrency:
  group: pr923-fix-cancellation-refresh
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Preserve the first persisted cancellation snapshot and verify the contract
        shell: bash
        run: |
          set -euo pipefail
          file='taxonomy-app/src/main/java/com/taxonomy/portfolio/service/CopilotAutomationService.java'

          perl -0pi -e 's/        OperationDefinition definition = definition\(jobs\);\n        List<JobWithKey> cancelled = establishCancellation\(/        OperationDefinition definition = definition(jobs);\n        jobs.stream()\n                .filter(entry -> !isTerminal(entry.job().status()))\n                .forEach(entry -> jobControlService.cancel(\n                        entry.job().id(), projectId, username, context));\n        List<JobWithKey> cancelled = establishCancellation(/' "$file"

          grep -Fq 'entry.job().id(), projectId, username, context));' "$file"

          ./mvnw -B -ntp -pl taxonomy-app -am \
            -Dtest=CopilotAutomationServiceCoverageTest,CopilotOperationConsistencyTest,CopilotAnalysisControllerTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

          rm .github/workflows/pr923-fix-cancellation-refresh.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Cancel active Copilot passes before refreshing persisted state'
          git push origin HEAD:qa/922-complete-ai-session
