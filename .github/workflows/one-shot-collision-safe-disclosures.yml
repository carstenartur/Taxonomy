name: One-shot collision-safe disclosures

on:
  push:
    branches:
      - qa/issue-649-collision-safe-disclosures

permissions:
  contents: write

concurrency:
  group: one-shot-collision-safe-disclosures
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-649-collision-safe-disclosures
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply collision-safe disclosure interaction
        run: python3 .github/scripts/apply-collision-safe-disclosures.py
      - name: Verify source contract and semantic-search browser scenario
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/apply-collision-safe-disclosures.py
          ./mvnw -B -pl taxonomy-app -am verify \
            -DskipITs=false \
            -Dtest=com.taxonomy.ui.OnnxDisclosureInteractionContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=OnnxSeleniumIT#semanticSearchViaUiReturnsResults \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -DrunOnnxTests=true \
            -Dtaxonomy.model.download.skip=false \
            -Dtaxonomy.ui.skip=true \
            -Dtaxonomy.quality.skip=true
          git diff --check
      - name: Commit permanent correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/test/java/com/taxonomy/OnnxSeleniumIT.java \
            taxonomy-app/src/test/java/com/taxonomy/ui/OnnxDisclosureInteractionContractTest.java
          git diff --cached --quiet && exit 0
          git commit -m 'Make browser disclosure clicks collision-safe'
          git push origin HEAD:qa/issue-649-collision-safe-disclosures
