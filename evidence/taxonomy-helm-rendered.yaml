# Source: taxonomy/templates/resources.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxonomy-taxonomy
  namespace: taxonomy
  labels:
    app.kubernetes.io/name: taxonomy
    app.kubernetes.io/instance: taxonomy
    app.kubernetes.io/version: "1.4.0-SNAPSHOT"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: taxonomy-0.1.0
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: taxonomy
      app.kubernetes.io/instance: taxonomy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taxonomy
        app.kubernetes.io/instance: taxonomy
    spec:
      serviceAccountName: taxonomy-taxonomy
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: taxonomy
          image: "ghcr.io/carstenartur/taxonomy:sha-0123456789abcdef0123456789abcdef01234567"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CUSTOM_LLM_MODEL
              value: ""
            - name: CUSTOM_LLM_URL
              value: ""
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=65.0 -XX:InitialRAMPercentage=20.0 -Xss512k -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp"
            - name: LLM_PROVIDER
              value: ""
            - name: SPRING_PROFILES_ACTIVE
              value: "postgres,kubernetes"
            - name: TAXONOMY_AI_AUTOPILOT_ENABLED
              value: "false"
            - name: TAXONOMY_AI_AUTOPILOT_MAX_ARCHITECTURE_NODES
              value: "50"
            - name: TAXONOMY_AI_AUTOPILOT_MAX_PROJECT_REQUIREMENTS
              value: "50"
            - name: TAXONOMY_AI_AUTOPILOT_ON_REQUIREMENT_SAVE
              value: "true"
            - name: TAXONOMY_AI_AUTOPILOT_PROFILE
              value: "EXHAUSTIVE"
            - name: TAXONOMY_AI_AUTOPILOT_PROPOSE_PRODUCTS
              value: "true"
            - name: TAXONOMY_AI_AUTOPILOT_PROPOSE_SOLUTIONS
              value: "true"
            - name: TAXONOMY_AI_AUTOPILOT_PROVIDER
              value: ""
            - name: TAXONOMY_AI_AUTOPILOT_VERIFICATION_PASSES
              value: "2"
            - name: TAXONOMY_AI_COORDINATOR_MAX_CONCURRENT_OPERATIONS
              value: "4"
            - name: TAXONOMY_AI_COORDINATOR_QUEUE_CAPACITY
              value: "100"
            - name: TAXONOMY_AI_COPILOT_PROFILE
              value: "FULL"
            - name: TAXONOMY_AI_COPILOT_VERIFICATION_PASSES
              value: "1"
            - name: TAXONOMY_AI_COST_POLICY
              value: "METERED"
            - name: TAXONOMY_AI_MAXIMUM_RUNTIME_SECONDS
              value: "1800"
            - name: TAXONOMY_AI_PRODUCT_PROPOSALS_MINIMUM_CONFIDENCE
              value: "0.25"
            - name: TAXONOMY_AI_PRODUCT_PROPOSALS_MINIMUM_COVERAGE
              value: "25"
            - name: TAXONOMY_DDL_AUTO
              value: "validate"
            - name: TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD
              value: "false"
            - name: TAXONOMY_EMBEDDING_ENABLED
              value: "false"
            - name: TAXONOMY_EMBEDDING_MODEL_DIR
              value: ""
            - name: TAXONOMY_FORWARD_HEADERS_STRATEGY
              value: "framework"
            - name: TAXONOMY_INIT_ASYNC
              value: "true"
            - name: TAXONOMY_INIT_RELOAD_EXISTING
              value: "false"
            - name: TAXONOMY_LIMITS_MAX_ARCHITECTURE_NODES
              value: "50"
            - name: TAXONOMY_SEARCH_DIRECTORY_TYPE
              value: "local-heap"
            - name: TAXONOMY_SEARCH_SYNC_STRATEGY
              value: "write-sync"
            - name: TAXONOMY_SPRINGDOC_ENABLED
              value: "false"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "ADMIN_TOKEN"
                  optional: true
            - name: CUSTOM_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "CUSTOM_LLM_API_KEY"
                  optional: true
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "DASHSCOPE_API_KEY"
                  optional: true
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "DEEPSEEK_API_KEY"
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "GEMINI_API_KEY"
                  optional: true
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "LLAMA_API_KEY"
                  optional: true
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "MISTRAL_API_KEY"
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "OPENAI_API_KEY"
                  optional: true
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "SPRING_DATASOURCE_PASSWORD"
                  optional: false
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "SPRING_DATASOURCE_URL"
                  optional: false
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "SPRING_DATASOURCE_USERNAME"
                  optional: false
            - name: TAXONOMY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "taxonomy-secrets"
                  key: "ADMIN_PASSWORD"
                  optional: false
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 5"
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 768Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: data
          emptyDir: {}
