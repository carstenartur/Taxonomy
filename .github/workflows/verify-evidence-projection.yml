name: Verify evidence projection continuation
on:
  push:
    branches: [verify/pr1113-evidence-projection-20260923]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Stage review regressions on exact unmodified source
        run: |
          cp -r .verification /tmp/evidence-regressions
          git fetch --quiet origin b3e06be24226c7a7cdbcdb31d413c1e405b1b94b --depth=1
          git checkout --detach b3e06be24226c7a7cdbcdb31d413c1e405b1b94b
          cp /tmp/evidence-regressions/ReviewBoundaryContinuationTest.java taxonomy-analysis/src/test/java/com/taxonomy/analysis/relations/
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Prove precision and early-root validation failures
        run: |
          set +e
          ./mvnw -B -ntp -pl taxonomy-analysis -am -Dtest=ReviewBoundaryContinuationTest -Dsurefire.failIfNoSpecifiedTests=false test > /tmp/evidence-review-red.log 2>&1
          status=$?
          tail -80 /tmp/evidence-review-red.log
          test "$status" -ne 0 || exit 1
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='taxonomy-analysis/target/surefire-reports/TEST-com.taxonomy.analysis.relations.ReviewBoundaryContinuationTest.xml'
          r=ET.parse(p).getroot()
          print('RED_REVIEW_ASSERTIONS',r.attrib)
          assert int(r.get('tests'))==8 and int(r.get('failures'))==5 and int(r.get('errors'))==0 and int(r.get('skipped'))==0
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: evidence-review-red
          path: |
            /tmp/evidence-review-red.log
            taxonomy-analysis/target/surefire-reports/TEST-*ContinuationTest.xml
          retention-days: 7
          if-no-files-found: error
