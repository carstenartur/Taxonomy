database.setup.preview.ready=Configuration ready to apply
database.setup.invalid=Check the host, port, database/service name, user and CA path. Use a plain host without URL options, port 1–65535, and an absolute PostgreSQL CA path only with TLS enabled.
database.setup.request.failed=The request could not be completed. Your current configuration is unchanged. Check connectivity and your administrator session, then try again.
database.setup.schema.conflict=Existing schema-generation settings would override this template. Review the deployment settings described in Help and remove the conflicting overrides or set them to validate. Then retry the export. Connection testing is still available.
