name: Codex implementation payload

on:
  push:
    branches:
      - codex/json-catalogue-overlay
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-catalogue-overlay-payload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Apply complete payload
        shell: bash
        run: |
          set -euo pipefail
          payload_dir=.github/codex-payload
          if [[ ! -f "$payload_dir/READY" ]]; then
            echo 'Payload is incomplete; waiting for READY marker.'
            exit 0
          fi

          wc -c "$payload_dir"/part-* "$payload_dir/READY"
          cat "$payload_dir"/part-* > /tmp/taxonomy-overlay.patch.xz.b64
          wc -c /tmp/taxonomy-overlay.patch.xz.b64
          base64 -d /tmp/taxonomy-overlay.patch.xz.b64 > /tmp/taxonomy-overlay.patch.xz
          expected_sha=$(tr -d '[:space:]' < "$payload_dir/READY")
          actual_sha=$(sha256sum /tmp/taxonomy-overlay.patch.xz | cut -d' ' -f1)
          echo "Expected payload SHA-256: $expected_sha"
          echo "Actual payload SHA-256:   $actual_sha"
          [[ "$actual_sha" == "$expected_sha" ]]
          xz -t /tmp/taxonomy-overlay.patch.xz
          xz -d -c /tmp/taxonomy-overlay.patch.xz > /tmp/taxonomy-overlay.patch

          git apply --index --binary --whitespace=error-all /tmp/taxonomy-overlay.patch
          rm -rf "$payload_dir"
          git add -A

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement versioned catalogue overlay and product scoring'
          git push origin "HEAD:${GITHUB_REF_NAME}"
