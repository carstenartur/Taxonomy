database.setup.check.next=Nächster Schritt: Prüfen Sie die Deployment-Konfiguration, übernehmen Sie diese in Rancher und starten Sie Taxonomy neu.
database.setup.check.retry=Korrigieren Sie die genannten Einstellungen und starten Sie die Prüfung erneut.
database.setup.preview.message=Verwenden Sie den unten angezeigten Anwendungsbenutzer. Hinterlegen Sie dessen Passwort im Deployment-Secret.
database.setup.preview.next=Die neue Datenbank wird aktiv, sobald Sie diese Einstellungen übernehmen und Taxonomy neu starten.
database.setup.done=Schließen
database.setup.request.title=Anfrage konnte nicht abgeschlossen werden
database.setup.session.failed=Ihre Administratorsitzung konnte die Anfrage nicht autorisieren. Melden Sie sich erneut als Administrator an und öffnen Sie die Datenbankeinrichtung wieder.
database.setup.create.invalid=Prüfen Sie Server, Regeln für Anwendungsname und Passwort, Administratorzugang und die datenbankspezifischen Felder. Verwenden Sie bei Oracle eine vorhandene PDB mit Tablespace und endlichem Speicherlimit, sonst die erforderliche Verwaltungsdatenbank. Systemnamen sind ausgeschlossen.
database.setup.finding.database.tls.NOT_CHECKED=Geprüftes TLS ist ausgewählt. Serverunterstützung und Zertifikatsvertrauen werden beim Verbindungsaufbau geprüft.
database.setup.finding.database.connection.dns.ERROR=Der Taxonomy-Server konnte den Hostnamen nicht auflösen. Prüfen Sie Namen und Namespace des Datenbank-Service in Rancher.
database.setup.finding.database.connection.refused.ERROR=Der Host hat die Verbindung abgelehnt. Prüfen Sie den Service-Port und ob der Service einen bereiten Datenbank-Pod auswählt.
database.setup.finding.database.connection.timeout.ERROR=Das Zeitlimit der Verbindungsprüfung wurde erreicht. Prüfen Sie Service-Endpunkte, Datenbankverfügbarkeit und NetworkPolicies zwischen den Pods.
database.setup.finding.database.connection.tls.ERROR=Eine geprüfte TLS-Verbindung konnte nicht hergestellt werden. Prüfen Sie, ob der Server TLS unterstützt, das Zertifikat zum Hostnamen passt und die vertrauenswürdige CA im Taxonomy-Pod verfügbar ist.
database.setup.finding.database.connection.authentication.ERROR=Die Datenbank hat die Anmeldung abgelehnt. Prüfen Sie, ob dieser Benutzer existiert und das Passwort stimmt. Bei einem frischen PostgreSQL-Server können Sie die Option zum Anlegen von Datenbank und Anwendungsbenutzer wählen.
database.setup.finding.database.connection.missing-database.ERROR=Die angegebene Datenbank existiert nicht. Korrigieren Sie den Namen oder verwenden Sie die PostgreSQL-Option zum Anlegen.
database.setup.finding.database.connection.permission.ERROR=Dem Datenbankbenutzer fehlt eine erforderliche Berechtigung. Lassen Sie Zugang und bei der Einrichtung auch Datenbankeigentum und Schemarechte durch den Datenbankadministrator prüfen.
database.setup.finding.database.connection.interrupted.ERROR=Die Verbindungsprüfung wurde unterbrochen. Starten Sie sie erneut, um ein aktuelles Ergebnis zu erhalten.
database.setup.finding.database.provision.ready.NOT_CHECKED=Server und geplante Namen wurden geprüft. Kontrollieren Sie die folgenden Aktionen und bestätigen Sie anschließend das Anlegen.
database.setup.finding.database.provision.ready.OK=Server und geplante Namen wurden geprüft. Kontrollieren Sie die folgenden Aktionen und bestätigen Sie anschließend das Anlegen.
database.setup.finding.database.provision.complete.OK=Der Anwendungsbenutzer kann sich anmelden und besitzt die erforderlichen Eigentums- und Schemarechte. Schemamigrationen laufen beim Start von Taxonomy mit der neuen Konfiguration.
database.setup.finding.database.provision.conflict.ERROR=Ein vorhandener Name, Eigentümer oder die Rechte eines Benutzers passen nicht zur Einrichtung, oder eine Ressource wurde zeitgleich angelegt. Prüfen Sie den aktuellen Zustand und die vorhandenen Ressourcen. Wählen Sie bei Bedarf andere Namen.
database.setup.finding.database.provision.plan-changed.ERROR=Der Zustand von Datenbank oder Benutzer hat sich seit der Prüfung geändert. Es wurde nichts angelegt. Prüfen Sie den aktuellen Zustand und bestätigen Sie erst nach Kontrolle des aktualisierten Plans erneut.
database.setup.finding.database.provision.permission.ERROR=Dem Einrichtungsadministrator fehlen erforderliche Rechte zum Anlegen, Zuweisen, Vergeben, Prüfen des Katalogs oder Sperren. Vorhandene Ressourcen wurden nicht geändert. Lassen Sie den Datenbankadministrator diesen Einrichtungsumfang prüfen.
database.setup.finding.database.provision.version.ERROR=Das automatische Anlegen benötigt PostgreSQL 15 oder neuer. Verwenden Sie eine vorhandene Datenbank oder einen unterstützten PostgreSQL-Server.
database.setup.finding.database.provision.readonly.ERROR=Dieser PostgreSQL-Server ist schreibgeschützt. Verwenden Sie den schreibbaren Primärknoten.
database.setup.finding.database.provision.confirmation.ERROR=Prüfen Sie die geplante Datenbank und den Benutzer und bestätigen Sie das Anlegen anschließend ausdrücklich.
database.setup.finding.database.provision.busy.WARNING=Eine andere Datenbankeinrichtung läuft noch. Warten Sie deren Abschluss ab und prüfen Sie dann den aktuellen Zustand.
database.setup.finding.database.provision.partial.ERROR=Die Einrichtung wurde nur teilweise abgeschlossen. Prüfen Sie die Zustände der Ressourcen und den aktuellen Serverzustand, bevor Sie fortfahren.
database.setup.finding.database.provision.unknown.ERROR=Das Ergebnis konnte nicht bestätigt werden. Datenbank oder Benutzer können bereits vorhanden sein. Prüfen Sie den aktuellen Zustand vor einem weiteren Anlegeversuch.
database.setup.mode.create.postgres=PostgreSQL-Datenbank und Benutzer anlegen
database.setup.mode.create.mssql=SQL-Server-Datenbank und Login anlegen
database.setup.mode.create.oracle=Oracle-Benutzer und Schema anlegen
database.setup.mode.create.help.postgres=Verwenden Sie einmalig einen Serveradministrator, um einen eigenen Taxonomy-Benutzer und seine Datenbank einzurichten.
database.setup.mode.create.help.mssql=Verwenden Sie einmalig einen Administratorzugang. Taxonomy erhält ein eigenes SQL-Login als Eigentümer seiner neuen Datenbank.
database.setup.mode.create.help.oracle=Richten Sie einen lokalen Benutzer mit eigenem Schema und begrenztem Speicherplatz in einer vorhandenen PDB ein. Es wird keine Datenbankinstanz oder PDB angelegt.
database.setup.create.name.help.postgres=Neue Datenbank und Benutzer: Kleinbuchstaben, Ziffern und Unterstriche; Beginn mit Buchstabe oder Unterstrich (höchstens 63 Zeichen).
database.setup.create.name.help.mssql=Neue Datenbank und Login: Kleinbuchstaben, Ziffern und Unterstriche; Beginn mit Buchstabe oder Unterstrich (höchstens 128 Zeichen). Systemnamen sind ausgeschlossen.
database.setup.create.name.help.oracle=Geben Sie einen vorhandenen PDB-Dienst ein, zum Beispiel FREEPDB1. Neue Benutzer verwenden Buchstaben, Ziffern und Unterstriche, beginnen mit einem Buchstaben und haben höchstens 30 Zeichen; Namen werden in Großbuchstaben umgewandelt.
database.setup.create.password.help.postgres=Wählen Sie das Passwort für den eigenen Anwendungsbenutzer und bewahren Sie es für das Deployment-Secret auf. Bei einem vorhandenen Benutzer geben Sie dessen aktuelles Passwort ein.
database.setup.create.password.help.mssql=Verwenden Sie 8–128 Zeichen ohne einfache Anführungszeichen oder Steuerzeichen; zusätzlich gilt die Passwortrichtlinie des Servers. Bewahren Sie dieses Passwort für das Anwendungs-Secret auf.
database.setup.create.password.help.oracle=Dieser Einrichtungsweg akzeptiert 1–30 ASCII-Zeichen ohne doppelte Anführungszeichen oder Steuerzeichen. Zusätzlich gilt die Passwortrichtlinie des Servers. Bewahren Sie das Passwort für das Anwendungs-Secret auf.
database.setup.admin.help.postgres=Bei einem frischen offiziellen postgres-Container mit nur POSTGRES_PASSWORD verwenden Sie hier postgres und dieses Passwort. Die Anwendung verwendet anschließend ihren eigenen Benutzer.
database.setup.admin.help.mssql=Verwenden Sie einen SQL-Serveradministrator mit sysadmin-Rechten, zum Beispiel sa. SQL-Authentifizierung muss aktiviert sein; die Vorprüfung verwendet die vorhandene master-Datenbank. Dieser Zugang wird nur für die Einrichtung verwendet.
database.setup.admin.help.oracle=Verbinden Sie einen PDB-Administrator wie SYSTEM mit dem ausgewählten PDB-Dienst. Benutzeranlage, Rechtevergabe, Katalogprüfung und DBMS_LOCK-Zugriff müssen bereits erlaubt sein; der Assistent vergibt keine zusätzlichen Administratorrechte.
database.setup.review.help.postgres=Der Anwendungsbenutzer wird Eigentümer seiner Datenbank. Vorhandene Benutzer und Datenbanken werden erst nach Prüfung wiederverwendet; ihre Passwörter und Eigentümer bleiben erhalten.
database.setup.review.help.mssql=Das SQL-Login wird Eigentümer seiner neuen Datenbank und erscheint dort als dbo. Es erhält keine Serveradministratorrolle. Vorhandene Logins und Datenbanken werden nur geprüft und wiederverwendet.
database.setup.review.help.oracle=Vorbereitet wird nur der lokale Anwendungsbenutzer mit eigenem Schema und dem angezeigten Speicherlimit. PDB-Dienst und Tablespace sind bereits vorhanden. Vorhandene Benutzer werden geprüft; Passwörter, Rechte und Quoten werden nicht geändert.
database.setup.provision.postgres=Datenbank und Benutzer jetzt anlegen
database.setup.provision.mssql=Datenbank und SQL-Login jetzt anlegen
database.setup.provision.oracle=Oracle-Benutzer und Schema jetzt anlegen
database.setup.provision.resources.postgres=Anwendungsbenutzer: {0}. Datenbank: {1}.
database.setup.provision.resources.mssql=SQL-Login: {0}. Datenbank: {1}.
database.setup.provision.resources.oracle=Anwendungsbenutzer/Schema: {0}. Vorhandener PDB-Dienst: {1}.
database.setup.oracle.user=Anwendungsbenutzer / Schema
database.setup.mssql.user=SQL-Login der Anwendung
database.setup.oracle.storage=Tablespace und Speicherlimit
database.setup.oracle.tablespace=Vorhandener permanenter Tablespace
database.setup.oracle.quota=Speicherlimit (MiB)
database.setup.oracle.quota.help=Wählen Sie 1–1048576 MiB in einem vorhandenen permanenten Tablespace. Ein wiederverwendeter Benutzer muss bereits genau dieses endliche Limit besitzen; der Assistent ändert es nicht.
database.setup.compatibility.schema=SQL Server und Oracle: Das Vorbereiten der Ressourcen legt keine Taxonomy-Anwendungstabellen an. Die exportierte Konfiguration prüft ein bereits initialisiertes Schema. Diese Kompatibilitätsprofile bleiben für die Evaluierung vorgesehen.
database.setup.compatibility.help=Ein frisches Evaluierungsschema initialisieren (öffnet neuen Tab)
database.setup.compatibility.next=Nächster Schritt: Beachten Sie die Anleitung zur Schemainitialisierung und prüfen und übernehmen Sie anschließend die Deployment-Konfiguration.
database.setup.persistence.body=Anwendungseinstellungen und gespeicherte Arbeit liegen in der aktiven Datenbank. Datenbankspeicher, Anwendungsdateien und Deployment-Secrets benötigen jeweils eine dauerhafte Ablage. Ein Verbindungswechsel überträgt keine vorhandenen Datensätze.
database.setup.persistence.memory=Die aktuelle Datenbank liegt im Arbeitsspeicher. Ein Neustart von Taxonomy verliert ihre Daten und Einstellungen. Sichern Sie alles Benötigte vor dem Wechsel oder Neustart; dieser Assistent überträgt es nicht. Ein PVC allein macht aus einer Speicherdatenbank keine Dateidatenbank.
database.setup.persistence.help=Rancher: Daten und Einstellungen über Neustarts behalten (öffnet neuen Tab)
database.setup.finding.database.provision.mssql.ready.NOT_CHECKED=Server, SQL-Authentifizierung, Administratorrechte und vorhandene Namen wurden geprüft. Prüfen Sie vor der Bestätigung die Aktionen für SQL-Login und Datenbank.
database.setup.finding.database.provision.mssql.complete.OK=Das SQL-Login kann sich mit seiner eigenen Datenbank verbinden und deren Schema verwenden. Taxonomy-Anwendungstabellen benötigen bei diesem Evaluierungsprofil noch einen gesonderten Initialisierungsschritt.
database.setup.finding.database.provision.mssql.server.ERROR=Die automatische Vorbereitung benötigt eine schreibbare SQL-Serverinstanz (2019 oder neuer), SQL-Authentifizierung und einen Administrator in master. Azure SQL Database und ausschließlich enthaltene Benutzer benötigen eine gesonderte Einrichtung.
database.setup.finding.database.provision.oracle.ready.NOT_CHECKED=Vorhandene PDB, Tablespace, Administratorrechte und Benutzer/Schema wurden geprüft. Prüfen Sie den lokalen Benutzer und das endliche Speicherlimit vor der Bestätigung.
database.setup.finding.database.provision.oracle.complete.OK=Der lokale Benutzer kann sich mit der vorhandenen PDB verbinden und besitzt die erforderlichen Schemarechte und das Speicherlimit. Taxonomy-Anwendungstabellen benötigen bei diesem Evaluierungsprofil noch einen gesonderten Initialisierungsschritt.
database.setup.finding.database.provision.oracle.pdb.ERROR=Verwenden Sie einen vorhandenen schreibbaren Oracle-PDB-Dienst. Der Assistent erstellt oder öffnet keine Instanz, keinen Root-Container und keine PDB.
database.setup.finding.database.provision.oracle.tablespace.ERROR=Wählen Sie einen vorhandenen verfügbaren permanenten Tablespace und ein endliches Speicherlimit. System-, temporäre und Undo-Tablespaces sind keine Speicherziele für diese Anwendung.
database.setup.persistence.choose=Die Anleitung zur dauerhaften Speicherung erklärt Datenbankspeicher, Pod-Volumes und Secrets, einschließlich HSQLDB mit Dateispeicher.
database.setup.finding.database.provision.oracle.lock-permission.ERROR=Der Oracle-Einrichtungsadministrator benötigt EXECUTE auf SYS.DBMS_LOCK in der ausgewählten PDB. Lassen Sie dieses Einrichtungsrecht vom Datenbankadministrator bereitstellen; der Anwendungsbenutzer benötigt es nicht.
database.setup.finding.database.provision.password-policy.ERROR=Der Datenbankserver hat das Anwendungspasswort aufgrund seiner Passwortrichtlinie abgelehnt. Wählen Sie ein zulässiges Passwort und prüfen Sie den aktuellen Zustand vor einer erneuten Bestätigung.
