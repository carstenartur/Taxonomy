database.setup.request.title=Request could not be completed
database.setup.session.failed=Your administrator session could not authorize this request. Sign in again as an administrator, then reopen database setup.
database.setup.create.invalid=Check the server, port, application name and password, administrator login, maintenance database and CA path. New database/account names must use lowercase letters, digits and underscores (maximum 63 characters) and cannot use system names.
database.setup.finding.database.tls.NOT_CHECKED=Verified TLS is selected. Server support and certificate trust are checked when connecting.
database.setup.finding.database.connection.dns.ERROR=The Taxonomy server could not resolve the hostname. Check the PostgreSQL Service name and namespace in Rancher.
database.setup.finding.database.connection.refused.ERROR=The host refused the connection. Check the Service port and that a ready database Pod is selected by the Service.
database.setup.finding.database.connection.timeout.ERROR=The connection check timed out. Check Service endpoints, database availability and network policies between the Pods.
database.setup.finding.database.connection.tls.ERROR=A verified TLS connection could not be established. Check that the server supports TLS, the certificate matches the hostname and the trusted CA is available in the Taxonomy Pod.
database.setup.finding.database.connection.authentication.ERROR=The database rejected the login. Check that this user exists and the password is correct. For a fresh PostgreSQL server, choose the option to create a database and application account.
database.setup.finding.database.connection.missing-database.ERROR=The requested database does not exist. Correct the name or use the PostgreSQL creation option.
database.setup.finding.database.connection.permission.ERROR=The database account lacks a required permission. Ask the database administrator to check access and, for preparation, database ownership and schema privileges.
database.setup.finding.database.connection.interrupted.ERROR=The connection check was interrupted. Run it again to obtain a current result.
database.setup.finding.database.provision.ready.NOT_CHECKED=The server and proposed names have been checked. Review the operations below and confirm when ready.
database.setup.finding.database.provision.ready.OK=The server and proposed names have been checked. Review the operations below and confirm when ready.
database.setup.finding.database.provision.complete.OK=The application account can log in to the database and has the required ownership and schema permissions. Schema migrations run when Taxonomy starts with the new configuration.
database.setup.finding.database.provision.conflict.ERROR=An existing name, owner or account permission conflicts with this setup, or a resource was created concurrently. Inspect again and check the existing resources. Choose different names if necessary.
database.setup.finding.database.provision.plan-changed.ERROR=The database or account changed since the inspection. No creation was started. Inspect the current state and review the updated plan before confirming again.
database.setup.finding.database.provision.permission.ERROR=This administrator cannot establish all required creation and ownership permissions. For a new account, use the PostgreSQL server administrator. Existing resources have not been changed.
database.setup.finding.database.provision.version.ERROR=Automatic creation requires PostgreSQL 15 or later. Use an existing database or a supported PostgreSQL server.
database.setup.finding.database.provision.readonly.ERROR=This PostgreSQL server is read-only. Use the writable primary endpoint.
database.setup.finding.database.provision.confirmation.ERROR=Review the proposed database and account, then explicitly confirm creation.
database.setup.finding.database.provision.busy.WARNING=Another database setup is still running. Wait for it to finish, then inspect the current state.
database.setup.finding.database.provision.partial.ERROR=Only part of the setup completed. Review the resource states and inspect again before continuing.
database.setup.finding.database.provision.unknown.ERROR=The result could not be confirmed. The database or account may already exist. Inspect the current state before another creation attempt.
