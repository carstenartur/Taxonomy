name: Interoperability module extraction
on:
  push:
    branches: [verification/628-physical-workspace]
    paths: [.github/workflows/628-interop-extraction.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c121be0701ad5dd4716e1e6922be23a6db2f6d9f
          persist-credentials: false
      - name: Inspect actual source and test ownership
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          def notice(title, value):
              message = json.dumps(value, ensure_ascii=True).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=' + title + '::' + message)
          files = [Path(p) for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines() if p.endswith('.java')]
          owners = {}
          for path in files:
              if '/src/main/java/' not in str(path): continue
              match = re.search(r'^package\s+([\w.]+);', path.read_text(), re.M)
              if match: owners[match.group(1) + '.' + path.stem] = str(path)
          rows = []
          external = set()
          for path in files:
              if '/src/main/java/com/taxonomy/interop/' not in str(path): continue
              imports = re.findall(r'^import\s+(?:static\s+)?([^;]+);', path.read_text(), re.M)
              application_imports = []
              for item in imports:
                  if not item.startswith('com.taxonomy.'): external.add(item); continue
                  targets = {owner for name, owner in owners.items() if name == item or item.startswith(name + '.') or (item.endswith('.*') and name.startswith(item[:-1]))}
                  bad = sorted(t for t in targets if t.startswith('taxonomy-app/') and '/com/taxonomy/interop/' not in t)
                  if bad: application_imports.append([item, bad])
              if application_imports: rows.append([str(path), application_imports])
          notice('INTEROP_REMAINING_APP_IMPORTS', rows)
          notice('INTEROP_EXTERNAL_IMPORTS', sorted(external))
          references = []
          for path in files:
              text = path.read_text()
              matches = [[i, line.strip()] for i, line in enumerate(text.splitlines(), 1) if 'IntegrationDomainAdapter' in line or ('interop/' in str(path) and 'requirements()' in line)]
              if matches: references.append([str(path), matches])
          notice('DOMAIN_ADAPTER_REFERENCES', references)
          notice('INTEROP_TEST_FILES', [str(p) for p in files if '/src/test/' in str(p) and ('/interop/' in str(p) or 'Interop' in p.name or 'IntegrationDomain' in p.name)])
          reverse = []
          for path in files:
              if '/src/main/' not in str(path) or '/com/taxonomy/interop/' in str(path): continue
              matches = re.findall(r'^import\s+(?:static\s+)?(com\.taxonomy\.interop[^;]*);', path.read_text(), re.M)
              if matches: reverse.append([str(path), matches])
          notice('INTEROP_REVERSE_IMPORTS', reverse)
          PY
