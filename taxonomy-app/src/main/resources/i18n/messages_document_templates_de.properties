document.templates.heading=Versionierte Word-Dokumentvorlagen
document.templates.intro=Verwalten Sie organisationsspezifische DOTX-Vorlagen. „Lokal bearbeiten“ nutzt Download und Upload im Browser; WebDAV bleibt eine optionale direkte Word-Verbindung. Beide Wege erhalten die OOXML-Git-Historie.
document.templates.admin.entry.title=Word-Dokumentvorlagen
document.templates.admin.entry.description=Versionierte DOTX-Vorlagen, direkte Word-Bearbeitung, Downloads und Historie verwalten.
document.templates.admin.entry.action=Vorlagen verwalten
document.templates.help.title=Wählen Sie den zu Ihren Kenntnissen passenden Arbeitsweg
document.templates.help.edit=Vorlage in Word bearbeiten öffnet die versionierte WebDAV-Ressource in der installierten Microsoft-Word-Anwendung. Beim Speichern in Word entsteht eine neue Git-Version.
document.templates.help.new=Neues Dokument aus Vorlage erzeugt ein getrenntes Word-Dokument, ohne die gespeicherte Vorlage zu verändern.
document.templates.help.fallback=Empfohlen für eingeschränkte Rechner: Bei der Vorlage „Lokal bearbeiten“ wählen, die feste Ausgangsversion herunterladen, in Word bearbeiten und auf derselben Seite zurückladen. WebDAV und Anwendungspasswort sind nicht erforderlich.
document.templates.https.warning=Die direkte Word-Bearbeitung sollte die öffentliche HTTPS-Adresse von Taxonomy verwenden. Die aktuelle Seite wird nicht über HTTPS aufgerufen.
document.templates.direct-word.disabled=Das direkte Öffnen in Word ist für dieses Anmeldeprofil deaktiviert, weil Desktop-Word die Browser-Anmeldung nicht übernehmen kann. Verwenden Sie stattdessen „Lokal bearbeiten“ mit der Browser-Anmeldung; WebDAV bleibt für kompatible Clients verfügbar.
document.templates.upload.title=Zusätzliche Vorlage anlegen (erweitert)
