name: One-shot lazy tree patch

on:
  push:
    branches:
      - qa/issue-611-ui-performance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Apply fail-closed transformation
        run: python3 .github/scripts/apply-taxonomy-lazy-rendering.py

      - name: Validate JavaScript and patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-browse.js
          node --check taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js
          git diff --check

      - name: Verify lazy rendering contract
        run: >-
          ./mvnw -B -pl taxonomy-app -am
          "-Dtest=com.taxonomy.ui.TaxonomyLazyTreeContractTest"
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Commit transformed sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-browse.js \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js; then
            echo "Lazy rendering sources already match the requested contract."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-browse.js \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js
          git commit -m "Render collapsed taxonomy subtrees lazily"
          git push origin "HEAD:${GITHUB_REF_NAME}"
