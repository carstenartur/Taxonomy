name: PR 1139 REST coverage evidence

on:
  push:
    branches: [verify/pr1139-locale-regression-20260928]
    paths:
      - taxonomy-app/src/test/java/com/taxonomy/security/UserManagementControllerTest.java

permissions:
  contents: read

jobs:
  regression:
    name: User-management JUnit and measured REST controller coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact production source and limited test-only delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 35fad560cfc8a254ad1d8c457a713cbf24ad01d2 -- . \
            ':!.github/workflows/pr1139-locale-regression.yml' \
            ':!taxonomy-app/src/test/java/com/taxonomy/security/UserManagementControllerTest.java'
          git diff --check
      - name: Run account-management JUnit suites with real JaCoCo instrumentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/pr1139-rest-coverage
          ./mvnw -B -ntp -pl taxonomy-app -am test jacoco:report \
            -Dtest=UserManagementControllerTest,UserManagementPageTest,LocalUserManagementProfileTest,UserManagementFormTest,UserCreationCredentialsTest,UserManagementServiceTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dmaven.build.cache.enabled=false \
            -Dtaxonomy.ui.skip=true -Dtaxonomy.model.download.skip=true \
            > target/pr1139-rest-coverage/maven.log 2>&1
      - name: Check actual JUnit counts and REST source coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import xml.etree.ElementTree as ET

          output = pathlib.Path('target/pr1139-rest-coverage')
          suites = ['UserManagementControllerTest', 'UserManagementPageTest',
                    'LocalUserManagementProfileTest', 'UserManagementFormTest',
                    'UserCreationCredentialsTest', 'UserManagementServiceTest']
          results = {}
          for suite in suites:
              path = pathlib.Path('taxonomy-app/target/surefire-reports') / ('TEST-com.taxonomy.security.' + suite + '.xml')
              root = ET.parse(path).getroot()
              counts = {key: int(root.get(key, '0')) for key in ['tests', 'failures', 'errors', 'skipped']}
              assert counts['tests'] > 0, (suite, counts)
              assert counts['failures'] == counts['errors'] == counts['skipped'] == 0, (suite, counts)
              results[suite] = counts
              shutil.copy2(path, output / path.name)
          report = pathlib.Path('taxonomy-app/target/site/jacoco/jacoco.xml')
          root = ET.parse(report).getroot()
          source = root.find("./package[@name='com/taxonomy/security/controller']/sourcefile[@name='UserManagementController.java']")
          assert source is not None, 'Missing source coverage for the REST controller'
          coverage = {counter.get('type'): {'covered': int(counter.get('covered')), 'missed': int(counter.get('missed'))} for counter in source.findall('counter')}
          for kind, minimum in [('LINE', 75), ('BRANCH', 60)]:
              counts = coverage[kind]
              total = counts['covered'] + counts['missed']
              assert total > 0 and counts['covered'] * 100 >= minimum * total, (kind, counts)
          shutil.copy2(report, output / 'jacoco.xml')
          test = pathlib.Path('taxonomy-app/src/test/java/com/taxonomy/security/UserManagementControllerTest.java')
          shutil.copy2(test, output / test.name)
          evidence = {'productionBase': '35fad560cfc8a254ad1d8c457a713cbf24ad01d2', 'testSha256': hashlib.sha256(test.read_bytes()).hexdigest(), 'tests': results, 'controllerSourceCoverage': coverage, 'scope': 'Focused JUnit and REST-controller coverage only; not the full canonical CI gate.'}
          (output / 'summary.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence, indent=2))
          PY
      - name: Archive actual JUnit and coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1139-rest-coverage-evidence
          path: target/pr1139-rest-coverage/
          if-no-files-found: error
          retention-days: 7
