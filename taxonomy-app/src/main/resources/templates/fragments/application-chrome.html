<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head>
<th:block th:fragment="styles">
    <link rel="stylesheet" th:href="@{/css/application-chrome.css}" href="/css/application-chrome.css"/>
    <link rel="stylesheet" th:href="@{/css/architecture-lifecycle.css}" href="/css/architecture-lifecycle.css"/>
</th:block>
</head><body>
<header th:fragment="navigation(active, localActions, helpDocument, helpSection)" class="taxonomy-app-chrome">
    <nav id="applicationNavigation" class="taxonomy-app-navigation" th:aria-label="#{app.navigation.label}" aria-label="Application navigation">
        <div class="taxonomy-app-mainrow">
            <a class="taxonomy-app-brand" th:href="@{/}" href="/">Taxonomy</a>
            <details id="applicationNavigationMenu" class="taxonomy-app-menu" open>
                <summary aria-controls="applicationNavigationMenuContent" th:text="#{app.navigation.menu}">Menu</summary>
            </details>
            <div id="applicationNavigationMenuContent" class="taxonomy-app-menu-content">
            <div class="taxonomy-app-primary">
                <a id="applicationProjectsLink" data-app-route="projects" data-taxonomy-feature="portfolio" th:href="@{/projects}" href="/projects"
                   th:attr="aria-current=${active == 'projects' ? 'page' : null}" th:text="#{app.navigation.projects}">Projects</a>
        <div class="application-work-navigation">
            <ul class="nav nav-tabs nav-tabs-page mb-0" id="mainNavTabs" aria-label="Main sections">
                <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'analysis' ? 'active' : ''}" th:attr="aria-current=${active == 'analysis' ? 'page' : null}" data-page="analyze" data-app-route="analysis" th:href="@{/#analyze}" href="/#analyze"><span class="taxonomy-app-route-icon" aria-hidden="true">&#128269; </span><span th:text="#{nav.analyze}">Analyze</span></a>
            </li>
                <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'architecture' ? 'active' : ''}" th:attr="aria-current=${active == 'architecture' ? 'page' : null}" data-page="architecture" data-taxonomy-feature="architecture" data-app-route="architecture" th:href="@{/#architecture}" href="/#architecture"><span class="taxonomy-app-route-icon" aria-hidden="true">&#127959;&#65039; </span><span th:text="#{nav.architecture}">Architecture</span></a>
            </li>
                <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'graph' ? 'active' : ''}" th:attr="aria-current=${active == 'graph' ? 'page' : null}" data-page="graph" data-taxonomy-feature="architecture" data-app-route="graph" th:href="@{/#graph}" href="/#graph"><span class="taxonomy-app-route-icon" aria-hidden="true">&#128300; </span><span th:text="#{nav.graph}">Graph</span></a>
            </li>
                <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'versions' ? 'active' : ''}" th:attr="aria-current=${active == 'versions' ? 'page' : null}" data-page="versions" data-app-route="versions" th:href="@{/#versions}" href="/#versions"><span class="taxonomy-app-route-icon" aria-hidden="true">&#128339; </span><span th:text="#{nav.versions}">Versions</span></a>
            </li>
                <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'dsl-editor' ? 'active' : ''}" th:attr="aria-current=${active == 'dsl-editor' ? 'page' : null}" data-page="dsl-editor" data-app-route="dsl-editor" th:href="@{/#dsl-editor}" href="/#dsl-editor"><span class="taxonomy-app-route-icon" aria-hidden="true">&#128221; </span><span th:text="#{nav.dsl}">DSL</span></a>
            </li>
            </ul>
        </div>
            </div>
            <div class="taxonomy-app-local"><th:block th:replace="${localActions}"></th:block></div>
            </div>
            <div class="taxonomy-app-utilities">
                <div class="taxonomy-app-languages" role="group" th:aria-label="#{lang.selector.label}" aria-label="Language">
                    <a href="?lang=en" hreflang="en" data-app-locale="en" th:aria-label="#{language.english}">EN</a>
                    <a href="?lang=de" hreflang="de" data-app-locale="de" th:aria-label="#{language.german}">DE</a>
                </div>
                <a th:replace="~{fragments/context-help :: button(${helpDocument}, ${helpSection})}"></a>
            </div>
        </div>
    </nav>
    <details id="applicationContextDisclosure" class="taxonomy-app-context-disclosure" open>
    <summary id="applicationContextSummary">
        <strong id="applicationContextSummaryTitle" th:text="#{app.context.label}">Selected context</strong>
        <span id="applicationContextSummarySelection"></span>
        <span id="applicationContextSummaryStand"></span>
        <span id="applicationContextSummaryStates" class="taxonomy-app-summary-statuses"></span>
    </summary>
    <div class="taxonomy-app-context-body">
    <section id="applicationContext" class="taxonomy-app-context" th:aria-label="#{app.context.label}" aria-label="Selected context" hidden>
        <div id="applicationCurrentContext" class="taxonomy-app-context-group" aria-labelledby="applicationCurrentContextTitle" hidden>
            <h2 id="applicationCurrentContextTitle" class="taxonomy-app-context-title" th:text="#{app.context.current}">Current selection</h2>
            <dl id="applicationCurrentDetails" class="taxonomy-entity-details taxonomy-app-context-details"></dl>
            <div id="applicationContextStates" class="taxonomy-entity-badges"></div>
        </div>
        <div id="applicationSourceContext" class="taxonomy-app-context-group taxonomy-app-source" aria-labelledby="applicationSourceContextTitle" hidden>
            <h2 id="applicationSourceContextTitle" class="taxonomy-app-context-title" th:text="#{app.context.source}">Frozen analysis source</h2>
            <dl id="applicationSourceDetails" class="taxonomy-entity-details taxonomy-app-context-details"></dl>
        </div>
        <details id="applicationTechnicalContext" class="taxonomy-app-technical" hidden>
            <summary th:text="#{app.context.technical}">Technical details</summary>
            <dl id="applicationTechnicalDetails" class="taxonomy-entity-details"></dl>
        </details>
    </section>
    <section id="architectureLifecycle" class="taxonomy-lifecycle" hidden></section>
    </div>
    </details>
</header>
<th:block th:fragment="scripts">
    <script th:fragment="navigationScript" th:src="@{/js/shared/application-chrome.js}" src="/js/shared/application-chrome.js"></script>
    <script th:src="@{/js/api/architecture-lifecycle-api.js}" src="/js/api/architecture-lifecycle-api.js"></script>
    <script th:src="@{/js/shared/architecture-lifecycle.js}" src="/js/shared/architecture-lifecycle.js"></script>
    <script th:src="@{/js/shared/requirement-intake.js}" src="/js/shared/requirement-intake.js"></script>
</th:block>
</body></html>
