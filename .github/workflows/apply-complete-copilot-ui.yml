name: Apply Complete Copilot Result UI

on:
  push:
    branches:
      - fix/complete-copilot-run-result-ux
    paths:
      - .github/tmp/complete-copilot-ui/ready

permissions:
  contents: write

concurrency:
  group: apply-complete-copilot-result-ui
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/complete-copilot-run-result-ux
          fetch-depth: 0

      - name: Assemble and apply the verified browser patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/complete-copilot-ui/part-*.patch > /tmp/complete-copilot-ui.patch
          git apply --check /tmp/complete-copilot-ui.patch
          git apply --whitespace=fix /tmp/complete-copilot-ui.patch
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          grep -F 'id="snapshotResultOverview"' taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          grep -F 'portfolio-result-kpis' taxonomy-app/src/main/resources/static/css/taxonomy-portfolio.css
          if grep -F 'gap.summary || gap.description || JSON.stringify(gap)' \
              taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js; then
            echo 'Raw JSON result fallback survived the patch' >&2
            exit 1
          fi
          rm -rf .github/tmp/complete-copilot-ui
          rm .github/workflows/apply-complete-copilot-ui.yml
          git diff --check

      - name: Commit the usable complete-run result surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js \
            taxonomy-app/src/main/resources/static/css/taxonomy-portfolio.css \
            .github/tmp/complete-copilot-ui \
            .github/workflows/apply-complete-copilot-ui.yml
          git commit -m 'Make the complete Copilot run result usable'
          git push origin HEAD:fix/complete-copilot-run-result-ux
