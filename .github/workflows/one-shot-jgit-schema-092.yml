name: Apply JGit schema 0.9.2 compatibility patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/one-shot-jgit-schema-092.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply fail-closed 0.9.2 schema compatibility
        run: python3 .github/scripts/one-shot-patch-jgit-schema-092.py

      - name: Run focused migration tests
        run: >-
          mvn -B -ntp -pl taxonomy-app -am
          -DskipITs
          -Dtest=JgitStorageSchemaMigrationConfigTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Commit generated source patch
        shell: bash
        run: |
          git rm .github/workflows/one-shot-jgit-schema-092.yml
          git rm .github/workflows/one-shot-jgit-schema-092-v2.yml
          git rm .github/scripts/one-shot-patch-jgit-schema-092.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taxonomy-app/src/main/java/com/taxonomy/dsl/storage/JgitStorageSchemaMigrationConfig.java
          git add taxonomy-app/src/test/java/com/taxonomy/dsl/storage/JgitStorageSchemaMigrationConfigTest.java
          git commit -m 'fix(storage): accept reflog schema 0.9.2'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
