name: Merged PR review audit

on:
  # A direct pull_request_review subscription creates approval-gated, jobless
  # runs when the external Copilot reviewer submits a review. Audit the trusted
  # merged-close event instead; the scheduled run still detects later reviews.
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional merged pull request number to audit
        required: false
        default: ''
      since_days:
        description: Number of recent days to audit manually
        required: false
        default: '35'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: taxonomy-merged-pr-review-audit-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || inputs.pr_number || 'window' }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit reviews of merged pull requests
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    # Findings are posted to PR discussions, even though the REST route is
    # /issues/{number}/comments. Grant PR write only to this trusted-code job.
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # pull_request_target and workflow_dispatch execute repository-owned
          # default-branch code. Never resolve or execute the pull-request head.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install repository-pinned Node runtime
        run: ./mvnw -B -ntp -f .github/ui-verification-pom.xml generate-resources -Pcontracts
      - name: Audit merged pull-request review evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || inputs.pr_number || '' }}
          # The audit contract was introduced by PR #974 on 2026-09-02. Scheduled
          # enforcement starts there instead of making main permanently red for
          # older merges that could not have followed a not-yet-existing policy.
          # Manual dispatch deliberately retains the configurable historical window.
          AUDIT_SINCE_DATE: ${{ github.event_name == 'schedule' && '2026-09-02' || '' }}
          AUDIT_SINCE_DAYS: ${{ inputs.since_days || '35' }}
          AUDIT_REVIEWERS: 'copilot-pull-request-reviewer[bot],Copilot'
          AUDIT_COMMENT: 'true'
          AUDIT_FAIL_SEVERITY: 'high'
          AUDIT_OUTPUT_ROOT: target/merged-pr-review-audit
        run: .cache/ui-frontend/node/node .github/scripts/merged-pr-review-audit.mjs
      - name: Print review-audit evidence
        if: always()
        run: |
          if [[ -f target/merged-pr-review-audit/audit.md ]]; then
            cat target/merged-pr-review-audit/audit.md
          fi
      - name: Upload review-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: merged-pr-review-audit
          path: target/merged-pr-review-audit/**
          if-no-files-found: error
          retention-days: 90
