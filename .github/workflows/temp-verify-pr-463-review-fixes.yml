name: Verify PR 463 review fixes

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.env.example'
      - '.mvn/wrapper/maven-wrapper.properties'
      - 'docs/*/CONTAINER_IMAGE.md'
      - 'taxonomy-app/src/main/java/com/taxonomy/security/config/AuthorizationRulesConfigurer.java'
      - 'taxonomy-app/src/test/java/com/taxonomy/SecurityTests.java'
      - 'taxonomy-app/src/test/java/com/taxonomy/ProductionHardeningTests.java'
      - '.github/workflows/temp-verify-pr-463-review-fixes.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/issue-461-jgit-storage-hibernate
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Verify and pin the Maven distribution
        run: |
          set -euo pipefail
          properties=.mvn/wrapper/maven-wrapper.properties
          url=$(sed -n 's/^distributionUrl=//p' "$properties")
          test -n "$url"
          curl --fail --location --retry 4 --output /tmp/apache-maven-bin.zip "$url"
          expected_sha512=ed41650d42485cfc243fad22158caf9cbb5dc408ce7a09ddb94dd42a019de929ca43065bfa450612cf12bf78b5cafa3884b96c090de326ff590448c933454af3
          echo "$expected_sha512  /tmp/apache-maven-bin.zip" | sha512sum --check --strict
          actual_sha256=$(sha256sum /tmp/apache-maven-bin.zip | cut -d' ' -f1)
          current_sha256=$(sed -n 's/^distributionSha256Sum=//p' "$properties")
          if [ "$actual_sha256" != "$current_sha256" ]; then
            python3 - "$properties" "$actual_sha256" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          sha256 = sys.argv[2]
          lines = path.read_text(encoding='utf-8').splitlines()
          result = []
          replaced = False
          for line in lines:
              if line.startswith('distributionSha256Sum='):
                  result.append(f'distributionSha256Sum={sha256}')
                  replaced = True
              else:
                  result.append(line)
          if not replaced:
              result.append(f'distributionSha256Sum={sha256}')
          path.write_text('\n'.join(result) + '\n', encoding='utf-8')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$properties"
            git commit -m 'Pin verified Maven 3.9.16 distribution checksum'
            git push origin HEAD:fix/issue-461-jgit-storage-hibernate
          fi
          ./mvnw --version
      - name: Reject obsolete authenticated build wiring
        run: |
          set -euo pipefail
          ! grep -R -n -E 'github-packages-settings|GITHUB_ACTOR|GITHUB_TOKEN|read:packages|GitHub Packages' \
            Dockerfile docker-compose*.yml .env.example docs/en/CONTAINER_IMAGE.md docs/de/CONTAINER_IMAGE.md
      - name: Validate production Compose model
        env:
          DOMAIN: taxonomy.example.com
          TAXONOMY_ADMIN_PASSWORD: test-only-password
        run: docker compose -f docker-compose.prod.yml config >/dev/null
      - name: Verify authorization and rate-limit regressions
        run: >-
          ./mvnw -B -pl taxonomy-app -am
          -Dtest=SecurityTests,ProductionHardeningTests
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Build source stage without credentials
        id: docker_build
        continue-on-error: true
        run: |
          set -o pipefail
          docker build --progress=plain --target build -t taxonomy-source-build-check . 2>&1 | tee docker-build.log
      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: credential-free-docker-build-log
          path: docker-build.log
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Docker build result
        if: steps.docker_build.outcome != 'success'
        run: exit 1
