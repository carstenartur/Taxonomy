name: Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [ main, feat/artemis-execution-base, 'implementation/**' ]
    paths:
      - '**/pom.xml'
      - 'taxonomy-*/src/**'
      - 'plugins/**'
      - '!plugins/*/README.md'
      - '!plugins/*/README_DE.md'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'deploy/**'
      - '.github/trivy.yaml'
      - '.github/trivy-data/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: taxonomy-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Trivy dependencies, secrets, configuration, and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
            .mvn/dependency-cache-epoch

      - name: Build application for packaged dependency inspection
        id: package
        shell: bash
        run: |
          mkdir -p target
          set +e
          set -o pipefail
          ./mvnw -B -pl taxonomy-build -am install -Dmaven.test.skip=true 2>&1 | tee target/security-build.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce immutable supply-chain references
        if: ${{ steps.package.outputs.exit_code == '0' }}
        run: ./mvnw -B -pl taxonomy-build test -Psupply-chain-policy

      - name: Archive packaging and supply-chain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-packaging-log
          path: |
            target/security-build.log
            target/supply-chain-pins.json
            taxonomy-build/target/surefire-reports/TEST-com.taxonomy.build.SupplyChainPinPolicyRepositoryTest.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Stop when packaging failed
        if: ${{ steps.package.outputs.exit_code != '0' }}
        run: exit 1

      - name: Scan repository and packaged application
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Scan the checked-out source with a valid immutable image reference.
          # Only the Secret name is needed to render; no credential is supplied.
          TRIVY_HELM_SET_STRING: image.tag=sha-${{ github.sha }},existingSecret=taxonomy-security-scan
        with:
          version: v0.76.2
          trivy-config: .github/trivy.yaml
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: target/trivy-results.json
          exit-code: '0'

      - name: Convert scan evidence to SARIF
        run: trivy convert --format sarif --output trivy-results.sarif target/trivy-results.json

      - name: Verify complete scan coverage before publishing findings
        id: scan_coverage
        run: |
          bash .github/scripts/taxonomy-tooling.sh check-trivy-coverage \
            --file trivy-results.sarif --scan-report target/trivy-results.json

      - name: Enforce HIGH and CRITICAL security threshold
        run: bash .github/scripts/taxonomy-tooling.sh check-trivy-sarif --file trivy-results.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always() && steps.scan_coverage.outcome == 'success' && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-results.sarif
          category: taxonomy-trivy

      - name: Archive scanner evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-security-scan
          path: |
            trivy-results.sarif
            target/trivy-results.json
            target/supply-chain-pins.json
          if-no-files-found: warn
          retention-days: 90
