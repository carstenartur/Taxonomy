name: One-shot Helm evidence-directory fix

on:
  push:
    branches:
      - qa/issue-625-rancher-small-prefix

permissions:
  contents: write

concurrency:
  group: one-shot-helm-evidence-directory-fix
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-625-rancher-small-prefix
          fetch-depth: 0
          persist-credentials: true

      - name: Install verified Helm 3.21.0
        env:
          HELM_VERSION: v3.21.0
        run: bash .github/scripts/install-helm.sh

      - name: Apply evidence-directory correction
        run: python3 .github/scripts/apply-helm-evidence-directory-fix.py

      - name: Verify custom output path and evidence files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/apply-helm-evidence-directory-fix.py
          bash -n deploy/helm/taxonomy/verify.sh
          rm -rf target
          custom_output="$(mktemp -d)/rendered/chart.yaml"
          bash deploy/helm/taxonomy/verify.sh "$custom_output"
          test -s "$custom_output"
          test -s target/taxonomy-helm-small-rendered.yaml
          test -s target/taxonomy-helm-rancher-rke2-rendered.yaml
          git diff --check

      - name: Commit permanent verification correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/helm/taxonomy/verify.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Create Helm evidence directory for custom output paths'
          git push origin HEAD:qa/issue-625-rancher-small-prefix
