name: Verify final score semantics corrections

on:
  push:
    branches:
      - automation/fix-1007-final-semantics
    paths:
      - .github/workflows/fix-1007-final-semantics.yml

permissions:
  contents: write

jobs:
  correct:
    name: Apply and verify final score semantics corrections
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/fix-1007-final-semantics
          fetch-depth: 1

      - name: Stage bounded patch script
        shell: bash
        run: cp .github/scripts/fix-1007-final-semantics.py "$RUNNER_TEMP/fix-1007-final-semantics.py"

      - name: Checkout exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/1006-product-score-semantics
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Apply bounded corrections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "374ec1371e880a373a1bc6419bd8eeb3c99d2865"
          python3 "$RUNNER_TEMP/fix-1007-final-semantics.py"
          node --check .github/scripts/document-template-report-download.mjs
          git diff --check

      - name: Verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -pl taxonomy-app -am \
            -Dtest=AnalysisScoreDiffTest,PortfolioAnalysisCoverageRegressionTest,DecisionRationaleSnapshotReportTest,DecisionRationaleReportControllerScoreSemanticsTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git add .github/scripts/document-template-report-download.mjs \
                  taxonomy-app/src/main/java/com/taxonomy/portfolio/service/AnalysisScoreDiff.java \
                  taxonomy-app/src/test/java/com/taxonomy/portfolio/service/AnalysisScoreDiffTest.java \
                  taxonomy-app/src/test/java/com/taxonomy/portfolio/report/DecisionRationaleSnapshotReportTest.java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix snapshot score diff and report E2E evidence"
          git push origin HEAD:fix/1006-product-score-semantics
