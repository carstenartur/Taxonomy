# Administrator-only browser-session inventory
sessions.title=Signed-in sessions
sessions.skip=Skip to sessions
sessions.navigation=Session administration
sessions.back=Back to application
sessions.scope=Local application instance only, not the entire cluster or the identity provider. Only browser logins registered since this instance started are included.
sessions.meaning=A registered session is not proof that someone is currently viewing the page. Last request includes automatic browser requests. Closing a browser does not log out immediately; sessions disappear on logout or when the container reports expiration. Stateless Basic/Bearer requests and database connections are not additional browser users.
sessions.refresh=Refresh sessions
sessions.measured=Measured at (UTC)
sessions.users=Distinct identified users
sessions.count=Registered non-expired sessions
sessions.unidentified=Sessions with unsupported identity types (not included in the identified user count)
sessions.truncated=Only the first 200 user rows are displayed. Counts include all registered sessions in this instance.
sessions.empty=No browser sessions are registered in this instance.
sessions.authentication=Sign-in type
sessions.oidc=OIDC browser sign-in
sessions.local=Local browser sign-in
sessions.lastRequest=Last registered request (UTC)
sessions.privacy=Read-only administrator view. No session IDs, passwords, tokens, IP addresses or email addresses are exposed. Names are not exported as telemetry labels. Separate identities can have the same display name.
