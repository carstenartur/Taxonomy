name: Interoperability module extraction
on:
  push:
    branches: [verification/628-physical-workspace]
    paths: [.github/workflows/628-interop-extraction.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: c121be0701ad5dd4716e1e6922be23a6db2f6d9f
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: source/**/pom.xml
      - name: Add regression before production changes
        run: cp ../control/verification/628-interop/ArchitectureInteropModuleTest.java taxonomy-app/src/test/java/com/taxonomy/
      - name: Reproduce physical and dependency boundary failures
        run: |
          set +e
          ./mvnw -B -ntp -Parchitecture-tests -Dsurefire.failIfNoSpecifiedTests=false -Dtest=ArchitectureInteropModuleTest test > "$RUNNER_TEMP/interop-red.log" 2>&1
          result=$?
          set -e
          if [[ "$result" == 0 ]]; then echo 'Expected the new boundary regression to fail'; exit 1; fi
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('taxonomy-app/target/surefire-reports/TEST-com.taxonomy.ArchitectureInteropModuleTest.xml')
          if not report.is_file():
              print(Path(os.environ['RUNNER_TEMP'], 'interop-red.log').read_text()[-12000:])
              raise SystemExit('No JUnit result: compilation or infrastructure failure is not valid evidence')
          root = ET.parse(report).getroot()
          assert [root.get(k) for k in ('tests','failures','errors','skipped')] == ['2','2','0','0'], root.attrib
          failures = {case.get('name'): case.find('failure').get('message','') for case in root.findall('testcase')}
          assert 'physical interoperability Maven module' in failures['interoperabilityImplementationBelongsToItsLibrary']
          assert 'com.taxonomy.portfolio' in failures['interoperabilityUsesPortsInsteadOfApplicationImplementations']
          print('RED VERIFIED: 2 expected failures, no errors/skips; production tree unchanged')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: interop-boundary-red
          path: |
            ${{ runner.temp }}/interop-red.log
            source/taxonomy-app/target/surefire-reports/TEST-com.taxonomy.ArchitectureInteropModuleTest.xml
          if-no-files-found: error
          retention-days: 7
