name: Verify PR1133 narrow checkpoint projection
on:
  push:
    branches: [transfer/pr1133-checkpoint-memory-3f3eddd9]
    paths: [.github/workflows/checkpoint-projection-fix.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fcf8f8abd00819848685b384e0283ff21bdc61b3
          fetch-depth: 1
      - name: Apply only the four exact locally tested changes
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args]).decode().strip()
          base='fcf8f8abd00819848685b384e0283ff21bdc61b3'
          source='b4bfb434781f3e69fad62d0aa61a222057404e2f'
          assert git('rev-parse','HEAD')==base
          assert git('ls-remote','origin','refs/heads/feat/resumable-copilot-evaluation').split()[0]==base
          git('fetch','origin',source)
          patch=b''.join(subprocess.check_output(['git','show',source+':.github/transfer/projection-'+str(i)+'.patch']) for i in range(4))
          assert hashlib.sha256(patch).hexdigest()=='5643fea00344ddb4331dbceb2173678f458ac8e97f2d9807a06bc06eab01e92b'
          paths={
            'taxonomy-analysis/src/main/java/com/taxonomy/analysis/recovery/AnalysisContinuationStore.java':('0f4413a84a4cd5d46dd10204417cb78e85f2a915','51602a32447259319faf31ad7736804660cad402'),
            'taxonomy-analysis/src/test/java/com/taxonomy/analysis/recovery/RecoveryCheckpointPersistenceProbe.java':('018b0321b274aee9af27b0d4465df235047c3788','4a067b496b8bfebc0cf564c690fba0ec29c98f3c'),
            'taxonomy-analysis/src/test/java/com/taxonomy/analysis/recovery/RecoveryCheckpointPersistenceTest.java':('518676ca3841a55b3eb89ca878c6f14e05f008e9','c656a47b45d12e4042be7f2188fc9c8cecf9e488'),
            'taxonomy-analysis/src/test/java/com/taxonomy/analysis/recovery/RecoveryDurabilityProbe.java':('11872ab5d56b2973275c70cd68b2041ed4e8a9dd','ebf8394dab859bcb0a24b6fcb55e8a2837b1bf72')
          }
          for name,(before,after) in paths.items(): assert git('hash-object',name)==before,name
          subprocess.run(['git','apply','--index'],input=patch,check=True)
          for name,(before,after) in paths.items(): assert git('hash-object',name)==after,name
          assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          git('diff','--cached','--check')
          git('config','user.name','ChatGPT');git('config','user.email','chatgpt@users.noreply.github.com')
          git('commit','-m','fix(analysis): keep frozen snapshots out of question bookkeeping\n\nUse the same pessimistically locked continuation row through a narrow projection. Persist question changes and guarded versioned metadata updates atomically, without fetching the frozen result for prepare/finish/replay. Test SQL shape, cancellation authority, rollback, and cached answer reuse. Preserve the original result, data limits and all runtime memory guards.')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'checkpoint-projection';out.mkdir()
          candidate=git('rev-parse','HEAD')
          (out/'candidate.json').write_text(json.dumps({'head':candidate,'parent':base,'tree':git('rev-parse','HEAD^{tree}'),'files':paths},indent=2))
          (out/'diff.patch').write_bytes(patch)
          git('push','origin',candidate+':refs/heads/transfer/pr1133-checkpoint-projection-candidate')
          print(candidate)
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Nineteen persistence and durability regression tests
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp -pl taxonomy-app -am -Dtest=RecoveryCheckpointPersistenceTest,RecoveryDurabilityTest,RecoveryCatalogueExchangeTest -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee "$RUNNER_TEMP/checkpoint-projection/maven.log"
      - name: Focused production JavaScript regressions
        shell: bash
        run: |
          set -o pipefail
          node --test .github/scripts/analysis*.test.mjs .github/scripts/copilot-operation-lifecycle.test.mjs .github/scripts/copilot-terminal-state-regression.test.mjs .github/scripts/copilot-session-i18n-ready-regression.test.mjs .github/scripts/copilot-summary-freshness.test.mjs .github/scripts/product-score-streaming.test.mjs .github/scripts/ui-copilot-completion.test.mjs 2>&1 | tee "$RUNNER_TEMP/checkpoint-projection/javascript.log"
      - name: Retain exact source and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1133-checkpoint-projection
          path: |
            ${{ runner.temp }}/checkpoint-projection/
            **/target/surefire-reports/
          retention-days: 3
          if-no-files-found: warn
