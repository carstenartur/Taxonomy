spring.application.name=taxonomy-analyzer
server.port=${PORT:8080}
server.address=0.0.0.0

# ── Default profile: hsqldb (in-memory, zero-config local dev) ────────────────
# Activate a different profile for external databases:
#   SPRING_PROFILES_ACTIVE=mssql      → Microsoft SQL Server
#   SPRING_PROFILES_ACTIVE=postgres   → PostgreSQL
#   SPRING_PROFILES_ACTIVE=oracle     → Oracle Database
#   SPRING_PROFILES_ACTIVE=hsqldb     → HSQLDB (explicit, same as default)
# Database-specific settings (URL, driver, dialect, pool) live in
# application-hsqldb.properties, application-mssql.properties,
# application-postgres.properties, and application-oracle.properties.
spring.profiles.default=hsqldb

# Async taxonomy initialization: set TAXONOMY_INIT_ASYNC=true to load taxonomy
# in the background AFTER the server starts accepting connections (recommended for
# Render and similar PaaS platforms to avoid "No open ports detected" timeouts).
# Defaults to false for backward compatibility (synchronous, tests pass as-is).
taxonomy.init.async=${TAXONOMY_INIT_ASYNC:false}
# Persistent deployments reuse an existing taxonomy catalogue by default. Set
# TAXONOMY_INIT_RELOAD_EXISTING=true only for an intentional destructive catalogue refresh.
taxonomy.init.reload-existing=${TAXONOMY_INIT_RELOAD_EXISTING:false}

# create = rebuild schema on each start (safe for in-memory default); override to
# update for file-based deployments so data is not wiped on restart.
spring.jpa.hibernate.ddl-auto=${TAXONOMY_DDL_AUTO:create}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway is enabled only by database profiles with released Core migrations.
# Legacy adoption is a one-time, fail-closed operator action after backup/preflight.
spring.flyway.enabled=false
taxonomy.jgit-storage.legacy-adoption=${TAXONOMY_JGIT_STORAGE_LEGACY_ADOPTION:false}
# Portable application contract migrations and the empty commit-index search rebuild
# are enabled by default. Disable only for a controlled diagnostic start.
taxonomy.schema-migration.enabled=${TAXONOMY_SCHEMA_MIGRATION_ENABLED:true}
taxonomy.commit-index.search-rebuild-empty=${TAXONOMY_COMMIT_INDEX_SEARCH_REBUILD_EMPTY:true}

# ── Memory optimization: JDBC batching ────────────────────────────────────────
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# LLM provider: GEMINI, OPENAI, DEEPSEEK, QWEN, LLAMA, MISTRAL, CUSTOM_OPENAI, LOCAL_ONNX
# If not set, the provider is auto-detected from available API keys or a complete
# CUSTOM_LLM_URL + CUSTOM_LLM_MODEL configuration.
# LOCAL_ONNX requires no API key, but semantic embeddings and any runtime download
# must be enabled explicitly with the embedding settings below.
llm.provider=${LLM_PROVIDER:}
llm.mock=${LLM_MOCK:false}

# ── LLM Record/Replay (for deterministic test recordings) ─────────────────────
# llm.record=true   → real API calls are made AND recorded for future replay
# llm.replay=true   → previously recorded responses are replayed (no real API call)
# llm.replay.fallback=live → when replaying and no recording exists, fall through to
#                            the real API and record the result
# llm.prune=true    → mark recordings unused in the current run as stale
# llm.prune.delete=true → delete stale recordings
llm.record=${LLM_RECORD:false}
llm.replay=${LLM_REPLAY:false}
llm.replay.fallback=${LLM_REPLAY_FALLBACK:error}
llm.prune=${LLM_PRUNE:false}
llm.prune.delete=${LLM_PRUNE_DELETE:false}
llm.recordings.dir=${LLM_RECORDINGS_DIR:}

# API keys — set via environment variables or here
gemini.api.key=${GEMINI_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}
deepseek.api.key=${DEEPSEEK_API_KEY:}
qwen.api.key=${DASHSCOPE_API_KEY:}
llama.api.key=${LLAMA_API_KEY:}
mistral.api.key=${MISTRAL_API_KEY:}

# Operator-configured OpenAI Chat Completions endpoint. URL and model are required
# when LLM_PROVIDER=CUSTOM_OPENAI; the API key is optional for trusted local servers.
# Examples: Ollama /v1/chat/completions, vLLM /v1/chat/completions, LocalAI /v1/chat/completions.
custom.llm.url=${CUSTOM_LLM_URL:}
custom.llm.model=${CUSTOM_LLM_MODEL:}
custom.llm.api.key=${CUSTOM_LLM_API_KEY:}

# ── Local Embedding (bge-small-en-v1.5 via DJL / ONNX Runtime) ───────────────
# Semantic embedding is independent from the selected chat provider and is disabled by
# default. Set TAXONOMY_EMBEDDING_ENABLED=true only when vector indexing/search is wanted.
embedding.enabled=${TAXONOMY_EMBEDDING_ENABLED:false}
# Path to a pre-downloaded model directory. A remote model is never fetched unless
# TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD=true is also set explicitly.
embedding.model.dir=${TAXONOMY_EMBEDDING_MODEL_DIR:}
# HuggingFace model URL or local path to a directory containing
# model.onnx + tokenizer.json + serving.properties.
embedding.model.name=${TAXONOMY_EMBEDDING_MODEL_NAME:https://huggingface.co/BAAI/bge-small-en-v1.5}
# Prefix prepended to query texts for asymmetric retrieval (BGE models).
embedding.query.prefix=${TAXONOMY_EMBEDDING_QUERY_PREFIX:Represent this sentence for searching relevant passages: }
# Runtime downloads are opt-in so containers/Kubernetes do not make unexpected outbound
# requests. Prefer a mounted TAXONOMY_EMBEDDING_MODEL_DIR in production.
embedding.allow-download=${TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD:false}
# Node vectors are built before relation vectors. Loader concurrency is deliberately
# bounded because every loaded entity performs local ONNX inference.
embedding.index.loader-threads=${TAXONOMY_EMBEDDING_INDEX_LOADER_THREADS:2}
embedding.index.batch-size=${TAXONOMY_EMBEDDING_INDEX_BATCH_SIZE:16}

# ADMIN_PASSWORD is a separate legacy/admin-panel and Actuator token. It is not the
# form-login administrator password.
admin.token=${ADMIN_PASSWORD:}
# Local form-login bootstrap credential. Outside production an empty value creates a
# one-time random password; the production profile rejects empty, weak or placeholder values.
taxonomy.admin-password=${TAXONOMY_ADMIN_PASSWORD:}

# ── Startup optimization: lazy initialization ───────────────────────────────
# Lazy bean initialization: only create beans when first accessed.
# TaxonomyService is annotated @Lazy(false) to remain eagerly initialized,
# preserving the @PostConstruct and @EventListener(ApplicationReadyEvent) behaviour.
# All other beans benefit from deferred creation, which reduces startup time.
spring.main.lazy-initialization=${TAXONOMY_LAZY_INIT:true}

# Disable JMX to save startup time and memory
spring.jmx.enabled=false

# Disable auto-configurations that are not needed
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.admin.SpringApplicationAdminJmxAutoConfiguration,\
  org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration

# Thymeleaf — cache templates in production; set TAXONOMY_THYMELEAF_CACHE=false for local dev
spring.thymeleaf.cache=${TAXONOMY_THYMELEAF_CACHE:true}

# ── Hibernate Statistics ───────────────────────────────────────────────────
# Enables Hibernate ORM statistics (sessions, queries, entities, cache).
# Micrometer auto-publishes these as hibernate.* metrics in /actuator/prometheus.
spring.jpa.properties.hibernate.generate_statistics=true

# ── Hibernate Search (Lucene backend) ────────────────────────────────────────
# Defaults to in-memory heap (fast, no I/O) for local dev/test.
# Override TAXONOMY_SEARCH_DIRECTORY_TYPE=local-filesystem (and optionally
# TAXONOMY_SEARCH_DIRECTORY_ROOT) for production disk-backed deployments.
spring.jpa.properties.hibernate.search.enabled=true
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.lucene_version=9.12.3
spring.jpa.properties.hibernate.search.backend.directory.type=${TAXONOMY_SEARCH_DIRECTORY_TYPE:local-heap}
spring.jpa.properties.hibernate.search.backend.directory.root=${TAXONOMY_SEARCH_DIRECTORY_ROOT:/app/data/lucene-index}
spring.jpa.properties.hibernate.search.backend.analysis.configurer=bean:hibernateSearchAnalysisConfigurer
# Synchronous indexing guarantees visibility after commit. Production and Kubernetes
# normally use write-sync for greater throughput.
spring.jpa.properties.hibernate.search.indexing.plan.synchronization.strategy=${TAXONOMY_SEARCH_SYNC_STRATEGY:sync}

# Suppress HSEARCH000568 warning about directory.root being unused when directory.type=local-heap
spring.jpa.properties.hibernate.search.configuration_property_checking.strategy=ignore

# ── Spring Boot Actuator ───────────────────────────────────────────────────
# Expose health, metrics, info and prometheus endpoints over HTTP.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.prometheus.enabled=true

# Health endpoint probes for Kubernetes-style readiness/liveness (also works with Render)
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Include useful info in /actuator/info
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.description=Taxonomy Architecture Analyzer

# Application display version — injected from pom.xml via Maven resource filtering
app.display-version=@project.version@

# ── SpringDoc / Swagger UI ─────────────────────────────────────────────────
# Enabled by default for development; set TAXONOMY_SPRINGDOC_ENABLED=false
# in production to disable the /v3/api-docs and /swagger-ui.html endpoints.
springdoc.api-docs.enabled=${TAXONOMY_SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${TAXONOMY_SPRINGDOC_ENABLED:true}

# ── Rate Limiting ─────────────────────────────────────────────────────────────
# Maximum admitted LLM-backed requests per stable authenticated identity and minute.
# Local users use canonical usernames; Keycloak uses immutable issuer/subject.
# Exactly 0 disables; negative values fail closed to 1. Counters are per instance.
taxonomy.rate-limit.per-minute=${TAXONOMY_RATE_LIMIT_PER_MINUTE:10}

# ── Login brute-force protection and local identity mode ─────────────────────
taxonomy.security.login-rate-limit.enabled=${TAXONOMY_LOGIN_RATE_LIMIT:true}
taxonomy.security.login-rate-limit.max-attempts=${TAXONOMY_LOGIN_MAX_ATTEMPTS:5}
taxonomy.security.login-rate-limit.lockout-seconds=${TAXONOMY_LOGIN_LOCKOUT_SECONDS:300}
taxonomy.security.require-password-change=${TAXONOMY_REQUIRE_PASSWORD_CHANGE:false}
taxonomy.security.swagger-public=${TAXONOMY_SWAGGER_PUBLIC:true}
taxonomy.security.audit-logging=${TAXONOMY_AUDIT_LOGGING:false}
# Keycloak overrides these defaults to false. Do not enable local account management
# in an OIDC deployment without a deliberate security review.
taxonomy.security.local-users-enabled=${TAXONOMY_SECURITY_LOCAL_USERS_ENABLED:true}
taxonomy.security.change-password-enabled=${TAXONOMY_SECURITY_CHANGE_PASSWORD_ENABLED:true}

# ── LLM and architecture-analysis preferences ────────────────────────────────
taxonomy.llm.rpm=${TAXONOMY_LLM_RPM:5}
taxonomy.llm.timeout-seconds=${TAXONOMY_LLM_TIMEOUT_SECONDS:30}
taxonomy.analysis.min-score=${TAXONOMY_ANALYSIS_MIN_SCORE:70}
# Concrete information products are scored independently and in bounded deterministic batches.
taxonomy.analysis.product.batch-size=${TAXONOMY_ANALYSIS_PRODUCT_BATCH_SIZE:10}
taxonomy.analysis.product.min-score=${TAXONOMY_ANALYSIS_PRODUCT_MIN_SCORE:50}

# ── DSL / JGit settings ──────────────────────────────────────────────────────
taxonomy.dsl.default-branch=${TAXONOMY_DSL_DEFAULT_BRANCH:draft}
taxonomy.dsl.project-name=${TAXONOMY_DSL_PROJECT_NAME:Taxonomy Architecture}
taxonomy.dsl.auto-save-interval=${TAXONOMY_DSL_AUTO_SAVE_INTERVAL:0}
taxonomy.dsl.remote-url=${TAXONOMY_DSL_REMOTE_URL:}
taxonomy.dsl.remote-token=${TAXONOMY_DSL_REMOTE_TOKEN:}
taxonomy.dsl.remote-push-on-commit=${TAXONOMY_DSL_REMOTE_PUSH_ON_COMMIT:false}
taxonomy.context.max-history=${TAXONOMY_CONTEXT_MAX_HISTORY:50}
taxonomy.git.bootstrap=${TAXONOMY_GIT_BOOTSTRAP:true}
# The multi-repository REST API remains an explicit, disabled-by-default feature flag.
taxonomy.features.multi-repository-api.enabled=${TAXONOMY_FEATURES_MULTI_REPOSITORY_API_ENABLED:false}

# ── Portfolio imports, durable analysis jobs and working drafts ───────────────
taxonomy.portfolio.max-import-requirements=${TAXONOMY_PORTFOLIO_MAX_IMPORT_REQUIREMENTS:100}
taxonomy.portfolio.max-import-characters=${TAXONOMY_PORTFOLIO_MAX_IMPORT_CHARACTERS:500000}
taxonomy.portfolio.max-analysis-batch=${TAXONOMY_PORTFOLIO_MAX_ANALYSIS_BATCH:100}
taxonomy.portfolio.analysis-claim-timeout-seconds=${TAXONOMY_PORTFOLIO_ANALYSIS_CLAIM_TIMEOUT_SECONDS:900}
taxonomy.portfolio.analysis-worker-concurrency=${TAXONOMY_PORTFOLIO_ANALYSIS_WORKER_CONCURRENCY:1}
taxonomy.portfolio.analysis-worker-queue-capacity=${TAXONOMY_PORTFOLIO_ANALYSIS_WORKER_QUEUE_CAPACITY:100}
taxonomy.portfolio.analysis-worker-shutdown-seconds=${TAXONOMY_PORTFOLIO_ANALYSIS_WORKER_SHUTDOWN_SECONDS:30}
taxonomy.portfolio.snapshot-stale-after-days=${TAXONOMY_PORTFOLIO_SNAPSHOT_STALE_AFTER_DAYS:30}
taxonomy.analysis-draft.max-characters=${TAXONOMY_ANALYSIS_DRAFT_MAX_CHARACTERS:2000000}

# ── Input, architecture and export limits ────────────────────────────────────
taxonomy.limits.max-business-text=${TAXONOMY_LIMITS_MAX_BUSINESS_TEXT:5000}
taxonomy.limits.max-architecture-nodes=${TAXONOMY_LIMITS_MAX_ARCHITECTURE_NODES:50}
taxonomy.limits.max-export-nodes=${TAXONOMY_LIMITS_MAX_EXPORT_NODES:200}
taxonomy.limits.document.max-upload-bytes=${TAXONOMY_LIMITS_DOCUMENT_MAX_UPLOAD_BYTES:52428800}
taxonomy.limits.document.max-pdf-pages=${TAXONOMY_LIMITS_DOCUMENT_MAX_PDF_PAGES:500}
taxonomy.limits.document.max-extracted-characters=${TAXONOMY_LIMITS_DOCUMENT_MAX_EXTRACTED_CHARACTERS:1000000}
taxonomy.limits.document.max-candidates=${TAXONOMY_LIMITS_DOCUMENT_MAX_CANDIDATES:2000}
taxonomy.limits.document.max-llm-characters=${TAXONOMY_LIMITS_DOCUMENT_MAX_LLM_CHARACTERS:200000}
taxonomy.limits.document.max-docx-entry-bytes=${TAXONOMY_LIMITS_DOCUMENT_MAX_DOCX_ENTRY_BYTES:67108864}
taxonomy.limits.document.max-docx-text-bytes=${TAXONOMY_LIMITS_DOCUMENT_MAX_DOCX_TEXT_BYTES:134217728}
taxonomy.limits.document.min-docx-inflate-ratio=${TAXONOMY_LIMITS_DOCUMENT_MIN_DOCX_INFLATE_RATIO:0.01}

# ── Document templates and diagram policy ────────────────────────────────────
taxonomy.document-templates.direct-word-enabled=${TAXONOMY_DIRECT_WORD_ENABLED:true}
taxonomy.diagram.policy=${TAXONOMY_DIAGRAM_POLICY:defaultImpact}

# Hierarchical decision rationale report provenance
git.commit.id=${GIT_COMMIT:${GITHUB_SHA:unknown}}
taxonomy.catalogue.resource=${TAXONOMY_CATALOGUE_RESOURCE:classpath:data/C3_Taxonomy_Catalogue_25AUG2025.xlsx}
# Versioned JSON corrections and product classifications layered over the Excel baseline.
taxonomy.catalogue.overlay.enabled=${TAXONOMY_CATALOGUE_OVERLAY_ENABLED:true}
taxonomy.catalogue.overlay-resource=${TAXONOMY_CATALOGUE_OVERLAY_RESOURCE:classpath:data/nato-taxonomy.json}
taxonomy.report.time-zone=${TAXONOMY_REPORT_TIME_ZONE:Europe/Berlin}
