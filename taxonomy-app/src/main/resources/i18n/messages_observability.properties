sessions.scope=Local application instance only, not the entire cluster or the identity provider. Only browser logins registered since this instance started are included.
sessions.meaning=A registered session is not proof that someone is currently viewing the page. Last request includes automatic browser requests. Closing a browser does not log out immediately; sessions disappear on logout or when the container reports expiration. Stateless Basic/Bearer requests and database connections are not additional browser users.
