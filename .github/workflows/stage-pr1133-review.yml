name: Stage reviewed PR1133 durability patch
on:
  push:
    branches: [transfer/pr1133-review-publish-1d0504f907]
    paths: [.github/workflows/stage-pr1133-review.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b4df02b335793bdfb7d1d07849425c2e9197164
          fetch-depth: 0
      - name: Verify exact patch and inspect main integration
        id: stage
        env:
          PAYLOAD_SHA256: 1d0504f9073f88c7a36c110269e5f68b73b28b55485bdfdde14d8da297a37957
          REVIEW_BASE: 6b4df02b335793bdfb7d1d07849425c2e9197164
          REVIEW_MAIN: 8a1190bf38f77cd5151165bbbfdc688e15f046ab
          STAGING_BRANCH: transfer/pr1133-review-stage-1d0504f907
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          D=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1133-review';D.mkdir()
          def git(*args,check=True):
              return subprocess.run(['git',*args],check=check,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          def out(*args):return git(*args).stdout.strip()
          encoded=''.join(out('show',os.environ['GITHUB_SHA']+f':.github/transfer/pr1133-review-{i}.b64') for i in range(3))
          raw=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()==os.environ['PAYLOAD_SHA256']
          data=json.loads(raw); base=os.environ['REVIEW_BASE']; main=os.environ['REVIEW_MAIN']
          assert out('rev-parse','HEAD')==base
          assert out('ls-remote','origin','refs/heads/feat/resumable-copilot-evaluation').split()[0]==base,'PR advanced; refusing stale publication'
          for f in data['files']:
              path=pathlib.Path(f['path']);assert not path.is_absolute() and '..' not in path.parts
              found=git('rev-parse','--verify','HEAD:'+f['path'],check=False)
              assert (found.stdout.strip() if found.returncode==0 else None)==f['before'],f['path']
          patch=D/'review.patch';patch.write_text(data['patch'])
          git('apply','--check',str(patch));git('apply','--index',str(patch));git('diff','--cached','--check')
          assert sorted(out('diff','--cached','--name-only').splitlines())==sorted(f['path'] for f in data['files'])
          for f in data['files']:assert out('rev-parse',':'+f['path'])==f['after'],f['path']
          git('config','user.name','ChatGPT');git('config','user.email','chatgpt@users.noreply.github.com')
          git('commit','-m','fix(analysis): commit recovery evidence before terminal publication\n\nAddress the four PR1133 review findings: durable cancellation, terminal progress ordering, provider validation and catalogue-bound v3 exchange. Add thirteen executable Java regressions and document local HTTP/SIGKILL verification. No gate or baseline weakened.')
          fixes=out('rev-parse','HEAD')
          git('fetch','origin',main)
          merge=git('merge','--no-ff','--no-commit',main,check=False)
          (D/'merge.log').write_text(merge.stdout)
          conflicts=out('diff','--name-only','--diff-filter=U').splitlines()
          if merge.returncode:
              for path in conflicts:
                  target=D/'conflicts'/path;target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_text(pathlib.Path(path).read_text())
                  for i in [1,2,3]:
                      part=git('show',f':{i}:{path}',check=False)
                      if part.returncode==0:target.with_name(target.name+f'.stage{i}').write_text(part.stdout)
              git('merge','--abort')
          else:
              git('diff','--cached','--check')
              git('commit','-m','Merge current main into PR1133 without dropping recovery changes')
          head=out('rev-parse','HEAD');tree=out('rev-parse','HEAD^{tree}')
          git('push','origin',head+':refs/heads/'+os.environ['STAGING_BRANCH'])
          result={'base':base,'main':main,'fixesCommit':fixes,'candidateCommit':head,'candidateTree':tree,'conflicts':conflicts,'mergeReturnCode':merge.returncode,'payloadSha256':hashlib.sha256(raw).hexdigest(),'files':data['files']}
          (D/'candidate.json').write_text(json.dumps(result,indent=2))
          print(json.dumps({k:v for k,v in result.items() if k!='files'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('merged='+str(merge.returncode==0).lower()+'\n')
          if merge.returncode:raise SystemExit('Staged verified fixes, but main merge requires explicit conflict resolution')
      - name: Set up Java 21
        if: steps.stage.outputs.merged == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Execute the thirteen review regressions in Maven
        if: steps.stage.outputs.merged == 'true'
        run: ./mvnw -B -ntp -pl taxonomy-app -am -Dtest=RecoveryDurabilityTest,RecoveryCatalogueExchangeTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Retain exact publication and conflict evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1133-review-staging
          path: ${{ runner.temp }}/pr1133-review/
          retention-days: 3
      - name: Retain focused JUnit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1133-review-junit
          path: '**/target/surefire-reports/'
          retention-days: 3
          if-no-files-found: ignore
