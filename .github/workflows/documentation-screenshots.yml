name: Documentation Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - docs/refresh-impact-map-screenshot
    paths:
      - .github/workflows/documentation-screenshots.yml

permissions:
  contents: read

concurrency:
  group: taxonomy-documentation-screenshots-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BGE_MODEL_REVISION: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a

jobs:
  generate:
    name: Generate screenshot artifact
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/docs/refresh-impact-map-screenshot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate trusted invocation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          else
            test "${GITHUB_EVENT_NAME}" = "push"
            test "${GITHUB_REF}" = "refs/heads/docs/refresh-impact-map-screenshot"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Install document rendering tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libreoffice-writer \
            poppler-utils

      - name: Download and verify pinned embedding model
        env:
          MODEL_REVISION: ${{ env.BGE_MODEL_REVISION }}
        run: bash .github/scripts/download-embedding-model.sh

      - name: Generate deterministic documentation screenshots
        env:
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/bge-small-en-v1.5
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
          LLM_MOCK: 'true'
        run: ./mvnw -B install -Pscreenshots -Dfailsafe.rerunFailingTestsCount=1

      - name: Install pinned Node and Chromium
        if: github.ref == 'refs/heads/main'
        run: |
          ./mvnw -B -pl taxonomy-build pre-integration-test \
            -Dtaxonomy.ui.skip=false \
            -Dtaxonomy.quality.skip=true \
            -Dtaxonomy.playwright.install.arguments="exec -- playwright install --with-deps chromium"

      - name: Generate document-template browser and report screenshots
        if: github.ref == 'refs/heads/main'
        env:
          TAXONOMY_RENDER_DOCX_PREVIEW: 'true'
          TAXONOMY_DOCS_IMAGE_DIR: ${{ github.workspace }}/docs/images
        run: |
          ./mvnw -B -pl taxonomy-build \
            -Pdocument-template-report-e2e \
            verify \
            -Dtaxonomy.node.executable="${GITHUB_WORKSPACE}/taxonomy-build/target/frontend/node/node"

      - name: Stage screenshot artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/generated-screenshots
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            cp docs/images/*.png target/generated-screenshots/
          else
            cp docs/images/20-architecture-view.png target/generated-screenshots/
          fi
          test -n "$(find target/generated-screenshots -maxdepth 1 -name '*.png' -print -quit)"

      - name: Upload generated screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-documentation-screenshots
          path: target/generated-screenshots/*.png
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish screenshots to main
    needs: generate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate publication target
        run: |
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git branch --show-current)" = "main"

      - name: Download verified screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-documentation-screenshots
          path: docs/images

      - name: Commit changed screenshots only
        run: |
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/images/*.png
          if git diff --staged --quiet; then
            echo "No screenshot changes to publish."
            exit 0
          fi
          git commit -m 'docs: regenerate documentation screenshots [skip ci]'
          git push origin HEAD:main

  publish-impact-map-branch:
    name: Publish impact-map screenshot to documentation branch
    needs: generate
    if: github.ref == 'refs/heads/docs/refresh-impact-map-screenshot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/refresh-impact-map-screenshot
          fetch-depth: 0

      - name: Validate documentation branch target
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF}" = "refs/heads/docs/refresh-impact-map-screenshot"
          test "$(git branch --show-current)" = "docs/refresh-impact-map-screenshot"

      - name: Download verified impact-map screenshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-documentation-screenshots
          path: docs/images

      - name: Commit the changed impact-map screenshot
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin docs/refresh-impact-map-screenshot
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/images/20-architecture-view.png
          if git diff --staged --quiet; then
            echo "The impact-map screenshot is already current."
            exit 0
          fi
          git commit -m 'docs: refresh architecture impact map screenshot [skip ci]'
          git push origin HEAD:docs/refresh-impact-map-screenshot
