    private List<AggregatedProductCoverageGapView> aggregateProductCoverageGaps(
            Long projectId,
            List<RequirementView> requirements,
            List<RequirementElementMapping> mappings,
            String scopeKey) {
        Map<GapMappingKey, RequirementElementMapping> mappingIndex = new LinkedHashMap<>();
        for (RequirementElementMapping mapping : mappings) {
            mappingIndex.putIfAbsent(
                    new GapMappingKey(mapping.getSnapshotId(), mapping.getNodeCode()), mapping);
        }

        Map<String, ProductGapAccumulator> byFamily = new LinkedHashMap<>();
        for (RequirementView requirement : requirements) {
            String snapshotId = requirement.currentAnalysisSnapshotId();
            if (snapshotId == null || snapshotId.isBlank()) {
                continue;
            }
            RequirementAnalysisSnapshot snapshot = snapshotRepository
                    .findByIdAndProjectIdAndScopeKey(snapshotId, projectId, scopeKey)
                    .orElse(null);
            if (snapshot == null) {
                continue;
            }
            AnalysisResult analysis = jsonCodec.read(snapshot.getAnalysisPayload(), AnalysisResult.class);
            if (analysis == null || analysis.getProductCoverageGaps() == null
                    || analysis.getProductCoverageGaps().isEmpty()) {
                continue;
            }
            Map<String, Integer> analysisScores = analysis.getScores() == null
                    ? Map.of() : analysis.getScores();
            for (ProductCoverageGap gap : analysis.getProductCoverageGaps()) {
                if (gap == null || gap.productFamilyCode() == null
                        || gap.productFamilyCode().isBlank()) {
                    continue;
                }
                String familyCode = gap.productFamilyCode().strip();
                RequirementElementMapping mapping = mappingIndex.get(
                        new GapMappingKey(snapshotId, familyCode));
                Map<String, Integer> evaluatedProductScores = new LinkedHashMap<>();
                for (String candidateCode : gap.candidateCodes()) {
                    if (candidateCode == null || candidateCode.isBlank()) {
                        continue;
                    }
                    String normalizedCode = candidateCode.strip();
                    evaluatedProductScores.put(normalizedCode,
                            gap.evaluatedProductScores().getOrDefault(
                                    normalizedCode,
                                    analysisScores.getOrDefault(normalizedCode, 0)));
                }
                ActionStatus actionStatus = mapping == null || mapping.getActionStatus() == null
                        ? ActionStatus.UNDECIDED : mapping.getActionStatus();
                ReviewStatus reviewStatus = mapping == null || mapping.getReviewStatus() == null
                        ? ReviewStatus.PROPOSED : mapping.getReviewStatus();
                ProductCoverageGapOccurrenceView occurrence =
                        new ProductCoverageGapOccurrenceView(
                                requirement.id(),
                                requirement.requirementKey(),
                                snapshotId,
                                snapshot.getStatus(),
                                snapshot.getTaxonomyFingerprint(),
                                snapshot.getPromptFingerprint(),
                                snapshot.getBranchName(),
                                snapshot.getCommitSha(),
                                mapping != null ? mapping.getId() : null,
                                familyCode,
                                gap.productFamilyName(),
                                gap.familyScore(),
                                gap.suitabilityThreshold(),
                                Map.copyOf(evaluatedProductScores),
                                gap.reason(),
                                reviewStatus,
                                actionStatus,
                                mapping != null ? mapping.getActionEvidence() : null,
                                mapping != null ? mapping.getDecisionBy() : null,
                                mapping != null ? mapping.getDecisionAt() : null,
                                mapping != null ? mapping.getDecisionComment() : null);
                byFamily.computeIfAbsent(
                        familyCode,
                        ignored -> new ProductGapAccumulator(
                                familyCode, gap.productFamilyName()))
                        .add(occurrence);
            }
        }
        return byFamily.values().stream()
                .map(ProductGapAccumulator::toView)
                .sorted(Comparator.comparing(
                        AggregatedProductCoverageGapView::productFamilyCode))
                .toList();
    }

    private record GapMappingKey(String snapshotId, String nodeCode) {
    }

    private static final class ProductGapAccumulator {
        private final String productFamilyCode;
        private String productFamilyName;
        private int maximumFamilyScore;
        private final Set<Integer> suitabilityThresholds = new TreeSet<>();
        private final Set<String> candidateCodes = new TreeSet<>();
        private final Set<String> requirementKeys = new TreeSet<>();
        private final Set<String> snapshotIds = new TreeSet<>();
        private final Map<ActionStatus, Integer> actionStatusCounts =
                new EnumMap<>(ActionStatus.class);
        private final List<ProductCoverageGapOccurrenceView> occurrences = new ArrayList<>();

        private ProductGapAccumulator(String productFamilyCode, String productFamilyName) {
            this.productFamilyCode = productFamilyCode;
            this.productFamilyName = productFamilyName;
        }

        private void add(ProductCoverageGapOccurrenceView occurrence) {
            if ((productFamilyName == null || productFamilyName.isBlank())
                    && occurrence.productFamilyName() != null
                    && !occurrence.productFamilyName().isBlank()) {
                productFamilyName = occurrence.productFamilyName();
            }
            maximumFamilyScore = Math.max(maximumFamilyScore, occurrence.familyScore());
            suitabilityThresholds.add(occurrence.suitabilityThreshold());
            candidateCodes.addAll(occurrence.evaluatedProductScores().keySet());
            requirementKeys.add(occurrence.requirementKey());
            snapshotIds.add(occurrence.snapshotId());
            actionStatusCounts.merge(occurrence.actionStatus(), 1, Integer::sum);
            occurrences.add(occurrence);
        }

        private AggregatedProductCoverageGapView toView() {
            List<ProductCoverageGapOccurrenceView> orderedOccurrences = occurrences.stream()
                    .sorted(Comparator
                            .comparing(ProductCoverageGapOccurrenceView::requirementKey)
                            .thenComparing(ProductCoverageGapOccurrenceView::snapshotId))
                    .toList();
            int unresolved = (int) orderedOccurrences.stream()
                    .filter(occurrence -> occurrence.mappingId() == null
                            || occurrence.actionStatus() == ActionStatus.UNDECIDED)
                    .count();
            return new AggregatedProductCoverageGapView(
                    productFamilyCode,
                    productFamilyName,
                    requirementKeys.size(),
                    maximumFamilyScore,
                    List.copyOf(suitabilityThresholds),
                    List.copyOf(candidateCodes),
                    List.copyOf(requirementKeys),
                    List.copyOf(snapshotIds),
                    unresolved,
                    Map.copyOf(actionStatusCounts),
                    orderedOccurrences);
        }
    }

