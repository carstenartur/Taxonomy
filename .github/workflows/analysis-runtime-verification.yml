name: Canonical profile analysis preflight (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: write
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7bada07047ad49f2f15428b3236111e535145483
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Assemble immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          out=Path('/tmp/analysis-final-logs');out.mkdir()
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='7bada07047ad49f2f15428b3236111e535145483'
          assert git('rev-parse','HEAD')==base
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          for blob,digest in [('d94209b86c369e3c91e5c846fd8437471581595b','73f81c7da3064d99f7da622483f192c079ea95b4b8371d3c889545fb5d048e80'),('669b7861563da2a5e9a2c295d22980707021c638','27d4dc72cfaf826e6037b5f53d534c876151181c2508ce6e9ac804fa7a3c6bba')]:
              with urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs/'+blob,headers=headers)) as response:
                  data=base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob
              patch=gzip.decompress(data);assert hashlib.sha256(patch).hexdigest()==digest
              patchFile=out/(blob+'.patch');patchFile.write_bytes(patch)
              subprocess.run(['git','apply','--index',str(patchFile)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          paths=git('diff','--cached','--name-only').splitlines();assert len(paths)==12,paths
          tree=git('write-tree');assert tree=='c52c43db529e3c59a89056b1cb5c109aa04e46e7',tree
          doc={'base':base,'tree':tree,'files':{p:git('hash-object',p) for p in paths},'verificationRun':os.environ['GITHUB_RUN_ID']}
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--full-index','--binary']))
          subprocess.run(['git','-c','user.name=Analysis verification','-c','user.email=verification@invalid.example','commit','-m','Canonical verification of immutable analysis candidate'],check=True)
          assert git('status','--porcelain')==''
          doc['runnerCommit']=git('rev-parse','HEAD')
          (out/'manifest.json').write_text(json.dumps(doc,indent=2)+'\n')
      - name: Restore canonical pinned embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: models/bge-small-en-v1.5
          key: ${{ runner.os }}-taxonomy-bge-small-en-v1.5-${{ hashFiles('.github/scripts/download-embedding-model.sh') }}
      - name: Full canonical reactor command with Failsafe enabled
        env:
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/bge-small-en-v1.5
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
          FRONTEND_API_BASE_REF: 29b9ef036882f5dbfc62924d9aca63038c098d4e
        run: |
          set -o pipefail
          docker info
          ./mvnw -B -ntp verify -Pci -DrunOnnxTests=true -Dtaxonomy.ui.skip=true 2>&1 | tee /tmp/analysis-final-logs/maven-ci.log
      - name: Require actual integration and browser execution, not a skipped goal
        shell: python
        run: |
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          reports=list(Path('.').glob('**/target/failsafe-reports/TEST-*.xml'))
          assert reports,'Failsafe produced no integration reports'
          matches=[p for p in reports if p.name=='TEST-com.taxonomy.AnalysisLiveProgressUiIT.xml']
          assert len(matches)==1,matches
          suite=ET.parse(matches[0]).getroot()
          assert int(suite.get('tests','0'))>=5,suite.attrib
          for attr in ('failures','errors','skipped'): assert int(suite.get(attr,'0'))==0,suite.attrib
          assert any(case.get('name')=='finalHttpResponseRefreshesPendingDiagnosticsWithoutOverwritingScores' for case in suite.findall('testcase')), [case.get('name') for case in suite.findall('testcase')]
          totals={}
          for kind in ('surefire','failsafe'):
              counts={key:0 for key in ('tests','failures','errors','skipped')}
              files=list(Path('.').glob('**/target/'+kind+'-reports/TEST-*.xml'))
              for path in files:
                  root=ET.parse(path).getroot()
                  for key in counts: counts[key]+=int(root.get(key,'0'))
              totals[kind]={'suites':len(files),**counts}
          Path('/tmp/analysis-final-logs/test-counts.json').write_text(json.dumps(totals,indent=2)+'\n')
          print(json.dumps(totals,indent=2))
      - name: Complete Maven-owned frontend contracts
        run: |
          set -o pipefail
          ./mvnw -B -ntp -f .github/ui-verification-pom.xml verify -Pcontracts 2>&1 | tee /tmp/analysis-final-logs/frontend.log
          .cache/ui-frontend/node/node .github/scripts/test-taxonomy-base-path.mjs | tee /tmp/analysis-final-logs/base-path.log
      - name: Publish exact verified source blobs without changing any ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,subprocess,urllib.request,zipfile
          from pathlib import Path
          out=Path('/tmp/analysis-final-logs');doc=json.loads((out/'manifest.json').read_text())
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^{tree}')==doc['tree']
          assert git('diff','--name-only')==''
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'}
          with zipfile.ZipFile(out/'tested-sources.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for path,sha in doc['files'].items():
                  data=Path(path).read_bytes();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha,path
                  request=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs',headers=headers,
                      data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST')
                  with urllib.request.urlopen(request) as response: assert json.load(response)['sha']==sha
                  archive.writestr(path,data)
          doc['verification']='canonical reactor and frontend contracts passed; whole-application UI shards remain canonical PR CI gates'
          (out/'manifest.json').write_text(json.dumps(doc,indent=2)+'\n')
          print(json.dumps(doc,indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: analysis-canonical-preflight-${{ github.sha }}
          path: |
            /tmp/analysis-final-logs
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
            **/target/analysis-ui-evidence/**
          retention-days: 7
          if-no-files-found: error
