name: Finalize clean Copilot result projection

on:
  push:
    branches:
      - fix/complete-copilot-run-result-review
    paths:
      - .github/workflows/finalize-clean-copilot-result.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: finalize-clean-copilot-result-projection
  cancel-in-progress: true

jobs:
  verify-and-merge-if-present:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Merge a clean replacement only when PR 948 required contamination recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"
          name="${repo#*/}"
          source_merged="$(gh api "repos/$repo/pulls/948" --jq '.merged')"
          if [[ "$source_merged" == true ]]; then
            echo 'PR #948 is already merged; no clean projection is needed.'
            exit 0
          fi

          pr="$(gh pr list --repo "$repo" --state open \
            --head fix/complete-copilot-result-clean \
            --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            echo 'No contamination-recovery PR exists; the original PR remains authoritative.'
            exit 0
          fi

          cat > /tmp/expected-files <<'EOF'
          .github/copilot-ref-screenshots.md
          docs/de/COPILOT_AUTOPILOT.md
          docs/en/COPILOT_AUTOPILOT.md
          docs/images/72-complete-copilot-run-result.png
          pom.xml
          taxonomy-app/src/main/resources/static/css/taxonomy-portfolio.css
          taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotResultUiContractTest.java
          taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java
          taxonomy-app/src/test/java/com/taxonomy/RequirementCopilotResultSurfaceContractTest.java
          EOF
          sort -o /tmp/expected-files /tmp/expected-files

          locked_head=""
          ready=false
          for attempt in $(seq 1 100); do
            source="$(gh api "repos/$repo/pulls/948")"
            if [[ "$(jq -r '.merged' <<<"$source")" == true ]]; then
              echo 'The original PR was merged while the fallback gate was running.'
              exit 0
            fi
            pr_json="$(gh api "repos/$repo/pulls/$pr")"
            if [[ "$(jq -r '.merged' <<<"$pr_json")" == true ]]; then exit 0; fi
            [[ "$(jq -r '.state' <<<"$pr_json")" == open ]]
            [[ "$(jq -r '.draft' <<<"$pr_json")" == false ]]
            [[ "$(jq -r '.head.ref' <<<"$pr_json")" == fix/complete-copilot-result-clean ]]
            [[ "$(jq -r '.base.ref' <<<"$pr_json")" == main ]]
            head="$(jq -r '.head.sha' <<<"$pr_json")"
            if [[ -z "$locked_head" ]]; then locked_head="$head"; fi
            [[ "$head" == "$locked_head" ]]

            gh api --paginate "repos/$repo/pulls/$pr/files?per_page=100" \
              --jq '.[].filename' | sort > /tmp/actual-files
            diff -u /tmp/expected-files /tmp/actual-files

            author="$(gh api "repos/$repo/commits/$locked_head" --jq '.author.login // .commit.author.name')"
            [[ "$author" != 'github-actions[bot]' ]]

            unresolved="$(gh api graphql \
              -f owner="$owner" -f name="$name" -F number="$pr" \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
            [[ "$unresolved" == 0 ]]

            runs="$(gh api "repos/$repo/actions/runs?head_sha=$locked_head&per_page=100")"
            pending=false
            failed=false
            for workflow in \
              'CI / CD' \
              'Database Compatibility' \
              'Document Template Report E2E' \
              'Kubernetes Constrained Smoke' \
              'JGit Storage Consumer Contract' \
              'Security Scan'; do
              current="$(jq -c --arg workflow "$workflow" \
                '[.workflow_runs[] | select(.name == $workflow)] | sort_by(.created_at) | last // empty' \
                <<<"$runs")"
              if [[ -z "$current" ]]; then pending=true; echo "$workflow: not started"; continue; fi
              status="$(jq -r '.status' <<<"$current")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$current")"
              echo "$workflow: $status ${conclusion:-pending}"
              if [[ "$status" != completed ]]; then pending=true
              elif [[ "$conclusion" != success ]]; then failed=true
              fi
            done
            codeql="$(jq -c '[.workflow_runs[] | select(.name == "CodeQL Source Analysis")] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [[ -z "$codeql" ]]; then pending=true
            else
              status="$(jq -r '.status' <<<"$codeql")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$codeql")"
              if [[ "$status" != completed ]]; then pending=true
              elif [[ "$conclusion" != success && "$conclusion" != skipped ]]; then failed=true
              fi
            fi
            [[ "$failed" == false ]]
            if [[ "$pending" == false ]]; then ready=true; break; fi
            sleep 30
          done
          [[ "$ready" == true ]]

          final="$(gh api "repos/$repo/pulls/$pr")"
          [[ "$(jq -r '.head.sha' <<<"$final")" == "$locked_head" ]]
          response="$(gh api --method PUT "repos/$repo/pulls/$pr/merge" \
            -f sha="$locked_head" \
            -f merge_method=squash \
            -f commit_title='Present complete Copilot results as a reviewable summary' \
            -f commit_message='Clean eleven-file projection of the reviewed complete Copilot result surface, selected-snapshot routing, browser acceptance, exports and documentation screenshot.')"
          [[ "$(jq -r '.merged' <<<"$response")" == true ]]
          [[ "$(gh api "repos/$repo/pulls/$pr" --jq '.merged')" == true ]]
