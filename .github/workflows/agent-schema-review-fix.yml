name: Agent schema review fix

on:
  push:
    branches:
      - agent/10-day-review-cleanup
    paths:
      - .github/workflows/agent-schema-review-fix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v5
        with:
          ref: agent/10-day-review-cleanup
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply fail-closed schema and history guards
        run: python .github/scripts/agent_schema_review_fix.py

      - name: Run focused migration regression tests
        run: >-
          ./mvnw -B -pl taxonomy-app -am
          -DskipITs
          -Dtest=JgitStorageSchema091CompatibilityTest,JgitStorageSchemaIndexValidationTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Commit verified production fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taxonomy-app/src/main/java/com/taxonomy/dsl/storage/JgitStorageSchemaMigrationConfig.java
          git diff --cached --check
          git commit -m "fix(migration): reject reflog schema history drift"
          git push origin HEAD:agent/10-day-review-cleanup
