name: Verify snapshot-bound architecture exports once

on:
  push:
    branches:
      - fix/snapshot-bound-architecture-exports
    paths:
      - .github/workflows/verify-snapshot-exports-once.yml

permissions:
  contents: write

concurrency:
  group: verify-snapshot-exports-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'carstenartur/Taxonomy' && github.actor == 'carstenartur'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the triggering exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify JavaScript, browser and documentation contracts
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          node --check taxonomy-app/src/main/resources/static/js/api/architecture-workbench-api.js
          node --check taxonomy-app/src/main/resources/static/js/architecture-workbench.js
          git diff --check origin/main HEAD -- \
            taxonomy-app/src/main/java/com/taxonomy/portfolio/workbench \
            taxonomy-app/src/main/resources/static/js/api/architecture-workbench-api.js \
            taxonomy-app/src/main/resources/static/js/architecture-workbench.js \
            taxonomy-app/src/main/resources/templates/architecture-workbench.html \
            taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java \
            taxonomy-app/src/test/java/com/taxonomy/portfolio/workbench \
            docs/en/ARCHITECTURE_HANDOFF.md \
            docs/de/ARCHITECTURE_HANDOFF.md \
            docs/en/FEATURE_MATRIX.md \
            docs/de/FEATURE_MATRIX.md \
            docs/en/USER_GUIDE.md \
            docs/de/USER_GUIDE.md \
            docs/en/API_REFERENCE.md \
            docs/de/API_REFERENCE.md

          service=taxonomy-app/src/main/java/com/taxonomy/portfolio/workbench/ArchitectureSnapshotExportService.java
          controller=taxonomy-app/src/main/java/com/taxonomy/portfolio/workbench/ArchitectureWorkbenchController.java
          page=taxonomy-app/src/main/resources/templates/architecture-workbench.html
          browser=taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java

          grep -Fq 'projection.branchName()' "$service"
          ! grep -Fq 'projection.branch()' "$service"
          ! grep -Fq 'LlmService' "$service"
          grep -Fq 'canonical-evidence' "$service"
          grep -Fq 'experimental-model-exchange' "$service"
          grep -Fq 'lossy-text-projection' "$service"
          grep -Fq 'X-Taxonomy-Export-Role' "$controller"
          grep -Fq 'X-Taxonomy-Architecture-Graph-SHA256' "$controller"
          grep -Fq 'id="architectureExportFormat"' "$page"
          grep -Fq 'id="downloadArchitectureExport"' "$page"
          ! grep -Fq 'value="visio"' "$page"
          grep -Fq '.doesNotContain("visio")' "$browser"
          grep -Fq 'x-taxonomy-architecture-graph-sha256' "$browser"
          grep -Fq 'requestTextArtifact(' "$browser"

          test -f docs/en/ARCHITECTURE_HANDOFF.md
          test -f docs/de/ARCHITECTURE_HANDOFF.md
          grep -Fq 'does **not** run the LLM again' docs/en/ARCHITECTURE_HANDOFF.md
          grep -Fq 'wird **nicht** erneut ausgeführt' docs/de/ARCHITECTURE_HANDOFF.md
          grep -Fq 'Visio VSDX handoff' docs/en/FEATURE_MATRIX.md
          grep -Fq 'Visio-VSDX-Übergabe' docs/de/FEATURE_MATRIX.md
          ! grep -Fq '| Export (ArchiMate/Visio/Mermaid/JSON) |' docs/en/FEATURE_MATRIX.md
          ! grep -Fq '| Export (ArchiMate/Visio/Mermaid/JSON) |' docs/de/FEATURE_MATRIX.md
          grep -Fq 'not certified as a reliable editable Microsoft Visio handoff' docs/en/USER_GUIDE.md
          grep -Fq 'nicht als zuverlässige editierbare Microsoft-Visio-Übergabe zertifiziert' docs/de/USER_GUIDE.md
          ! grep -Fq 'suitable for import into tools such as Archi or Sparx EA' docs/en/USER_GUIDE.md
          ! grep -Fq 'zum Import in Tools wie Archi oder Sparx EA geeignet' docs/de/USER_GUIDE.md
          grep -Fq '/exports/{formatId}' docs/en/API_REFERENCE.md
          grep -Fq '/exports/{formatId}' docs/de/API_REFERENCE.md
          grep -Fq 'Legacy ad-hoc convenience exports' docs/en/API_REFERENCE.md
          grep -Fq 'Bisherige Ad-hoc-Komfortexporte' docs/de/API_REFERENCE.md

          test ! -e .github/workflows/apply-snapshot-export-ui-once.yml
          test ! -e .github/workflows/apply-snapshot-export-browser-test-once.yml
          test ! -e .github/workflows/reconcile-export-user-guides-once.yml
          test ! -e .github/workflows/reconcile-export-api-reference-once.yml

      - name: Run focused Maven tests and compile browser acceptance
        run: |
          set -euo pipefail
          ./mvnw -B -ntp \
            -pl taxonomy-app -am test \
            -Dtest=ArchitectureSnapshotExportServiceTest,ArchitectureWorkbenchControllerTest,ArchitectureWorkbenchAssetContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Remove the temporary workflow after successful exact-head verification
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse FETCH_HEAD)" = "${EXPECTED_HEAD}"
          git checkout -B "${GITHUB_REF_NAME}" "${EXPECTED_HEAD}"
          rm .github/workflows/verify-snapshot-exports-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-snapshot-exports-once.yml
          git commit -m "Remove one-shot snapshot export verification workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
