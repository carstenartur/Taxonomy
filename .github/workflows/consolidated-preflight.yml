name: Isolated consolidated preflight
on:
  push:
    branches: [verify/llm-consolidated-20260922]
permissions:
  contents: read
  actions: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize completed runs without executing application tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          gh api --allow-escape-sequences repos/carstenartur/Taxonomy/actions/jobs/106849471435/logs > evidence/core.log
          gh api --allow-escape-sequences repos/carstenartur/Taxonomy/actions/jobs/106886806797/logs > evidence/sql.log
          node <<'NODE'
          const fs = require('node:fs');
          for (const name of ['core','sql']) {
            const lines = fs.readFileSync('evidence/'+name+'.log','utf8').replace(/\x1b\[[0-9;]*m/g,'').split('\n');
            const rows = [];
            for (const line of lines) {
              const m = line.match(/Tests run: (\d+), Failures: (\d+), Errors: (\d+), Skipped: (\d+), Time elapsed: ([\d,.]+) s -- in (\S+)/);
              if (m) rows.push({name:m[6],seconds:Number(m[5].replaceAll(',','')),tests:Number(m[1]),failures:Number(m[2]),errors:Number(m[3]),skipped:Number(m[4])});
            }
            console.log(name.toUpperCase()+'_TIMINGS',JSON.stringify({count:rows.length,totalReportedSeconds:rows.reduce((s,r)=>s+r.seconds,0),slowest:rows.sort((a,b)=>b.seconds-a.seconds).slice(0,35)},null,2));
            console.log(name.toUpperCase()+'_SUMMARY\n'+lines.filter(l=>/Taxonomy .*(SUCCESS|FAILURE)|BUILD SUCCESS|BUILD FAILURE|Total time:|\[ERROR\].*(goal|fork|heap|Crashed|Tests run)|-Xmx|forkCount|reuseForks/.test(l)).slice(-45).join('\n'));
            let shown = 0;
            for (let i=0;i<lines.length && shown<3;i++) {
              if (lines[i].includes('OutOfMemoryError')) {
                console.log(name.toUpperCase()+'_FIRST_OOM_CONTEXT\n'+lines.slice(Math.max(0,i-18),i+42).join('\n'));
                shown++;
                i+=42;
              }
            }
          }
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: consolidated-build-inventory
          path: evidence/**
          if-no-files-found: error
          retention-days: 3
