integration.pcsNotice=Experimental PCS read/pull: version 1 reads package and element properties; version 2 also reads connectors, tags, attributes, operations and parameters. Collections are exhausted within aggregate limits. Apply reads all data again and rejects changed evidence. Missing objects never authorize deletion. Real EA/PCS compatibility is unverified.
