document.template.diff.help=Die nummerierten Anzeigeabschnitte beginnen vor einem wörtlichen < oder nach einem Zeilenumbruch; sie sind keine ursprünglichen Quellzeilennummern. Text, Leerzeichen und Entitäten werden weder normalisiert noch ausgeführt. Für einen exakten Bytevergleich können Sie die Originalversionen herunterladen. Unveränderte Bereiche sind eingeklappt und lassen sich vollständig aufklappen.
