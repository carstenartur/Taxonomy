name: Temporary Issue 464 Source Export

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'fix/issue-464-maven-test-authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Stage reproducible source snapshot
        run: |
          set -euo pipefail
          mkdir -p target/issue-464-source
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'target/' \
            --exclude '*/target/' \
            --exclude 'models/' \
            --exclude 'node_modules/' \
            ./ target/issue-464-source/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-464-source
          path: target/issue-464-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
