name: Verify hierarchy context correction
on:
  push:
    branches: ['verify/hierarchy-context-20260923']
permissions:
  contents: read
jobs:
  efficiency-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Stage efficiency regression on first context implementation
        run: |
          cp -r .verification /tmp/hierarchy-work
          git fetch --quiet origin 4e69b04b2fa56dd68d6b56cd4c7f15c22c7e0bd8 --depth=1
          git checkout --detach 4e69b04b2fa56dd68d6b56cd4c7f15c22c7e0bd8
          python3 /tmp/hierarchy-work/apply-hierarchy.py
          cp /tmp/hierarchy-work/ContextBatchEfficiencyTest.java taxonomy-analysis/src/test/java/com/taxonomy/analysis/service/
      - name: Prove repeated context before reducing prompt work
        run: |
          set +e
          ./mvnw -B -ntp -pl taxonomy-analysis -am -Dtest=ContextBatchEfficiencyTest -Dsurefire.failIfNoSpecifiedTests=false test > /tmp/hierarchy-efficiency-red.log 2>&1
          rc=$?
          tail -55 /tmp/hierarchy-efficiency-red.log | cut -c 1-500
          test "$rc" -ne 0 || exit 1
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse('taxonomy-analysis/target/surefire-reports/TEST-com.taxonomy.analysis.service.ContextBatchEfficiencyTest.xml').getroot()
          print('EFFICIENCY_RED',r.attrib)
          assert int(r.get('tests'))==3 and int(r.get('failures'))==1 and int(r.get('errors'))==0 and int(r.get('skipped'))==0
          failed=[c.get('name') for c in r.findall('testcase') if c.find('failure') is not None]
          assert failed==['siblingContextIsSentOnlyOnce']
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: hierarchy-efficiency-red
          path: |
            /tmp/hierarchy-efficiency-red.log
            taxonomy-analysis/target/surefire-reports/TEST-*Efficiency*.xml
          retention-days: 7
