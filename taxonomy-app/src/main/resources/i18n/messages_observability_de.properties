# Administrator-only browser-session inventory
sessions.title=Angemeldete Sitzungen
sessions.skip=Zu den Sitzungen springen
sessions.navigation=Sitzungsverwaltung
sessions.back=Zur\u00fcck zur Anwendung
sessions.scope=Nur diese Anwendungsinstanz, nicht der gesamte Cluster oder der Identit\u00e4tsanbieter. Erfasst werden registrierte Browser-Anmeldungen seit dem Start dieser Instanz.
sessions.meaning=Eine registrierte Sitzung beweist nicht, dass jemand die Seite gerade betrachtet. Die letzte Anfrage umfasst auch automatische Browser-Anfragen. Das Schlie\u00dfen des Browsers meldet nicht sofort ab; Sitzungen verschwinden bei Abmeldung oder nach Ablaufmeldung des Containers. Zustandslose Basic-/Bearer-Aufrufe und Datenbankverbindungen sind keine zus\u00e4tzlichen Browserbenutzer.
sessions.refresh=Sitzungen aktualisieren
sessions.measured=Messzeitpunkt (UTC)
sessions.users=Unterschiedliche identifizierte Benutzer
sessions.count=Registrierte, nicht abgelaufene Sitzungen
sessions.unidentified=Sitzungen mit nicht unterst\u00fctztem Identit\u00e4tstyp (nicht in der identifizierten Benutzerzahl enthalten)
sessions.truncated=Nur die ersten 200 Benutzerzeilen werden angezeigt. Die Z\u00e4hlwerte umfassen alle registrierten Sitzungen dieser Instanz.
sessions.empty=In dieser Instanz sind keine Browsersitzungen registriert.
sessions.authentication=Anmeldeart
sessions.oidc=OIDC-Browseranmeldung
sessions.local=Lokale Browseranmeldung
sessions.lastRequest=Letzte registrierte Anfrage (UTC)
sessions.privacy=Rein lesende Administratoransicht. Sitzungskennungen, Passw\u00f6rter, Tokens, IP-Adressen und separate E-Mail-Attribute werden nicht ausgegeben. Ein angezeigter Anmeldename kann selbst eine E-Mail-Adresse sein. Namen werden nicht als Telemetrie-Labels exportiert. Verschiedene Identit\u00e4ten k\u00f6nnen denselben Anzeigenamen haben.
