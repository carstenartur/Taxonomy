name: Verify final module boundary stack (temporary)
on:
  push:
    branches: [verify/628-boundary-regressions-20260916]
    paths:
      - .github/workflows/628-boundary-regressions.yml
      - .github/scripts/boundary-final-review.py
permissions:
  contents: read
concurrency:
  group: final-module-boundary-preflight
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.candidates.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: harness, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aff0f1c78f81598d9bce2c575ba1bf0584de4ee5
          path: candidate
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Apply all reproduced corrections and preserve positive write-scope controls
        run: |
          mkdir -p /tmp/628-final
          python harness/.github/scripts/boundary-final-review.py tests candidate
          python harness/.github/scripts/boundary-final-review.py patch candidate
          git -C candidate diff --check
      - name: Complete affected graph, scope, recovery and security suites
        working-directory: candidate
        run: |
          set -o pipefail
          ./mvnw -B -ntp test '-Dtest=ArchitectureModuleExtractionTest,ArchitectureModuleGraphTest,ArchitectureSelectorSynchronizationTest,WorkspaceCentralReadBoundaryTest,WorkspaceDivergedStrategyScopeTest,WorkspaceFactoryRetryRecoveryTest,WorkspaceContextResolverRequestPinningTest,AdminAuthorizationRegressionTest,GitNativeSyncIntegrationServiceTest' -Dsurefire.failIfNoSpecifiedTests=false > /tmp/628-final/focused.log 2>&1 || { tail -150 /tmp/628-final/focused.log; exit 1; }
          tail -35 /tmp/628-final/focused.log
      - name: Verify the full application interceptor chain
        working-directory: candidate
        run: |
          set -o pipefail
          ./mvnw -B -ntp -pl taxonomy-app -am verify -Dtest=AdminAuthorizationRegressionTest -DskipITs=false -Dit.test=WorkspaceAccessSecurityIT -Dsurefire.failIfNoSpecifiedTests=false -Dfailsafe.failIfNoSpecifiedTests=false > /tmp/628-final/access-integration.log 2>&1 || { tail -150 /tmp/628-final/access-integration.log; exit 1; }
          tail -30 /tmp/628-final/access-integration.log
      - name: Require actual positive and negative execution
        shell: python
        run: |
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          suites={}
          for kind in ('surefire','failsafe'):
              for path in Path('candidate').glob('**/target/'+kind+'-reports/TEST-*.xml'):
                  suite=ET.parse(path).getroot()
                  counts={k:int(suite.get(k,'0')) for k in ('tests','failures','errors','skipped')}
                  assert counts['failures']==counts['errors']==counts['skipped']==0,(path,counts)
                  suites[suite.get('name')]=counts
          for name,count in {
              'com.taxonomy.workspace.service.WorkspaceCentralReadBoundaryTest':28,
              'com.taxonomy.security.AdminAuthorizationRegressionTest':16,
              'com.taxonomy.workspace.service.GitNativeSyncIntegrationServiceTest':8,
              'com.taxonomy.workspace.controller.WorkspaceAccessSecurityIT':10}.items():
              assert suites[name]['tests']==count,(name,suites)
          Path('/tmp/628-final/focused-counts.json').write_text(json.dumps(suites,indent=2)+'\n')
          print(suites)
      - name: Prepare exact native candidates without changing public PR heads
        id: candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python harness/.github/scripts/boundary-final-review.py prepare candidate /tmp/628-final
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: final-boundary-candidates
          path: |
            /tmp/628-final
            candidate/**/target/surefire-reports/TEST-*.xml
            candidate/**/target/failsafe-reports/TEST-*.xml
          retention-days: 7
          if-no-files-found: error
  complete:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Verify exact clean product identity
        env:
          EXPECTED_SHA: ${{ matrix.sha }}
          EXPECTED_TREE: ${{ matrix.tree }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          test ! -e .github/scripts/boundary-final-review.py
          test ! -e .github/workflows/628-boundary-regressions.yml
          mkdir -p /tmp/628-final-complete
          git rev-parse HEAD HEAD^{tree} > /tmp/628-final-complete/source-identity.txt
          docker info
      - name: Restore canonical pinned embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: models/bge-small-en-v1.5
          key: ${{ runner.os }}-taxonomy-bge-small-en-v1.5-${{ hashFiles('.github/scripts/download-embedding-model.sh') }}
      - name: Complete clean canonical reactor with integration tests
        env:
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/bge-small-en-v1.5
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
          FRONTEND_API_BASE_REF: 118a03441d0d72b280acdbf7ad9c37ab55eae964
        run: |
          set -o pipefail
          ./mvnw -B -ntp clean verify -Pci -DrunOnnxTests=true -Dtaxonomy.ui.skip=true > /tmp/628-final-complete/reactor.log 2>&1 || { tail -180 /tmp/628-final-complete/reactor.log; exit 1; }
          tail -45 /tmp/628-final-complete/reactor.log
      - name: Complete Maven-owned frontend contracts
        run: |
          set -o pipefail
          ./mvnw -B -ntp -f .github/ui-verification-pom.xml verify -Pcontracts > /tmp/628-final-complete/frontend.log 2>&1 || { tail -180 /tmp/628-final-complete/frontend.log; exit 1; }
          tail -25 /tmp/628-final-complete/frontend.log
      - name: Inspect actual reports and unchanged source
        shell: python
        run: |
          from pathlib import Path
          import json,subprocess,xml.etree.ElementTree as ET
          counts={}
          for kind in ('surefire','failsafe'):
              reports=list(Path('.').glob('**/target/'+kind+'-reports/TEST-*.xml'));assert reports,kind
              total={k:0 for k in ('tests','failures','errors','skipped')}
              for path in reports:
                  suite=ET.parse(path).getroot()
                  for key in total: total[key]+=int(suite.get(key,'0'))
              assert total['failures']==total['errors']==0 and total['tests']>total['skipped'],(kind,total)
              counts[kind]={'suites':len(reports),**total}
          graph=Path('taxonomy-build/target/architecture-module-graph.txt');assert graph.is_file()
          out=Path('/tmp/628-final-complete')
          (out/'architecture-module-graph.txt').write_bytes(graph.read_bytes())
          (out/'counts.json').write_text(json.dumps(counts,indent=2)+'\n')
          assert subprocess.check_output(['git','diff','--name-only'],text=True).strip()==''
          for file,expected in {
              'taxonomy-workspace/target/surefire-reports/TEST-com.taxonomy.workspace.service.WorkspaceCentralReadBoundaryTest.xml':28,
              'taxonomy-app/target/surefire-reports/TEST-com.taxonomy.security.AdminAuthorizationRegressionTest.xml':16,
              'taxonomy-app/target/surefire-reports/TEST-com.taxonomy.workspace.service.GitNativeSyncIntegrationServiceTest.xml':8,
              'taxonomy-app/target/failsafe-reports/TEST-com.taxonomy.workspace.controller.WorkspaceAccessSecurityIT.xml':10}.items():
              suite=ET.parse(file).getroot()
              assert int(suite.get('tests','0'))==expected and int(suite.get('skipped','0'))==0,(file,suite.attrib)
          print(json.dumps(counts,indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: final-boundary-complete-${{ matrix.stage }}
          path: |
            /tmp/628-final-complete
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          retention-days: 7
          if-no-files-found: error
