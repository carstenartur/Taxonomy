name: Analysis source snapshot (temporary)
on:
  push:
    branches: [fix/analysis-runtime-observability]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 795cb969651f48762a47537646a4c984f39f5934
          persist-credentials: false
          fetch-depth: 8
      - name: Archive only clean versioned source and its baseline
        run: |
          test "$(git rev-parse HEAD^{tree})" = e84d1063312f341c2b1066912fd34255d1c000eb
          mkdir -p /tmp/taxonomy-source
          git archive --format=tar HEAD | gzip > /tmp/taxonomy-source/head.tar.gz
          git archive --format=tar 29b9ef036882f5dbfc62924d9aca63038c098d4e | gzip > /tmp/taxonomy-source/base.tar.gz
          git rev-parse HEAD HEAD^{tree} > /tmp/taxonomy-source/identity.txt
          sha256sum /tmp/taxonomy-source/*.tar.gz > /tmp/taxonomy-source/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: analysis-source-795cb969
          path: /tmp/taxonomy-source
          retention-days: 1
          if-no-files-found: error
