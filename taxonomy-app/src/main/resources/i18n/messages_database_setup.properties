database.setup.menu=Database setup
database.setup.title=Prepare a database connection
database.setup.intro=Prepare an external database connection. You can close this assistant at any time and continue with the current configuration.
database.setup.prompt.title=Set up an external database?
database.setup.prompt.body=Taxonomy currently uses embedded HSQLDB. The optional assistant helps prepare a remote database and links to Pod setup instructions. You can return to it later in Settings.
database.setup.prompt.memory=Taxonomy currently uses HSQLDB in memory; its data lasts only until shutdown. The optional assistant helps prepare an external database. You can keep working now and return to it later in Settings.
database.setup.prompt.start=Open database assistant
database.setup.continue=Continue with current configuration
database.setup.close=Close and continue with current configuration
database.setup.dismiss.failed=You can continue working. The database setup choice could not be saved, so the invitation may appear again after reloading.
database.setup.steps=Setup steps
database.setup.step.type=1. Database
database.setup.step.connection=2. Connection
database.setup.step.deployment=3. Deployment
database.setup.current=Current database: {0}
database.setup.current.memory=HSQLDB in memory
database.setup.current.hsqldb=HSQLDB
database.setup.current.hsqldb-file=HSQLDB file database
database.setup.current.postgres=PostgreSQL
database.setup.current.mssql=Microsoft SQL Server
database.setup.current.oracle=Oracle Database
database.setup.current.unknown=Could not determine the active database
database.setup.type=Target database
database.setup.support.postgres=PostgreSQL: the supported external database path with released schema migrations. The connection test does not certify the deployment.
database.setup.support.evaluation=Evaluation only: SQL Server and Oracle have connection profiles, but their complete migration, persistence and recovery path is not qualified for production.
database.setup.server.required=Create the database server, database and application account first. The help explains Service DNS, persistent volumes, Secrets, TLS and network access in Rancher/Kubernetes.
database.setup.no.transfer=Existing HSQLDB data is not transferred. Keep the source database and a verified backup if its records must be retained.
database.setup.help=Database and Pod setup help (opens a new tab)
database.setup.connection.title=Connection from the Taxonomy server
database.setup.host=Host / Service DNS
database.setup.host.help=Use the address reachable from Taxonomy, such as postgres.database.svc.cluster.local. localhost refers to the Taxonomy server, not your browser.
database.setup.port=Port
database.setup.name=Database name
database.setup.name.help=This assistant accepts letters, digits, dots, underscores and hyphens for database/service names.
database.setup.service=Oracle service name
database.setup.username=Database user
database.setup.password=Password for the connection test
database.setup.password.help=Used only for the connection test. It is not saved in preferences or downloads, and is cleared when the assistant closes. You can prepare configuration without entering it.
database.setup.tls=TLS with certificate and server identity verification
database.setup.tls.warning=TLS is disabled. Credentials and data may cross the network without transport protection. Enable verified TLS for your deployment.
database.setup.ca=Optional PostgreSQL CA path on the Taxonomy server
database.setup.ca.help=An already mounted absolute server path, for example /etc/taxonomy-db-ca/ca.crt. This is not a file upload or a path on your browser computer.
database.setup.jvm.trust=SQL Server and Oracle use the existing JVM truststore. Provision the trusted database CA there before testing; this assistant does not install certificates.
database.setup.check=Test connection
database.setup.check.scope=Optional: the test opens a separate connection with a read-only hint. It checks reachability and login, without application-data writes or DDL. Schema, migration permissions and production readiness remain untested.
database.setup.checking=Testing connection from the Taxonomy server…
database.setup.check.finished=Connection check finished. Review the findings below.
database.setup.next=Next
database.setup.back=Back
database.setup.prepare=Prepare configuration
database.setup.preparing=Preparing password-free configuration…
database.setup.preview.ready=Configuration prepared. Nothing has been applied or restarted.
database.setup.invalid=Check the host, port, database/service name, user and CA path. Use a plain host without URL options, port 1–65535, and an absolute PostgreSQL CA path only with TLS enabled.
database.setup.request.failed=The request could not be completed. Your current configuration is unchanged. Check connectivity and your administrator session, then try again.
database.setup.schema.conflict=Existing schema-generation settings would override this template. Review the deployment settings described in Help and remove the conflicting overrides or set them to validate. Then retry the export. Connection testing is still available.
database.setup.properties=Spring properties
database.setup.helm=Helm values and Secret instructions
database.setup.download.properties=Download properties
database.setup.download.helm=Download Helm values
database.setup.copy=Copy
database.setup.copied=Copied without the password.
database.setup.copy.failed=Clipboard access is unavailable. Select and copy the text, or download the file.
database.setup.apply.title=Apply through your deployment
database.setup.apply.secrets=Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD in the existing deployment Secret, or use protected Spring configuration. The downloads deliberately omit the password property.
database.setup.apply.profiles=Merge the suggested settings into your deployment. Preserve the intended authentication profiles, review driver/dialect and schema overrides, and provision TLS trust and required network access. The assistant does not add the production profile automatically.
database.setup.apply.restart=Redeploy or restart deliberately after review, then verify startup, login and application behavior. For PostgreSQL, the released startup migrations initialize the target schema; no source records are copied.
database.setup.apply.environment=Deployment settings remain authoritative. Environment variables, guided Helm database fields, extraEnv and other overrides may take precedence over a properties file. Review the effective configuration before restarting.
database.setup.status.OK=OK
database.setup.status.WARNING=Warning
database.setup.status.ERROR=Error
database.setup.status.NOT_CHECKED=Not checked
database.setup.finding.database.schema.NOT_CHECKED=No schema migration, write-permission test or rollback test is performed.
database.setup.finding.database.schema-overrides.WARNING=The connection test is independent of existing schema-generation overrides. Those settings currently block configuration export. Review the deployment settings in Help and remove the conflicting overrides or set them to validate.
database.setup.finding.database.tls.OK=TLS with server identity verification is selected. Provision the trusted CA certificates in the target environment.
database.setup.finding.database.tls.WARNING=TLS is disabled explicitly; credentials and data may cross the network without transport protection.
database.setup.finding.database.support.WARNING=SQL Server and Oracle remain evaluation paths. Production migration, persistence, restart and recovery acceptance is not established.
database.setup.finding.database.deployment.NOT_CHECKED=Deployment settings remain authoritative. Review driver, dialect, included profiles and schema overrides before applying configuration and restarting manually.
database.setup.finding.database.transfer.NOT_CHECKED=No existing records are copied. A connection check does not establish target schema readiness or transfer existing data.
database.setup.finding.database.connection.OK=The separate JDBC connection was validated with a read-only hint. Schema and migration permissions remain untested.
database.setup.finding.database.connection.ERROR=The connection could not be validated or the check was interrupted. Check DNS, network policies, TLS trust and database credentials in the target environment.
database.setup.finding.database.connection.WARNING=Other database connection checks are still running. Try again after they finish.
database.setup.finding.spring.profiles.active.ERROR=Review the profile list. Select only one database engine and one authentication mode.
