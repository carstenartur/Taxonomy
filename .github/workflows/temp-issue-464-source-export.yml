name: Apply Maven Test Authority Refactor

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/issue-464-maven-test-authority' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/issue-464-maven-test-authority
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Merge current main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Decode and apply verified patch
        run: |
          set -euo pipefail
          cat .github/issue464-patch/part-* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/issue464.patch
          git apply --index /tmp/issue464.patch
      - name: Generate pinned Maven Wrapper
        run: |
          set -euo pipefail
          mvn -N org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper \
            -Dmaven=3.9.16 \
            -Dtype=only-script
          chmod +x mvnw
      - name: Generate pinned frontend lock
        run: |
          set -euo pipefail
          npm --prefix .github install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
      - name: Remove transfer helpers
        run: |
          set -euo pipefail
          rm -rf .github/issue464-patch
          rm .github/workflows/temp-issue-464-source-export.yml
      - name: Run structural verification
        run: |
          set -euo pipefail
          python3 .github/scripts/check-workflow-test-authority.py
          python3 .github/scripts/check-doc-links.py
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import yaml

          for path in Path('.').rglob('pom.xml'):
              if 'target' not in path.parts:
                  ET.parse(path)
          for path in (Path('.mvn/verification-suites.json'), Path('.github/package.json'), Path('.github/package-lock.json')):
              json.loads(path.read_text(encoding='utf-8'))
          for path in Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
          PY
          node --check .github/scripts/run-ui-suite.mjs
          bash -n .github/scripts/release.sh
          ./mvnw -B -N validate -DskipUiTests=true -DskipQualityChecks=true
          git diff --check
      - name: Commit final branch state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Maven the single verification authority'
          git push origin HEAD:fix/issue-464-maven-test-authority
