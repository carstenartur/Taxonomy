name: Retry Stalled Maven Verification

on:
  push:
    branches:
      - ops/cancel-superseded-workflow-runs-20261116

permissions:
  actions: write
  pull-requests: read

jobs:
  retry:
    if: github.repository == 'carstenartur/Taxonomy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry the queued Maven run for the checked pull request head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          
          repo=carstenartur/Taxonomy
          [ "$GITHUB_REPOSITORY" = "$repo" ]
          [ "$GITHUB_REF" = "refs/heads/ops/cancel-superseded-workflow-runs-20261116" ]
          
          head=59ed3e0b4e48455105915f47464904e35d18f3c6
          base=4170234158e429fac50a7497411ef21420320060
          run_id=43884230447
          endpoint="repos/$repo/actions/runs/$run_id"
          
          verify_pr() {
            gh api "repos/$repo/pulls/1540" |
              jq -e --arg head "$head" --arg base "$base" \
                '.state == "open" and .draft == false and .head.sha == $head
                 and .base.ref == "main" and .base.sha == $base' >/dev/null
          }
          
          stalled() {
            gh api "$endpoint" |
              jq -e --arg head "$head" --argjson id "$run_id" \
                '.id == $id and .head_sha == $head and .event == "pull_request"
                 and .run_attempt == 1 and .status == "queued"
                 and .updated_at == "2026-11-16T14:19:38Z"
                 and now - (.updated_at | fromdateiso8601) >= 1800' >/dev/null &&
            gh api "$endpoint/jobs?per_page=100" |
              jq -e '.total_count == 10
                and ([.jobs[] | select(.status == "queued" and (.runner_id // 0) == 0)] | length) == 8
                and ([.jobs[] | select(.status == "completed")] | length) == 2' >/dev/null
          }
          
          verify_pr
          if ! stalled; then
            echo "The pinned Maven run has changed. Check its current jobs."
            exit 0
          fi
          
          if ! gh api --method POST "$endpoint/cancel" >/dev/null; then
            verify_pr
            stalled
            gh api --method POST "$endpoint/force-cancel" >/dev/null
          fi
          echo "Cancellation requested for Maven run $run_id."
          
          for attempt in $(seq 1 20); do
            state="$(gh api "$endpoint" --jq '.status + ":" + (.conclusion // "")')"
            case "$state" in
              completed:cancelled)
                verify_pr
                gh api --method POST "$endpoint/rerun" >/dev/null
                echo "Restart requested for Maven run $run_id at $head."
                exit 0
                ;;
              completed:*)
                echo "Maven run $run_id completed with $state."
                exit 0
                ;;
            esac
            sleep 3
          done
          echo "::error::Cancellation pending for Maven run $run_id."
          exit 1
