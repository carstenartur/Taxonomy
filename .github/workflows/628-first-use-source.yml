name: Retain exact workspace first-use source
on:
  push:
    branches: [verification/628-first-use-source]
    paths: [.github/workflows/628-first-use-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 21e6465904fb29116baae587d4c90f3ed6ab915d
          fetch-depth: 0
          persist-credentials: false
      - name: Archive source identity and reachable changes
        run: |
          set -euo pipefail
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/source-identity.txt"
          git update-ref refs/heads/pinned-workspace-source HEAD
          git bundle create "$RUNNER_TEMP/first-use-source.bundle" refs/heads/pinned-workspace-source ^418f59f4585c19808295ea011b67502e9bac0172
          git bundle verify "$RUNNER_TEMP/first-use-source.bundle"
          git ls-files '*MultiUser*' '*ViewContextIntegrationTest*' '*ArchitectureViewTests*'
          git grep -n -A35 -B4 'ensureDefaultWorkspaceReady' -- '*.java' || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workspace-first-use-source
          path: |
            ${{ runner.temp }}/source-identity.txt
            ${{ runner.temp }}/first-use-source.bundle
          retention-days: 7
          if-no-files-found: error
