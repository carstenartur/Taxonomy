name: Local ONNX reference evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/scripts/configure-docker-mirror.sh'
      - '.github/workflows/local-onnx-reference.yml'
      - 'pom.xml'
      - 'taxonomy-app/pom.xml'
      - 'taxonomy-build/pom.xml'
      - 'taxonomy-tooling/src/main/java/com/taxonomy/tooling/JunitReportVerifier.java'
      - '.github/scripts/download-embedding-model.sh'
      - 'taxonomy-build/src/test/java/com/taxonomy/build/OnnxProfile*'
      - 'taxonomy-app/src/test/java/com/taxonomy/LocalOnnxPipelineIT.java'
      - 'taxonomy-app/src/test/java/com/taxonomy/OnnxRestEndpointTest.java'
      - 'taxonomy-app/src/test/java/com/taxonomy/acceptance/OnnxReference*'
      - 'taxonomy-app/src/test/resources/scenarios/local-onnx-reference-v1.json'
      - 'taxonomy-knowledge/src/main/java/com/taxonomy/catalog/service/LocalEmbeddingService.java'
      - 'taxonomy-knowledge/src/main/java/com/taxonomy/catalog/snapshot/**'
      - 'taxonomy-knowledge/src/main/java/com/taxonomy/relations/service/BranchGraphVector*.java'
      - 'taxonomy-knowledge/src/test/java/com/taxonomy/relations/service/BranchGraphVectorOnnxTest.java'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-onnx-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Keep the full reactor build and the selected model/reference test suites.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-read-only: true
          cache-dependency-path: |
            **/pom.xml
            .github/ui-verification-pom.xml
            **/*-pom.xml
            **/pom-*.xml
            **/.mvn/wrapper/maven-wrapper.properties
            **/.mvn/extensions.xml
            .mvn/dependency-cache-epoch
      - name: Install verified Helm 3.21.0
        run: bash .github/scripts/install-helm.sh

      - name: Configure and verify Docker Hub cache
        run: bash .github/scripts/configure-docker-mirror.sh
      - name: Run Maven-owned ONNX suite
        env:
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
        shell: bash
        run: |
          mkdir -p target
          set -o pipefail
          ./mvnw -B verify -Ponnx,ci-onnx-reference -T 2 2>&1 | tee target/local-onnx-reference.log
      - name: Upload local inference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: local-onnx-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/local-onnx-reference.log
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: error
          retention-days: 7
