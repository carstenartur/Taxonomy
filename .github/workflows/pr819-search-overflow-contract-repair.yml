name: Complete PR 819 search overflow repair

on:
  push:
    branches:
      - agent/630-large-result-release-floor-current
    paths:
      - .github/workflows/pr819-search-overflow-contract-repair.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr819-search-overflow-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.number == 819
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/630-large-result-release-floor-current
          fetch-depth: 0

      - name: Keep every search-form row inside the panel
        shell: bash
        run: |
          set -euo pipefail
          index=taxonomy-app/src/main/resources/templates/index.html

          perl -0pi -e 's/(<details id="searchPanel".*?<div class="row g-2 mx-0 mb-2">.*?<div class="row) g-2 mb-2"/$1 g-2 mx-0 mb-2"/s' "$index"

          panel=$(sed -n '/<details id="searchPanel"/,/<\/details>/p' "$index")
          [[ $(grep -Foc '<div class="row g-2 mx-0 mb-2">' <<<"$panel") -eq 2 ]]
          ! grep -Fq '<div class="row g-2 mb-2">' <<<"$panel"
          git diff --check

      - name: Commit the product fix and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr819-search-overflow-contract-repair.yml
          git add taxonomy-app/src/main/resources/templates/index.html
          git diff --cached --check
          git commit -m 'Bound every search form row within the panel'
          git push origin HEAD:agent/630-large-result-release-floor-current
