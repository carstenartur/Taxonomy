name: Apply score semantics evidence integration

on:
  push:
    branches:
      - fix/1006-product-score-semantics
    paths:
      - .github/scripts/apply-score-semantics-evidence.py
      - .github/workflows/apply-score-semantics-evidence.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply typed score evidence patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/1006-product-score-semantics
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Apply deterministic integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-score-semantics-evidence.py
          git diff --check
          ./mvnw -B -ntp -pl taxonomy-app -am \
            -Dtest=AnalysisEvidenceFingerprintTest,AnalysisScoreSemanticsTest,AnalysisScoreDiffTest,DecisionRationaleScoreSemanticsAdapterTest,AnalysisSseEventMapperTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/apply-score-semantics-evidence.py \
                 .github/workflows/apply-score-semantics-evidence.yml
          git add taxonomy-app/src/main/java/com/taxonomy/portfolio/dto/PortfolioDtos.java \
                  taxonomy-app/src/main/java/com/taxonomy/portfolio/service/PortfolioAnalysisPersistenceService.java \
                  taxonomy-app/src/main/java/com/taxonomy/architecture/decision/DecisionRationaleReportService.java
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Complete typed score fingerprint and diff evidence"
          git push origin HEAD:fix/1006-product-score-semantics
