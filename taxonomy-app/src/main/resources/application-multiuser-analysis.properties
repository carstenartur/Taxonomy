# Opt-in capacity profile for ONE application process; not a cluster-wide scheduler.
# Existing installations keep their conservative portfolio-worker default unless this profile is selected.
taxonomy.portfolio.analysis-worker-concurrency=${TAXONOMY_PORTFOLIO_ANALYSIS_WORKER_CONCURRENCY:4}
taxonomy.analysis.max-concurrent-jobs=${TAXONOMY_ANALYSIS_MAX_CONCURRENT_JOBS:4}
taxonomy.analysis.queue-capacity=${TAXONOMY_ANALYSIS_QUEUE_CAPACITY:16}
taxonomy.analysis.max-concurrent-jobs-per-user=${TAXONOMY_ANALYSIS_MAX_CONCURRENT_JOBS_PER_USER:2}
taxonomy.analysis.queue-capacity-per-user=${TAXONOMY_ANALYSIS_QUEUE_CAPACITY_PER_USER:8}
taxonomy.analysis.maximum-queue-wait-seconds=${TAXONOMY_ANALYSIS_MAXIMUM_QUEUE_WAIT_SECONDS:1800}
taxonomy.llm.max-concurrent-requests=${TAXONOMY_LLM_MAX_CONCURRENT_REQUESTS:4}
taxonomy.llm.request-queue-capacity=${TAXONOMY_LLM_REQUEST_QUEUE_CAPACITY:64}
taxonomy.llm.maximum-queue-wait-seconds=${TAXONOMY_LLM_MAXIMUM_QUEUE_WAIT_SECONDS:120}
