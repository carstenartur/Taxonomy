name: Evidence 1134 continuation
on:
  push:
    branches: [maintenance/continue-evidence-1134-20260927]
    paths: [.github/workflows/evidence-1134-continuation.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0039a12a5b3eb4fcd4b2cea1455221858d8ab36a
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact source identity and Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0039a12a5b3eb4fcd4b2cea1455221858d8ab36a
          test "$(git hash-object taxonomy-app/src/test/java/com/taxonomy/ProductionPersistenceRestartIT.java)" = ec617e04b2efccdd78d99f72ecb59870f4b26efa
          git diff --check
          docker info
      - name: Run source-built closure, projection and real container-replacement acceptance
        env:
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/restart-1134
          ./mvnw -B -ntp -pl taxonomy-app -am verify -Dtest=TaxDslExportClosureTest,RelationProjectionReadServiceTest -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=ProductionPersistenceRestartIT -DskipITs=false -DexcludedGroups=real-llm -Dtaxonomy.model.download.skip=true 2>&1 | tee /tmp/restart-1134/maven.log
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          expected = {'TaxDslExportClosureTest', 'RelationProjectionReadServiceTest', 'ProductionPersistenceRestartIT'}
          inventory = {}
          for p in Path('.').glob('*/target/*-reports/TEST-*.xml'):
              root = ET.parse(p).getroot()
              name = root.get('name','').rsplit('.',1)[-1]
              if name not in expected: continue
              assert int(root.get('tests','0')) > 0, (name,root.attrib)
              assert all(int(root.get(k,'0')) == 0 for k in ('failures','errors','skipped')), (name,root.attrib)
              inventory[name] = int(root.get('tests'))
          assert set(inventory) == expected, inventory
          assert inventory['TaxDslExportClosureTest'] == 4, inventory
          assert inventory['ProductionPersistenceRestartIT'] == 1, inventory
          Path('/tmp/restart-1134/inventory.json').write_text(json.dumps(inventory,indent=2)+'\n')
          PY
      - name: Collect source-bound reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/restart-1134
          git rev-parse HEAD HEAD^{tree} > /tmp/restart-1134/identity.txt
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          with tarfile.open('/tmp/restart-1134/reports.tar.gz','w:gz') as t:
              for p in Path('.').glob('*/target/*-reports/*'):
                  if p.is_file() and p.suffix in ('.xml','.txt'): t.add(p,arcname=str(p),recursive=False)
          PY
          cd /tmp/restart-1134
          sha256sum identity.txt reports.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: evidence-1134-restart-verification
          path: /tmp/restart-1134
          if-no-files-found: error
          retention-days: 7
