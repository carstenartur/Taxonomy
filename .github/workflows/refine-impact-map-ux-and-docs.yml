name: Refine impact map UX and documentation

on:
  push:
    branches:
      - fix/usable-result-impact-map
    paths:
      - .github/workflows/refine-impact-map-ux-and-docs.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/usable-result-impact-map
          fetch-depth: 0

      - name: Keep cards readable initially and update the user guides
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/refine-impact-map-ux-and-docs.py
          node --check taxonomy-app/src/main/resources/static/js/shared/taxonomy-impact-map.js
          node --test .github/scripts/taxonomy-impact-map.test.mjs
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            taxonomy-app/src/main/resources/static/js/shared/taxonomy-impact-map.js \
            .github/scripts/taxonomy-impact-map.test.mjs \
            docs/de/USER_GUIDE.md \
            docs/en/USER_GUIDE.md
          git commit -m "Refine impact map initial view and documentation"
          git push origin HEAD:fix/usable-result-impact-map
