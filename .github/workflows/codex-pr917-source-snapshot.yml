name: Codex PR 917 source snapshot

on:
  push:
    branches:
      - fix/repeatable-analysis-reset-and-lifecycle-menu

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Create source archive
        run: tar --exclude=.git -czf taxonomy-pr917-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: taxonomy-pr917-source
          path: taxonomy-pr917-source.tar.gz
          retention-days: 1
          if-no-files-found: error
