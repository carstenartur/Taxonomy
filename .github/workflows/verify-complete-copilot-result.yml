name: Verify Complete Copilot Result

on:
  push:
    branches:
      - fix/complete-copilot-run-screenshot
    paths:
      - .github/workflows/verify-complete-copilot-result.yml

permissions:
  contents: write

concurrency:
  group: verify-complete-copilot-result-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and publish permanent complete-result changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Apply the reviewed permanent patch recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/finalize-complete-copilot-result.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          step_name = '      - name: Apply the permanent result-surface changes'
          try:
              step = lines.index(step_name)
          except ValueError as error:
              raise SystemExit('Permanent patch step not found') from error

          run_index = next(
              index for index in range(step + 1, len(lines))
              if lines[index] == '        run: |')
          body = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              if line and not line.startswith('          '):
                  raise SystemExit(f'Unexpected patch indentation: {line!r}')
              body.append(line[10:] if line else '')
          if not body:
              raise SystemExit('Permanent patch body is empty')
          Path('/tmp/apply-complete-result.sh').write_text(
              '\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-complete-result.sh
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          git diff --check

      - name: Verify the focused frontend contract
        run: >-
          ./mvnw -B -pl taxonomy-app -am test
          -Dtest=RequirementCopilotResultSurfaceContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Exercise the authoritative complete Copilot session and capture the result
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=CompleteCopilotSessionIT
          -DgenerateScreenshots=true
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify screenshot and documentation output
        shell: bash
        run: |
          set -euo pipefail
          image=docs/images/72-complete-copilot-run-result.png
          test -s "$image"
          test "$(wc -c < "$image")" -gt 40000
          file "$image" | grep -F 'PNG image data'
          python3 - <<'PY'
          from pathlib import Path
          import struct

          image = Path('docs/images/72-complete-copilot-run-result.png').read_bytes()
          if image[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Screenshot does not have a PNG signature')
          width, height = struct.unpack('>II', image[16:24])
          if width < 1800 or height < 1000:
              raise SystemExit(f'Screenshot is unexpectedly small: {width}x{height}')
          print(f'Verified screenshot dimensions: {width}x{height}')
          PY
          grep -F '72-complete-copilot-run-result.png' \
            docs/en/COPILOT_AUTOPILOT.md \
            docs/de/COPILOT_AUTOPILOT.md \
            .github/copilot-ref-screenshots.md
          git diff --check

      - name: Upload focused evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: complete-copilot-run-result-final
          path: |
            docs/images/72-complete-copilot-run-result.png
            taxonomy-app/target/failsafe-reports/**
            taxonomy-app/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish only permanent product, test and documentation files
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/complete-copilot-run-screenshot
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js \
            taxonomy-app/src/test/java/com/taxonomy/RequirementCopilotResultSurfaceContractTest.java \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotScreenshotWatcher.java \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java \
            pom.xml \
            docs/images/72-complete-copilot-run-result.png \
            docs/en/COPILOT_AUTOPILOT.md \
            docs/de/COPILOT_AUTOPILOT.md \
            .github/copilot-ref-screenshots.md
          git diff --cached --check
          git commit -m 'Document and clarify the complete Copilot run result'
          git push origin HEAD:"$branch"
