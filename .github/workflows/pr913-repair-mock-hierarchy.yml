name: Repair PR 913 mock hierarchy fixtures

on:
  push:
    branches:
      - codex/json-catalogue-overlay
    paths:
      - .github/workflows/pr913-repair-mock-hierarchy.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/json-catalogue-overlay
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Regenerate hierarchy-bound mock evidence and verify contracts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git rm -f --ignore-unmatch \
            .github/workflows/pr913-repair-mock-hierarchy.yml \
            .github/workflows/pr913-finalize-current-main.yml \
            .github/workflows/pr913-refresh-after-storage.yml

          retry_maven() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
            done
          }

          retry_maven ./mvnw -B -ntp -pl taxonomy-app -am \
            -DgenerateMockScores=true \
            -Dtest=MockScoreGeneratorIT \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipITs \
            test

          test -f taxonomy-app/src/main/resources/mock-scores/secure-voice-comms.json
          test -f taxonomy-app/src/main/resources/mock-scores/logistics-supply-chain.json
          test -f taxonomy-app/src/main/resources/mock-scores/cyber-defence-monitoring.json
          test ! -e src/main/resources/mock-scores

          retry_maven ./mvnw -B -ntp -pl taxonomy-app -am \
            -Dtest=HierarchyScoreDistributorTest,HierarchyScoreDistributorMixedStrategyTest,LlmMockScoringTests,CatalogueOverlayServiceTest,DecisionRationaleReportTests,WorkflowTestAuthorityPolicyTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DskipITs \
            test

          test ! -e .github/workflows/pr913-repair-mock-hierarchy.yml
          test ! -e .github/workflows/pr913-finalize-current-main.yml
          test ! -e .github/workflows/pr913-refresh-after-storage.yml
          git diff --check

          git add -A
          git diff --cached --stat
          git commit -m "fix: align mock scoring evidence with product hierarchy"
          git push origin HEAD:codex/json-catalogue-overlay
