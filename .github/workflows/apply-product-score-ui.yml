name: Apply product score UI patch

on:
  push:
    branches:
      - fix/1006-product-score-semantics
    paths:
      - .github/scripts/product-score-ui.patch
      - .github/workflows/apply-product-score-ui.yml

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify browser score semantics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/1006-product-score-semantics
          fetch-depth: 0

      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/scripts/product-score-ui.patch
          git apply .github/scripts/product-score-ui.patch
          for file in \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-state.js \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-analysis-session-core.js \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-analysis-session-draft.js \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-analysis-session-ui.js \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-browse.js \
            taxonomy-app/src/main/resources/static/js/core/taxonomy-scoring.js
          do
            node --check "$file"
          done
          git diff --check

      - name: Commit verified browser changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/product-score-ui.patch .github/workflows/apply-product-score-ui.yml
          git add taxonomy-app/src/main/resources/static/js/core
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Preserve product suitability in browser sessions"
          git push origin HEAD:fix/1006-product-score-semantics
