name: Fix Complete Result Table Headers

on:
  push:
    branches:
      - fix/complete-copilot-run-screenshot
    paths:
      - .github/workflows/fix-complete-result-table-headers.yml

permissions:
  contents: write

concurrency:
  group: fix-complete-result-table-headers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Add localized accessible headers to finding tables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          detail_path = Path(
              'taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js')
          detail = detail_path.read_text(encoding='utf-8')

          english_old = """            openWorkbench: 'Inspect diagram in architecture workbench', direct: 'Direct',
                      resultReady: 'The immutable Copilot result is ready for review.'
          """
          english_new = """            openWorkbench: 'Inspect diagram in architecture workbench', direct: 'Direct',
                      sourceNode: 'Source node', expectedRelation: 'Expected relationship',
                      targetArea: 'Target area', descriptionLabel: 'Description',
                      nodeCode: 'Node code', coverageScore: 'Coverage score',
                      gapDescription: 'Gap description', patternDescription: 'Pattern description',
                      missingElement: 'Missing element',
                      resultReady: 'The immutable Copilot result is ready for review.'
          """
          german_old = """            openWorkbench: 'Diagramm in der Architektur-Workbench untersuchen', direct: 'Direkt',
                      resultReady: 'Das unveränderliche Copilot-Ergebnis ist zur Prüfung bereit.'
          """
          german_new = """            openWorkbench: 'Diagramm in der Architektur-Workbench untersuchen', direct: 'Direkt',
                      sourceNode: 'Quellknoten', expectedRelation: 'Erwartete Beziehung',
                      targetArea: 'Zielbereich', descriptionLabel: 'Beschreibung',
                      nodeCode: 'Knotencode', coverageScore: 'Abdeckungswert',
                      gapDescription: 'Lückenbeschreibung', patternDescription: 'Musterbeschreibung',
                      missingElement: 'Fehlendes Element',
                      resultReady: 'Das unveränderliche Copilot-Ergebnis ist zur Prüfung bereit.'
          """
          for old, new, label in [
              (english_old, english_new, 'English table labels'),
              (german_old, german_new, 'German table labels'),
          ]:
              if old not in detail:
                  raise SystemExit(f'{label} insertion point not found')
              detail = detail.replace(old, new, 1)

          old_function = '''    function renderFindingDetails(label, items, fields) {
                  if (!items.length) return '';
                  return `<details class="portfolio-finding-details"><summary>${escapeHtml(label)} <span class="badge text-bg-secondary">${items.length}</span></summary>`
                      + `<div class="portfolio-result-table portfolio-result-table-sm"><table class="table table-sm align-middle mb-0"><tbody>`
                      + items.map(item => `<tr>${fields.map(field => `<td>${escapeHtml(formatFindingValue(field, item[field]))}</td>`).join('')}</tr>`).join('')
                      + `</tbody></table></div></details>`;
              }

              function formatFindingValue(field, value) {
          '''
          new_function = '''    function renderFindingDetails(label, items, fields) {
                  if (!items.length) return '';
                  const headers = fields.map(field =>
                      `<th scope="col">${escapeHtml(findingColumnLabel(field))}</th>`).join('');
                  return `<details class="portfolio-finding-details"><summary>${escapeHtml(label)} <span class="badge text-bg-secondary">${items.length}</span></summary>`
                      + `<div class="portfolio-result-table portfolio-result-table-sm"><table class="table table-sm align-middle mb-0">`
                      + `<caption class="visually-hidden">${escapeHtml(label)}</caption>`
                      + `<thead><tr>${headers}</tr></thead><tbody>`
                      + items.map(item => `<tr>${fields.map(field => `<td>${escapeHtml(formatFindingValue(field, item[field]))}</td>`).join('')}</tr>`).join('')
                      + `</tbody></table></div></details>`;
              }

              function findingColumnLabel(field) {
                  const labels = {
                      sourceNodeCode: t('sourceNode'),
                      expectedRelationType: t('expectedRelation'),
                      expectedTargetRoot: t('targetArea'),
                      description: t('descriptionLabel'),
                      nodeCode: t('nodeCode'),
                      coverageScore: t('coverageScore'),
                      gapDescription: t('gapDescription'),
                      patternDescription: t('patternDescription'),
                      missingElement: t('missingElement')
                  };
                  return labels[field] || humanize(field);
              }

              function formatFindingValue(field, value) {
          '''
          if old_function not in detail:
              raise SystemExit('Finding-table renderer not found')
          detail_path.write_text(
              detail.replace(old_function, new_function, 1), encoding='utf-8')

          contract_path = Path(
              'taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotResultUiContractTest.java')
          contract = contract_path.read_text(encoding='utf-8')
          class_end = contract.rfind('\n}')
          if class_end < 0:
              raise SystemExit('Result UI contract terminator not found')
          test = '''

              @Test
              void findingTablesExposeLocalizedAccessibleColumnHeaders()
                      throws IOException {
                  String detail = Files.readString(Path.of(
                          "src/main/resources/static/js/portfolio/requirement-detail.js"));
                  String css = Files.readString(Path.of(
                          "src/main/resources/static/css/taxonomy-portfolio.css"));

                  assertThat(detail)
                          .contains("<caption class=\\\"visually-hidden\\\">")
                          .contains("<th scope=\\\"col\\\">")
                          .contains("findingColumnLabel(field)")
                          .contains("sourceNode: 'Source node'")
                          .contains("sourceNode: 'Quellknoten'")
                          .contains("coverageScore: 'Coverage score'")
                          .contains("coverageScore: 'Abdeckungswert'");
                  assertThat(css).contains(".portfolio-result-table thead th");
              }
          '''
          contract_path.write_text(
              contract[:class_end] + test + contract[class_end:], encoding='utf-8')
          PY

          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          git diff --check

      - name: Verify focused UI contracts
        run: >-
          ./mvnw -B -pl taxonomy-app -am test
          -Dtest=CompleteCopilotResultUiContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Publish verified permanent changes
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/complete-copilot-run-screenshot
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotResultUiContractTest.java
          git diff --cached --check
          git commit -m 'Add accessible headers to Copilot finding tables'
          git push origin HEAD:"$branch"
