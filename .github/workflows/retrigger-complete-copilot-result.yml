name: Retrigger Complete Copilot Result Verification

on:
  push:
    branches:
      - fix/complete-copilot-run-result-ux
    paths:
      - .github/workflows/retrigger-complete-copilot-result.yml

permissions:
  contents: write

concurrency:
  group: retrigger-complete-copilot-result
  cancel-in-progress: true

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/complete-copilot-run-result-ux
          fetch-depth: 0

      - name: Normalize the QA input and retrigger the owning workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/qa-complete-copilot-result.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = 'name: QA Complete Copilot Result\n'
          replacement = 'name: QA Complete Copilot Result\n# QA documentation input normalized before run 2.\n'
          if marker not in text:
              raise SystemExit('Complete Copilot QA workflow name not found')
          workflow.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          PY
          rm .github/workflows/retrigger-complete-copilot-result.yml
          git diff --check

      - name: Commit the retrigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/qa-complete-copilot-result.yml \
            .github/workflows/retrigger-complete-copilot-result.yml
          git commit -m 'Retrigger complete Copilot result verification'
          git push origin HEAD:fix/complete-copilot-run-result-ux
