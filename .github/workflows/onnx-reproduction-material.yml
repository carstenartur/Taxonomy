name: Temporary ONNX reproduction material
on:
  push:
    branches: [maintenance/onnx-repro-1141-20260929]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 979c0ed643d33eeb807469b5b39015a009cb41dc
          persist-credentials: false
      - name: Package exact source and existing pinned public model
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/download-embedding-model.sh
          mkdir -p reproduction
          git archive --format=tar.gz HEAD > reproduction/source-979c0ed.tar.gz
          cp -R models/bge-small-en-v1.5 reproduction/model
          git rev-parse HEAD HEAD^{tree} > reproduction/source-revision.txt
          sha256sum reproduction/source-979c0ed.tar.gz reproduction/model/* > reproduction/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: onnx-reproduction-979c0ed
          path: reproduction/
          if-no-files-found: error
          retention-days: 2
