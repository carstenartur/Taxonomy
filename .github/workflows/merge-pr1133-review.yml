name: Verify integrated PR1133 review fixes
on:
  push:
    branches: [transfer/pr1133-review-publish-1d0504f907]
    paths: [.github/workflows/merge-pr1133-review.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: eece8e674b57855c75b3a4844974607278d9b886
          fetch-depth: 0
      - name: Resolve only the inspected conflict and preserve all reviewed blobs
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          D=pathlib.Path(os.environ['RUNNER_TEMP'])/'pr1133-integrated';D.mkdir()
          def git(*args,check=True):return subprocess.run(['git',*args],check=check,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True)
          def out(*args):return git(*args).stdout.strip()
          def blob(value):return hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()
          assert out('rev-parse','HEAD')=='eece8e674b57855c75b3a4844974607278d9b886'
          assert out('ls-remote','origin','refs/heads/feat/resumable-copilot-evaluation').split()[0]=='6b4df02b335793bdfb7d1d07849425c2e9197164'
          encoded=''.join(out('show','5256abd07838e7a1eeae05fe263601b4a03ccdd1'+f':.github/transfer/pr1133-review-{i}.b64') for i in range(3))
          raw=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='1d0504f9073f88c7a36c110269e5f68b73b28b55485bdfdde14d8da297a37957'
          manifest=json.loads(raw)['files']
          main='8a1190bf38f77cd5151165bbbfdc688e15f046ab'
          git('fetch','origin',main)
          merge=git('merge','--no-ff','--no-commit',main,check=False)
          (D/'merge.log').write_text(merge.stdout)
          conflicts=out('diff','--name-only','--diff-filter=U').splitlines()
          assert conflicts==['.github/package.json'],conflicts
          ours=git('show',':2:.github/package.json').stdout
          theirs=git('show',':3:.github/package.json').stdout
          assert blob(ours.encode())=='dd68ac0d968bd9782dda736142f8450d897a7147'
          assert blob(theirs.encode())=='9547278bc6374f3af5cb526a5611762b673e6ff3'
          equivalent=json.loads(ours)
          for key in ['test:analysis-recovery','verify:analysis-recovery']:del equivalent['scripts'][key]
          for key in ['verify:ui','verify:ui-contracts']:equivalent['scripts'][key]=equivalent['scripts'][key].replace(' && npm run test:analysis-recovery','')
          assert equivalent==json.loads(theirs),'Resolution must preserve every main script and dependency'
          pathlib.Path('.github/package.json').write_text(ours)
          git('add','.github/package.json');git('diff','--cached','--check')
          for entry in manifest:assert out('rev-parse',':'+entry['path'])==entry['after'],entry['path']
          git('config','user.name','ChatGPT');git('config','user.email','chatgpt@users.noreply.github.com')
          git('commit','-m','Merge main into PR1133 preserving recovery and lifecycle verification\n\nResolve only the package.json chain conflict: every main script/dependency is unchanged and recovery remains in both UI verification chains. Retain all reviewed durability blobs byte-for-byte.')
          candidate=out('rev-parse','HEAD');tree=out('rev-parse','HEAD^{tree}')
          result={'head':candidate,'tree':tree,'parents':['eece8e674b57855c75b3a4844974607278d9b886',main],'originalPrHead':'6b4df02b335793bdfb7d1d07849425c2e9197164','resolution':'.github/package.json retains all main entries and both recovery invocations','files':manifest}
          (D/'candidate.json').write_text(json.dumps(result,indent=2))
          git('archive','--format=zip','-o',str(D/'source.zip'),'HEAD')
          git('push','origin',candidate+':refs/heads/transfer/pr1133-review-integrated-1d0504f907')
          print(json.dumps({k:v for k,v in result.items() if k!='files'},indent=2))
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Focused review JUnit tests on integrated source
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp -pl taxonomy-app -am -Dtest=RecoveryDurabilityTest,RecoveryCatalogueExchangeTest -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee "$RUNNER_TEMP/pr1133-integrated/maven.log"
      - name: Focused recovery JavaScript tests
        run: node --test .github/scripts/analysis*.test.mjs .github/scripts/copilot-operation-lifecycle.test.mjs .github/scripts/copilot-terminal-state-regression.test.mjs .github/scripts/copilot-session-i18n-ready-regression.test.mjs .github/scripts/copilot-summary-freshness.test.mjs .github/scripts/product-score-streaming.test.mjs
      - name: Retain source and integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1133-review-integrated
          path: ${{ runner.temp }}/pr1133-integrated/
          retention-days: 3
          include-hidden-files: true
      - name: Retain focused JUnit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr1133-review-integrated-junit
          path: '**/target/surefire-reports/'
          retention-days: 3
          if-no-files-found: ignore
