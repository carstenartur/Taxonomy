name: Apply persisted Copilot implementation

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/agent/copilot-payload/**
      - .github/workflows/agent-apply-copilot.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: agent-copilot-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/792-copilot-autopilot-full-analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/792-copilot-autopilot-full-analysis
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact staged payload
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=3510c7e688a6a888e0870d9ae9874be474dc6cdd
          actual_parent=$(git rev-parse HEAD^)
          if [[ "$actual_parent" != "$expected_parent" ]]; then
            echo "::error::Unexpected staged payload parent: $actual_parent" >&2
            exit 1
          fi
          mapfile -t parts < <(find .github/agent/copilot-payload -maxdepth 1 -type f -name 'part-*' | sort)
          if [[ ${#parts[@]} -ne 5 ]]; then
            echo "::error::Expected exactly five persisted payload parts, found ${#parts[@]}" >&2
            exit 1
          fi

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Materialize implementation payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent/copilot-payload/part-* > "$RUNNER_TEMP/copilot.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/copilot.tar.gz.b64" > "$RUNNER_TEMP/copilot.tar.gz"
          gzip --test "$RUNNER_TEMP/copilot.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/copilot.tar.gz" --directory .
          rm -rf .github/agent/copilot-payload
          rm -f .github/workflows/agent-apply-copilot.yml

      - name: Verify JavaScript syntax
        run: |
          node --check taxonomy-app/src/main/resources/static/js/api/copilot-api.js
          node --check taxonomy-app/src/main/resources/static/js/api/portfolio-api.js
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js

      - name: Run focused Copilot contracts
        shell: bash
        run: |
          ./mvnw -B -pl taxonomy-app -am \
            -DskipITs \
            -Dtest=AiAutomationPolicyTest,CopilotOperationKeyTest,CopilotResultSelectorTest,CopilotAnalysisControllerTest,RequirementCopilotUiContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'ChatGPT Codex Connector'
          git config user.email 'chatgpt-codex-connector@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ai): add persisted Copilot and unmetered Autopilot [copilot-applied]'
          git push origin HEAD:agent/792-copilot-autopilot-full-analysis
