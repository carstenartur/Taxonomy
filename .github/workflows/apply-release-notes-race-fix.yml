name: Apply compatible release-notes race fix

on:
  push:
    branches:
      - release/reviewed-notes-race-fix-build
    paths:
      - '.github/workflows/apply-release-notes-race-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Restore early validation and rematerialize before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/scripts/release.sh')
          text = path.read_text(encoding='utf-8')

          def once(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected one occurrence: {old!r}')
              text = text.replace(old, new, 1)

          once(
              'RELEASE_NOTES_OUTPUT="${RUNNER_TEMP:-target}/taxonomy-${RELEASE_VERSION}-release-notes.md"\n',
              '',
          )

          pattern = re.compile(
              r'materialize_reviewed_release_notes\(\) \{.*?\n\}\n\ncollect_release_artifacts',
              re.DOTALL,
          )
          replacement = '''validate_release_notes() {
            local notes_file=release_notes.md
            if [[ "$(git rev-parse HEAD)" != "$RELEASE_COMMIT" ]]; then
              fail "Reviewed release notes must be validated at release commit $RELEASE_COMMIT"
            fi
            git ls-files --error-unmatch "$notes_file" >/dev/null \\
              || fail "$notes_file must be tracked by the exact release commit"
            git diff --quiet HEAD -- "$notes_file" \\
              || fail "$notes_file differs from the exact release commit"
            RELEASE_VERSION="$RELEASE_VERSION" \\
              RELEASE_NOTES_COMMIT="$RELEASE_COMMIT" \\
              RELEASE_NOTES_FILE="$notes_file" \\
              "$RELEASE_NOTES_VALIDATOR"
          }

          materialize_reviewed_release_notes() {
            RELEASE_VERSION="$RELEASE_VERSION" \\
              RELEASE_NOTES_COMMIT="$RELEASE_COMMIT" \\
              RELEASE_NOTES_FILE=release_notes.md \\
              "$RELEASE_NOTES_VALIDATOR"
          }

          collect_release_artifacts'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one materialization function, found {count}')

          once(
              '\nmaterialize_reviewed_release_notes\n\nif [[ "$SKIP_TESTS" == "true" ]]; then\n',
              '\nvalidate_release_notes\n\nif [[ "$SKIP_TESTS" == "true" ]]; then\n',
          )
          if text.count('--notes-file "$RELEASE_NOTES_OUTPUT"') != 2:
              raise SystemExit('expected two runner-temp notes arguments')
          text = text.replace(
              '--notes-file "$RELEASE_NOTES_OUTPUT"',
              '--notes-file release_notes.md',
          )
          if text.count('materialize_reviewed_release_notes') != 3:
              raise SystemExit('expected definition plus two publication calls')
          if text.count('validate_release_notes') != 2:
              raise SystemExit('expected definition plus early validation call')
          path.write_text(text, encoding='utf-8')
          PY

          bash -n .github/scripts/release.sh
          git diff --check

      - name: Commit only the compatible product script
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/release.sh
          test "$(git diff --cached --name-only)" = '.github/scripts/release.sh'
          git commit -m 'Rematerialize reviewed notes before publication'
          git push origin HEAD:release/reviewed-notes-race-fix-build
