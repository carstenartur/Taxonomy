name: Protected Release Main Advance

run-name: Advance main to ${{ inputs.next_version }} (${{ inputs.expected_sha }})

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version whose staging branch is being advanced
        required: true
        type: string
      next_version:
        description: Exact next development version
        required: true
        type: string
      temp_branch:
        description: Release staging branch containing the next-development commit
        required: true
        type: string
      expected_sha:
        description: Exact next-development commit SHA
        required: true
        type: string
      expected_base_sha:
        description: Exact main SHA from which the release started
        required: true
        type: string

permissions:
  actions: write
  checks: read
  statuses: read
  contents: write
  pull-requests: write

concurrency:
  group: protected-release-main-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  advance:
    name: Verify and merge next development snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout authoritative main workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Preserve Java release tooling
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -pl taxonomy-tooling -am package -DskipTests
          tooling_jar=$(find taxonomy-tooling/target -maxdepth 1 -type f \
            -name 'taxonomy-tooling-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)
          if [[ -z "$tooling_jar" || ! -f "$tooling_jar" ]]; then
            echo "::error::Java release tooling jar was not produced"
            exit 1
          fi
          cp "$tooling_jar" "$RUNNER_TEMP/taxonomy-tooling.jar"
          cp .github/scripts/check-release-pr-gates.sh "$RUNNER_TEMP/check-release-pr-gates.sh"

      - name: Validate immutable handoff
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION: ${{ inputs.next_version }}
          TEMP_BRANCH: ${{ inputs.temp_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version $RELEASE_VERSION"
            exit 1
          fi
          if ! [[ "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::Invalid next development version $NEXT_VERSION"
            exit 1
          fi
          if [[ "$TEMP_BRANCH" != "release-temp-${RELEASE_VERSION}" ]]; then
            echo "::error::Unexpected staging branch $TEMP_BRANCH"
            exit 1
          fi
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release handoff must use full immutable commit SHAs"
            exit 1
          fi

          git fetch origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TEMP_BRANCH}:refs/remotes/origin/${TEMP_BRANCH}" --force
          actual_main=$(git rev-parse origin/main)
          actual_head=$(git rev-parse "origin/${TEMP_BRANCH}")
          test "$actual_main" = "$EXPECTED_BASE_SHA" || {
            echo "::error::main moved from $EXPECTED_BASE_SHA to $actual_main before release handoff"
            exit 1
          }
          test "$actual_head" = "$EXPECTED_SHA" || {
            echo "::error::$TEMP_BRANCH points to $actual_head, expected $EXPECTED_SHA"
            exit 1
          }
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$EXPECTED_SHA" || {
            echo "::error::next-development commit is not descended from the release source main"
            exit 1
          }
          git checkout --detach "$EXPECTED_SHA"
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-version-state \
            --root . --mode development --expected-version "$NEXT_VERSION"
          current_version=$(java -jar \
            "$RUNNER_TEMP/taxonomy-tooling.jar" read-pom-version)
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-release-plan \
            --root . \
            --current-version "$current_version" \
            --release-version "$RELEASE_VERSION" \
            --next-development-version "$NEXT_VERSION" \
            --state advanced \
            --require-clean true

      - name: Create protected-main pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_VERSION: ${{ inputs.next_version }}
          TEMP_BRANCH: ${{ inputs.temp_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number=$(gh pr list \
            --state open --base main --head "$TEMP_BRANCH" \
            --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$EXPECTED_SHA\") | .number" \
            | head -n 1)
          if [[ -z "$pr_number" ]]; then
            gh pr create \
              --base main \
              --head "$TEMP_BRANCH" \
              --title "Prepare next development version $NEXT_VERSION" \
              --body "Release automation prepared this exact next-development snapshot. The branch is merged only after the complete required pull-request gate matrix succeeds on $EXPECTED_SHA."
            pr_number=$(gh pr list \
              --state open --base main --head "$TEMP_BRANCH" \
              --json number,headRefOid \
              --jq ".[] | select(.headRefOid == \"$EXPECTED_SHA\") | .number" \
              | head -n 1)
          fi
          test -n "$pr_number" || {
            echo "::error::Could not create or locate protected-main release PR"
            exit 1
          }
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Check workflow admission before expensive verification
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: bash "$RUNNER_TEMP/check-release-pr-gates.sh" preflight

      - name: Run canonical verification on exact snapshot
        id: canonical
        env:
          GH_TOKEN: ${{ github.token }}
          TEMP_BRANCH: ${{ inputs.temp_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Select the newest exact-head dispatch, never an older green run
          # when a more recent run/attempt failed or is still running.
          latest_run_id() {
            gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow ci-cd.yml --event workflow_dispatch \
              --commit "$EXPECTED_SHA" --limit 1 \
              --json databaseId,createdAt --jq '.[0].databaseId // empty'
          }
          run_id=$(latest_run_id)
          if [[ -z "$run_id" ]]; then
            gh workflow run ci-cd.yml --ref "$TEMP_BRANCH" --repo "$GITHUB_REPOSITORY"
            for _ in $(seq 1 60); do
              run_id=$(latest_run_id)
              if [[ -n "$run_id" ]]; then break; fi
              sleep 5
            done
          fi
          if ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Could not locate canonical CI for $EXPECTED_SHA"
            exit 1
          fi
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
          jq -e --arg sha "$EXPECTED_SHA" --arg branch "$TEMP_BRANCH" '
            .head_sha == $sha and .head_branch == $branch and .event == "workflow_dispatch" and
            .path == ".github/workflows/ci-cd.yml"' <<< "$run" >/dev/null || {
              echo "::error::Canonical CI $run_id has a different source or workflow"
              exit 1
            }
          if [[ "$(jq -r '.status' <<< "$run")" == completed &&
                "$(jq -r '.conclusion' <<< "$run")" != success ]]; then
            echo "::error::Canonical CI $run_id ended with $(jq -r '.conclusion' <<< "$run"); not retrying it automatically"
            exit 1
          fi
          echo "Canonical CI: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          # A completed exact-source success returns immediately. In-progress
          # runs are joined rather than duplicated. No test result is fabricated.
          gh run watch "$run_id" --exit-status --interval 60 --repo "$GITHUB_REPOSITORY"
          final_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
          jq -e --arg sha "$EXPECTED_SHA" --arg branch "$TEMP_BRANCH" '
            .head_sha == $sha and .head_branch == $branch and .event == "workflow_dispatch" and
            .path == ".github/workflows/ci-cd.yml" and
            .status == "completed" and .conclusion == "success"' \
            <<< "$final_run" >/dev/null || {
              echo "::error::Canonical CI $run_id did not finish successfully on $EXPECTED_SHA"
              exit 1
            }
          test "$(latest_run_id)" = "$run_id" || {
            echo '::error::A newer canonical run appeared; do not accept superseded evidence'
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for complete protected-main pull-request gates
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          head_before=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          test "$head_before" = "$EXPECTED_SHA" || {
            echo "::error::PR #$PR_NUMBER moved to $head_before before gate verification, expected $EXPECTED_SHA"
            exit 1
          }

          bash "$RUNNER_TEMP/check-release-pr-gates.sh" preflight
          gh pr checks "$PR_NUMBER" --required --watch --fail-fast --interval 30
          bash "$RUNNER_TEMP/check-release-pr-gates.sh" verify

          head_after=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          test "$head_after" = "$EXPECTED_SHA" || {
            echo "::error::PR #$PR_NUMBER moved to $head_after while its gates were running, expected $EXPECTED_SHA"
            exit 1
          }

      - name: Merge through protected main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION: ${{ inputs.next_version }}
          TEMP_BRANCH: ${{ inputs.temp_branch }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/main:refs/remotes/origin/main" --force
          current_main=$(git rev-parse origin/main)
          test "$current_main" = "$EXPECTED_BASE_SHA" || {
            echo "::error::main moved to $current_main while release snapshot was verified"
            exit 1
          }
          head_sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          test "$head_sha" = "$EXPECTED_SHA" || {
            echo "::error::PR #$PR_NUMBER moved to $head_sha, expected $EXPECTED_SHA"
            exit 1
          }

          # Refuse anything except the verified release + snapshot pair before
          # asking GitHub to perform its protected, linear-history merge.
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-release-history \
            --root . --release-commit "v${RELEASE_VERSION}" \
            --expected-next-commit "$EXPECTED_SHA" \
            --expected-base-commit "$EXPECTED_BASE_SHA" \
            --main-commit "$EXPECTED_SHA"

          gh pr merge "$PR_NUMBER" --rebase --match-head-commit "$EXPECTED_SHA"

          merged_pr=$(gh pr view "$PR_NUMBER" --json state,headRefOid,mergeCommit)
          merged_sha=$(jq -er --arg head "$EXPECTED_SHA" \
            'select(.state == "MERGED" and .headRefOid == $head) | .mergeCommit.oid // empty' \
            <<< "$merged_pr")

          git fetch origin "refs/heads/main:refs/remotes/origin/main" --force
          test "$(git rev-parse origin/main)" = "$merged_sha" || {
            echo "::error::main no longer matches the protected PR merge result"
            exit 1
          }
          # GitHub rewrites commit IDs on rebase. Compare both complete trees
          # and their exact common base; never retag the already-built release.
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-release-history \
            --root . --release-commit "v${RELEASE_VERSION}" \
            --expected-next-commit "$EXPECTED_SHA" \
            --expected-base-commit "$EXPECTED_BASE_SHA" \
            --main-commit "$merged_sha"
          git checkout --detach origin/main
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-version-state \
            --root . --mode development --expected-version "$NEXT_VERSION"
          git push origin ":refs/heads/${TEMP_BRANCH}" || true
