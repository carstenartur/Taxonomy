name: Document Template Report E2E

on:
  pull_request:
    branches: [ main, feat/artemis-execution-base, 'implementation/**' ]
    paths:
      - '.github/scripts/configure-docker-mirror.sh'
      - '.github/package.json'
      - '.github/package-lock.json'
      - '.github/scripts/document-template-report-download.mjs'
      - '.github/workflows/document-template-report-e2e.yml'
      - '.github/actions/document-rendering/**'
      - '.github/scripts/apt-packages.sh'
      - '.github/scripts/install-document-rendering.sh'
      - '.github/scripts/install-playwright-github.sh'
      - 'taxonomy-app/src/main/**'
      - 'taxonomy-workspace/**'
      - 'taxonomy-templates/**'
      - 'taxonomy-templates-api/**'
      - 'taxonomy-reporting/**'
      - 'taxonomy-reporting-api/**'
      - 'taxonomy-interop/**'
      - 'taxonomy-build/**'
      - 'docs/de/DOCUMENT_TEMPLATES.md'
      - 'docs/en/DOCUMENT_TEMPLATES.md'
      - 'docs/images/document-template-management.png'
      - 'docs/images/decision-rationale-template-test-report.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-document-template-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Playwright download through Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Configure and verify Docker Hub cache
        run: bash .github/scripts/configure-docker-mirror.sh

      - name: Install document rendering tools
        uses: ./.github/actions/document-rendering

      - name: Build and install the packaged application reactor
        run: |
          ./mvnw -B -pl taxonomy-tooling,taxonomy-build -am install \
            -DskipTests \
            -Dtaxonomy.ui.skip=true \
            -Dtaxonomy.quality.skip=true

      - name: Install pinned Node and Chromium
        run: |
          ./mvnw -B -pl taxonomy-build pre-integration-test \
            -DskipTests \
            -Dtaxonomy.ui.skip=false \
            -Dtaxonomy.quality.skip=true \
            -Dtaxonomy.playwright.install.arguments="run install:playwright:github -- --chromium-only"

      - name: Download the template-backed report in Playwright
        env:
          TAXONOMY_RENDER_DOCX_PREVIEW: 'true'
          TAXONOMY_DOCS_IMAGE_DIR: ${{ github.workspace }}/docs/images
        run: |
          ./mvnw -B -pl taxonomy-build \
            -Pdocument-template-report-e2e \
            verify

      - name: Upload browser, DOCX, and screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: document-template-report-e2e
          path: |
            target/ui-verification/document-template-report/**
            docs/images/document-template-management.png
            docs/images/decision-rationale-template-test-report.png
          if-no-files-found: warn
          retention-days: 90
