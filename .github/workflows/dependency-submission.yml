name: Dependency Submission

on:
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '**/pom.xml'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: taxonomy-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-maven:
    name: Submit Maven dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Ensure Maven cache path exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.m2/repository"
          test -d "$HOME/.m2/repository"

      - name: Restore Maven cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-dependency-submission-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-submission-maven-

      - name: Submit dependency snapshot
        uses: actions/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
        with:
          directory: ${{ github.workspace }}
