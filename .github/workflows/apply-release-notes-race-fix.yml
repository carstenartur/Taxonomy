name: Apply release-notes contract ratchet

on:
  push:
    branches:
      - release/reviewed-notes-race-fix-build
    paths:
      - '.github/workflows/apply-release-notes-race-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Ratchet the static release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/check-release-delivery-contract.py')
          text = path.read_text(encoding='utf-8')

          def once(old, new):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected one occurrence: {old!r}')
              text = text.replace(old, new, 1)

          once(
              '''        "DEFER_RELEASE_PUBLICATION=${DEFER_RELEASE_PUBLICATION:-false}",
                  "run_maven_release_check()",
          ''',
              '''        "DEFER_RELEASE_PUBLICATION=${DEFER_RELEASE_PUBLICATION:-false}",
                  'RELEASE_NOTES_OUTPUT="${RUNNER_TEMP:-target}/taxonomy-${RELEASE_VERSION}-release-notes.md"',
                  "materialize_reviewed_release_notes()",
                  'RELEASE_NOTES_FILE="$RELEASE_NOTES_OUTPUT"',
                  '--notes-file "$RELEASE_NOTES_OUTPUT"',
                  "run_maven_release_check()",
          ''',
          )

          marker = '''    if "git add pom.xml */pom.xml" in script:
          '''
          extra = '''    if script.count("materialize_reviewed_release_notes") != 4:
                  failures.append(
                      "release.sh must materialize reviewed notes for early validation, "
                      "draft creation and direct publication"
                  )
              if script.count('--notes-file "$RELEASE_NOTES_OUTPUT"') != 2:
                  failures.append(
                      "release.sh must use the immutable notes file for draft creation "
                      "and direct publication"
                  )
              if "--notes-file release_notes.md" in script:
                  failures.append(
                      "release.sh must not publish notes from a checkout that may have advanced"
                  )

              if "git add pom.xml */pom.xml" in script:
          '''
          once(marker, extra)
          path.write_text(text, encoding='utf-8')
          PY

          python3 .github/scripts/check-release-delivery-contract.py
          git diff --check

      - name: Commit only the static contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/check-release-delivery-contract.py
          test "$(git diff --cached --name-only)" = '.github/scripts/check-release-delivery-contract.py'
          git commit -m 'Ratchet immutable reviewed-notes publication contract'
          git push origin HEAD:release/reviewed-notes-race-fix-build
