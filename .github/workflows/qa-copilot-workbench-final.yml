name: QA Final Persisted Copilot Workbench

on:
  push:
    branches:
      - fix/copilot-architecture-workbench-ux
    paths:
      - .github/workflows/qa-copilot-workbench-final.yml

permissions:
  contents: write

concurrency:
  group: qa-final-persisted-copilot-workbench
  cancel-in-progress: true

jobs:
  verify:
    name: Verify compact persisted-snapshot workbench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/copilot-architecture-workbench-ux
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Use the next free screenshot number and document its owning test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java'),
              Path('docs/en/COPILOT_AUTOPILOT.md'),
              Path('docs/de/COPILOT_AUTOPILOT.md'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if '41-copilot-architecture-workbench.png' not in text:
                  raise SystemExit(f'Old Copilot screenshot reference missing in {path}')
              text = text.replace(
                  '41-copilot-architecture-workbench.png',
                  '71-copilot-architecture-workbench.png')
              if path.name == 'ArchitectureWorkbenchUiIT.java':
                  text = text.replace(
                      'new Dimension(1800, 1100)',
                      'new Dimension(2200, 1300)',
                      1)
              path.write_text(text, encoding='utf-8')

          reference = Path('.github/copilot-ref-screenshots.md')
          text = reference.read_text(encoding='utf-8')
          old_intro = 'Screenshots are captured by `src/test/java/com/taxonomy/ScreenshotGeneratorIT.java`.'
          new_intro = ('Most screenshots are captured by '
                       '`src/test/java/com/taxonomy/ScreenshotGeneratorIT.java`. '
                       'The persisted Copilot architecture workbench is owned by '
                       '`ArchitectureWorkbenchUiIT.java` because that test creates and opens '
                       'the real immutable analysis snapshot used by the browser, SVG and PDF paths.')
          if old_intro not in text:
              raise SystemExit('Screenshot reference introduction not found')
          text = text.replace(old_intro, new_intro, 1)

          row70 = '| `70`         | No              | Swagger UI (API Documentation)                        |\n'
          row71 = ('| `71`         | Yes (mock mode) | Persisted Copilot architecture workbench from the '
                   'owning snapshot acceptance |\n')
          if row70 not in text:
              raise SystemExit('Screenshot numbering table insertion point not found')
          text = text.replace(row70, row70 + row71, 1)

          profile_line = '3. **Run the generator** locally (`./mvnw -B verify -Pscreenshots`) to produce the PNG file.\n'
          note = (profile_line + '\n   The Maven-owned `screenshots` profile runs both screenshot owners. '
                  'Keep a snapshot-specific screenshot in `ArchitectureWorkbenchUiIT` instead '
                  'of fabricating a second browser state in `ScreenshotGeneratorIT`.\n')
          if profile_line not in text:
              raise SystemExit('Screenshot generation guidance insertion point not found')
          text = text.replace(profile_line, note, 1)

          key_marker = '| Architecture View panel | `#architectureViewPanel` |\n'
          key_rows = (key_marker
                      + '| Persisted Copilot workbench | `#architectureWorkbench` |\n'
                      + '| Copilot workbench search | `#architectureSearch` |\n'
                      + '| Copilot workbench true fit | `#fitArchitecture` |\n')
          if key_marker not in text:
              raise SystemExit('Screenshot key table insertion point not found')
          text = text.replace(key_marker, key_rows, 1)
          reference.write_text(text, encoding='utf-8')
          PY

          rm -f docs/images/41-copilot-architecture-workbench.png
          git diff --check

      - name: Verify compact shared browser-SVG-PDF projection
        run: >-
          ./mvnw -B -pl taxonomy-export -am test
          -Dtest=LayeredDiagramLayoutServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Exercise and capture the compact real snapshot
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=ArchitectureWorkbenchUiIT
          -DgenerateScreenshots=true
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Verify the final documentation screenshot
        shell: bash
        run: |
          set -euo pipefail
          image=docs/images/71-copilot-architecture-workbench.png
          test -s "$image"
          test "$(wc -c < "$image")" -gt 75000
          file "$image" | grep -F 'PNG image data'
          test ! -e docs/images/41-copilot-architecture-workbench.png

      - name: Upload final screenshot and focused evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: persisted-copilot-workbench-final
          path: |
            docs/images/71-copilot-architecture-workbench.png
            taxonomy-app/target/failsafe-reports/**
            taxonomy-export/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 7

      - name: Publish verified documentation and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qa-copilot-workbench-final.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/test/java/com/taxonomy/ArchitectureWorkbenchUiIT.java \
            docs/en/COPILOT_AUTOPILOT.md \
            docs/de/COPILOT_AUTOPILOT.md \
            .github/copilot-ref-screenshots.md \
            docs/images/41-copilot-architecture-workbench.png \
            docs/images/71-copilot-architecture-workbench.png \
            .github/workflows/qa-copilot-workbench-final.yml
          git commit -m 'docs: add the compact persisted Copilot workbench screenshot [skip ci]'
          git push origin HEAD:fix/copilot-architecture-workbench-ux
