error.semantic.notReady=Semantische Suche ist noch nicht bereit
error.search.unavailable=Die Suche ist vorübergehend nicht verfügbar. Bitte erneut versuchen.
search.input.fulltext.placeholder=z. B. Zeiterfassung oder BP-1000
search.input.fulltext.help=Geben Sie Stichwörter oder einen Knoten-Code / Code-Anfang ein, z. B. Zeiterfassung oder BP-1000. Durchsucht Namen, Beschreibungen und Kennungen.
search.input.semantic.placeholder=z. B. Wie erfassen wir Arbeitszeiten sicher?
search.input.semantic.help=Beschreiben Sie Ihren Bedarf in natürlicher Sprache, z. B. Wie erfassen wir Arbeitszeiten sicher? Findet ähnliche Bedeutungen; keine besondere Suchsyntax ist erforderlich.
search.input.hybrid.placeholder=z. B. sichere Erfassung von Arbeitszeiten
search.input.hybrid.help=Geben Sie Stichwörter ein oder beschreiben Sie Ihren Bedarf in natürlicher Sprache, z. B. sichere Erfassung von Arbeitszeiten. Kombiniert Volltext-Treffer mit semantischer Ähnlichkeit.
search.input.graph.placeholder=z. B. Dienste zur Erfassung von Arbeitszeiten
search.input.graph.help=Beschreiben Sie ein Thema in natürlicher Sprache, z. B. Dienste zur Erfassung von Arbeitszeiten. Findet ähnliche Knoten und Relationen im ausgewählten Branch; dieser muss unterstützt und bereit sein.
