name: CodeQL Source Analysis

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - 'taxonomy-*/pom.xml'
      - 'taxonomy-*/src/**'
      - '.github/scripts/**'
      - '.github/codeql-sarif-baseline.json'
      - '.github/workflows/codeql.yml'
  push:
    branches: ['**']
    paths:
      - 'pom.xml'
      - 'taxonomy-*/pom.xml'
      - 'taxonomy-*/src/**'
      - '.github/scripts/**'
      - '.github/codeql-sarif-baseline.json'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '19 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: CodeQL / Java
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended,security-and-quality

      - name: Build Java reactor and SARIF gate for CodeQL
        run: >-
          ./mvnw -B -q -pl taxonomy-app,taxonomy-tooling -am package
          -Dmaven.test.skip=true
          -Dtaxonomy.model.download.skip=true
          -Dtaxonomy.ui.skip=true
          -Dtaxonomy.quality.skip=true

      - name: Preserve immutable Java SARIF gate
        shell: bash
        run: |
          set -euo pipefail
          tooling_jar=$(find taxonomy-tooling/target -maxdepth 1 -type f \
            -name 'taxonomy-tooling-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          if [[ -z "$tooling_jar" || ! -f "$tooling_jar" ]]; then
            echo "::error::Java CodeQL SARIF gate jar was not produced"
            exit 1
          fi
          cp "$tooling_jar" "$RUNNER_TEMP/taxonomy-tooling.jar"

      - name: Analyze Java to local SARIF
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:java-kotlin
          upload: false
          output: codeql-java

      - name: Enforce high-severity Java findings
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t reports < <(
            find codeql-java -type f -name '*.sarif' -print0 | sort -z
          )
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-codeql-sarif \
            --baseline .github/codeql-sarif-baseline.json \
            --report target/codeql-java-gate.json \
            "${reports[@]}"

      - name: Archive Java SAST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-java-sarif
          path: |
            codeql-java/**
            target/codeql-java-gate.json
          if-no-files-found: error
          retention-days: 90

  javascript:
    name: CodeQL / JavaScript
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and preserve Java SARIF gate
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -q -pl taxonomy-tooling package -DskipTests
          tooling_jar=$(find taxonomy-tooling/target -maxdepth 1 -type f \
            -name 'taxonomy-tooling-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          if [[ -z "$tooling_jar" || ! -f "$tooling_jar" ]]; then
            echo "::error::Java CodeQL SARIF gate jar was not produced"
            exit 1
          fi
          cp "$tooling_jar" "$RUNNER_TEMP/taxonomy-tooling.jar"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Analyze JavaScript to local SARIF
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:javascript-typescript
          upload: false
          output: codeql-javascript

      - name: Enforce high-severity JavaScript findings
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t reports < <(
            find codeql-javascript -type f -name '*.sarif' -print0 | sort -z
          )
          java -jar "$RUNNER_TEMP/taxonomy-tooling.jar" check-codeql-sarif \
            --baseline .github/codeql-sarif-baseline.json \
            --report target/codeql-javascript-gate.json \
            "${reports[@]}"

      - name: Archive JavaScript SAST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-javascript-sarif
          path: |
            codeql-javascript/**
            target/codeql-javascript-gate.json
          if-no-files-found: error
          retention-days: 90
