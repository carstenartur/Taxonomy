name: Fix Selected Snapshot Workbench Link

on:
  push:
    branches:
      - fix/complete-copilot-run-screenshot
    paths:
      - .github/workflows/fix-selected-snapshot-workbench-link.yml

permissions:
  contents: write

concurrency:
  group: fix-selected-snapshot-workbench-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify Docker availability
        run: docker info

      - name: Bind workbench and result tables to their exact evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          detail_path = Path(
              'taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js')
          detail = detail_path.read_text(encoding='utf-8')

          old_url = '''    function architectureWorkbenchUrl() {
                  return window.location.pathname.replace(/\\/$/, '')
                      + '/architecture?lang=' + encodeURIComponent(locale);
              }
          '''
          new_url = '''    function architectureWorkbenchUrl() {
                  if (!state.selectedSnapshot || state.selectedSnapshot.id === null
                          || state.selectedSnapshot.id === undefined) {
                      return '#';
                  }
                  const url = new URL('/architecture/workbench', window.location.origin);
                  url.searchParams.set('projectId', String(projectId));
                  url.searchParams.set('snapshotId', String(state.selectedSnapshot.id));
                  url.searchParams.set('lang', locale);
                  return url.pathname + url.search;
              }
          '''
          if old_url not in detail:
              raise SystemExit('Current-requirement workbench URL helper not found')
          detail = detail.replace(old_url, new_url, 1)

          old_relation_table = '''            ? `<details class="portfolio-finding-details"><summary>${escapeHtml(t('suggestedRelations'))} <span class="badge text-bg-secondary">${suggested.length}</span></summary>`
                          + `<div class="portfolio-result-table portfolio-result-table-sm"><table class="table table-sm align-middle mb-0"><thead><tr>`
                          + `<th>${escapeHtml(t('relation'))}</th><th>${escapeHtml(t('reasoning'))}</th></tr></thead><tbody>`
          '''
          new_relation_table = '''            ? `<details class="portfolio-finding-details"><summary>${escapeHtml(t('suggestedRelations'))} <span class="badge text-bg-secondary">${suggested.length}</span></summary>`
                          + `<div class="portfolio-result-table portfolio-result-table-sm"><table class="table table-sm align-middle mb-0">`
                          + `<caption class="visually-hidden">${escapeHtml(t('suggestedRelations'))}</caption><thead><tr>`
                          + `<th scope="col">${escapeHtml(t('relation'))}</th><th scope="col">${escapeHtml(t('reasoning'))}</th></tr></thead><tbody>`
          '''
          if old_relation_table not in detail:
              raise SystemExit('Suggested-relation table renderer not found')
          detail_path.write_text(
              detail.replace(old_relation_table, new_relation_table, 1),
              encoding='utf-8')

          session_path = Path(
              'taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java')
          session = session_path.read_text(encoding='utf-8')
          old_call = '        openSelectedSnapshotThroughVisibleAnalysisControls();\n'
          new_call = '        openSelectedSnapshotThroughVisibleAnalysisControls(projectId);\n'
          if old_call not in session:
              raise SystemExit('Selected-snapshot browser method call not found')
          session = session.replace(old_call, new_call, 1)
          old_signature = (
              '    private static void '
              'openSelectedSnapshotThroughVisibleAnalysisControls() {\n'
          )
          new_signature = (
              '    private static void '
              'openSelectedSnapshotThroughVisibleAnalysisControls(long projectId) {\n'
          )
          if old_signature not in session:
              raise SystemExit('Selected-snapshot browser method signature not found')
          session = session.replace(old_signature, new_signature, 1)

          kpi_marker = '''        assertThat(driver.findElements(By.cssSelector(
                          "#snapshotResultOverview .portfolio-result-kpi")))
                          .hasSize(6);

          '''
          workbench_assertion = '''        assertThat(driver.findElements(By.cssSelector(
                          "#snapshotResultOverview .portfolio-result-kpi")))
                          .hasSize(6);

                  WebElement selectedSnapshot = driver.findElement(By.cssSelector(
                          "#snapshotList [data-snapshot-id].active[aria-current='true']"));
                  String selectedSnapshotId = selectedSnapshot.getAttribute("data-snapshot-id");
                  String workbenchHref = driver.findElement(By.cssSelector(
                          "#snapshotResultOverview a[href*='/architecture/workbench']"))
                          .getAttribute("href");
                  assertThat(workbenchHref)
                          .contains("/architecture/workbench")
                          .contains("projectId=" + projectId)
                          .contains("snapshotId=" + selectedSnapshotId);

          '''
          if kpi_marker not in session:
              raise SystemExit('Workbench-link browser assertion insertion point not found')
          session_path.write_text(
              session.replace(kpi_marker, workbench_assertion, 1),
              encoding='utf-8')

          contract_path = Path(
              'taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotResultUiContractTest.java')
          contract = contract_path.read_text(encoding='utf-8')
          contract = contract.replace(
              'private static void openSelectedSnapshotThroughVisibleAnalysisControls()',',
              'private static void openSelectedSnapshotThroughVisibleAnalysisControls(long projectId)',',
              1)
          header_assertion = '''                .contains("coverageScore: 'Coverage score'")
                          .contains("coverageScore: 'Abdeckungswert'");
          '''
          header_replacement = '''                .contains("coverageScore: 'Coverage score'")
                          .contains("coverageScore: 'Abdeckungswert'")
                          .contains("<caption class=\\\"visually-hidden\\\">${escapeHtml(t('suggestedRelations'))}</caption>")
                          .contains("<th scope=\\\"col\\\">${escapeHtml(t('relation'))}</th>")
                          .contains("<th scope=\\\"col\\\">${escapeHtml(t('reasoning'))}</th>");
          '''
          if header_assertion not in contract:
              raise SystemExit('Accessible table contract insertion point not found')
          contract = contract.replace(header_assertion, header_replacement, 1)

          class_end = contract.rfind('\n}')
          if class_end < 0:
              raise SystemExit('Result UI contract terminator not found')
          workbench_test = '''

              @Test
              void workbenchLinkKeepsTheExactSelectedImmutableSnapshot()
                      throws IOException {
                  String detail = Files.readString(Path.of(
                          "src/main/resources/static/js/portfolio/requirement-detail.js"));
                  String session = Files.readString(Path.of(
                          "src/test/java/com/taxonomy/CompleteCopilotSessionIT.java"));

                  assertThat(detail)
                          .contains("new URL('/architecture/workbench', window.location.origin)")
                          .contains("url.searchParams.set('projectId', String(projectId))")
                          .contains("url.searchParams.set('snapshotId', String(state.selectedSnapshot.id))")
                          .doesNotContain("+ '/architecture?lang=' + encodeURIComponent(locale)");
                  assertThat(session)
                          .contains("openSelectedSnapshotThroughVisibleAnalysisControls(projectId)")
                          .contains("projectId=\" + projectId")
                          .contains("snapshotId=\" + selectedSnapshotId");
              }
          '''
          contract_path.write_text(
              contract[:class_end] + workbench_test + contract[class_end:],
              encoding='utf-8')
          PY

          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          git diff --check

      - name: Verify focused result contracts
        run: >-
          ./mvnw -B -pl taxonomy-app -am test
          -Dtest=RequirementCopilotResultSurfaceContractTest,CompleteCopilotResultUiContractTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Build the packaged application
        run: >-
          ./mvnw -B -pl taxonomy-app -am install
          -DskipTests
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Exercise the exact selected-snapshot browser journey
        run: >-
          ./mvnw -B -pl taxonomy-app verify
          -Dtest=__NoUnitTests__
          -Dsurefire.failIfNoSpecifiedTests=false
          -DskipITs=false
          -Dit.test=CompleteCopilotSessionIT
          -Dcyclonedx.skip=true
          -Dtaxonomy.model.download.skip=true

      - name: Publish verified permanent changes
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/complete-copilot-run-screenshot
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotResultUiContractTest.java \
            taxonomy-app/src/test/java/com/taxonomy/CompleteCopilotSessionIT.java
          git diff --cached --check
          git commit -m 'Bind the workbench to the selected Copilot snapshot'
          git push origin HEAD:"$branch"
