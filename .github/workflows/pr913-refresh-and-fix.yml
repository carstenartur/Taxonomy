name: Refresh and fix PR 913

on:
  push:
    branches:
      - codex/json-catalogue-overlay
    paths:
      - .github/workflows/pr913-refresh-and-fix.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/json-catalogue-overlay
          fetch-depth: 0
      - name: Merge main and normalize mapping-review labels
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          values = {
              'taxonomy-app/src/main/resources/i18n/messages.properties': {
                  'mappingReview.status.pending': 'Pending review',
                  'mappingReview.status.approved': 'Approved',
                  'mappingReview.status.rejected': 'Rejected',
                  'mappingReview.badge.reviewPending': 'Review required',
                  'mappingReview.badge.lowConfidence': 'Low confidence',
              },
              'taxonomy-app/src/main/resources/i18n/messages_de.properties': {
                  'mappingReview.status.pending': 'Prüfung ausstehend',
                  'mappingReview.status.approved': 'Freigegeben',
                  'mappingReview.status.rejected': 'Abgelehnt',
                  'mappingReview.badge.reviewPending': 'Prüfung erforderlich',
                  'mappingReview.badge.lowConfidence': 'Niedrige Konfidenz',
              },
          }

          for filename, replacements in values.items():
              path = Path(filename)
              lines = path.read_text(encoding='utf-8').splitlines()
              seen = set()
              output = []
              for line in lines:
                  if '=' not in line or line.lstrip().startswith(('#', '!')):
                      output.append(line)
                      continue
                  key = line.split('=', 1)[0].strip()
                  if key in replacements:
                      output.append(f'{key}={replacements[key]}')
                      seen.add(key)
                  else:
                      output.append(line)
              # Do not invent unused keys; only normalize keys already introduced by this PR.
              path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

          git diff --check
          ./mvnw -B -ntp -pl taxonomy-app -am \
            -DskipITs \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

          git rm .github/workflows/pr913-refresh-and-fix.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: refresh mapping review against main"
          git push origin HEAD:codex/json-catalogue-overlay
