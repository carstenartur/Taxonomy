name: Apply verified PR 463 integration patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-resolve-pr-463.yml'

permissions:
  contents: write

concurrency:
  group: resolve-taxonomy-pr-463
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply verified PR 463 integration patch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue-461-jgit-storage-hibernate
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply and verify non-workflow integration
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TEMP_WORKFLOW: .github/workflows/temp-resolve-pr-463.yml
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          for part in 00 01 02 03; do
            git show "origin/main:.github/pr463-integration/part-${part}"
          done | base64 --decode | gzip --decompress > /tmp/pr463.patch
          test "$(sha256sum /tmp/pr463.patch | cut -d' ' -f1)" = \
            '2bb075b70a766b6b7b0d5cc303728263a09b0133fd806918f536334ecef2c634'

          git apply --3way --index /tmp/pr463.patch
          rm -f .github/issue-461-merge-conflicts.txt
          rm -f .mvn/github-packages-settings.xml

          python3 -m py_compile .github/scripts/*.py
          node --check .github/scripts/run-ui-suite.mjs
          bash -n .github/scripts/release.sh
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in Path('.').rglob('pom.xml'):
              if 'target' not in path.parts:
                  ET.parse(path)
          pom = Path('pom.xml').read_text(encoding='utf-8')
          assert '<jgit-storage-hibernate.version>0.1.10</jgit-storage-hibernate.version>' in pom
          assert 'https://raw.githubusercontent.com/carstenartur/jgit-storage-hibernate/maven-repository/' in pom
          print('POM and anonymous repository contract verified')
          PY

          chmod +x mvnw
          ./mvnw -B -N validate \
            -Dtaxonomy.ui.skip=true \
            -Dtaxonomy.quality.skip=true \
            -DskipUiTests=true \
            -DskipQualityChecks=true
          git diff --check
          git add -A
          git commit -m 'Integrate anonymous jgit-storage-hibernate 0.1.10 release'
          git push origin HEAD:fix/issue-461-jgit-storage-hibernate

          for path in \
            "$TEMP_WORKFLOW" \
            .github/pr463-integration/part-00 \
            .github/pr463-integration/part-01 \
            .github/pr463-integration/part-02 \
            .github/pr463-integration/part-03; do
            sha=$(gh api "repos/${REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)
            if [[ -n "$sha" ]]; then
              gh api -X DELETE "repos/${REPOSITORY}/contents/${path}" \
                -f message="Remove temporary PR 463 transfer file: ${path}" \
                -f sha="$sha" \
                -f branch=main >/dev/null
            fi
          done
