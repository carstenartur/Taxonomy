name: Verify strict assessments and retained partial evidence
on:
  push:
    branches: [verify/pr1112-pr1113-repair-20260923]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Reconstruct exact locally tested source
        run: |
          cp .verification/category-increment.payload /tmp/category-increment.payload
          cp .verification/apply-category-increment.py /tmp/apply-category-increment.py
          cp .verification/preserve-partial.patch /tmp/preserve-partial.patch
          echo '5b4a034b1845bdfacdc450ebb62a99bddbcb5a4830354a99a63d385b8d341f4f  /tmp/preserve-partial.patch' | sha256sum --check
          git checkout --detach 1bb12dbb3ef5a6708ad6558b27e7d1460aff270e
          python3 /tmp/apply-category-increment.py
          git apply --index /tmp/preserve-partial.patch
          test "$(git write-tree)" = 69a1f7e15fd33fb77b261c6ce616d790c962c0df
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Run complete analysis and upstream unit suites
        run: |
          ./mvnw -B -ntp -pl taxonomy-analysis -am test > /tmp/category-java.log 2>&1 || { tail -n 100 /tmp/category-java.log; exit 1; }
          tail -n 25 /tmp/category-java.log
      - name: Check unchanged architecture and configuration contracts
        run: |
          ./mvnw -B -ntp -pl taxonomy-app -am -Dtest=ArchitectureContextDependencyRatchetTest,ConfigurationReferenceContractTest -Dsurefire.failIfNoSpecifiedTests=false test > /tmp/category-guards.log 2>&1 || { tail -n 100 /tmp/category-guards.log; exit 1; }
          tail -n 25 /tmp/category-guards.log
      - name: Execute complete ordinary UI contract entrypoint
        run: |
          npm --prefix .github ci
          npm --prefix .github run verify:ui-contracts > /tmp/category-ui.log 2>&1 || { tail -n 100 /tmp/category-ui.log; exit 1; }
          tail -n 20 /tmp/category-ui.log
      - name: Require intended Java suites and exact source identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
            'taxonomy-analysis': {
              'com.taxonomy.analysis.service.CategoryAssessmentContractTest': 15,
              'com.taxonomy.analysis.service.LlmServiceBranchCoverageTest': 25,
              'com.taxonomy.analysis.service.LlmDiagnosticTest': 6,
              'com.taxonomy.analysis.relations.RelationSearchEngineTest': 28,
              'com.taxonomy.analysis.relations.RelationSearchIntegrationTest': 40,
            },
            'taxonomy-app': {
              'com.taxonomy.ArchitectureContextDependencyRatchetTest': 22,
              'com.taxonomy.config.ConfigurationReferenceContractTest': 11,
            },
          }
          for module, suites in expected.items():
              for name, count in suites.items():
                  root = ET.parse(Path(module)/'target/surefire-reports'/('TEST-'+name+'.xml')).getroot()
                  assert int(root.get('tests', 0)) >= count, root.attrib
                  assert all(int(root.get(key, 0)) == 0 for key in ('failures','errors','skipped')), root.attrib
                  print(name, root.attrib)
          PY
          test "$(git write-tree)" = 69a1f7e15fd33fb77b261c6ce616d790c962c0df
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: strict-category-assessment-evidence
          path: |
            /tmp/category-*.log
            taxonomy-*/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
  prepare-commit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Prepare only the verified increment; do not update any refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .verification/category-increment.payload /tmp/category-increment.payload
          cp .verification/apply-category-increment.py /tmp/apply-category-increment.py
          cp .verification/preserve-partial.patch /tmp/preserve-partial.patch
          echo '5b4a034b1845bdfacdc450ebb62a99bddbcb5a4830354a99a63d385b8d341f4f  /tmp/preserve-partial.patch' | sha256sum --check
          git checkout --detach 1bb12dbb3ef5a6708ad6558b27e7d1460aff270e
          python3 - <<'PY'
          import json, os, runpy, subprocess, urllib.request
          from pathlib import Path
          data = runpy.run_path('/tmp/apply-category-increment.py')
          subprocess.run(['git','apply','--index','/tmp/preserve-partial.patch'],check=True)
          expected_tree = '69a1f7e15fd33fb77b261c6ce616d790c962c0df'
          assert data['git']('write-tree') == expected_tree
          assert data['git']('diff','--cached','--name-only').splitlines() == data['FILES']
          def post(kind, body):
              request = urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/' + kind,
                  data=json.dumps(body).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          tree = post('trees', {'base_tree':'657ae72887e39bd7eb686975641bdb9c354fc3e4',
              'tree':[{'path':p,'mode':'100644','type':'blob','content':Path(p).read_text()} for p in data['FILES']]})
          assert tree['sha'] == expected_tree
          commit = post('commits', {'tree':tree['sha'], 'parents':[data['BASE']],
              'message':'fix(analysis): preserve unassessed children and partial relationship evidence\n\nReuse complete child-set validation for category scores and original catalogue candidate sets. Reject invalid batches before normalization; retain unknowns, diagnostics, prior scores, verified edges and spent budget. Keep failed interactive batches retryable without changing successful zero semantics. Exact-tree source-built analysis/upstream, architecture/configuration and complete UI contracts passed. No main refs, thresholds, canonical workflows or automatic adoption semantics change.'})
          print('PREPARED_COMMIT=' + commit['sha'])
          print('PREPARED_TREE=' + tree['sha'])
          print('No branch references were changed.')
          PY
