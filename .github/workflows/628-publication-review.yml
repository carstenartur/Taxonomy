name: Portfolio publication review verification
on:
  push:
    branches: [work/628-publication-review]
    paths: [.github/workflows/628-publication-review.yml]
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 823138373e330a00141f9482bab4a1f03d4506ec
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {java-version: '21', distribution: temurin, cache: maven}
      - name: Apply bounded publication fix and behavior contracts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import urllib.request,json,base64,hashlib,os,pathlib,subprocess
          sha='dcdf6ecfa916e2430b63ab820570295c163ab807'
          req=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=120) as response: data=base64.b64decode(json.load(response)['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          path=pathlib.Path('/tmp/628-candidate.py');path.write_bytes(data)
          subprocess.run(['python3',str(path)],check=True)
          path=pathlib.Path('taxonomy-portfolio/src/test/java/com/taxonomy/portfolio/service/ProductCatalogPolicyContractTest.java')
          text=path.read_text();assert text.count('clearInvocations(products);')==1
          path.write_text(text.replace('clearInvocations(products);','clearInvocations(products,coverage,candidates,decisions,projects);'))
          subprocess.run(['git','add','-A'],check=True)
          pathlib.Path('target/628-publication.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          PY
      - name: Verify publication and existing portfolio contracts
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -Dtest=WorkspacePortfolioVersionBoundaryTest,WorkspacePortfolioDocumentAdapterTest,WorkspacePortfolioDocumentMonitorTest,PortfolioGitPublicationRaceTest,PortfolioGitReviewedSnapshotTest,PortfolioGitMaterializationPreviewTest,PortfolioGitServiceTest,PortfolioDecisionGitRoundtripTest,PortfolioApiContractTest,ArchitectureCompletionTest,ArchitectureCycleBoundaryTest,ArchitectureContextDependencyRatchetTest,PortfolioControllerDelegationContractTest,PortfolioGitRequestContractTest,PortfolioRepresentationsContractTest,PortfolioReviewMutationContractTest,PortfolioJsonCodecBoundaryTest,DocumentAnalysisServiceTest,ProductCatalogPolicyContractTest,SolutionCatalogPolicyContractTest,PortfolioDecisionImportBoundaryTest,PortfolioReportServiceTest -Dsurefire.failIfNoSpecifiedTests=false test > target/628-green.log 2>&1 || { tail -180 target/628-green.log; exit 1; }
          tail -25 target/628-green.log
      - name: Aggregate focused coverage evidence
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -pl taxonomy-coverage -am -DskipTests jacoco:report-aggregate > target/628-coverage.log 2>&1 || { tail -80 target/628-coverage.log; exit 1; }
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          p=pathlib.Path('taxonomy-coverage/target/site/jacoco-aggregate/jacoco.xml')
          report=ET.parse(p).getroot()
          for group in report.findall('group'):
              for package in group.findall('package'):
                  for source in package.findall('sourcefile'):
                      if any(part in package.get('name') for part in ('portfolio/controller','portfolio/service','portfolio/model','provenance/service','workspace/storage')):
                          counts={c.get('type'):(int(c.get('covered')),int(c.get('missed'))) for c in source.findall('counter')}
                          print('FOCUSED_COVERAGE',group.get('name'),package.get('name'),source.get('name'),counts)
          PY
      - name: Record tested source tree without changing refs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,json,urllib.request,os,xml.etree.ElementTree as ET
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--exit-code'],check=True)
          changes=[]
          for path in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines():
              assert not path.startswith('.github/workflows/')
              changes.append({'path':path,'mode':'100644','type':'blob','content':pathlib.Path(path).read_text()})
          expected=subprocess.check_output(['git','write-tree'],text=True).strip()
          body=json.dumps({'base_tree':'9ee4fd2bf0860346ee54af39ca4b915e9c8ff9a3','tree':changes}).encode()
          req=urllib.request.Request('https://api.github.com/repos/carstenartur/Taxonomy/git/trees',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=120) as response: stored=json.load(response)['sha']
          assert stored==expected
          tests=[]
          for path in pathlib.Path('.').glob('*/target/surefire-reports/TEST-*.xml'):
              root=ET.parse(path).getroot(); assert int(root.get('failures','0'))==int(root.get('errors','0'))==0
              tests.append({'suite':root.get('name'),'tests':int(root.get('tests','0')),'skipped':int(root.get('skipped','0'))})
          report={'base':'823138373e330a00141f9482bab4a1f03d4506ec','testedTree':expected,'suites':tests}
          pathlib.Path('target/628-verified.json').write_text(json.dumps(report,indent=2)+'\n')
          print('VERIFIED_TREE',expected,'TESTS',sum(x['tests'] for x in tests))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: portfolio-publication-verification
          path: |
            target/628-*
            **/target/surefire-reports/TEST-*.xml
            taxonomy-coverage/target/site/jacoco-aggregate/jacoco.xml
          if-no-files-found: error
          retention-days: 7
