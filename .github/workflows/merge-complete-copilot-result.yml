name: Merge Verified Complete Copilot Result

on:
  push:
    branches:
      - fix/complete-copilot-run-result-review
    paths:
      - .github/workflows/merge-complete-copilot-result.yml

permissions:
  actions: read
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: merge-complete-copilot-result
  cancel-in-progress: true

jobs:
  verify-clean-and-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/complete-copilot-run-result-review
          fetch-depth: 0

      - name: Require the authoritative V4 run to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow 'Finalize Complete Copilot Result V4' \
            --branch fix/complete-copilot-run-result-review \
            --limit 1 \
            --json databaseId,status,conclusion,headSha,url)"
          test "$(jq -r '.[0].status // empty' <<<"$run_json")" = completed
          test "$(jq -r '.[0].conclusion // empty' <<<"$run_json")" = success
          echo "AUTHORITATIVE_RUN_URL=$(jq -r '.[0].url' <<<"$run_json")" >> "$GITHUB_ENV"

      - name: Require the clean published feature tree
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/images/72-complete-copilot-run-result.png
          test "$(wc -c < docs/images/72-complete-copilot-run-result.png)" -gt 75000
          test -f taxonomy-app/src/test/java/com/taxonomy/portfolio/CompleteCopilotResultUiContractTest.java
          grep -F 'snapshotResultOverview' \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          grep -F "const resultReady = ['SUCCESS', 'PARTIAL'].includes(status.toUpperCase())" \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          grep -F 'taxonomy:requirement-version-created' \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          ! grep -F 'gap.summary || gap.description || JSON.stringify(gap)' \
            taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          for obsolete in \
            .github/workflows/finalize-complete-copilot-result.yml \
            .github/workflows/finalize-complete-copilot-result-v2.yml \
            .github/workflows/finalize-complete-copilot-result-v3.yml \
            .github/workflows/finalize-complete-copilot-result-v4.yml \
            .github/workflows/open-complete-copilot-result-pr.yml; do
            test ! -e "$obsolete"
          done
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-copilot.js
          node --check taxonomy-app/src/main/resources/static/js/portfolio/requirement-detail.js
          git diff --check

      - name: Remove this one-shot workflow without changing the feature tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/merge-complete-copilot-result.yml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/merge-complete-copilot-result.yml
          git commit -m 'Remove complete-result merge bootstrap [skip ci]'
          git push origin HEAD:fix/complete-copilot-run-result-review
          echo "CLEAN_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish the pull request and wait for regular checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head fix/complete-copilot-run-result-review \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          test -n "$number"
          if [ "$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready "$number" --repo "$GITHUB_REPOSITORY"
          fi
          gh pr comment "$number" --repo "$GITHUB_REPOSITORY" --body \
            "Authoritative complete-session verification passed: $AUTHORITATIVE_RUN_URL. The branch was rebuilt on current main and the one-shot verification workflows have been removed."
          gh pr checks "$number" --repo "$GITHUB_REPOSITORY" \
            --watch --fail-fast --interval 15
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" \
            --squash --match-head-commit "$CLEAN_HEAD" \
            --subject 'Make complete Copilot results reviewable' \
            --body 'Render completed Copilot analyses as a structured, accessible review surface; keep retry controls visible for cancelled, failed, or stale runs; and document the real browser-verified result.'
