database.setup.create.password.help=Choose the password for the separate application account. Keep it for your deployment Secret. For an existing account, enter its current password.
database.setup.admin.title=Server administrator — for this setup only
database.setup.admin.help=For a fresh official postgres container initialized only with POSTGRES_PASSWORD, use the postgres user and that password here. Taxonomy will use the separate application account afterwards.
