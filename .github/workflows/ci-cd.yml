name: CI / CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taxonomy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Commit-bound UI application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Package commit-bound UI application
        run: ./mvnw -B -ntp -DskipTests package
      - name: Stage commit-bound UI application
        run: bash .github/scripts/stage-ui-application.sh
      - name: Upload commit-bound UI application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: taxonomy-ui-application, path: 'target/ui-application/**', if-no-files-found: error, retention-days: 7 }

  core:
    name: Core reactor verification
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Verify release and delivery contracts
        run: |
          set -euo pipefail
          core_contract=.github/scripts/ci-core-contracts.sh
          required_contracts=(
            './mvnw -B -pl taxonomy-tooling -am package -DskipTests'
            "-name 'taxonomy-tooling-*.jar'"
            'if [[ -z "$tooling_jar" || ! -f "$tooling_jar" ]]'
            '::error::Java release tooling jar was not produced'
            'java -jar "$tooling_jar" check-release-plan'
            '--state development'
            '--require-clean true'
          )
          for required in "${required_contracts[@]}"; do
            if ! grep -F -- "$required" "$core_contract" >/dev/null; then
              echo "::error::$core_contract is missing delegated contract: $required"
              exit 1
            fi
          done
          bash "$core_contract"
      - name: Install verified Helm 3.21.0
        env: { HELM_VERSION: v3.21.0 }
        run: bash .github/scripts/install-helm.sh
      - name: Verify Docker availability
        run: docker info
      - name: Detect production-image changes
        id: production-image-scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- \
              Dockerfile \
              .dockerignore \
              pom.xml \
              mvnw \
              .mvn/wrapper \
              'taxonomy-*/pom.xml' \
              docs \
              LICENSE \
              NOTICE \
              THIRD-PARTY-NOTICES.md \
              observability/javaagent.properties; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify production Docker image build
        if: steps.production-image-scope.outputs.run == 'true'
        env: { IMAGE_TAG: 'taxonomy-ci:${{ github.event.pull_request.head.sha }}' }
        run: |
          set -euo pipefail
          docker build \
            --progress=plain \
            --build-arg BUILD_DATE=1970-01-01T00:00:00Z \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg VERSION="ci-${GITHUB_SHA}" \
            --tag "$IMAGE_TAG" .
          image_revision=$(docker image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$IMAGE_TAG")
          if [[ "$image_revision" != "$GITHUB_SHA" ]]; then
            echo "::error::Docker image revision label is '$image_revision'; expected '$GITHUB_SHA'."
            exit 1
          fi
          image_user=$(docker image inspect --format '{{ .Config.User }}' "$IMAGE_TAG")
          if [[ "$image_user" != '10001:10001' ]]; then
            echo "::error::Docker image runtime user is '$image_user'; expected '10001:10001'."
            exit 1
          fi
      - name: Validate production and Rancher Helm profiles
        run: bash deploy/helm/taxonomy/verify.sh target/taxonomy-helm-rendered.yaml
      - name: Restore pinned embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: models/bge-small-en-v1.5
          key: ${{ runner.os }}-taxonomy-bge-small-en-v1.5-${{ hashFiles('.github/scripts/download-embedding-model.sh') }}
      - name: Run the canonical Maven verification suite
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TAXONOMY_EMBEDDING_MODEL_DIR: ${{ github.workspace }}/models/bge-small-en-v1.5
          TAXONOMY_EMBEDDING_ALLOW_DOWNLOAD: 'false'
          FRONTEND_API_BASE_REF: ${{ github.event.pull_request.base.sha }}
          VERSION_STATE_MODE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'development' }}
          VERSION_STATE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          mkdir -p target
          set -o pipefail
          ./mvnw -B verify -Pci -DrunOnnxTests=true -Dtaxonomy.ui.skip=true 2>&1 | tee target/maven-verification.log
      - name: Publish authoritative JUnit results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        continue-on-error: true
        with:
          name: Maven Tests
          path: '**/target/surefire-reports/TEST-*.xml,**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          max-annotations: '50'
      - name: Stage commit-bound verified reports
        if: always()
        run: bash .github/scripts/stage-core-quality-reports.sh
      - name: Upload core verified reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with: { name: quality-reports-core, path: 'target/quality-reports/**', if-no-files-found: warn, include-hidden-files: true, retention-days: 7 }

  observability:
    name: OpenTelemetry performance budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { java-version: '21', distribution: temurin, cache: maven }
      - name: Detect performance-sensitive changes
        id: observability-performance-scope
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "${PR_BASE_SHA}...${PR_HEAD_SHA}" -- pom.xml Dockerfile taxonomy-app/pom.xml taxonomy-app/src/main ':(exclude)taxonomy-app/src/main/resources/static/**' ':(exclude)taxonomy-app/src/main/resources/templates/**' taxonomy-app/src/test/java/com/taxonomy/ObservabilityContainerIT.java taxonomy-app/src/test/java/com/taxonomy/ObservabilityPerformanceIT.java taxonomy-app/src/test/resources/observability observability .github/scripts/run-observability-performance.sh docs/dev/OBSERVABILITY_PERFORMANCE.md; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Measure OpenTelemetry performance budget
        if: github.event_name != 'pull_request' || steps.observability-performance-scope.outputs.run == 'true'
        env: { TAXONOMY_OBSERVABILITY_PERFORMANCE_ENFORCE: 'true' }
        run: bash .github/scripts/run-observability-performance.sh
      - name: Record observability lane scope
        if: always()
        env:
          EXECUTED: ${{ github.event_name != 'pull_request' || steps.observability-performance-scope.outputs.run == 'true' }}
        run: bash .github/scripts/record-observability-evidence.sh
      - name: Upload observability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: observability-performance, path: 'target/observability-performance/**', if-no-files-found: error, retention-days: 7 }

  ui-plan:
    name: Plan authoritative UI shards
    runs-on: ubuntu-latest
    outputs: { matrix: '${{ steps.matrix.outputs.matrix }}' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Export repository-owned UI shard matrix
        id: matrix
        run: |
          jq -e '.schemaVersion == 1 and (.shards | length > 0)' .github/ui-shards.json >/dev/null
          echo "matrix=$(jq -c '{shard:[.shards[].id]}' .github/ui-shards.json)" >> "$GITHUB_OUTPUT"

  ui-contracts:
    name: UI contract verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { java-version: '21', distribution: temurin, cache: maven }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.npm
            .cache/ui-frontend
          key: ${{ runner.os }}-taxonomy-ui-node-${{ hashFiles('.github/package-lock.json', '.github/ui-verification-pom.xml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-taxonomy-playwright-${{ hashFiles('.github/package-lock.json', '.github/scripts/install-playwright-github.sh') }}
      - name: Run Maven-owned UI contracts and prepare browser runtime
        run: ./mvnw -B -f .github/ui-verification-pom.xml verify -Pcontracts

  ui-shards:
    name: UI shard / ${{ matrix.shard }}
    needs: [application, ui-plan, ui-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ui-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { java-version: '21', distribution: temurin, cache: maven }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.npm
            .cache/ui-frontend
          key: ${{ runner.os }}-taxonomy-ui-node-${{ hashFiles('.github/package-lock.json', '.github/ui-verification-pom.xml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-taxonomy-playwright-${{ hashFiles('.github/package-lock.json', '.github/scripts/install-playwright-github.sh') }}
      - name: Download commit-bound UI application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: taxonomy-ui-application, path: target/ui-application }
      - name: Verify and stage the UI application
        run: bash .github/scripts/verify-ui-application.sh
      - name: Run Maven-owned authoritative UI shard
        env:
          TAXONOMY_UI_SHARD: ${{ matrix.shard }}
          TAXONOMY_UI_OUTPUT_ROOT: ${{ github.workspace }}/target/ui-verification/${{ matrix.shard }}
        run: ./mvnw -B -f .github/ui-verification-pom.xml verify -Pshard
      - name: Upload UI shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: 'ui-verification-${{ matrix.shard }}', path: 'target/ui-verification/**', if-no-files-found: error, retention-days: 7 }

  verify:
    name: Maven verification
    needs: [application, core, observability, ui-contracts, ui-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Keep draft heads non-mergeable
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          echo "::error::Draft pull-request heads intentionally do not satisfy required Maven verification."
          exit 1
      - name: Require every authoritative lane
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          CORE_RESULT: ${{ needs.core.result }}
          OBSERVABILITY_RESULT: ${{ needs.observability.result }}
          UI_CONTRACTS_RESULT: ${{ needs.ui-contracts.result }}
          UI_SHARDS_RESULT: ${{ needs.ui-shards.result }}
        run: |
          for lane in APPLICATION_RESULT CORE_RESULT OBSERVABILITY_RESULT UI_CONTRACTS_RESULT UI_SHARDS_RESULT; do
            [[ "${!lane}" == success ]] || { echo "::error::$lane ended with ${!lane}"; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with: { java-version: '21', distribution: temurin, cache: maven }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/ui-frontend
          key: ${{ runner.os }}-taxonomy-ui-node-${{ hashFiles('.github/package-lock.json', '.github/ui-verification-pom.xml') }}
      - name: Download commit-bound UI application manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: taxonomy-ui-application, path: target/ui-application }
      - name: Download all UI shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: 'ui-verification-*', path: target/ui-verification, merge-multiple: true }
      - name: Download observability evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: observability-performance, path: target/observability-performance }
      - name: Download core quality reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: quality-reports-core, path: target/quality-reports }
      - name: Verify complete digest-bound UI evidence
        env:
          TAXONOMY_UI_EXPECTED_COMMIT: ${{ github.sha }}
          TAXONOMY_UI_SHARD_RESULTS_ROOT: ${{ github.workspace }}/target/ui-verification
          TAXONOMY_UI_APPLICATION_MANIFEST: ${{ github.workspace }}/target/ui-application/manifest.json
        run: ./mvnw -B -f .github/ui-verification-pom.xml verify -Pevidence-gate
      - name: Require complete review of the exact pull-request head
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_GATE_REVIEWERS: 'copilot-pull-request-reviewer[bot],Copilot'
          REVIEW_GATE_WAIT_SECONDS: '900'
          REVIEW_GATE_POLL_SECONDS: '20'
          REVIEW_GATE_EVIDENCE_PATH: 'target/quality-reports/review-gate.json'
        run: |
          set -euo pipefail
          gate=.github/scripts/exact-head-review-gate.mjs
          if git cat-file -e "${{ github.event.pull_request.base.sha }}:$gate" 2>/dev/null; then
            mkdir -p target/trusted-review-gate
            git show "${{ github.event.pull_request.base.sha }}:$gate" \
              > target/trusted-review-gate/exact-head-review-gate.mjs
            gate=target/trusted-review-gate/exact-head-review-gate.mjs
          fi
          .cache/ui-frontend/node/node "$gate"
      - name: Finalize commit-bound quality evidence
        run: bash .github/scripts/finalize-quality-evidence.sh
      - name: Upload verified reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: quality-reports, path: 'target/quality-reports/**', if-no-files-found: error, include-hidden-files: true, retention-days: 90 }
      - name: Upload consolidated UI verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: ui-verification, path: 'target/ui-verification/**', if-no-files-found: error, retention-days: 90 }
