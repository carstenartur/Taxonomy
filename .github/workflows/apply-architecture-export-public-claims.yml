name: Apply architecture export public claim cleanup

on:
  push:
    branches:
      - docs/architecture-export-public-claims

permissions:
  contents: write

concurrency:
  group: apply-architecture-export-public-claims
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'carstenartur/Taxonomy' && github.actor == 'carstenartur'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: docs/architecture-export-public-claims
          fetch-depth: 2
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Verify the exact staging parent and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ffdcf5469deb4360f176612a925b275525d56161"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/apply-architecture-export-public-claims.yml"
      - name: Apply bounded bilingual export wording and contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "docs/en/ARCHITECTURE.md": [
                  (
                      "| `ArchiMateDiagramService` | Converts architecture views into ArchiMate 3.x Model Exchange File Format XML, suitable for import into tools such as Archi, BiZZdesign, and MEGA. |",
                      "| `ArchiMateDiagramService` | Produces the experimental bounded ArchiMate 3.1 subset; mapping/loss profiles, semantic round-trip evidence, and independent-tool interoperability remain pending in #967. |",
                  ),
                  (
                      "| **ArchiMate XML** | ArchiMate 3.x Model Exchange File Format XML, importable into Archi, BiZZdesign, MEGA, and other ArchiMate-compatible tools. |",
                      "| **ArchiMate XML** | **Experimental bounded ArchiMate 3.1 subset.** Representative output is validated against the pinned schema set; mapping/loss profiles, semantic round-trip evidence, and independent-tool interoperability remain pending in #967. |",
                  ),
                  (
                      "| **Visio `.vsdx`** | Microsoft Visio diagram package, compatible with Visio 2013 and later. |",
                      "| **Visio `.vsdx`** | **Experimental bounded Visio 2012 subset.** The deterministic technical-reader contract is implemented; Microsoft Visio desktop open/edit/save/reopen certification and complete handoff/loss metadata remain pending in #965. |",
                  ),
              ],
              "docs/de/ARCHITECTURE.md": [
                  (
                      "| `ArchiMateDiagramService` | Konvertiert Architekturansichten in ArchiMate 3.x Model Exchange File Format XML, geeignet für den Import in Tools wie Archi, BiZZdesign und MEGA. |",
                      "| `ArchiMateDiagramService` | Erzeugt die experimentelle begrenzte ArchiMate-3.1-Teilmenge; Mapping-/Verlustprofile, semantischer Roundtrip-Nachweis und Interoperabilität mit unabhängigen Werkzeugen bleiben in #967 ausstehend. |",
                  ),
                  (
                      "| **ArchiMate-XML** | ArchiMate 3.x Model Exchange File Format XML, importierbar in Archi, BiZZdesign, MEGA und andere ArchiMate-kompatible Tools. |",
                      "| **ArchiMate-XML** | **Experimentelle begrenzte ArchiMate-3.1-Teilmenge.** Repräsentative Ausgaben werden gegen den fixierten Schemasatz validiert; Mapping-/Verlustprofile, semantischer Roundtrip-Nachweis und Interoperabilität mit unabhängigen Werkzeugen bleiben in #967 ausstehend. |",
                  ),
                  (
                      "| **Visio `.vsdx`** | Microsoft Visio-Diagrammpaket, kompatibel mit Visio 2013 und höher. |",
                      "| **Visio `.vsdx`** | **Experimentelle begrenzte Visio-2012-Teilmenge.** Der deterministische technische Lesevertrag ist umgesetzt; Microsoft-Visio-Desktop-Zertifizierung für Öffnen, Bearbeiten, Speichern und erneutes Öffnen sowie vollständige Übergabe-/Verlustmetadaten bleiben in #965 ausstehend. |",
                  ),
              ],
              "docs/en/USER_GUIDE.md": [
                  (
                      "Click **📥 ArchiMate** to download an ArchiMate 3.x XML file suitable for import into tools such as Archi or Sparx EA.",
                      "Click **📥 ArchiMate** to download an **experimental bounded ArchiMate 3.1 subset**. Representative output is schema-validated, while mapping/loss profiles, semantic round-trip evidence, and independent-tool interoperability remain pending in #967.",
                  ),
                  (
                      "Click **📥 Visio** to download a structured Microsoft Visio file (`.vsdx`) representing the Architecture View. The diagram includes the anchor nodes, related elements, and labelled relationships.",
                      "Click **📥 Visio** to download an **experimental bounded Visio 2012 VSDX subset** representing the Architecture View. The package includes the anchor nodes, related elements, and labelled relationships; Microsoft Visio desktop open/edit/save/reopen certification and complete handoff/loss metadata remain pending in #965.",
                  ),
              ],
              "docs/de/USER_GUIDE.md": [
                  (
                      "Klicken Sie auf **📥 ArchiMate**, um eine ArchiMate 3.x XML-Datei herunterzuladen, die zum Import in Tools wie Archi oder Sparx EA geeignet ist.",
                      "Klicken Sie auf **📥 ArchiMate**, um eine **experimentelle begrenzte ArchiMate-3.1-Teilmenge** herunterzuladen. Repräsentative Ausgaben sind schemavalidiert; Mapping-/Verlustprofile, semantischer Roundtrip-Nachweis und Interoperabilität mit unabhängigen Werkzeugen bleiben in #967 ausstehend.",
                  ),
                  (
                      "Klicken Sie auf **📥 Visio**, um eine strukturierte Microsoft Visio-Datei (`.vsdx`) herunterzuladen, die die Architekturansicht darstellt. Das Diagramm enthält die Anker-Knoten, verwandte Elemente und beschriftete Beziehungen.",
                      "Klicken Sie auf **📥 Visio**, um eine **experimentelle begrenzte Visio-2012-VSDX-Teilmenge** herunterzuladen, die die Architekturansicht darstellt. Das Paket enthält die Anker-Knoten, verwandte Elemente und beschriftete Beziehungen; Microsoft-Visio-Desktop-Zertifizierung für Öffnen, Bearbeiten, Speichern und erneutes Öffnen sowie vollständige Übergabe-/Verlustmetadaten bleiben in #965 ausstehend.",
                  ),
              ],
              "docs/en/EXAMPLES.md": [
                  (
                      "- **📦 ArchiMate** — Exports as ArchiMate 3.x XML (compatible with Archi, BiZZdesign, MEGA)",
                      "- **📦 ArchiMate** — Exports the experimental bounded ArchiMate 3.1 subset; independent-tool interoperability remains pending in #967",
                  ),
                  (
                      "The resulting XML file can be imported into **Archi**, **BiZZdesign**, **MEGA**, or any ArchiMate 3.x-compatible tool.",
                      "The resulting XML is representative output for the schema-validated subset. Mapping/loss profiles, semantic round-trip evidence, and independent-tool interoperability remain pending in #967.",
                  ),
              ],
              "docs/de/EXAMPLES.md": [
                  (
                      "- **📦 ArchiMate** — Exportiert als ArchiMate 3.x XML (kompatibel mit Archi, BiZZdesign, MEGA)",
                      "- **📦 ArchiMate** — Exportiert die experimentelle begrenzte ArchiMate-3.1-Teilmenge; Interoperabilität mit unabhängigen Werkzeugen bleibt in #967 ausstehend",
                  ),
                  (
                      "Die resultierende XML-Datei kann in **Archi**, **BiZZdesign**, **MEGA** oder jedes ArchiMate 3.x-kompatible Werkzeug importiert werden.",
                      "Die resultierende XML-Datei ist eine repräsentative Ausgabe der schemavalidierten Teilmenge. Mapping-/Verlustprofile, semantischer Roundtrip-Nachweis und Interoperabilität mit unabhängigen Werkzeugen bleiben in #967 ausstehend.",
                  ),
              ],
              "docs/en/USE_CASE_WISSENSKONSERVIERUNG.md": [
                  (
                      "| **IT Reference Architecture** | Export as ArchiMate XML → import into EA/Sparx |",
                      "| **IT Reference Architecture** | Experimental bounded ArchiMate 3.1 export; independent-tool interoperability pending in #967 |",
                  ),
              ],
              "docs/de/USE_CASE_WISSENSKONSERVIERUNG.md": [
                  (
                      "| **IT-Rahmenarchitektur** | Export als ArchiMate XML → Import in EA/Sparx |",
                      "| **IT-Rahmenarchitektur** | Experimenteller begrenzter ArchiMate-3.1-Export; Interoperabilität mit unabhängigen Werkzeugen in #967 ausstehend |",
                  ),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{filename}: expected one exact occurrence, found {count}: {old}"
                      )
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          test_path = Path(
              "taxonomy-app/src/test/java/com/taxonomy/portfolio/workbench/"
              "ArchitectureExportDocumentationContractTest.java"
          )
          test_text = test_path.read_text(encoding="utf-8")
          english_anchor = (
              '            "importable into Archi, BiZZdesign, MEGA",\n'
          )
          english_additions = (
              '            "compatible with Archi, BiZZdesign, MEGA",\n'
              '            "can be imported into **Archi**, **BiZZdesign**, **MEGA**",\n'
              '            "import into EA/Sparx",\n'
          )
          german_anchor = (
              '            "importierbar in Archi, BiZZdesign, MEGA",\n'
          )
          german_additions = (
              '            "geeignet für den Import in Tools wie Archi, BiZZdesign und MEGA",\n'
              '            "kompatibel mit Archi, BiZZdesign, MEGA",\n'
              '            "kann in **Archi**, **BiZZdesign**, **MEGA**",\n'
              '            "Import in EA/Sparx",\n'
          )
          for anchor, additions, label in (
              (english_anchor, english_additions, "English forbidden claims"),
              (german_anchor, german_additions, "German forbidden claims"),
          ):
              if test_text.count(anchor) != 1:
                  raise SystemExit(f"{label} anchor did not match exactly once")
              test_text = test_text.replace(anchor, anchor + additions, 1)

          method_anchor = (
              "    private static String read(Path repository, String relativePath)\n"
              "            throws IOException {\n"
          )
          if test_text.count(method_anchor) != 1:
              raise SystemExit("documentation contract insertion anchor is not unique")
          method = '''
              @Test
              void publicGuidesUseTheBoundedExternalHandoffContract()
                      throws IOException {
                  Path repository = findRepositoryRoot();
                  String english = String.join("\\n",
                          read(repository, "docs/en/ARCHITECTURE.md"),
                          read(repository, "docs/en/USER_GUIDE.md"),
                          read(repository, "docs/en/EXAMPLES.md"),
                          read(repository,
                                  "docs/en/USE_CASE_WISSENSKONSERVIERUNG.md"));
                  String german = String.join("\\n",
                          read(repository, "docs/de/ARCHITECTURE.md"),
                          read(repository, "docs/de/USER_GUIDE.md"),
                          read(repository, "docs/de/EXAMPLES.md"),
                          read(repository,
                                  "docs/de/USE_CASE_WISSENSKONSERVIERUNG.md"));

                  assertThat(english)
                          .contains("Experimental bounded ArchiMate 3.1 subset")
                          .contains("independent-tool interoperability remain pending in #967")
                          .contains("Experimental bounded Visio 2012 subset")
                          .contains("Microsoft Visio desktop open/edit/save/reopen certification")
                          .contains("#965");
                  assertThat(german)
                          .contains("Experimentelle begrenzte ArchiMate-3.1-Teilmenge")
                          .contains("Interoperabilität mit unabhängigen Werkzeugen")
                          .contains("Experimentelle begrenzte Visio-2012-Teilmenge")
                          .contains("Microsoft-Visio-Desktop-Zertifizierung")
                          .contains("#965");

                  for (String claim : FORBIDDEN_ENGLISH_CLAIMS) {
                      assertThat(english).doesNotContain(claim);
                  }
                  for (String claim : FORBIDDEN_GERMAN_CLAIMS) {
                      assertThat(german).doesNotContain(claim);
                  }
              }

          '''
          test_path.write_text(
              test_text.replace(method_anchor, method + method_anchor, 1),
              encoding="utf-8",
          )
          PY
      - name: Verify the focused documentation contract
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -pl taxonomy-app -am \
            -Dtest=ArchitectureExportDocumentationContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            docs/de/ARCHITECTURE.md \
            docs/de/EXAMPLES.md \
            docs/de/USER_GUIDE.md \
            docs/de/USE_CASE_WISSENSKONSERVIERUNG.md \
            docs/en/ARCHITECTURE.md \
            docs/en/EXAMPLES.md \
            docs/en/USER_GUIDE.md \
            docs/en/USE_CASE_WISSENSKONSERVIERUNG.md \
            taxonomy-app/src/test/java/com/taxonomy/portfolio/workbench/ArchitectureExportDocumentationContractTest.java \
            | sort)"
      - name: Commit the final nine-file change and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-architecture-export-public-claims.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/de/ARCHITECTURE.md docs/de/EXAMPLES.md \
            docs/de/USER_GUIDE.md docs/de/USE_CASE_WISSENSKONSERVIERUNG.md \
            docs/en/ARCHITECTURE.md docs/en/EXAMPLES.md \
            docs/en/USER_GUIDE.md docs/en/USE_CASE_WISSENSKONSERVIERUNG.md \
            taxonomy-app/src/test/java/com/taxonomy/portfolio/workbench/ArchitectureExportDocumentationContractTest.java \
            .github/workflows/apply-architecture-export-public-claims.yml
          git diff --cached --check
          git commit -m "Align public architecture export claims with the supported boundary"
          git push origin HEAD:refs/heads/docs/architecture-export-public-claims
