name: One-shot API transport review fixes

on:
  push:
    branches:
      - qa/issue-644-api-transport

permissions:
  contents: write

concurrency:
  group: one-shot-api-review-fixes
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-644-api-transport
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply review corrections
        run: python3 .github/scripts/apply-api-review-fixes.py

      - name: Verify request correlation and fail-closed marker contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/apply-api-review-fixes.py
          node --check taxonomy-app/src/main/resources/static/js/api/taxonomy-api-client.js
          node --check .github/scripts/test-taxonomy-api-client.mjs
          node .github/scripts/test-taxonomy-api-client.mjs
          ./mvnw -B -pl taxonomy-app -am \
            -Dtest=com.taxonomy.ui.TaxonomyApiClientContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
          git diff --check

      - name: Commit permanent review corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/scripts/test-taxonomy-api-client.mjs \
            taxonomy-app/src/main/resources/static/js/api/taxonomy-api-client.js \
            taxonomy-app/src/test/java/com/taxonomy/ui/TaxonomyApiClientContractTest.java
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve request IDs on invalid API responses'
          git push origin HEAD:qa/issue-644-api-transport
