name: Reported core failure diagnosis

on:
  pull_request:
    paths:
      - '.github/workflows/triage-core-run.yml'
      - 'taxonomy-app/src/test/java/com/taxonomy/TaxonomyLargeResultBudgetIT.java'

permissions:
  contents: read

jobs:
  verify-render-clock:
    if: github.event.pull_request.number == 1108 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Prove late-observation regression detects the old clock formula
        run: |
          set -euo pipefail
          mkdir -p target
          source=taxonomy-app/src/test/java/com/taxonomy/TaxonomyLargeResultBudgetIT.java
          cp "$source" target/render-clock-source.java
          trap 'cp target/render-clock-source.java "$source"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('taxonomy-app/src/test/java/com/taxonomy/TaxonomyLargeResultBudgetIT.java')
          source = p.read_text()
          old = 'renderDurationMs: timing.renderDurationMs,'
          assert source.count(old) == 1
          p.write_text(source.replace(old,
              'renderDurationMs: performance.now() - (timing.completedAt - timing.renderDurationMs),'))
          PY
          status=0
          ./mvnw -B -pl taxonomy-app -am package failsafe:integration-test failsafe:verify \
            -Pci -Dtaxonomy.ui.skip=true \
            -Dtest=TaxonomySearchLargeResultContractTest -Dsurefire.failIfNoSpecifiedTests=false \
            '-Dit.test=TaxonomyLargeResultBudgetIT#renderDurationDoesNotIncludeDelayedDriverObservation' \
            -Dfailsafe.failIfNoSpecifiedTests=false >target/render-clock-red.log 2>&1 || status=$?
          tail -n 35 target/render-clock-red.log
          test "$status" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('taxonomy-app/target/failsafe-reports/TEST-com.taxonomy.TaxonomyLargeResultBudgetIT.xml')
          r = ET.parse(p).getroot()
          assert r.get('tests') == '1' and r.get('failures') == '1' and r.get('errors') == '0', r.attrib
          failure = r.find('testcase/failure')
          assert 'render duration remains frozen after completion' in failure.get('message', ''), failure.attrib
          Path('target/render-clock-red.xml').write_bytes(p.read_bytes())
          print('RED_CONFIRMED: the late WebDriver observation formula fails the intended assertion')
          PY
      - name: Run all large-result browser budgets and both clock controls
        run: |
          set -euo pipefail
          status=0
          ./mvnw -B -pl taxonomy-app -am package failsafe:integration-test failsafe:verify \
            -Pci -Dtaxonomy.ui.skip=true \
            -Dtest=TaxonomySearchLargeResultContractTest -Dsurefire.failIfNoSpecifiedTests=false \
            -Dit.test=TaxonomyLargeResultBudgetIT -Dfailsafe.failIfNoSpecifiedTests=false \
            >target/render-clock-green.log 2>&1 || status=$?
          tail -n 35 target/render-clock-green.log
          if [ "$status" -ne 0 ]; then
            grep -E '\[ERROR\]|<<< FAILURE|<<< ERROR' target/render-clock-green.log | tail -n 25 || true
            exit "$status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          p = Path('taxonomy-app/target/failsafe-reports/TEST-com.taxonomy.TaxonomyLargeResultBudgetIT.xml')
          r = ET.parse(p).getroot()
          assert r.get('tests') == '4' and r.get('failures') == '0' and r.get('errors') == '0' and r.get('skipped') == '0', r.attrib
          print('GREEN_CONFIRMED:', r.attrib)
          for case in r.findall('testcase'):
              print('PASS', case.get('name'))
          report = json.loads(Path('target/ui-verification/large-results/report.json').read_text())
          assert len(report['scenarios']) == 2
          for case in report['scenarios']:
              print('RENDER_METRICS', json.dumps({k: case[k] for k in (
                  'scenario', 'renderDurationMs', 'driverObservationDelayMs', 'longestTaskMs',
                  'interactionLatencyMs', 'renderedResults', 'resultAreaDomNodes')}))
          PY
          git diff --exit-code -- taxonomy-app/src/test/java/com/taxonomy/TaxonomyLargeResultBudgetIT.java
      - name: Retain focused verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: render-clock-verification
          path: |
            target/render-clock-*.log
            target/render-clock-red.xml
            target/ui-verification/large-results/report.json
            taxonomy-app/target/failsafe-reports/TEST-com.taxonomy.TaxonomyLargeResultBudgetIT.xml
          if-no-files-found: error
          retention-days: 7
