name: Analysis memory workbench
on:
  push:
    branches: [workbench/analysis-memory-live-progress-20260914]
    paths: [.github/workflows/analysis-memory-workbench.yml]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_OPTS: -Xmx1536m
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: candidate
          ref: 29b9ef036882f5dbfc62924d9aca63038c098d4e
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install behavioral reproductions only
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 29b9ef036882f5dbfc62924d9aca63038c098d4e
          python ../tools/.github/scripts/analysis-memory-tests.py
      - name: Run RED and existing controls
        working-directory: candidate
        run: |
          set +e
          set -o pipefail
          ./mvnw -B -pl taxonomy-app -am -Dtest=HsqldbFileProfileTest,LlmTranscriptBoundsTest,AnalysisCapacityTest,AnalysisApiControllerTest,StreamRequirementAnalysisUseCaseTest -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee "$RUNNER_TEMP/analysis-red.log"
          code=${PIPESTATUS[0]}
          echo "Maven exit=$code"
          test "$code" -ne 0 || exit 1
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as E
          reports=list(Path('taxonomy-app/target/surefire-reports').glob('TEST-*.xml'))
          assert len(reports)==5, [p.name for p in reports]
          totals=[0,0,0,0]
          for p in reports:
              root=E.parse(p).getroot()
              values=[int(root.get(k,0)) for k in ('tests','failures','errors','skipped')]
              print(root.get('name'), values)
              totals=[a+b for a,b in zip(totals,values)]
          print('TOTAL tests/failures/errors/skipped:',totals)
          assert totals[1:]==[5,0,0], totals
          PY
      - name: Run browser ordering controls
        working-directory: candidate
        run: node --test .github/scripts/analysis-operation-controller.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-red-evidence
          path: |
            ${{ runner.temp }}/analysis-red.log
            candidate/**/target/surefire-reports/*.xml
          retention-days: 7
