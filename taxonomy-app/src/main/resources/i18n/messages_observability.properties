system.warning.IN_MEMORY_APPLICATION_PROCESS=Data-loss warning: this database is in memory in the application process. Its data and changes are lost when that process stops or restarts.
system.warning.IN_MEMORY_DATABASE_PROCESS=Data-loss warning: this database is in memory in a separate database process. Its data is lost when that database process stops or restarts; restarting Taxonomy alone is different.
system.warning.DESTRUCTIVE_SCHEMA_ACTION=Data-loss warning: the effective Hibernate schema action drops, recreates or truncates application tables. File-backed or external database storage does not prevent this.
system.warning.STORAGE_DURABILITY_UNVERIFIED=The database is not identified as in-memory, but volume durability, backups and restore/restart behavior have not been verified. Do not interpret this as a persistence guarantee.
system.warning.SCHEMA_ACTION_UNKNOWN=The effective schema action could not be determined. Startup data retention is unknown.
system.warning.DATABASE_DIAGNOSTICS_UNAVAILABLE=The database diagnostics are unavailable. The other system values remain independent.
system.warning.PERSISTENCE_UNKNOWN=The database storage mode is unknown. Do not assume data will survive a restart.
system.warning.CATALOGUE_RELOAD_ENABLED=Reloading an existing taxonomy catalogue on startup is enabled. Existing catalogue data may be replaced.
