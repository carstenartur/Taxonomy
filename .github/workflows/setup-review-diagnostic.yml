name: Setup review diagnostic (isolated branch)
on:
  push:
    branches: [verify/pr1142-review-regressions-20260928]
permissions:
  contents: read
jobs:
  check:
    name: Jackson XML numeric-limit regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: driver, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 26bd8c2ffe465167976cc991abda615a5c3eb314
          path: source
          persist-credentials: false
      - name: Apply exact security patch
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          gzip -dc ../driver/.github/qa/setup-jackson-security.patch.gz >../jackson-security.patch
          git apply --check ../jackson-security.patch
          git apply --index ../jackson-security.patch
          git diff --cached --check
          test "$(git write-tree)" = c84f418124eb6a5cac9dd088eaa7df90970a1abf
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {java-version: '21', distribution: temurin}
      - name: Verify identical bounded cases on vulnerable and patched releases
        shell: python
        working-directory: source
        run: |
          import hashlib, os, pathlib, subprocess, urllib.request
          root = pathlib.Path('target/jackson-security')
          root.mkdir(parents=True, exist_ok=True)
          def artifact(path, destination):
              url = 'https://repo.maven.apache.org/maven2/' + path
              data = urllib.request.urlopen(url, timeout=60).read()
              digest = urllib.request.urlopen(url + '.sha512', timeout=60).read().decode().split()[0]
              assert hashlib.sha512(data).hexdigest() == digest, 'Maven Central checksum mismatch'
              destination.write_bytes(data)
              print(destination.name, hashlib.sha512(data).hexdigest())
          for version, failures in [('3.1.5', 2), ('3.1.6', 0)]:
              directory = root / version
              directory.mkdir(parents=True, exist_ok=True)
              for module in ['jackson-core', 'jackson-databind']:
                  artifact(f'tools/jackson/core/{module}/{version}/{module}-{version}.jar', directory / (module + '.jar'))
              artifact('com/fasterxml/jackson/core/jackson-annotations/2.22/jackson-annotations-2.22.jar', directory / 'jackson-annotations.jar')
              cp = str(directory) + '/*'
              subprocess.run(['javac', '-encoding', 'UTF-8', '-cp', cp, '-d', str(directory), 'taxonomy-app/src/test/java/com/taxonomy/security/JacksonXmlDatatypeLimitsCases.java'], check=True)
              result = subprocess.run(['java', '-cp', os.pathsep.join([str(directory), cp]), 'com.taxonomy.security.JacksonXmlDatatypeLimitsCases'], capture_output=True, text=True)
              print('Jackson ' + version + ':\n' + result.stdout)
              assert ('4 cases, ' + str(failures) + ' failures') in result.stdout, result.stderr
              assert (result.returncode == 0) == (failures == 0), result.stderr
  publish-candidate:
    name: Publish verified Jackson security candidate only
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: driver, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 26bd8c2ffe465167976cc991abda615a5c3eb314
          path: source
      - name: Publish source without diagnostic workflow
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc ../driver/.github/qa/setup-jackson-security.patch.gz >../jackson-security.patch
          git apply --index ../jackson-security.patch
          git diff --cached --check
          test "$(git write-tree)" = c84f418124eb6a5cac9dd088eaa7df90970a1abf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(security): upgrade Jackson 3 BOM to patched 3.1.6' -m 'Address CVE-2026-68497 and accompanying scanner findings. Add bounded XML datatype length regressions under Maven and document the scan blocker. Same 4 cases reproduce 2 failures on 3.1.5 and pass on 3.1.6 on Linux and Windows. Full packaged security scan and canonical PR CI remain required.'
          git push origin HEAD:refs/heads/verify/pr1142-jackson-security-20260929
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
