name: Scenario architecture acceptance

on:
  pull_request:
    paths:
      - 'taxonomy-*/**'
      - 'pom.xml'
      - '.mvn/verification-suites.json'
      - '.github/workflows/scenario-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenario-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run sourced example scenario with real browser and remote LLM playback
        run: >-
          ./mvnw -B -ntp -pl taxonomy-app -am test -Pscenario-acceptance
      - name: Independently render and check Word and Visio exports
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-draw poppler-utils
          ./mvnw -B -ntp -pl taxonomy-tooling -am compile -DskipTests
          java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-junit-reports \
            taxonomy-app/target/surefire-reports/TEST-com.taxonomy.acceptance.ReformulationScenarioAcceptanceTest.xml 1 \
            taxonomy-app/target/surefire-reports/TEST-com.taxonomy.acceptance.ReformulationScenarioBrowserTest.xml 1 \
            taxonomy-app/target/surefire-reports/TEST-com.taxonomy.acceptance.ReformulationAuthoredScenarioTest.xml 2 \
            taxonomy-app/target/surefire-reports/TEST-com.taxonomy.acceptance.ScenarioLlmPlaybackTest.xml 17 \
            taxonomy-app/target/surefire-reports/TEST-com.taxonomy.portfolio.reformulation.ReformulationBrowserTest.xml 1
          java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-scenario-documents --artifacts taxonomy-app/target/scenario-acceptance
          java -cp taxonomy-tooling/target/classes com.taxonomy.tooling.TaxonomyTooling check-scenario-documents --reformulation-only --artifacts taxonomy-app/target/reformulation-scenario-acceptance
      - name: Preserve architecture, exports, screenshots and verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scenario-architecture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            taxonomy-app/target/scenario-acceptance/**
            taxonomy-app/target/surefire-reports/*Scenario*
            taxonomy-app/target/surefire-reports/*ScenarioLlm*
            taxonomy-app/target/surefire-reports/*ReformulationBrowser*
            taxonomy-app/target/surefire-reports/*ReformulationAuthored*
            taxonomy-app/target/reformulation-scenario-acceptance/**/*.json
            taxonomy-app/target/reformulation-scenario-acceptance/**/*.docx
            taxonomy-app/target/reformulation-scenario-acceptance/**/*.md
            taxonomy-app/target/reformulation-scenario-acceptance/**/*.html
            taxonomy-app/target/reformulation-scenario-acceptance/**/*.png
            taxonomy-app/target/reformulation-scenario-acceptance/**/*.pdf
            taxonomy-app/target/reformulation-scenario-acceptance/**/*application.log
          if-no-files-found: error
          retention-days: 14
