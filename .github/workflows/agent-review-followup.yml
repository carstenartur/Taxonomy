name: Agent review follow-up

on:
  push:
    branches:
      - agent/10-day-review-cleanup
    paths:
      - .github/workflows/agent-review-followup.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v5
        with:
          ref: agent/10-day-review-cleanup
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply final review follow-up
        run: python .github/scripts/agent_review_followup.py

      - name: Run focused policy regression tests
        run: >-
          ./mvnw -B
          -pl taxonomy-build,taxonomy-app -am
          -DskipITs
          -Dtest=WorkflowTestAuthorityPolicyTest,ReactorCoveragePolicyTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            taxonomy-app/src/test/java/com/taxonomy/build/WorkflowTestAuthorityPolicy.java \
            taxonomy-app/src/test/java/com/taxonomy/build/WorkflowTestAuthorityPolicyTest.java \
            taxonomy-build/src/test/java/com/taxonomy/build/ReactorCoveragePolicy.java \
            taxonomy-build/src/test/java/com/taxonomy/build/ReactorCoveragePolicyTest.java
          git diff --cached --check
          git commit -m "fix(build): require executable canonical verification"
          git push origin HEAD:agent/10-day-review-cleanup
