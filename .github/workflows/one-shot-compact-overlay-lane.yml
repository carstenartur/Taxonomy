name: One-shot compact overlay lane fix

on:
  push:
    branches:
      - qa/issue-622-accessible-overlays

permissions:
  contents: write

concurrency:
  group: one-shot-compact-overlay-lane
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/issue-622-accessible-overlays
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply compact high-zoom overlay layout
        run: python3 .github/scripts/apply-compact-overlay-lane.py

      - name: Verify overlay source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/apply-compact-overlay-lane.py
          ./mvnw -B -pl taxonomy-app -am \
            -Dtest=com.taxonomy.ui.TaxonomyOverlayContractTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
          git diff --check

      - name: Commit permanent overlay correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taxonomy-app/src/main/resources/static/css/taxonomy-ergonomics.css \
            taxonomy-app/src/test/java/com/taxonomy/ui/TaxonomyOverlayContractTest.java
          git diff --cached --quiet && exit 0
          git commit -m 'Compact stacked overlays at high zoom'
          git push origin HEAD:qa/issue-622-accessible-overlays
