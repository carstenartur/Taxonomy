database.setup.menu=Database setup
database.setup.title=Set up the database
database.setup.intro=Connect Taxonomy to an existing database, or prepare a new PostgreSQL database and application account.
database.setup.prompt.title=Set up an external database?
database.setup.prompt.body=Taxonomy currently uses embedded HSQLDB. The optional assistant helps prepare a remote database and links to Pod setup instructions. You can return to it later in Settings.
database.setup.prompt.memory=Taxonomy currently uses HSQLDB in memory; its data lasts only until shutdown. The optional assistant helps prepare an external database. You can keep working now and return to it later in Settings.
database.setup.prompt.start=Open database assistant
database.setup.continue=Continue later
database.setup.close=Close database setup
database.setup.dismiss.failed=You can continue working. The database setup choice could not be saved, so the invitation may appear again after reloading.
